[package]
autobins = false
autoexamples = false
name = "eliot-search"
default-run = "eliot-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[[bin]]
name = "eliot-search"
path = "src/entry.rs"

[dependencies]
serde_json.workspace = true
search-source-registry.workspace = true
search-provider-protocol.workspace = true
search-provider-client.workspace = true
tokio = { workspace = true, features = ["rt", "process", "io-util", "io-std", "time", "macros", "signal"] }

[lints]
workspace = true

[package]
name = "eliot-searchd"
default-run = "eliot-searchd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[[bin]]
name = "eliot-searchd"
path = "src/entry.rs"

[[bin]]
name = "eliot-search-snapshotd"
path = "src/main.rs"

[features]
default = ["wave1-shell"]
wave1-shell = []
wave2-source = [
    "dep:search-source-admission",
    "dep:search-source-registry",
    "dep:search-source-identity",
    "dep:search-safe-reader",
    "dep:search-revision-store",
    "dep:search-materializer",
    "dep:search-unitizer",
]
wave3-index = [
    "wave2-source",
    "dep:search-projection-planner",
    "dep:search-point-identity",
    "dep:search-qdrant-supervisor",
    "dep:search-qdrant-bridge",
    "dep:search-publication",
    "dep:search-epoch-pins",
    "dep:search-index-reclaimer",
]
wave4-query = [
    "wave3-index",
    "dep:search-access",
    "dep:search-query-planner",
    "dep:search-retrieval-executor",
    "dep:search-candidate-validator",
    "dep:search-handles",
    "dep:search-result-projector",
    "dep:search-continuation",
    "dep:search-eval",
]
wave5-current = [
    "wave4-query",
    "dep:search-source-reconcile",
    "dep:search-overlay",
    "dep:search-code-enricher",
]
wave6-proof = [
    "wave5-current",
    "dep:search-exact",
    "dep:search-subject-resolver",
    "dep:search-comparator",
]
wave7-lifecycle = [
    "wave6-proof",
    "dep:search-retention",
]
full-baseline = ["wave7-lifecycle"]

[dependencies]
search-contracts.workspace = true
search-domain.workspace = true
search-ports.workspace = true
search-config.workspace = true
search-runtime-owner.workspace = true
search-os-secrets.workspace = true
search-control-redb.workspace = true
search-provider-protocol.workspace = true
search-lexical.workspace = true
zeroize = "=1.9.0"

search-source-admission = { workspace = true, optional = true }
search-source-registry = { workspace = true, optional = true }
search-source-identity = { workspace = true, optional = true }
search-source-reconcile = { workspace = true, optional = true }
search-safe-reader = { workspace = true, optional = true }
search-revision-store = { workspace = true, optional = true }
search-materializer = { workspace = true, optional = true }
search-unitizer = { workspace = true, optional = true }
search-code-enricher = { workspace = true, optional = true }

search-projection-planner = { workspace = true, optional = true }
search-point-identity = { workspace = true, optional = true }
search-qdrant-supervisor = { workspace = true, optional = true }
search-qdrant-bridge = { workspace = true, optional = true }
search-publication = { workspace = true, optional = true }
search-epoch-pins = { workspace = true, optional = true }
search-index-reclaimer = { workspace = true, optional = true }

search-access = { workspace = true, optional = true }
search-overlay = { workspace = true, optional = true }
search-exact = { workspace = true, optional = true }
search-subject-resolver = { workspace = true, optional = true }
search-query-planner = { workspace = true, optional = true }
search-retrieval-executor = { workspace = true, optional = true }
search-candidate-validator = { workspace = true, optional = true }
search-comparator = { workspace = true, optional = true }
search-handles = { workspace = true, optional = true }
search-result-projector = { workspace = true, optional = true }
search-continuation = { workspace = true, optional = true }

search-retention = { workspace = true, optional = true }
search-eval = { workspace = true, optional = true }

[lints]
workspace = true

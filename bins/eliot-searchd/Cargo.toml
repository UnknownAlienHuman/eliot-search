[package]
autobins = false
autoexamples = false
name = "eliot-searchd"
default-run = "eliot-searchd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[[bin]]
name = "eliot-searchd"
path = "src/entry.rs"

[dependencies]
search-contracts.workspace = true
search-control-redb.workspace = true
search-revision-store.workspace = true
search-runtime-owner.workspace = true
search-safe-reader.workspace = true
serde.workspace = true
search-source-registry.workspace = true
search-unitizer.workspace = true
search-qdrant-bridge.workspace = true
search-provider-protocol.workspace = true
tokio = { workspace = true, features = ["rt", "io-std", "io-util", "time", "sync", "macros"] }
serde_json.workspace = true
toml.workspace = true
ignore.workspace = true

[lints]
workspace = true

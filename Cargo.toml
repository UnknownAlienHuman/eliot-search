[workspace]
resolver = "3"
exclude = ["vendor/redb", "vendor/ignore"]
members = [
    "crates/search-contracts",
    "crates/search-runtime/search-runtime-owner",
    "crates/search-control-redb",
    "crates/search-source/search-source-registry",
    "crates/search-source/search-safe-reader",
    "crates/search-source/search-revision-store",
    "crates/search-prep/search-materializer",
    "crates/search-prep/search-unitizer",
    "crates/search-index-qdrant/search-qdrant-bridge",
    "crates/search-provider-protocol",
    "crates/search-provider-client",
    "bins/eliot-searchd",
    "bins/eliot-search",
    "bins/eliot-search-mcp",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/UnknownAlienHuman/eliot-search"

[workspace.dependencies]
search-contracts = { path = "crates/search-contracts" }
search-runtime-owner = { path = "crates/search-runtime/search-runtime-owner" }
search-control-redb = { path = "crates/search-control-redb" }
search-source-registry = { path = "crates/search-source/search-source-registry" }
search-safe-reader = { path = "crates/search-source/search-safe-reader" }
search-revision-store = { path = "crates/search-source/search-revision-store" }
search-materializer = { path = "crates/search-prep/search-materializer" }
search-unitizer = { path = "crates/search-prep/search-unitizer" }
search-qdrant-bridge = { path = "crates/search-index-qdrant/search-qdrant-bridge" }
search-provider-protocol = { path = "crates/search-provider-protocol" }
search-provider-client = { path = "crates/search-provider-client" }

# Single vendor-SDK pin. Only search-qdrant-bridge may inherit this
# dependency; its exact version must match the qualified client receipt.
qdrant-client = { version = "=1.20.0", default-features = false }
tonic = { version = "=0.14.6", features = ["transport", "tls-native-roots", "tls-ring"] }
prost = "=0.14.3"
tokio = { version = "=1.53.1", default-features = false }
tokio-util = { version = "=0.7.19", features = ["rt"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }

# Maintained BLAKE3 is consumed directly by retained-object and preparation owners.
blake3 = { version = "=1.8.2", default-features = false, features = ["std", "pure", "zeroize"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }
ignore = "=0.4.34"

[patch.crates-io]
ignore = { path = "vendor/ignore" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

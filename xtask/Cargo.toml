[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded Rust validation tooling (T41). Small explicit Cargo command surface for registry/evidence checks; not a swarm controller."

[[bin]]
name = "xtask"
path = "src/main.rs"

[lib]
name = "xtask"
path = "src/lib.rs"

[dependencies]
cargo_metadata.workspace = true
sha2.workspace = true
toml = "0.8"
serde_json = "1"
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls"] }
proc-macro2 = { version = "=1.0.107", default-features = false }
# Tooling manifest syntax only; product config adoption remains #238.
manifest-toml = { package = "toml", version = "=1.1.7", default-features = false, features = ["std", "serde", "parse"] }

[lints]
workspace = true

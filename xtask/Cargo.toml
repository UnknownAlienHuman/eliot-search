[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Bounded Rust validation tooling (T41). Small explicit Cargo command surface for registry/evidence checks; not a swarm controller."

[[bin]]
name = "xtask"
path = "src/main.rs"

[lib]
name = "xtask"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
toml = "0.8"
serde_json = "1"

[lints]
workspace = true

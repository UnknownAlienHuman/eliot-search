mode = "QUALIFIED_REF"
default = "UNSELECTED"

[[run.field]]
name = "warmup_iterations"
type = "u16"
mode = "TUNABLE"
default = 5
change_action = "APPLY_NEXT_RUN"
min = 0
max = 20

[[run.field]]
name = "measured_iterations"
type = "u16"
mode = "TUNABLE"
default = 30
change_action = "APPLY_NEXT_RUN"

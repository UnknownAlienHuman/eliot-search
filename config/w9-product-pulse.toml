max = 600000

[[run.field]]
name = "block_timeout_ms"
type = "u64"
mode = "TUNABLE"
default = 1800000
change_action = "APPLY_NEXT_RUN"
min = 60000
max = 7200000

[[run.field]]
name = "resource_sample_interval_ms"
type = "u64"
mode = "TUNABLE"
default = 100
change_action = "APPLY_NEXT_RUN"

schema_version = 3
config_schema_version = 1
project = "eliot-search"
unknown_section = "reject"
duplicate_section = "reject"
environment_prefix = "ELIOT_SEARCH__"
precedence = ["defaults", "file", "environment", "cli"]
contract_path_template = "config/sections/{section}.md"

# `reload` is the minimum action for any changed key in the section. A field may require a stricter
# action. Section owners validate fields and may never downgrade this class.

[[section]]
name = "instance"
owner = "search-runtime-owner"
owner_module = "config"
first_wave = 1
reload = "DRAIN_AND_RESTART"
secret_policy = "forbid_plaintext"
contract = "config/sections/instance.md"


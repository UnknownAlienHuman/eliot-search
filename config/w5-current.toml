schema_version = 1
project = "eliot-search"
stage = "P09-P10"
wave = 5
status = "schema-only"
implementation_authorized = false

# LOCKED values are correctness/security invariants. TUNABLE values are finite owner-validated policy.
# QUALIFIED_REF values require immutable accepted dependency/profile evidence.

[reconciliation]
owner = "search-source-reconcile"
user_config_section = "reconcile"

[[reconciliation.field]]
name = "watcher_is_authority"
type = "bool"
mode = "LOCKED"
default = false

[[reconciliation.field]]
name = "overflow_declares_gap_before_ack"
type = "bool"
mode = "LOCKED"
default = true

[[reconciliation.field]]
name = "open_gap_blocks_current_confirmed"
type = "bool"
mode = "LOCKED"
default = true

[[reconciliation.field]]
name = "complete_inventory_required_to_resolve_gap"
type = "bool"
mode = "LOCKED"
default = true

[[reconciliation.field]]
name = "partial_inventory_may_remove_unseen_source"
type = "bool"
mode = "LOCKED"
default = false

[[reconciliation.field]]
name = "guarded_apply_required"
type = "bool"
mode = "LOCKED"
default = true

[[reconciliation.field]]
name = "inventory_interval_ms"
type = "u64"
mode = "TUNABLE"
min = 10000
max = 86400000
default = 300000
change_action = "APPLY_LIVE"

[[reconciliation.field]]
name = "overflow_reconcile_budget_ms"
type = "u64"
mode = "TUNABLE"
min = 100
max = 600000
default = 5000
change_action = "APPLY_LIVE"

[[reconciliation.field]]
name = "max_roots_per_sweep"
type = "u32"
mode = "TUNABLE"
min = 1
max = 4096
default = 64
change_action = "APPLY_LIVE"

[[reconciliation.field]]
name = "max_entries_per_slice"
type = "u32"
mode = "TUNABLE"
min = 1
max = 1000000
default = 10000
change_action = "APPLY_LIVE"

[[reconciliation.field]]
name = "max_concurrent_roots"
type = "u16"
mode = "TUNABLE_INTERNAL_CEILING"
min = 1
max = 32
default = 2
change_action = "APPLY_LIVE"

[[reconciliation.field]]
name = "max_slice_retry_attempts"
type = "u8"
mode = "TUNABLE"
min = 0
max = 3
default = 1
change_action = "APPLY_LIVE"

[currentness]

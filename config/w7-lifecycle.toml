type = "bool"
mode = "LOCKED"
default = false

[[continuations.field]]
name = "restored_token_reuse_allowed"
type = "bool"
mode = "LOCKED"
default = false

[[continuations.field]]
name = "invalidation_batch_records"
type = "u32"
mode = "TUNABLE"
min = 1
max = 100000
default = 512
change_action = "APPLY_LIVE"

[revision_store]
owner = "search-revision-store"

[[revision_store.field]]
name = "residency_separation_required"
type = "bool"
mode = "LOCKED"
default = true

[[revision_store.field]]
name = "exact_delete_authority_required"
type = "bool"
mode = "LOCKED"
default = true

[[revision_store.field]]
name = "purge_tombstone_enforced"
type = "bool"
mode = "LOCKED"
default = true

[[revision_store.field]]
name = "restore_quarantine_required"
type = "bool"
mode = "LOCKED"
default = true

[[revision_store.field]]
name = "inventory_page_objects"
type = "u32"
mode = "TUNABLE"

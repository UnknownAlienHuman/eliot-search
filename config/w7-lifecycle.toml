schema_version = 1
project = "eliot-search"
stage = "P13"
wave = 7
status = "schema-only"
implementation_authorized = false

# LOCKED fields are architecture/security invariants and cannot be overridden. TUNABLE fields are
# bounded resource/scheduling policy validated by the semantic owner. COMMAND_ONLY fields are not
# configuration toggles; they require authenticated explicit lifecycle commands and receipts.

[security]
owner = "search-access"

[[security.field]]
name = "restrictive_state_monotonic"
type = "bool"
mode = "LOCKED"
default = true

[[security.field]]
name = "ack_after_live_fence"
type = "bool"
mode = "LOCKED"
default = true

[[security.field]]
name = "contaminated_leg_policy"
type = "enum"
mode = "LOCKED"
default = "discard_whole_leg"

[[security.field]]
name = "invalidation_batch_targets"
type = "u32"
mode = "TUNABLE"
min = 1
max = 100000
default = 1024
change_action = "APPLY_LIVE"

[[security.field]]
name = "invalidation_timeout_ms"
type = "u64"
mode = "TUNABLE"
min = 100
max = 120000
default = 15000
change_action = "APPLY_LIVE"

[handles]
owner = "search-handles"

[[handles.field]]
name = "durable_requires_retained_revision"
type = "bool"
mode = "LOCKED"
default = true

[[handles.field]]
name = "durable_unsaved_allowed"
type = "bool"
mode = "LOCKED"
default = false

[[handles.field]]
name = "restored_token_reuse_allowed"
type = "bool"
mode = "LOCKED"
default = false

[[handles.field]]
name = "invalidation_batch_records"
type = "u32"
mode = "TUNABLE"
min = 1
max = 100000
default = 1024
change_action = "APPLY_LIVE"

[continuations]

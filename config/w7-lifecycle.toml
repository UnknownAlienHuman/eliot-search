mode = "LOCKED"
default = true

[[retention.field]]
name = "refcount_is_deletion_authority"
type = "bool"
mode = "LOCKED"
default = false

[[retention.field]]
name = "mark_batch_objects"
type = "u32"
mode = "TUNABLE"
min = 1
max = 100000
default = 10000
change_action = "APPLY_LIVE"

[[retention.field]]
name = "sweep_batch_objects"
type = "u32"
mode = "TUNABLE"

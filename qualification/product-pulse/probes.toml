schema_version = 1
project = "eliot-search"
architecture_version = "8.4"
stage = "P15"
wave = 9
gate = "G5"
status = "NOT_EXECUTED"
result_values = ["PASS", "FAIL", "UNAVAILABLE"]
raw_output_required_for_pass = true
independent_review_required_for_pass = true
all_mandatory_must_pass = true
prose_only_evidence = "reject"

[probe_defaults]
owner = "search-eval"
mandatory = true
result = "UNAVAILABLE"
command_or_fixture_ref = ""
raw_output_ref = ""
raw_output_digest = ""
reviewer_receipt_ref = ""

[[probe]]
id = "corpus_manifest_complete"
evidence_id = "control_corpus_abc_results"
producer = "search-eval"
purpose = "All required case IDs, fixture/oracle digests and eight-lineage minimum validate."

[[probe]]
id = "baseline_a_exact_identity"
evidence_id = "control_corpus_abc_results"

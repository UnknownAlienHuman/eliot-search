direction = "lower"
denominator = "case"
class = "required_quality"
hard_blocker = false
description = "Latency to first correct grounded action."

[[metric]]
id = "request_latency_ms"
unit = "milliseconds"
direction = "lower"
denominator = "request"
class = "performance"
hard_blocker = false
description = "End-to-end request latency."

[[metric]]
id = "first_useful_progressive_card_ms"
unit = "milliseconds"
direction = "lower"
denominator = "request"
class = "performance"
hard_blocker = false
description = "Accepted first useful card timer."

[[metric]]
id = "process_cpu_ms"
unit = "milliseconds"
direction = "lower"
denominator = "case"
class = "resource"
hard_blocker = false

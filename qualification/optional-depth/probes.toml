schema_version = 1
project = "eliot-search"
architecture_version = "8.4"
stage = "P16-P18"
wave = 10
gate = "G6"
status = "TEMPLATES_DISABLED"
result_values = ["DISABLED", "PASS", "FAIL", "UNAVAILABLE"]
selected_candidate = "NONE"
raw_output_required_for_pass = true
independent_review_required_for_pass = true
prose_only_evidence = "reject"

[probe_defaults]
mandatory_when_selected = true
result = "DISABLED"
raw_output_ref = ""
raw_output_digest = ""
reviewer_receipt_ref = ""

# MODEL_OPTIONAL — 15 probes, three per G6 evidence ID.

[[probe]]
id = "model_adr_exact_scope"
profile = "model"
evidence_id = "dedicated_optional_profile_adr"
producer = "integration-owner"
purpose = "ADR fixes candidate kind, intended use, feature/config, risks and authority boundary."

[[probe]]
id = "model_adr_p15_binding"
profile = "model"
evidence_id = "dedicated_optional_profile_adr"
producer = "independent-reviewer"
purpose = "ADR and candidate are bound to the exact accepted P15 report and regression baseline."

[[probe]]
id = "model_profile_contract_freeze"
profile = "model"
evidence_id = "dedicated_optional_profile_adr"
producer = "search-model-provider"
purpose = "All model/tokenizer/runtime/vector/rerank/resource/content fields are immutable."

[[probe]]
id = "model_artifact_runtime_identity"
profile = "model"
evidence_id = "exact_provider_artifact_qualification"
producer = "eliot-search-model-worker"
purpose = "Worker/runtime/model weights/tokenizer/Windows/license identities match exact digests."

[[probe]]
id = "model_document_query_rerank_golden"
profile = "model"
evidence_id = "exact_provider_artifact_qualification"
producer = "search-model-provider"
purpose = "Document/query vectors and rerank calibration match qualified golden fixtures."

[[probe]]
id = "model_security_resource_worker_qualification"
profile = "model"
evidence_id = "exact_provider_artifact_qualification"
producer = "eliot-search-model-worker"
purpose = "Private IPC, no-network/content policy, finite resources, cancellation and crash isolation pass."

[[probe]]
id = "model_incremental_quality_gain"
profile = "model"
evidence_id = "measured_material_benefit"
producer = "search-eval"
purpose = "Pre-registered extension of P15 demonstrates material quality/recall gain."

[[probe]]
id = "model_latency_resource_cost"
profile = "model"
evidence_id = "measured_material_benefit"
producer = "search-eval"
purpose = "Latency, CPU/GPU, RAM/VRAM, disk, preparation and model-input cost are acceptable."

[[probe]]
id = "model_access_currentness_noninterference"
profile = "model"
evidence_id = "measured_material_benefit"
producer = "search-eval"
purpose = "Inaccessible/stale/denied/purged/shadowed material cannot influence model output."

[[probe]]
id = "model_absent_disabled_baseline"
profile = "model"
evidence_id = "removal_or_uninstall_fallback"
producer = "eliot-searchd"
purpose = "Feature/binary/profile is absent or disabled by default and P15 works without it."

[[probe]]
id = "model_worker_cache_cleanup"
profile = "model"
evidence_id = "removal_or_uninstall_fallback"
producer = "eliot-search-model-worker"
purpose = "Drain/shutdown removes provider input/temp/cache state and verifies process exit."

[[probe]]
id = "model_p15_regression_after_removal"
profile = "model"
evidence_id = "removal_or_uninstall_fallback"
producer = "search-eval"
purpose = "Accepted P15 behavior and capability regression pass after uninstall."

[[probe]]
id = "model_generation_or_not_applicable_plan"
profile = "model"
evidence_id = "migration_and_rollback_when_applicable"
producer = "eliot-searchd"
purpose = "Dense/multivector use generation migration; rerank-only has reviewed no-persistent-state proof."

[[probe]]
id = "model_route_pin_drain_and_candidate_discard"
profile = "model"
evidence_id = "migration_and_rollback_when_applicable"
producer = "search-publication"
purpose = "Failed candidate exact-discard and old-route pin drain preserve baseline visibility."

[[probe]]
id = "model_activation_rollback_failpoints"
profile = "model"
evidence_id = "migration_and_rollback_when_applicable"
producer = "eliot-searchd"
purpose = "Worker/build/validation/control/snapshot/removal crash matrix restores coherent baseline."


[package]
name = "search-os-secrets-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# Enables the bounded Credential Manager deletion API used only by native test
# harness cleanup. Production daemon builds do not enable this feature.
test-credential-cleanup = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

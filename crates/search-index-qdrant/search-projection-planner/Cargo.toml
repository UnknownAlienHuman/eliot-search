[package]
name = "search-projection-planner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
search-contracts.workspace = true
search-domain.workspace = true
search-ports.workspace = true
search-point-identity.workspace = true
# The planner owns expected payload/vector/manifest digests. Use the same exact
# pure-Rust BLAKE3 pin as the daemon and point-identity owner.
blake3 = { version = "=1.8.2", default-features = false, features = ["std", "pure", "zeroize"] }

[lints]
workspace = true

fields = [
  { name = "binding_id", type = "BindingId", presence = "required", basis = "S19.1 and S32.0", rule = "Strong identity; never supplied as authoritative request input." },
  { name = "installation_id", type = "InstallationId", presence = "required", basis = "S19.1", rule = "Must equal the daemon installation identity." },
  { name = "installation_incarnation_id", type = "InstallationIncarnationId", presence = "required", basis = "S19.1 and S32.0", rule = "Must equal the live installation incarnation." },
  { name = "peer_role", type = "closed PeerRole enum", presence = "required", basis = "proposed from S32.0 mutual-authenticated hello", rule = "Exact variants are owned by search-provider-protocol; arbitrary strings are forbidden." },
  { name = "peer_identity_digest", type = "Blake3Digest32", presence = "required", basis = "proposed from S32.0 mutual-authenticated hello", rule = "Stable comparison value only; never proof of authentication or a raw vendor/native identity." },
  { name = "pairing_generation", type = "NonZeroRevision", presence = "required", basis = "proposed currentness fence", rule = "Identifies one pairing; never zero, wraps, or reuses a retired value." },
  { name = "permitted_profile_ids", type = "BoundedSet<ProfileId>", presence = "required", basis = "proposed from S32.2 binding-filtered available_profiles", rule = "Filters capability exposure only and never grants recipe, read, exact-scan, or retrieval permission; empty means none." },
  { name = "issued_at", type = "UtcTimestamp", presence = "required", basis = "proposed lifecycle metadata", rule = "Explicit record time; not a substitute for current readback." },
  { name = "expires_at", type = "Option<UtcTimestamp>", presence = "required", basis = "proposed lifecycle ceiling", rule = "Null explicitly means no time-based binding expiry; otherwise strictly later than issued_at." },
  { name = "revocation_generation", type = "NonZeroRevision", presence = "required", basis = "S19.1 revocation fence", rule = "Sole owner of binding revocation generation; copied from the same current row into each grant." },
  { name = "status", type = "ProviderBindingStatus", presence = "required", basis = "proposed explicit lifecycle", rule = "Closed tags ACTIVE, REVOKED, EXPIRED; terminal rows cannot reactivate in place." },
]

schema_version = 1
project = "eliot-search"
stage = "P13"
wave = 7
status = "BLOCKED"
launch_authority = "swarm/launch-state.toml"
qualification = "qualification/lifecycle/W7_QUALIFICATION.md"
baseline = "qualification/lifecycle/baseline.toml"
probes = "qualification/lifecycle/probes.toml"
settings_schema = "config/w7-lifecycle.toml"
settings_contract = "docs/config/W7_LIFECYCLE_SETTINGS_1.0.md"
implementation_packet = "docs/handoff/W7_IMPLEMENTATION_PACKET.md"
architecture_access = "exception-only"

# A W7 ticket supplies only one package packet, exact accepted direct-dependency handoffs, named
# fixtures/settings and applicable probe IDs. Presence here is not launch authorization.

[[packet]]
package = "search-retention"
primary = "crates/search-runtime/search-retention/FUNCTIONS.md"
assignment = "swarm/assignments/search-retention.md"
config_packets = ["config/sections/retention.md", "config/w7-lifecycle.toml"]
owns = ["retention_roots", "mark_sweep_policy", "purge_fence_tombstone_plan_receipt", "paired_recovery_restore_quarantine"]
accepted_handoffs_required = ["search-contracts", "search-domain", "search-ports", "search-config", "search-control-redb", "search-revision-store", "search-access", "search-handles", "search-continuation", "search-candidate-validator", "search-publication", "search-epoch-pins", "search-index-reclaimer"]

[[packet]]
package = "search-revision-store"
primary = "crates/search-source/search-revision-store/FUNCTIONS.md"
assignment = "swarm/assignments/search-revision-store.md"
config_packets = ["config/sections/revision_store.md", "config/w7-lifecycle.toml"]
owns = ["immutable_revision_objects", "retention_leases", "lifecycle_root_inventory_ports", "exact_object_operations", "store_tombstone_quarantine"]
accepted_handoffs_required = ["search-contracts", "search-domain", "search-ports", "search-config", "search-control-redb", "search-source-identity", "search-source-registry"]

[[packet]]

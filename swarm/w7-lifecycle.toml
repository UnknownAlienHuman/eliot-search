[review]
require_exact_dependency_api_digests = true
require_operation_identity_and_unknown_outcome = true
require_checkpoint_matrix = true
require_owner_specific_invalidation_receipts = true
require_no_content_in_diagnostics = true
require_receipt_layer_truthfulness = true
require_line_budget = true

[gate]
gate_id = "G3"
stage = "P13"
required_evidence = [
  "restrictive_security_live_fence_and_checkpoints",
  "handle_continuation_candidate_lifecycle_hardening",
  "residency_revision_lifecycle_ports",
  "retention_mark_sweep_fault_matrix",
  "purge_fence_layers_tombstone_non_resurrection",
  "restore_pairing_quarantine_revalidation_new_route",
  "ordinary_reclaim_sweep_purge_receipt_separation",
  "lifecycle_content_minimization_and_non_overclaim",
]

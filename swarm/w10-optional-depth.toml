[[packet]]
package = "search-eval"
stages = ["P16", "P17", "P18"]
assignment = "swarm/assignments/search-eval.md"
functions = "crates/search-eval/FUNCTIONS.md"
contract = "crates/search-eval/W10_OPTIONAL_EVALUATION.md"
write_scope = "crates/search-eval/**"
role = "candidate-evaluation-owner"
soft_src_line_target = 7500
accepted_handoffs_required = [
  "accepted_P15_Product_Pulse",
  "accepted_search-eval_W9_API",
  "candidate_specific_ADR_and_G6_inputs",
  "exact_selected_candidate_package_API_digests",
]
read_set = [
  "AGENTS.md",
  "crates/search-eval/AGENTS.md",
  "swarm/assignments/search-eval.md",
  "crates/search-eval/FUNCTIONS.md",
  "crates/search-eval/W10_OPTIONAL_EVALUATION.md",
  "docs/optional/W10_OPTIONAL_DEPTH_CONTRACTS_1.0.md",
  "qualification/optional-depth/W10_QUALIFICATION.md",
  "qualification/optional-depth/baseline.toml",
  "qualification/optional-depth/probes.toml",
  "qualification/optional-depth/gate-map.toml",
  "qualification/optional-depth/fixture-owners.toml",
  "config/w10-optional-depth.toml",
]

[integration]
shared_evidence_and_registry_edits = "integration-owner-only"
package_writer_may_select_provider = false
package_writer_may_edit_other_package = false
package_writer_may_accept_g6 = false
package_writer_may_enable_feature_or_config = false
required_candidate_inputs = [
  "exact_accepted_P15_receipt",
  "dedicated_candidate_ADR",
  "exact_artifact_profile_Windows_license_qualification",
  "pre_registered_material_benefit_policy",
  "removal_fallback_plan",
  "migration_rollback_plan_or_reviewed_rerank_only_not_applicable_receipt",
]

[gate_requirements]
required_evidence_ids = [
  "dedicated_optional_profile_adr",
  "exact_provider_artifact_qualification",
  "measured_material_benefit",
  "removal_or_uninstall_fallback",
  "migration_and_rollback_when_applicable",
]
raw_output_required = true
independent_review_required = true
all_selected_candidate_probes_must_pass = true

[current_state]
accepted_p15_receipt = "UNSELECTED"
selected_candidate = "NONE"
model = "DISABLED"
document = "DISABLED"
scale = "DISABLED"
g6 = "NOT_ACCEPTED"

schema_version = 1
project = "eliot-search"
architecture_version = "8.4"
stage = "P16-P18"
wave = 10
gate = "G6"
status = "BLOCKED"
launch_authority = "swarm/launch-state.toml"
requires_accepted_gate = "G5"
requires_exact_accepted_p15_receipt = true
implementation_authorized = false
optional_depth_authorized = false
one_candidate_per_ticket = true
ordinary_agent_architecture_access = "exception-only"

cross_package_contract = "docs/optional/W10_OPTIONAL_DEPTH_CONTRACTS_1.0.md"
qualification = "qualification/optional-depth/W10_QUALIFICATION.md"
settings = "config/w10-optional-depth.toml"
probe_templates = "qualification/optional-depth/probes.toml"
gate_map = "qualification/optional-depth/gate-map.toml"
fixture_owners = "qualification/optional-depth/fixture-owners.toml"

[[packet]]
package = "search-model-provider"
stages = ["P16"]
assignment = "swarm/assignments/search-model-provider.md"
functions = "crates/search-model-provider/FUNCTIONS.md"
profile_template = "qualification/optional-depth/model-profile.toml"
write_scope = "crates/search-model-provider/**"
soft_src_line_target = 6500
accepted_handoffs_required = ["search-contracts", "search-domain", "search-ports"]
read_set = [
  "AGENTS.md",
  "crates/search-model-provider/AGENTS.md",
  "swarm/assignments/search-model-provider.md",
  "crates/search-model-provider/FUNCTIONS.md",
  "docs/optional/W10_OPTIONAL_DEPTH_CONTRACTS_1.0.md",
  "qualification/optional-depth/model-profile.toml",
  "qualification/optional-depth/probes.toml",
  "config/w10-optional-depth.toml",
]

[[packet]]
package = "eliot-search-model-worker"
stages = ["P16"]
assignment = "swarm/assignments/eliot-search-model-worker.md"
functions = "bins/eliot-search-model-worker/FUNCTIONS.md"
profile_template = "qualification/optional-depth/model-profile.toml"
write_scope = "bins/eliot-search-model-worker/**"
soft_src_line_target = 4500
accepted_handoffs_required = ["search-contracts", "search-ports", "search-provider-protocol", "search-model-provider"]
read_set = [
  "AGENTS.md",
  "bins/eliot-search-model-worker/AGENTS.md",
  "swarm/assignments/eliot-search-model-worker.md",
  "bins/eliot-search-model-worker/FUNCTIONS.md",

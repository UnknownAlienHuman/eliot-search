  "AGENTS.md",
  "bins/eliot-searchd/AGENTS.md",
  "bins/eliot-searchd/W10_INTEGRATION.md",
  "docs/optional/W10_OPTIONAL_DEPTH_CONTRACTS_1.0.md",
  "qualification/optional-depth/W10_QUALIFICATION.md",
  "config/sections/optional_profiles.md",
  "config/w10-optional-depth.toml",
]

[[packet]]
package = "search-qdrant-bridge"
stages = ["P18"]
contract = "crates/search-index-qdrant/search-qdrant-bridge/P18_SCALE.md"

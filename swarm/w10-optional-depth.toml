profile_template = "qualification/optional-depth/document-profile.toml"
write_scope = "bins/eliot-search-doc-worker/**"
soft_src_line_target = 5000
accepted_handoffs_required = ["search-contracts", "search-ports", "search-provider-protocol", "search-materializer"]

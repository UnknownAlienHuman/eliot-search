modules = ["search-control-redb:snapshot", "eliot-searchd:request"]

[[invariant]]
id = "INV-11"
summary = "Uncommitted epoch is never observable as current"
enforcement_packages = ["search-publication", "search-control-redb"]
modules = ["search-publication:commit", "search-control-redb:snapshot"]

[[invariant]]
id = "INV-12"
summary = "Epoch number is never reused within a collection generation"
enforcement_packages = ["search-contracts", "search-domain", "search-publication"]
modules = ["search-contracts:ids", "search-domain:transitions", "search-publication:intent"]

[[invariant]]
id = "INV-13"
summary = "At most one active Qdrant publication commit transaction globally"
enforcement_packages = ["search-publication"]
modules = ["search-publication:actor"]

[[invariant]]
id = "INV-14"
summary = "Publication writes are acknowledged and read back before control commit"

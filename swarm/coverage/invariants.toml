[[invariant]]
id = "INV-01"
summary = "Qdrant is the only search/index database"
enforcement_packages = ["search-qdrant-bridge", "search-control-redb", "eliot-searchd"]
modules = ["search-qdrant-bridge:schema", "search-control-redb:transaction", "eliot-searchd:profile"]

[[invariant]]
id = "INV-02"
summary = "redb contains control state, never searchable corpus"
enforcement_packages = ["search-control-redb"]
modules = ["search-control-redb:transaction", "search-control-redb:snapshot"]

[[invariant]]
id = "INV-03"
summary = "Original source or immutable admitted revision is source truth"
enforcement_packages = ["search-safe-reader", "search-revision-store", "search-candidate-validator"]
modules = ["search-safe-reader:stable_read", "search-revision-store:revision", "search-candidate-validator:readback"]

[[invariant]]
id = "INV-04"
summary = "Retrieval proposes candidates; consuming client owns interpretation and admission"
enforcement_packages = ["search-result-projector", "search-provider-protocol", "search-eliot-adapter", "search-research-export-adapter"]
modules = ["search-result-projector:evidence", "search-provider-protocol:terminal", "search-eliot-adapter:result", "search-research-export-adapter:export"]

[[invariant]]
id = "INV-05"
summary = "One Qdrant point belongs to exactly one ProjectionMembership"
enforcement_packages = ["search-projection-planner", "search-point-identity", "search-qdrant-bridge"]
modules = ["search-projection-planner:point_set", "search-point-identity:key", "search-qdrant-bridge:schema"]

[[invariant]]
id = "INV-06"
summary = "Point payload contains no membership array or corpus names"
enforcement_packages = ["search-projection-planner", "search-qdrant-bridge"]
modules = ["search-projection-planner:schema", "search-qdrant-bridge:schema"]

[[invariant]]
id = "INV-07"
summary = "Access and currentness filter before candidate generation and IDF"
enforcement_packages = ["search-access", "search-query-planner", "search-retrieval-executor", "search-qdrant-bridge"]
modules = ["search-access:legs", "search-query-planner:legs", "search-retrieval-executor:legs", "search-qdrant-bridge:query"]

[[invariant]]
id = "INV-08"
summary = "Indexed top-K never narrows an exact negative-proof denominator"
enforcement_packages = ["search-exact", "search-query-planner"]
modules = ["search-exact:denominator", "search-query-planner:plan"]

[[invariant]]
id = "INV-09"
summary = "Restrictive access and purge fences override snapshots immediately"
enforcement_packages = ["search-access", "search-retention", "search-candidate-validator", "search-handles", "search-continuation"]
modules = ["search-access:barrier", "search-retention:purge", "search-candidate-validator:security", "search-handles:invalidate", "search-continuation:reauthorize"]

[[invariant]]
id = "INV-10"
summary = "Short query performs no durable control-store write"

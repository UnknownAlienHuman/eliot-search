]

[invariants]
pure_operations_create_records = false
mutation_operations_require_operation_id = true
mutation_operations_require_exact_post_write_readback = true
same_operation_different_input = "CONTROL_OPERATION_CONFLICT"
blind_retry_after_possible_write_allowed = false
partial_multi_record_success_allowed = false
control_record_in_place_mutation_allowed = false
package_writer_may_publish_integration_records = false
package_handoff_may_advance_gate_or_wave = false
workflow_result_may_issue_authority = false

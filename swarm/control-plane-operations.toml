manual_workflow = ".github/workflows/ticket-issuance-conformance.yml"
workflow_policy = "manual_only"
unknown_operations = "reject"
unknown_failure_codes = "reject"
operation_count = 12
pure_operation_count = 2
mutation_operation_count = 9
read_only_recovery_operation_count = 1

operation_kinds = ["PURE", "MUTATION", "READ_ONLY_RECOVERY"]
recovery_dispositions = [
  "RECOVERED_SUCCEEDED",
  "SAFE_TO_RETRY",
  "CONFLICT",
  "PRESERVE_OUTCOME_UNKNOWN",
]

[[operation]]
id = "validate_ticket_draft"
kind = "PURE"
authority = "integration-owner"
actor = "integration-owner"
input_kinds = ["assignment_ticket_draft_v2", "package_registry", "function_registry", "stage_registry", "launch_state"]
output_kinds = ["validated_ticket_draft"]
domain_separator = ""
idempotency = "deterministic_equal_input_equal_output"
cancellation = "side_effect_free_check_between_bounded_validation_steps"
deadline = "finite_caller_deadline_or_explicit_ABSENT"
recovery = "not_applicable_no_mutation"
state_transition = "none"
failure_codes = ["DRAFT_NOT_VALID", "DRAFT_NOT_NONCLAIMABLE"]

[[operation]]
id = "validate_context_draft"
kind = "PURE"
authority = "integration-owner"
actor = "integration-owner"
input_kinds = ["writer_context_draft_v2", "context_draft_manifest_v2", "package_registry", "function_registry", "stage_registry", "launch_state"]
output_kinds = ["validated_context_draft"]
domain_separator = ""
idempotency = "deterministic_equal_input_equal_output"
cancellation = "side_effect_free_check_between_bounded_validation_steps"

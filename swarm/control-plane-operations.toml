authority = "integration-owner"
actor = "integration-owner"
input_kinds = ["operation_id", "canonical_input_digest", "intended_target_paths", "repository_read_view"]
output_kinds = ["closed_recovery_disposition"]
domain_separator = "recover_control_operation_v1"
idempotency = "read_only_equal_repository_view_equal_disposition"

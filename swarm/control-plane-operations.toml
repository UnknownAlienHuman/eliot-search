schema_version = 1
project = "eliot-search"
architecture_version = "8.4"
status = "CONTRACT_ONLY_NOT_IMPLEMENTED"
owner = "integration-owner"
operation_contract = "docs/handoff/TICKET_ISSUANCE_OPERATIONS.md"
record_schema_registry = "swarm/control-plane-schema.toml"
type_registry = "swarm/schemas/types-v1.toml"

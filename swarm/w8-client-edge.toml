require_optional_profiles_disabled_by_default = true
require_research_native_readback_and_independent_wire_digest = true
require_unknown_mutation_outcome_recovery = true
require_raw_evidence_and_independent_review = true
require_line_budget = true

[gate_evidence]
required = [
  "provider_frame_replay_cancel_limits",
  "authenticated_binding_and_grant",
  "capability_descriptor_filtering",
  "handle_expansion_reauthorization",
  "generic_request_plan_candidate_roundtrip",
]

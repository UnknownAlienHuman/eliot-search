[canonicalization]
representation = "literal UTF-8 uppercase ASCII enum tokens"
case_sensitive = true
aliases_or_normalization_allowed = false
unknown_values = "reject_as_schema_error"
allowed_values_order = "lexicographic"
ordered_record_field_order = "unchanged_from_types_v1"
status_of_every_value = "PROPOSED_REVIEW_PENDING"

[separation]
result_values = ["FAIL", "PASS", "UNAVAILABLE"]
result_values_source = "qualification/ticket-issuance/probes.toml"
expected_behavior_values = ["FAILURE", "POLICY", "RECOVERY", "SUCCESS"]
expected_behavior_source = "qualification/ticket-issuance/probes.toml"
rule = "A class value is not a probe verdict, process exit, qualification receipt, package acceptance, or authority state."
unavailable_rule = "UNAVAILABLE remains explicit and never becomes PASS, a default, or silent omission."

[[closed_enum]]
enum_id = "fixture_qualification_status_candidate"
field_paths = ["OrderedFixtureRef.qualification_status"]
proposal_state = "PROPOSED_REVIEW_PENDING"
allowed = ["FAILED", "QUALIFIED", "UNAVAILABLE"]
meaning = "State of qualification evidence for this exact fixture_id and fixture_digest, not package or ticket qualification. A not-yet-run check remains UNAVAILABLE."

  [[closed_enum.value]]
  value = "FAILED"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The exact fixture digest was evaluated and failed its declared qualification criteria; preserve the associated typed failure evidence."

  [[closed_enum.value]]
  value = "QUALIFIED"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The exact fixture digest has an immutable qualification result and independent accepted reviewer evidence in its owning registry. The token alone grants no package or ticket authority."

  [[closed_enum.value]]
  value = "UNAVAILABLE"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "Qualification was not run or could not be evaluated for this exact fixture digest; it does not satisfy a qualification prerequisite."

[[closed_enum]]
enum_id = "process_exit_class_candidate"
field_paths = ["BoundedCommandSpec.expected_exit_class", "OrderedRawCommandOutcomeRef.exit_class"]
proposal_state = "PROPOSED_REVIEW_PENDING"
allowed = ["EXIT_NONZERO", "EXIT_ZERO"]
meaning = "Normal process termination class only. It is independent of the command's test verdict and evidence acceptance class."

  [[closed_enum.value]]
  value = "EXIT_NONZERO"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The process started and terminated with a nonzero exit status. This does not mean the evidence assertion failed or passed."

  [[closed_enum.value]]
  value = "EXIT_ZERO"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The process started and terminated with exit status zero. This does not mean the evidence assertion passed or the package was accepted."

[[closed_enum]]
enum_id = "evidence_artifact_class_candidate"
field_paths = [
  "BoundedCommandSpec.evidence_class",
  "EvidenceRequirement.evidence_class",
  "OrderedEvidenceRef.evidence_class",
  "OrderedAcceptedEvidenceRef.evidence_class",
]
proposal_state = "PROPOSED_REVIEW_PENDING"
allowed = ["PACKAGE_HANDOFF_CANDIDATE", "PUBLIC_API_SCHEMA_DIGEST", "QUALIFICATION_PROBE_RESULT", "RESIDUAL_RISK_RECORD", "TEST_RESULT"]
meaning = "Kind of required/produced evidence artifact; raw process output remains separately identified by OrderedRawCommandOutcomeRef."

  [[closed_enum.value]]
  value = "PACKAGE_HANDOFF_CANDIDATE"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "A package handoff candidate artifact; candidate status is not accepted handoff status."

  [[closed_enum.value]]
  value = "PUBLIC_API_SCHEMA_DIGEST"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The public API/schema digest deliverable named by the P00 draft; it is not a compatibility or handoff acceptance by itself."

  [[closed_enum.value]]
  value = "QUALIFICATION_PROBE_RESULT"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "An immutable probe result artifact with its raw output and reviewer receipt bound where the applicable qualification contract requires them."

  [[closed_enum.value]]
  value = "RESIDUAL_RISK_RECORD"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The required residual-risks-and-contract-changes record; recording a risk does not waive it."

  [[closed_enum.value]]
  value = "TEST_RESULT"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "A package-local test or contract/property/negative-test result, including the fifteen named P00 evidence obligations."

[[closed_enum]]
enum_id = "expected_behavior_acceptance_class_candidate"
field_paths = ["EvidenceRequirement.acceptance_class", "OrderedEvidenceRef.acceptance_class"]
proposal_state = "PROPOSED_REVIEW_PENDING"
allowed = ["FAILURE", "POLICY", "RECOVERY", "SUCCESS"]
meaning = "Expected behavior family for a requirement, reusing the qualification packet's expected_classes vocabulary. It is not the result state."

  [[closed_enum.value]]
  value = "FAILURE"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The behavior under test is an expected typed rejection. A matching ClosedReasonCode must be bound by the exact fixture/probe contract; a conformance probe can still have result PASS."

  [[closed_enum.value]]
  value = "POLICY"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The behavior under test is a policy invariant, including prohibited authority or control-record mutation where specified."

  [[closed_enum.value]]
  value = "RECOVERY"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The behavior under test is a named recovery disposition; the exact disposition must be bound by the fixture/probe contract."

  [[closed_enum.value]]
  value = "SUCCESS"
  proposal_state = "PROPOSED_REVIEW_PENDING"
  meaning = "The behavior under test is the specified successful operation outcome."

[compatibility]
expected_vs_observed_exit_class = "For every completed command, retain the actual EXIT_ZERO or EXIT_NONZERO in OrderedRawCommandOutcomeRef.exit_class, even when it differs from BoundedCommandSpec.expected_exit_class. Compare expected and observed classes only in the separate acceptance evaluation; a mismatch fails that acceptance evaluation but does not make the observed record schema-invalid, omitted, or rewritten."
unlinked_command_and_requirement = "The ticket schema has no producer command_id on EvidenceRequirement. Do not infer a command-to-requirement association from array order; exact evidence-class equality is enforceable only after an explicit immutable association is supplied."
evidence_requirement_to_evidence_ref = "For the same requirement_id, OrderedEvidenceRef.evidence_class and acceptance_class must copy the exact EvidenceRequirement values."
accepted_evidence_class = "OrderedAcceptedEvidenceRef.evidence_class must equal the referenced EvidenceRequirement.evidence_class; requirement_id must resolve through the immutable ticket."
failure_semantics = "EXIT_NONZERO is not a typed failure reason. FAILURE acceptance_class requires the exact ClosedReasonCode from the bound fixture/probe; unknown or missing reason evidence remains a failure, not an inferred match."
unavailable_semantics = "A command that never starts, times out, is cancelled, or has unknown completion is not EXIT_NONZERO. Preserve it as an explicit unavailable check with a semantically applicable ClosedReasonCode; if none exists, stop for a separate reason-registry contract change."
qualification_semantics = "QUALIFIED is copied only from the owning fixture registry after its evidence requirements are met; the proposed status enum cannot execute probes or promote status."
pass_scope = "The ticket-issuance qualification packet and P00 G0 each define their own PASS requirements. This proposal does not make every evidence class or every ticket requirement PASS-required."

[follow_up_contract_gaps]
status = "PROPOSED_REVIEW_PENDING"
additional_closed_enum_fields = ["OrderedAcceptedEvidenceRef.availability", "OrderedUnavailableCheck.status"]
additional_field_rules = [
  "Bind each EvidenceRequirement to its producing command or immutable fixture/probe; current schema has no producer_command_id or equivalent link.",
  "Define how artifact_required=false is represented by OrderedEvidenceRef, whose current artifact_ref and artifact_sha256 fields are required.",
  "Define exact failure-code/recovery-disposition linkage for acceptance_class=FAILURE or RECOVERY.",
  "Add a typed command execution failure/unavailability reason only if existing ClosedReasonCode values cannot accurately represent start failure, timeout, cancellation, or unknown completion.",
  "Confirm accepted evidence can resolve acceptance_class through requirement_id and the bound immutable ticket; OrderedAcceptedEvidenceRef has no acceptance_class field."
]

[review_boundary]
requires_independent_integration_review = true
requires_types_and_assignment_schema_change_before_enforcement = true
draft_or_probe_presence_is_execution = false
qualification_result_is_package_acceptance = false
package_handoff_is_gate_or_wave_acceptance = false
automatic_control_record_creation = false

schema_version = 1
project = "eliot-search"
candidate_id = "local-windows-cng-software-ecdsa-p256-v1"
profile_ref = "eliot-search/local-windows-cng-software-ecdsa-p256-v1"
profile_kind = "LOCAL_APPROVAL_PROFILE"
profile_version = 1
status = "PROPOSED_REVIEW_PENDING"
claimable = false
profile_instance = "NOT_PROVISIONED"
qualified = false
qualification_result = "UNAVAILABLE"
owner = "integration-owner/native-rust-control-plane-tooling"
target_runtime = "Windows x64"

[signing]
api = "Windows CNG NCrypt/BCrypt through the native Win32 ABI"
key_storage_provider = "Microsoft Software Key Storage Provider"
key_scope = "persisted current-user key; NCRYPT_MACHINE_KEY_FLAG is not used"
key_container_name_pattern = "^EliotSearch-Approval-v1-[A-Za-z0-9._-]{1,96}$"
key_container_name_authority = "must be explicitly present in the root-signed actor mapping; name is a locator only, never actor identity or trust"
key_open_validation = "open the exact mapped key name and recompute SHA-256 of the exact exported public BCRYPT_ECCPUBLIC_BLOB; it must equal the signed key_id"
key_algorithm = "ECDSA P-256"
prehash_algorithm = "SHA-256"
signature_encoding = "IEEE P1363 fixed-field concatenation: 32-byte r followed by 32-byte s"
signature_bytes = 64
signature_api = "NCryptSignHash over SHA-256(signature_preimage)"
signing_flags = "NCRYPT_SILENT_FLAG; fail if the selected provider requests UI"
key_create_overwrite_flag = "never set NCRYPT_OVERWRITE_KEY_FLAG; an existing persisted key name blocks provisioning"
verification_api = "NCryptVerifySignature with the trusted public key and the same SHA-256 digest"
public_key_encoding = "exact BCRYPT_ECCPUBLIC_BLOB returned by NCryptExportKey"
public_key_blob_length_bytes = 72
public_key_blob_hex_characters = 144
public_key_blob_layout = "BCRYPT_ECCKEY_BLOB header (dwMagic=BCRYPT_ECDSA_PUBLIC_P256_MAGIC, cbKey=32) followed by unsigned big-endian X[32] and Y[32]"
key_id = "sha256- plus lowercase SHA-256 of exact public-key blob bytes"
key_export_policy = "set NCRYPT_EXPORT_POLICY_PROPERTY to DWORD 0 before finalization and require NCryptGetProperty readback 0; qualification must verify that the exact provider rejects export"
plaintext_private_key_artifact = false
credential_or_pin_in_repository = false
human_presence_proved = false
hardware_required = false
automatic_provider_fallback = false

[signature_preimage]
encoding_id = "control_record_signature_preimage_v1"
domain_separator_ascii = "ELIOT-SEARCH/APPROVAL-SIGNATURE/V1"
domain_terminator = "one zero byte"
field_encoding = "each ASCII text field is U16BE byte length followed by exact ASCII bytes; u16 and raw32 fields have the fixed widths named in field_order"
field_order = [
  "profile_ref",
  "record_kind",
  "schema_version_u16be",
  "signed_payload_sha256_raw_32_bytes",
  "actor_identity",
  "operation_id_raw_32_bytes",
  "canonical_input_sha256_raw_32_bytes",
  "trust_manifest_sha256_raw_32_bytes",
]
record_payload_digest = "SHA-256 of exact UTF-8/LF record bytes before the [signature] table, per swarm/RECEIPT_CANONICALIZATION.md"
signed_message_digest = "SHA-256 of domain separator, terminator and ordered framed fields"
immutable_context_binding = "canonical input SHA-256 plus operation ID bind the exact immutable inputs and context for this issuance operation"
signature_artifact_is_in_preimage = false
complete_record_file_sha256_is_in_preimage = false
operation_receipt_sha256_is_in_preimage = false
operation_input_artifact_is_referenced_by_digest = true

[identity]
actor_identity_source = "exact ActorIdentity field; never a display name"
trust_mapping = "root-signed immutable actor trust manifest maps exact ActorIdentity to one active key ID, one exact current-user CNG key-container name and allowed operation domains; opening the name must reproduce the mapped public-key blob digest"
trust_mapping_schema = "PROPOSED actor_trust_manifest_v1 and actor_trust_head_v1 shape in [trust_manifest_candidate]; not registered or accepted, so authoritative mutation remains blocked"
trusted_actor_count_limit = 128
active_keys_per_actor = 1
writer_reviewer_distinct_strings = "ticket-assigned ActorIdentity values and their root-mapped key IDs must be distinct; distinct strings do not prove distinct humans"
key_custody_proof = "not required to meet the standalone software-profile baseline; any stronger custody claim is optional external evidence and must never be inferred from labels or digest equality"
windows_user_sid_binding = "REQUIRED_EXTERNAL_TRUST_INPUT when OS-principal separation is claimed"

[trust_bootstrap]
root_public_key_fingerprint = "REQUIRED_EXTERNAL_INPUT_VERIFIED_OUT_OF_BAND"
trust_manifest_signature = "required; a self-signed manifest or local key alone is not trust"
actor_assignment = "explicit root-signed ActorIdentity-to-public-key mapping and allowed-operation list"
rotation = "append a new root-signed trust snapshot; revoke old key and activate replacement in one reviewed transition"
revocation = "append-only signed revocation record; reject a revoked key for every later operation"
currentness = "read the signed head locator from the exact current bound control-ref commit for every operation; all trust updates use that same control ref CAS, preventing a stale-snapshot race"
historical_validation = "verify against the trust snapshot committed with that operation; later revocation does not rewrite history"
wall_clock_as_authority = false
root_rotation_contract = "REQUIRED_REVIEWED_EXTERNAL_PROCEDURE"

[security_boundary]
trusted_host_assumption = "host OS, current Windows account, Git executable, CNG software provider and cooperative launcher/actor-assignment process are trusted and not compromised"
same_windows_user_process_isolation = false
same_user_effect = "any process with the same Windows token may request signatures from keys available to that account; distinct key IDs do not establish distinct actors"
independent_writer_reviewer_rule = "require distinct ticket-assigned ActorIdentity values, distinct root-mapped key IDs and an actual separate reviewer task; under the declared trusted cooperative host/launcher assumption this is the local baseline, while this profile cannot prove distinct people or process isolation"
administrator_or_account_compromise = "outside this profile threat model; can use account keys or rewrite local refs"
remote_global_currentness = "not provided by a local-only profile"
signature_meaning = "proves the mapped private key signed the framed bytes under the trusted-host assumption; does not prove a person read or understood the document"
stronger_custody = "may use a separately reviewed optional hardware or isolated-principal profile; no such device, account or credential is assumed here"

[trust_manifest_candidate]
status = "PROPOSED_REVIEW_PENDING"
manifest_record_kind = "actor_trust_manifest_v1"
head_record_kind = "actor_trust_head_v1"
manifest_schema_version = 1
head_schema_version = 1
manifest_instance_status = "TRUST_SNAPSHOT"
head_instance_status = "TRUST_HEAD"
manifest_path_pattern = "swarm/control-trust/actor-manifests/<20-digit-generation>.toml"
manifest_generation_filename = "generation is canonical u64 decimal in range 1..18446744073709551615, left-zero-padded to exactly 20 ASCII digits; append .toml; reject overflow"
current_head_path = "swarm/control-trust/actor-trust-head-v1.toml"
head_locator_scope = "read the exact head file from the exact current bound control-ref commit; the control ref CAS is also the trust-currentness serialization point"
manifest_top_level_field_order = ["schema_version", "record_kind", "status", "generation", "root_key_id", "actors", "revoked_keys", "signature"]
actor_entry_field_order = ["actor_identity", "key_id", "key_container_name", "public_key_blob_hex", "allowed_operation_domains", "registration_evidence_ref"]
revoked_key_entry_field_order = ["key_id", "effective_generation", "reason_sha256"]
head_top_level_field_order = ["schema_version", "record_kind", "status", "generation", "manifest_path", "manifest_git_blob_id", "manifest_exact_record_file_sha256", "root_key_id", "signature"]
manifest_field_types = ["schema_version=u16 exact 1", "record_kind=ASCII exact actor_trust_manifest_v1", "status=ASCII exact TRUST_SNAPSHOT", "generation=u64 in 1..18446744073709551615", "root_key_id=sha256- plus 64 lowercase hex", "actors=array of actor_entry_v1", "revoked_keys=array of revoked_key_entry_v1", "signature=trust_signature_v1"]
actor_entry_field_types = ["actor_identity=registered ActorIdentity pattern, at most 160 ASCII bytes", "key_id=sha256- plus 64 lowercase hex and equal to exact public BCRYPT_ECCPUBLIC_BLOB SHA-256", "key_container_name=exact pattern above, at most 120 ASCII bytes", "public_key_blob_hex=exactly 144 lowercase hex characters", "allowed_operation_domains=unique ordered ASCII strings, each 1..128 bytes", "registration_evidence_ref=existing ImmutableRecordRef exact field/type order"]
revoked_key_entry_field_types = ["key_id=sha256- plus 64 lowercase hex", "effective_generation=u64 equal to enclosing manifest generation", "reason_sha256=exactly 64 lowercase hex"]
head_field_types = ["schema_version=u16 exact 1", "record_kind=ASCII exact actor_trust_head_v1", "status=ASCII exact TRUST_HEAD", "generation=u64 equal to referenced manifest generation", "manifest_path=exact generation-derived repository-relative path", "manifest_git_blob_id=full algorithm-tagged GitObjectId", "manifest_exact_record_file_sha256=exactly 64 lowercase hex", "root_key_id=sha256- plus 64 lowercase hex", "signature=trust_signature_v1"]
actor_entries_sorted_by = "bytewise ASCII ActorIdentity ascending; exactly one active key per actor"
key_container_name_pattern = "^EliotSearch-Approval-v1-[A-Za-z0-9._-]{1,96}$"
key_container_name_is_authority = false
opened_key_check = "public BCRYPT_ECCPUBLIC_BLOB SHA-256 must equal the signed key_id"
max_actor_entries = 128
max_allowed_domains_per_actor = 32
max_allowed_operation_domain_bytes = 128
max_revocation_entries = 4096
max_manifest_bytes = 1048576
max_head_record_bytes = 65536
registration_evidence = "immutable non-secret evidence of the explicit identity/key mapping; it does not assert separate OS accounts or human custody"
allowed_operation_domains_sorted_by = "bytewise ASCII ascending; duplicates reject"
revocations_sorted_by = "raw key_id bytes ascending; unique key IDs; effective_generation must equal this manifest generation"
head_generation_rule = "u64 generation strictly increases by exactly 1 for each accepted trust transition; no wall-clock currentness"
generation_initial_value = 1
generation_overflow = "reject trust update at u64::MAX; root rotation and counter reset are unsupported"
public_key_blob_encoding = "exactly 144 lowercase hex characters decoding to 72 bytes; BCRYPT_ECCKEY_BLOB P-256 public header plus X[32] and Y[32]"
root_key_anchor = "root public-key BCRYPT_ECCPUBLIC_BLOB SHA-256 fingerprint provisioned and verified out of band; no self-signed bootstrap"
manifest_signature_preimage = "ASCII ELIOT-SEARCH/ACTOR-TRUST-MANIFEST/V1 || 0x00 || u16be schema_version || LP16 signature_profile_ref ASCII || raw32 signed_payload_sha256 || raw32 root_key_id"
head_signature_preimage = "ASCII ELIOT-SEARCH/ACTOR-TRUST-HEAD/V1 || 0x00 || u16be schema_version || LP16 signature_profile_ref ASCII || raw32 signed_payload_sha256 || raw32 root_key_id"
head_manifest_binding = "the head payload binds manifest path, full Git blob ID and exact record-file SHA-256; the consumer combines this locator with the exact containing control-ref commit to construct ImmutableRecordRef"
trust_head_ref_binding = "the current trust head is resolved at swarm/control-trust/actor-trust-head-v1.toml in the expected current control-ref tree; input binds its path, full Git blob ID and exact SHA-256 but omits containing commit for stable retries; receipt joins it to expected_parent_control_commit; any concurrent trust transition moves the same control ref and causes CAS failure"
retention = "manifests, revocations and historical head records remain append-only; the head locator may change only in a root-signed trust transition commit"
root_rotation = "unsupported in v1; requires a separately reviewed and externally verified root-rotation contract"
trust_signature_field_order = ["root_key_id", "signature_profile_ref", "signed_payload_sha256", "signature_artifact_ref"]
trust_signature_artifact_type = "ImmutableArtifactRef; exact 64-byte P1363 candidate signature"
trust_signature_toml_surface = "[signature] is the final table; write the four trust_signature_field_order assignments in that order; signature_artifact_ref is an inline table using exact ImmutableArtifactRef field order store_profile_ref, artifact_id, bytes, sha256; no comments or alternate syntax"
root_key_id_derivation = "sha256- plus lowercase SHA-256 of exact root BCRYPT_ECCPUBLIC_BLOB bytes"
root_key_id_wire_encoding = "strip sha256- and decode the 64 lowercase hex digits to raw32 for the trust signature preimage"
root_key_disjoint_from_actor_keys = true
trust_signature_fields_are_identical_for_manifest_and_head = true
trust_record_encoding = "UTF-8 without BOM, LF, final LF, ordered fields, no comments, exact payload digest ending immediately before [signature]"
trust_record_toml_surface = "emit each top-level scalar assignment in declared order; actors and revoked_keys are compact arrays of inline tables in declared row/field order; each inline table uses comma-separated key=value pairs with no spaces; string values use double quotes and contain only allowed ASCII characters with no escapes; integers use unsigned decimal with no leading zeros; signature is the final [signature] table with its declared field order"
trust_inline_actor_ref_encoding = "registration_evidence_ref is one immutable-record-ref inline table in the exact existing ImmutableRecordRef field order repository, commit, path, git_blob_id, exact_record_file_sha256, record_kind; values obey those registered field grammars"
trust_array_empty_encoding = "empty actors or revoked_keys list serializes exactly as []"
trust_toml_ascii_string_rule = "all strings are ASCII and use only their registered identifier, digest, path or Git-object-id grammar; quote, backslash, control and non-ASCII bytes reject, so TOML escape processing cannot change signed bytes"
instance_created = false
root_key_generated = false
actor_keys_generated = false
trust_manifest_provisioned = false
[required_external_inputs]
items = [
  "exact software KSP instance and signed native Git/CNG runtime identity",
  "per-actor provisioned key, exact root-mapped CNG key-container name and public BCRYPT_ECCPUBLIC_BLOB; no key generation occurs in this design",
  "out-of-band verified trust-root fingerprint and root-signed actor mapping",
  "explicit root-signed ActorIdentity-to-public-key mapping and ticket actor assignment under a trusted cooperative host/launcher assumption",
  "accepted profile definition digest and executed independent crypto/readback qualification",
  "accepted first-four instance and nested ClosedEnum schemas",
  "reviewed and registered actor_trust_manifest_v1/actor_trust_head_v1 schemas and root trust-bootstrap procedure",
  "for acknowledgement, accepted v2 WriterAcknowledgement payload and event operation/domain revision",
]

[qualification_plan]
suite_id = "local_windows_cng_approval_v1"
all_results = "UNAVAILABLE"
executed = false
cases = [
  "Microsoft Software KSP opens the expected current-user persisted P-256 signing key without provider fallback",
  "NCryptSignHash and NCryptVerifySignature agree on the exact candidate P1363 64-byte encoding",
  "signature changes fail after mutating each framed field, payload digest, actor, operation ID or trust digest",
  "unknown profile, key ID, actor mapping, operation domain, public-key blob or signature length rejects",
  "missing, untrusted, stale or revoked trust snapshot fails closed",
  "non-export policy is read back; an unmet policy blocks activation",
  "credential bytes, private keys and key handles never enter control records, contexts or logs",
  "same-user multi-process probes document that any process with the same token can request any key available to that account; qualification verifies mapped key and ticket actor binding without claiming OS or human isolation",
  "revocation blocks later operations while historical signatures retain their recorded trust snapshot",
  "CNG/provider absence and user cancellation fail without a software or algorithm downgrade",
]

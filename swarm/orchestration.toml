schema_version = 5
project = "eliot-search"
package_registry = "swarm/crates.toml"
function_registry = "swarm/function-packets.toml"
stage_registry = "swarm/stages.toml"
stage_readset_registry = "swarm/stage-readsets.toml"
launch_state = "swarm/launch-state.toml"
gate_registry = "swarm/gates.toml"
control_plane_schema_registry = "swarm/control-plane-schema.toml"
control_plane_type_registry = "swarm/schemas/types-v1.toml"
control_plane_validator = "tools/validate-ticket-issuance-contracts.ps1"
control_plane_manual_workflow = ".github/workflows/ticket-issuance-contracts.yml"
workflow_policy = "manual_only"
ticket_issuance_operation_contract = "docs/handoff/TICKET_ISSUANCE_OPERATIONS.md"
assignment_ticket_template = "swarm/ASSIGNMENT_TICKET_TEMPLATE.md"
writer_lease_template = "swarm/WRITER_LEASE_TEMPLATE.md"
context_manifest_template = "swarm/CONTEXT_MANIFEST_TEMPLATE.md"
submission_template = "swarm/SUBMISSION_TEMPLATE.md"
review_receipt_template = "swarm/REVIEW_RECEIPT_TEMPLATE.md"
package_handoff_template = "swarm/PACKAGE_HANDOFF_TEMPLATE.md"
api_handoff_template = "swarm/API_HANDOFF_TEMPLATE.md"
wave_receipt_template = "swarm/WAVE_RECEIPT_TEMPLATE.md"
ticket_draft_manifest = "swarm/ticket-drafts/manifest.toml"
context_draft_manifest = "swarm/context-drafts/manifest.toml"
issued_ticket_layout = "swarm/tickets/<package>/<ticket_id>.toml"
materialized_context_layout = "swarm/context-manifests/<package>/<context_record_sha256>.toml"
writer_lease_layout = "swarm/leases/<package>/<lease_id>.toml"
lease_event_layout = "swarm/leases/<package>/events/<event_id>.toml"
submission_layout = "swarm/submissions/<package>/<submission_id>.toml"
review_layout = "swarm/reviews/<package>/<review_id>.toml"
accepted_handoff_layout = "swarm/handoffs/<package>/<handoff_id>.toml"
supersession_layout = "swarm/supersessions/<record_kind>/<receipt_id>.toml"
failure_reason_type = "ClosedReasonCode"
lease_event_reason_type = "LeaseEventReasonCode"
supersession_reason_type = "SupersessionReasonCode"
consumer_action_type = "ConsumerActionCode"

states = [
  "BLOCKED",
  "READY",
  "LEASED",
  "IMPLEMENTING",
  "REVIEW",
  "ACCEPTED",
  "REJECTED",
  "SUPERSEDED",
]

one_active_writer_per_package = true
package_writer_may_edit_launch_state = false
package_writer_may_edit_assignment = false
package_writer_may_edit_dependency_handoff = false
package_writer_may_edit_ticket_context_lease_review = false
accepted_receipts_are_append_only = true
consumer_uses_branch_head = false
consumer_requires_exact_commit_and_api_digest = true

[drafts]
status_values = ["DRAFT_ONLY_NOT_ISSUED", "UNMATERIALIZED_DRAFT"]
drafts_are_orchestration_states = false
draft_presence_authorizes_work = false
draft_presence_creates_lease = false
draft_may_be_writer_acknowledged = false
draft_may_be_copied_verbatim_to_issued_ticket = false
issued_ticket_requires_new_immutable_record = true
issued_ticket_requires_exact_base_commit = true
issued_ticket_requires_materialized_context_manifest = true
issued_ticket_requires_writer_and_independent_reviewer = true
issued_ticket_requires_instruction_and_registry_digests = true
conditional_ticket_requires_accepted_dependency_handoffs = true
materialized_context_is_append_only = true
materialized_context_artifact_count = 1
architecture_master_in_ordinary_context = false
dependency_implementation_source_in_context = false

[record_validation]
schema_registry_required = true
type_registry_required = true
reason_registries_required = true
record_kind_must_match_schema = true
all_field_kinds_must_resolve = true
array_path_kind_is_element_type = true
whole_collection_kind_requires_non_array_path = true
unknown_load_bearing_fields_rejected = true
canonical_field_order_required = true
signed_payload_sha256_embedded = true
exact_record_file_sha256_stored_externally = true
self_referential_complete_file_digest_allowed = false
exact_git_blob_and_path_readback_required = true
operation_id_required_for_mutation = true
same_operation_different_input = "CONTROL_OPERATION_CONFLICT"
unknown_outcome_requires_exact_readback = true
append_only_supersession_required = true
handoff_filename_uses_unique_handoff_id = true

[ready]
requires_launch_authorization = true
requires_all_direct_dependency_handoffs = true
requires_no_active_lease = true
requires_optional_prerequisites_when_applicable = true
requires_issued_ticket_not_draft = true
requires_materialized_context = true
requires_schema_valid_ticket_and_context = true

[lease]
required_fields = [
  "identity.lease_id",
  "identity.operation_id",
  "identity.package",
  "identity.stage",
  "ticket.ref",
  "ticket.exact_record_file_sha256",
  "context.manifest_ref",
  "context.artifact_sha256",
  "actors.writer",
  "actors.reviewer",
  "actors.issuer",
  "scope.base_commit",
  "scope.branch_or_worktree",
  "scope.write_scope",
  "scope.feature_profile",
  "dependencies[]",
  "lifecycle.issued_at",
  "lifecycle.initial_state",
  "lifecycle.automatic_expiry",
  "lifecycle.previous_active_lease_check",
  "signature.record_sha256",
  "signature.integration_signature_ref",
]
automatic_expiry = false
revocation_requires_integration_receipt = true
second_active_lease = "deny"
acknowledgement_requires_append_only_lease_event = true

[submission]
requires_acknowledged_active_lease = true
requires_complete_sorted_unique_diff = true
requires_all_paths_inside_write_scope = true
requires_exact_api_manifest = true
requires_raw_command_outcomes = true
requires_unavailable_checks_visible = true
requires_line_budget_report = true

[review]
requires_complete_changed_file_list = true
requires_scope_check = true
requires_api_digest = true
requires_raw_test_outcomes = true
requires_dependency_digest_check = true
requires_context_and_lease_digest_check = true
requires_ownership_review = true
requires_line_budget_check = true
reviewer_must_be_independent_from_writer = true
acceptance_verdict = "ACCEPT_SUBMISSION_FOR_INTEGRATION"

[acceptance]
required_fields = [
  "identity.handoff_id",
  "identity.operation_id",
  "identity.package",
  "identity.stage",
  "identity.accepted_at",
  "submission_review.submission_ref",
  "submission_review.submission_exact_record_file_sha256",
  "submission_review.review_ref",
  "submission_review.review_exact_record_file_sha256",
  "accepted_code.base_commit",
  "accepted_code.final_commit",
  "accepted_code.changed_files_digest",
  "public_surface.api_manifest_ref",
  "public_surface.api_schema_digest",
  "public_surface.configuration_digest",
  "public_surface.fixture_digest_set",
  "public_surface.error_reason_digest",
  "dependencies[]",
  "evidence[]",
  "compatibility.class",
  "compatibility.consumer_actions[]",
  "supersession.supersedes_handoff_ref",
  "supersession.supersedes_handoff_exact_record_file_sha256",
  "signature.integration_owner_identity",
  "signature.record_sha256",
  "signature.integration_signature_ref",
]
ticket_lease_context_is_transitively_bound_through_submission = true
mutable_after_acceptance = false
correction_mode = "new_receipt_supersedes_old"
package_handoff_does_not_accept_gate_or_wave = true
api_digest_is_not_record_identity = true
handoff_id_is_record_path_identity = true

[wave_advance]
authority = "integration-owner"
requires_all_mandatory_package_handoffs = true
requires_all_mandatory_gate_evidence_pass = true
requires_no_unresolved_active_lease = true
requires_wave_receipt = true
launch_state_and_receipt_same_reviewed_change = true

[[transition]]
from = "BLOCKED"
to = "READY"
condition = "launch authorized, dependencies accepted, issued schema-valid ticket and materialized context"

[[transition]]
from = "READY"
to = "LEASED"
condition = "schema-valid writer lease, no competing lease and exact ticket/context readback"

[[transition]]
from = "LEASED"
to = "IMPLEMENTING"
condition = "append-only ACKNOWLEDGED lease event binds exact ticket, lease, base and context artifact"

[[transition]]
from = "IMPLEMENTING"
to = "REVIEW"
condition = "schema-valid complete package submission and API handoff candidate recorded"

[[transition]]
from = "REVIEW"
to = "ACCEPTED"
condition = "independent review accepted and integration-owner package handoff published"

[[transition]]
from = "REVIEW"
to = "REJECTED"
condition = "review receipt contains exact rejection reasons"

[[transition]]
from = "REJECTED"
to = "READY"
condition = "new materialized context and assignment-ticket revision exist, launch/dependencies remain valid and no active lease exists"

[[transition]]
from = "BLOCKED|READY|LEASED|IMPLEMENTING|REVIEW|REJECTED"
to = "SUPERSEDED"
condition = "append-only integration-owner supersession receipt references replacement record"

[w0_acceptance]
required_packages = ["search-contracts", "search-domain", "search-ports"]
required_package_record = "package_handoff_v1"
required_gate = "G0"
required_wave_receipt = "W0"
required_evidence_state = "PASS"
raw_output_required = true
independent_review_required = true
requires_no_active_writer_leases = true
requires_zero_unreviewed_submissions = true
requires_append_only_package_handoffs = true
package_handoff_does_not_accept_gate_or_wave = true
receipt_and_launch_update_same_reviewed_change = true

[w1_unlock]
stage = "W1"
current_state = "BLOCKED"
requires_accepted_gate = "G0"
requires_accepted_receipt = "W0"
requires_launch_state_active_wave = 1
requires_launch_state_stage = "P01-P02"
configuration_or_stage_presence_authorizes = false
package_presence_authorizes = false
manual_workflow_authorizes = false

[current_repository_state]
materialized_contexts = 0
issued_tickets = 0
active_writer_leases = 0
submissions = 0
accepted_reviews = 0
accepted_package_handoffs = 0
accepted_g0_receipt = false
accepted_w0_receipt = false
active_stage = "P00"
active_wave = 0

schema_version = 1
record_kind = "writer_lease_v1"
status = "SCHEMA_ONLY_NOT_AN_INSTANCE"
owner = "integration-owner"
canonicalization = "exact_utf8_lf_sha256"
record_layout = "swarm/leases/<package>/<lease_id>.toml"
immutable = true
unknown_fields = "reject"
automatic_expiry_allowed = false
second_active_lease_allowed = false
source_content_allowed = false
secret_content_allowed = false

canonical_field_order = [
  "schema_version", "record_kind", "status", "identity", "ticket", "context",
  "actors", "scope", "dependencies", "lifecycle", "signature",
]

[[field]]
path = "identity.lease_id"
kind = "OpaqueId"
required = true
canonical_order = 1
rules = ["non_empty", "unique_per_package"]

[[field]]
path = "identity.operation_id"
kind = "Sha256Digest"
required = true
canonical_order = 2
rules = ["domain_separated_issue_lease_v1", "stable_for_equal_input"]

[[field]]
path = "identity.package"
kind = "PackageName"
required = true
canonical_order = 3
rules = ["matches_ticket"]

[[field]]
path = "identity.stage"
kind = "StageId"
required = true
canonical_order = 4
rules = ["matches_ticket"]

[[field]]
path = "ticket.ref"
kind = "ImmutableRecordRef"
required = true
canonical_order = 5
rules = ["kind_assignment_ticket_v1"]

[[field]]
path = "ticket.sha256"
kind = "Sha256Digest"
required = true
canonical_order = 6
rules = ["exact_record_digest"]

[[field]]
path = "context.manifest_ref"
kind = "ImmutableRecordRef"
required = true
canonical_order = 7
rules = ["matches_ticket"]

[[field]]
path = "context.artifact_sha256"
kind = "Sha256Digest"
required = true
canonical_order = 8
rules = ["matches_ticket_and_manifest"]

[[field]]
path = "actors.writer"
kind = "ActorIdentity"
required = true
canonical_order = 9
rules = ["matches_ticket", "different_from_reviewer"]

[[field]]
path = "actors.reviewer"
kind = "ActorIdentity"
required = true
canonical_order = 10
rules = ["matches_ticket", "different_from_writer"]

[[field]]
path = "actors.issuer"
kind = "ActorIdentity"
required = true
canonical_order = 11
rules = ["integration_owner"]

[[field]]
path = "scope.base_commit"
kind = "GitObjectId"
required = true
canonical_order = 12
rules = ["matches_ticket"]

[[field]]
path = "scope.branch_or_worktree"
kind = "OpaqueWorktreeRef"
required = true
canonical_order = 13
rules = ["matches_ticket"]

[[field]]
path = "scope.write_scope"
kind = "RepositoryGlob"
required = true
canonical_order = 14
rules = ["matches_ticket_and_function_registry"]

[[field]]
path = "scope.feature_profile"
kind = "ClosedFeatureProfile"
required = true
canonical_order = 15
rules = ["matches_ticket"]

[[field]]
path = "dependencies[]"
kind = "OrderedAcceptedPackageHandoff"
required = true
canonical_order = 16
rules = ["byte_equal_to_ticket_dependency_set"]

[[field]]
path = "lifecycle.issued_at"
kind = "Rfc3339Utc"
required = true
canonical_order = 17
rules = ["recorded_not_inferred"]

[[field]]
path = "lifecycle.initial_state"
kind = "ClosedEnum"
required = true
canonical_order = 18
rules = ["equals_LEASED"]

[[field]]
path = "lifecycle.automatic_expiry"
kind = "bool"
required = true
canonical_order = 19
rules = ["must_be_false"]

[[field]]
path = "lifecycle.previous_active_lease_check"
kind = "ClosedEnum"
required = true
canonical_order = 20
rules = ["equals_NONE_ACTIVE_VERIFIED"]

[[field]]
path = "signature.record_sha256"
kind = "Sha256Digest"
required = true
canonical_order = 21
rules = ["exact_record_digest_rule"]

[[field]]
path = "signature.integration_signature_ref"
kind = "ImmutableSignatureRef"
required = true
canonical_order = 22
rules = ["issuer_identity_bound"]

proposal_status = "PROPOSED_REVIEW_PENDING"
claimability = "NONCLAIMABLE"
operation_registry_schema_version = 2
operation_input_canonicalization_status = "UNBOUND_TO_AN_ACCEPTED_PROFILE"
operation_id_value = "Sha256Digest"
operation_id_formula = "SHA-256(ASCII(domain_separator) || canonical_operation_input_bytes)"
operation_domain_separator_encoding = "ASCII bytes with no NUL delimiter, preserving docs/handoff/TICKET_ISSUANCE_OPERATIONS.md"
operation_id_input_excludes = ["generated_event_id", "recorded_timestamp", "signature_artifact", "event_output_digest", "operation_receipt_digest", "containing_commit"]
v1_operation_ids_are_read_only = true
v1_and_v2_domain_aliasing_allowed = false
all_new_lease_event_producers_must_use_v2 = true
operation_receipt_record_schema_included = false
operation_receipt_profile_accepted = false

[[operation]]
id = "acknowledge_writer_lease_v2"
kind = "MUTATION"
operation_schema_version = 2
input_schema_id = "acknowledge_writer_lease_input_v2"
input_schema_version = 2
actor = "ticket_writer"
authority = "exact_assigned_writer_signs_event; integration_owner_verifies_and_records_exact_bytes"
domain_separator = "acknowledge_writer_lease_v2"
input_field_order = ["writer_lease_ref", "assignment_ticket_ref", "context_manifest_ref", "context_artifact_sha256", "writer_acknowledgement", "writer_acknowledgement_digest"]
input_fields = [
  { path = "writer_lease_ref", type = "ImmutableRecordRef", constraint = "record_kind_writer_lease_v1_and_exact_file_digest; source orchestration state exactly LEASED; no earlier lease_event_v1 or lease_event_v2 event; this ACK event is the v2 genesis" },
  { path = "assignment_ticket_ref", type = "ImmutableRecordRef", constraint = "record_kind_assignment_ticket_v1_and_exact_file_digest" },
  { path = "context_manifest_ref", type = "ImmutableRecordRef", constraint = "record_kind_context_manifest_v1_and_exact_file_digest" },
  { path = "context_artifact_sha256", type = "Sha256Digest", constraint = "exact_ticket_and_lease_artifact_digest" },
  { path = "writer_acknowledgement", type = "WriterAcknowledgementV1", constraint = "exact_embedded_payload_including_accepted_types_v1_complete_file_sha256" },
  { path = "writer_acknowledgement_digest", type = "Sha256Digest", constraint = "equals_canonical_payload_digest_and_event_digest_field" },
]
output_kinds = ["lease_event_v2_ACKNOWLEDGED"]
idempotency = "same_operation_id_and_exact_input_returns_the_original_exact_writer_signed_event"
cancellation = "clean_before_write_unknown_after_possible_write"
recovery = "requires_an_accepted_durable_operation_receipt_profile_plus_exact_event_chain_and_complete_file_readback"
state_transition = "LEASED_to_IMPLEMENTING_after_signature_verification_and_exact_readback"
failure_codes = ["LEASE_ACKNOWLEDGEMENT_MISMATCH", "LEASE_REVOKED_OR_SUPERSEDED", "CONTROL_RECORD_SCHEMA_MISMATCH", "CONTROL_RECORD_DIGEST_MISMATCH", "CONTROL_OPERATION_CONFLICT", "CONTROL_RECORD_QUARANTINED"]
enabled = false
disabled_reason = "The c209 native operation-input profile is unaccepted, provides only the v1 acknowledgement input, and binds an acknowledgement artifact incompatible with this embedded-payload shape."

[[operation]]
id = "record_package_submission_v2"
kind = "MUTATION"
operation_schema_version = 2
input_schema_id = "record_package_submission_input_v2"
input_schema_version = 2
actor = "ticket_writer"
authority = "integration_owner_records_exact_writer_submission"
domain_separator = "record_package_submission_v2"
input_field_order = ["acknowledged_active_writer_lease_v2", "immutable_final_commit", "complete_changed_file_manifest", "public_surface_candidate", "bounded_evidence_set", "line_report"]
input_fields = [
  { path = "acknowledged_active_writer_lease_v2", type = "writer_lease_v1 plus complete lease_event_v2 chain", constraint = "must contain exactly one verified ACKNOWLEDGED and no terminal event" },
  { path = "immutable_final_commit", type = "GitObjectId", constraint = "descends_from_ticket_base_commit" },
  { path = "complete_changed_file_manifest", type = "ordered changed-file set", constraint = "recomputed and inside exact ticket write scope" },
  { path = "public_surface_candidate", type = "typed candidate", constraint = "existing package submission contract" },
  { path = "bounded_evidence_set", type = "typed evidence and unavailable sets", constraint = "retain raw outcomes and typed unavailable states" },
  { path = "line_report", type = "typed line counts", constraint = "checked against issued ticket limits" },
]
output_kinds = ["package_submission_v1", "lease_event_v2_SUBMITTED"]
idempotency = "submission_and_v2_SUBMITTED_event_committed_in_one_git_commit_for_equal_input"
cancellation = "clean_before_commit_unknown_after_possible_joint_commit"
recovery = "requires_an_accepted_durable_operation_receipt_profile_plus_joint_submission_and_event_exact_commit_readback"
state_transition = "IMPLEMENTING_to_REVIEW"
enabled = false
disabled_reason = "No v2 operation-input receipt profile has been accepted."

[[operation]]
id = "revoke_or_supersede_lease_v2"
kind = "MUTATION"
operation_schema_version = 2
input_schema_id = "revoke_or_supersede_lease_input_v2"
input_schema_version = 2
actor = "integration_owner"
authority = "integration_owner"
domain_separator = "revoke_or_supersede_lease_v2"
input_field_order = ["writer_lease_ref", "current_lease_event_v2_chain", "lease_terminal_event_request"]
input_fields = [
  { path = "writer_lease_ref", type = "ImmutableRecordRef", constraint = "record_kind_writer_lease_v1_and_exact_file_digest; every chain event must reference this exact lease" },
  { path = "current_lease_event_v2_chain", type = "ordered lease_event_v2 refs", constraint = "exact linear previous-event links and full-file digests for this lease; an empty array is allowed only for the existing LEASED-to-SUPERSEDED path and must emit a SUPERSEDED genesis with both previous-event fields ABSENT; empty chain is forbidden for REVOKED; never consume v1 events" },
  { path = "lease_terminal_event_request", type = "closed terminal event request", constraint = "REVOKED requires an existing valid nonterminal v2 chain and a source state permitting revocation; SUPERSEDED uses an empty chain only for exact LEASED-to-SUPERSEDED genesis or otherwise appends to a valid nonterminal v2 chain; preserve exact reason, actor, replacement, and receipt semantics from the pinned v1 sources" },
]
output_kinds = ["lease_event_v2_REVOKED_or_SUPERSEDED"]
idempotency = "same_operation_id_and_exact_input_returns_original_terminal_event"
cancellation = "clean_before_commit_unknown_after_possible_commit"
recovery = "requires_an_accepted_durable_operation_receipt_profile_plus_exact_terminal_event_chain_and_complete_file_readback"
state_transition = "active_state_to_authority_removed_or_SUPERSEDED"
failure_codes = ["LEASE_REVOKED_OR_SUPERSEDED", "CONTROL_RECORD_SCHEMA_MISMATCH", "CONTROL_RECORD_DIGEST_MISMATCH", "CONTROL_OPERATION_CONFLICT", "CONTROL_RECORD_QUARANTINED"]
enabled = false
disabled_reason = "The v2 operation-input encoding, durable recovery/profile binding, and REVOKED receipt record-kind binding remain unresolved."

[version_rules]
lease_event_v1 = "read-only compatibility; no new lifecycle event may be appended to it"
lease_event_v2 = "all new event chains use v2 from their first event; allowed genesis is exact LEASED-to-IMPLEMENTING ACKNOWLEDGED or the pinned LEASED-to-SUPERSEDED terminal path"
mixed_v1_v2_chain = "reject; never migrate an existing v1 chain by appending a v2 event"
chain_genesis = "ACKNOWLEDGED genesis requires the exact ticket writer and a LEASED source state; SUPERSEDED genesis is allowed only for the pinned LEASED-to-SUPERSEDED transition with exact integration-owner actor and matching supersession receipt; both previous-event optionals are ABSENT. No pre-ACK REVOKED genesis is added."
linear_chain = "Every non-genesis v2 event links the immediate same-lease predecessor and exact complete-file digest; reject gaps, forks, duplicate predecessors, cross-lease references, and post-terminal events."
submission_record = "package_submission_v1 remains the immutable submission record; only its companion lease event changes to v2"
terminal_events = ["REVOKED", "SUPERSEDED"]
RECORDED = "serialized record instance status only; never means operation success or authority"

[unaccepted_profile_compatibility]
profile_worktree_commit = "c209addae7dc379191ce14dc2f0b72f176e79cfa"
profile_document = "docs/handoff/changes/2026-10-03-local-issuance-profile-design.md"
profile_operation_input_file = "swarm/profile-drafts/local-issuance-v1/operation-receipt-v1.toml"
candidate_rule = "The c209 draft states that v1 and v2 operation/domain revisions are never aliased and that acknowledgement remains disabled until its payload/event schema is accepted."
not_imported = ["binary TLV bytes as normative v2 input", "v1 acknowledgement artifact input", "operation receipt schema", "approval or artifact store profiles", "trust manifests or heads", "keys, actors, signatures, or qualification"]
required_follow_up = "A reviewed operation-input/profile revision must bind these v2 operation IDs, input_schema_ids, exact inputs, canonical bytes, signer boundaries, and durable recovery semantics before any mutation."

[unresolved]
required_evidence_bound = "assignment-ticket-v1 declares no max_required_evidence and no finite ticket-record byte ceiling; bounded operation activation remains blocked"
revoked_receipt_kind = "The event rule names a revocation receipt but ClosedControlRecordKind has no registered revocation-receipt value."
type_registry_binding = "The accepted four-domain/nine-binding decision is pinned at bac90ff7753ef7d4d107836c60480df216acfe7f; canonical types-v1.toml implementation and its exact final SHA-256 remain pending. The e58 historical ACK proposal count is 52 (enum 51 plus ACK); the later QualifiedOpaqueId grammar adoption is outside that snapshot, so the future cumulative target is 53 if both adoptions are materialized. Validate every type adopted at the exact ticket base commit; do not require a fixed current count or fabricate the digest."
v2_operation_input_and_recovery = "The v2 input schemas, canonical input bytes, operation/profile receipt binding, durable recovery behavior, and unknown-outcome authority are proposed only; no accepted v2 operation input or recovery profile exists."
profile_and_actor_qualification = "Writer and integration-owner identities, signer roles, verification profiles, trust state, keys, artifact storage, and runtime qualification remain unprovisioned and unqualified."
status_authority = "The accepted RECORDED instance status never proves an ACKNOWLEDGED transition, active lease, execution, acceptance, or a gate."

proposal_status = "PROPOSED_REVIEW_PENDING"
claimability = "NONCLAIMABLE"
schema_version = 2
record_kind = "lease_event_v2"
status = "SCHEMA_ONLY_NOT_AN_INSTANCE"
owner = "integration-owner_recording_closed_writer_or_integration_event"
canonicalization = "exact_utf8_lf_sha256"
record_layout = "swarm/leases/<package>/events/<event_id>.toml"
immutable = true
unknown_fields = "reject"
event_kinds = ["ACKNOWLEDGED", "SUBMITTED", "REVOKED", "SUPERSEDED"]
event_reason_type = "LeaseEventReasonCode"
source_content_allowed = false
secret_content_allowed = false
canonical_field_order = [
  "schema_version", "record_kind", "status", "identity", "lease", "event",
  "actor", "related_records", "chain", "signature",
]

[event_reason_codes]
ACKNOWLEDGED = "WRITER_ACKNOWLEDGED"
SUBMITTED = "PACKAGE_SUBMITTED"
REVOKED = "LEASE_REVOKED"
SUPERSEDED = "LEASE_SUPERSEDED"

[[field]]
path = "identity.event_id"
kind = "OpaqueId"
required = true
canonical_order = 1
rules = ["non_empty", "unique_per_lease"]

[[field]]
path = "identity.operation_id"
kind = "Sha256Digest"
required = true
canonical_order = 2
rules = ["domain_separated_by_matching_v2_operation", "stable_for_equal_canonical_input"]

[[field]]
path = "identity.package"
kind = "PackageName"
required = true
canonical_order = 3
rules = ["matches_writer_lease_and_ticket"]

[[field]]
path = "lease.ref"
kind = "ImmutableRecordRef"
required = true
canonical_order = 4
rules = ["record_kind_writer_lease_v1", "exact_record_readback"]

[[field]]
path = "lease.exact_record_file_sha256"
kind = "Sha256Digest"
required = true
canonical_order = 5
rules = ["equals_lease_ref_exact_record_file_sha256", "not_signed_payload_sha256"]

[[field]]
path = "event.kind"
kind = "ClosedEnum"
required = true
canonical_order = 6
allowed = ["ACKNOWLEDGED", "SUBMITTED", "REVOKED", "SUPERSEDED"]

[[field]]
path = "event.occurred_at"
kind = "Rfc3339Utc"
required = true
canonical_order = 7
rules = ["recorded_not_inferred"]

[[field]]
path = "event.reason_code"
kind = "LeaseEventReasonCode"
required = true
canonical_order = 8
rules = ["exact_mapping_from_event_kind", "details_external_when_sensitive"]

[[field]]
path = "event.writer_acknowledgement"
kind = "WriterAcknowledgementV1"
required = false
canonical_order = 9
rules = ["required_if_ACKNOWLEDGED", "forbidden_for_SUBMITTED_REVOKED_SUPERSEDED", "exactly_one", "payload_digest_excludes_its_own_digest"]

[[field]]
path = "event.writer_acknowledgement_digest"
kind = "Sha256Digest"
required = false
canonical_order = 10
rules = ["required_if_ACKNOWLEDGED", "forbidden_for_SUBMITTED_REVOKED_SUPERSEDED", "equals_digest_of_canonical_embedded_payload"]

[[field]]
path = "actor.identity"
kind = "ActorIdentity"
required = true
canonical_order = 11
rules = ["ACKNOWLEDGED_requires_exact_ticket_writer_and_lease_writer", "SUBMITTED_requires_exact_ticket_writer_and_lease_writer", "REVOKED_requires_integration_owner", "SUPERSEDED_requires_integration_owner", "signature_actor_equals_event_actor"]

[[field]]
path = "related_records[]"
kind = "OrderedImmutableRecordRef"
required = true
canonical_order = 12
rules = ["ACKNOWLEDGED_exactly_ticket_then_context_manifest_equal_to_payload_and_lease_ticket_context_refs", "SUBMITTED_binds_exact_package_submission_v1", "SUPERSEDED_binds_exact_replacement_from_matching_supersession_receipt", "REVOKED_binds_exact_revocation_receipt_kind_unresolved"]

[[field]]
path = "chain.previous_event_ref"
kind = "OptionalImmutableRecordRef"
required = true
canonical_order = 13
rules = ["absent_only_for_ACKNOWLEDGED_genesis_or_exact_LEASED_to_SUPERSEDED_genesis", "present_for_every_other_event", "same_lease", "record_kind_lease_event_v2", "immediate_predecessor_no_gaps_or_branches", "never_link_to_lease_event_v1"]

[[field]]
path = "chain.previous_event_exact_record_file_sha256"
kind = "OptionalSha256Digest"
required = true
canonical_order = 14
rules = ["matches_previous_ref_exact_complete_file_digest", "both_optional_values_ABSENT_only_for_an_allowed_genesis", "ABSENT_uses_registered_optional_state_and_empty_value_not_null_or_omission", "never_signed_payload_sha256"]

[[field]]
path = "signature.record_sha256"
kind = "Sha256Digest"
required = true
canonical_order = 15
rules = ["exact_signed_payload_digest_before_signature_table"]

[[field]]
path = "signature.signature_ref"
kind = "ImmutableSignatureRef"
required = true
canonical_order = 16
rules = ["actor_identity_bound", "signed_payload_sha256_matches_record_sha256", "selected_profile_verification_required"]

[acknowledgement_event]
kind = "ACKNOWLEDGED"
reason_code = "WRITER_ACKNOWLEDGED"
actor = "exact_ticket_writer"
related_records_exact_order = ["assignment_ticket_v1", "context_manifest_v1"]
event_nested_field_order = ["kind", "occurred_at", "reason_code", "writer_acknowledgement", "writer_acknowledgement_digest"]
payload_representation = "inline ordered table using WriterAcknowledgementV1 canonical_fields"
payload_path = "event.writer_acknowledgement"
digest_path = "event.writer_acknowledgement_digest"
lease_location = "lease.ref"
payload_refs_equal_related_records = true
writer_signs_exact_event_bytes_before_signature_table = true
integration_owner_may_sign_as_writer = false
transition = "LEASED_to_IMPLEMENTING_only_after_exact_event_readback"

[other_event_payload_rule]
writer_acknowledgement = "forbidden"
writer_acknowledgement_digest = "forbidden"
conditional_absence_representation = "Omit both fields entirely; empty tables, nulls, and sentinel values are forbidden."
conditional_absence_is_canonical = true

[event_chain]
allowed_genesis_kinds = ["ACKNOWLEDGED", "SUPERSEDED"]
ACKNOWLEDGED_genesis = "Only for the exact assigned writer and matching lease/ticket/context while the pinned orchestration source state is LEASED; there is no earlier lease_event_v1 or lease_event_v2 event."
LEASED_to_SUPERSEDED_genesis = "Preserve the pinned LEASED->SUPERSEDED transition: integration owner may record SUPERSEDED as the first lease_event_v2 event only with exact LEASE_SUPERSEDED reason, matching supersession_receipt_v1 whose old_record ref and complete-file digest equal lease.ref, and the sole related_records value equal to the receipt's replacement ref. The old lease bytes remain unchanged; no ACK event is required."
REVOKED_genesis = "Not introduced. The pinned orchestration transitions do not establish LEASED->REVOKED; do not infer pre-ACK revocation from a generic terminal operation. A REVOKED event requires a prior valid nonterminal v2 event chain unless a separate accepted contract change defines another source transition."
genesis_previous_fields = "For either allowed genesis, both chain.previous_event_ref and chain.previous_event_exact_record_file_sha256 use their registered OptionalV1 ABSENT state with empty values; neither field is omitted or null."
all_nongenesis_events = "Every later event is lease_event_v2 linked to the immediately preceding event for the same writer_lease_v1 by ImmutableRecordRef and exact complete-file SHA-256; gaps, forks, duplicate predecessors, cross-lease refs, and version changes reject."
v1_compatibility = "lease_event_v1 remains read-only; an existing v1 chain cannot be extended by v2 or converted into a v2 predecessor."
mixed_version_chain = "reject"
append_only = true
one_linear_chain_per_lease = true
complete_file_digest_is_external = true
signed_payload_digest_is_embedded = true
terminal_events = ["REVOKED", "SUPERSEDED"]
no_event_after_terminal = true
one_ACKNOWLEDGED_per_lease = true
SUBMITTED_requires_prior_ACKNOWLEDGED = true
REVOKED_terminal_effect = "remove lease authority; do not invent a serialized REVOKED orchestration state"
SUPERSEDED_terminal_effect = "integration-owner supersession receipt references the exact replacement record; old bytes remain unchanged"
SUBMITTED_transition = "IMPLEMENTING_to_REVIEW after exactly one valid ACKNOWLEDGED in the same v2 chain; submission is not package acceptance, handoff acceptance, gate PASS, or automatic lease expiry"
ACKNOWLEDGED_transition = "LEASED_to_IMPLEMENTING after the exact assigned writer's signature verification, commit, and exact readback"

[related_record_rules]
ACKNOWLEDGED = "Exactly two ImmutableRecordRef values, item 1 the exact assignment_ticket_v1, item 2 the exact context_manifest_v1; both equal the payload refs. The lease is lease.ref and no acknowledgement record/artifact ref is allowed."
SUBMITTED = "Exactly one ImmutableRecordRef to the exact package_submission_v1 emitted in the same commit by record_package_submission_v2."
REVOKED = "The existing v1 rule says REVOKED_binds_revocation_receipt, but the current closed record-kind/type registry defines no revocation-receipt kind. Reject issuance until the receipt kind/reference is resolved by a separately reviewed contract change; do not substitute an unregistered string or infer a kind. This proposal adds no pre-ACK REVOKED genesis."
SUPERSEDED = "Exactly one ImmutableRecordRef to the exact replacement record named by the matching supersession_receipt_v1; that receipt must bind old_record to the exact lease.ref and its complete-file digest. Preserve the existing SUPERSEDED_binds_replacement predicate; do not mutate old lease bytes."

[pre_ack_supersession_genesis]
source_orchestration_state = "LEASED"
target_orchestration_state = "SUPERSEDED"
event_kind = "SUPERSEDED"
reason_code = "LEASE_SUPERSEDED"
actor = "exact_integration_owner"
previous_event_ref = "registered OptionalV1 ABSENT with empty value"
previous_event_exact_record_file_sha256 = "registered OptionalV1 ABSENT with empty value"
matching_supersession_receipt_required = true
receipt_old_record_ref_and_digest_equal_lease_ref = true
related_records_exactly_one_replacement_equal_to_receipt_replacement = true
lease_record_rewritten_or_deleted = false
prior_ACKNOWLEDGED_required = false
pre_ack_REVOKED_genesis_added = false

[chain_and_actor_preservation]
reason_map = "Preserve the four v1 mappings exactly: ACKNOWLEDGED/WRITER_ACKNOWLEDGED, SUBMITTED/PACKAGE_SUBMITTED, REVOKED/LEASE_REVOKED, SUPERSEDED/LEASE_SUPERSEDED."
actor_map = "ACKNOWLEDGED and SUBMITTED are signed by the exact assigned writer, which must equal both ticket.actors.writer and lease.actors.writer; REVOKED and SUPERSEDED are signed by the exact integration owner under a selected profile."
existing_transitions = "Preserve LEASED->IMPLEMENTING on ACKNOWLEDGED and IMPLEMENTING->REVIEW on SUBMITTED; preserve the pinned LEASED->SUPERSEDED path as a pre-ACK terminal genesis; REVOKED removes authority only under a separately allowed source transition."
event_order = "Exactly one predecessor link and its immutable exact-file digest establish a single linear chain; no forks, gaps, duplicate events, or timestamps-as-order."
signing_boundary = "The signature actor must equal actor.identity. The signer for a writer event is the actual exact ticket writer. The integration owner may verify and record the event but cannot impersonate or sign as that writer."

[invariants]
recorded_is_instance_status_only = true
RECORDED_does_not_mean_ACKNOWLEDGED = true
RECORDED_does_not_mean_current_authority = true
RECORDED_does_not_mean_evidence_or_acceptance = true
one_ACKNOWLEDGED_per_lease = true
LEASED_to_SUPERSEDED_pre_ACK_genesis_preserved = true
pre_ACK_REVOKED_genesis_introduced = false
one_linear_chain_per_lease = true
new_lease_event_producers_use_v2_from_first_event = true
exact_utf8_lf_canonicalization_required = true
no_mixed_v1_v2_chains = true

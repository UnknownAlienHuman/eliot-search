[count_delta_explanation]
schema_files = "Add only lease-event-v2.toml to the nine current required schema files."
record_kinds = "Add lease_event_v2 to ClosedControlRecordKind; do not add a writer_acknowledgement record kind."
registered_types = "At the e58 proposal snapshot only, the accepted enum decision advances the historical 47 baseline to 51 with four named domains and this ACK proposal adds WriterAcknowledgementV1 for a historical target of 52. The later separately accepted QualifiedOpaqueId grammar adoption is outside this snapshot; if both adoptions are materialized, the future cumulative target is 53. Neither count claims canonical registry implementation."
instance_profiles = "Add lease-event-instance-v2.toml with the accepted RECORDED instance status."
operation_receipt = "Separate unaccepted operation-receipt/trust profile work is excluded and would require its own reviewed count delta."

[status_binding]
instance_status = "RECORDED"
status_meaning = "The field identifies a lease_event_v2 serialized instance; it does not by itself prove operation success, exact readback, ACKNOWLEDGED, or authority."
status_does_not_mean = ["ACKNOWLEDGED", "current_lease_authority", "implementation_authorized", "evidence_passed", "package_accepted", "handoff_accepted", "gate_passed", "wave_advanced"]

[activation_blockers]
items = [
  "No finite required_evidence[] cardinality or ticket-file byte cap exists in assignment-ticket-v1; do not invent one here.",
  "The v1 REVOKED_binds_revocation_receipt rule has no corresponding closed record kind in the current ClosedControlRecordKind set.",
  "The separate native operation-input/receipt profile is unaccepted, has only a v1 acknowledgement input entry, and includes an acknowledgement artifact that this embedded-payload proposal forbids.",
  "The v2 operation input schemas, canonical input bytes, durable recovery/profile binding, and exact unknown-outcome procedure remain unaccepted; every operation stays disabled.",
  "Writer and integration-owner identities, signer roles, verification profiles, keys, artifact store, and trust state remain unprovisioned and unqualified.",
  "Writer, integration-owner, approval, artifact-store, trust, and signing-profile identities and instances remain unprovisioned and unqualified.",
  "The four ticket-obligation enum domains and nine bindings are accepted, but canonical types-v1.toml implementation remains pending; its exact final file digest is unknown and must not be invented.",
  "No exact writer signature or immutable event readback exists.",
  "The later separately accepted QualifiedOpaqueId grammar adoption is outside this e58 source snapshot; if that adoption and this ACK type are both materialized, the future cumulative type target is 53, while canonical implementation and the exact final registry digest remain pending."
]


[[server_record]]
name = "ProviderBindingRecord"
record_kind = "durable_server_record"
shape_owner = "search-contracts"
shape_module_proposal = "search-contracts::authority"
mutable_state_owner = "search-provider-protocol::binding"
durability_adapter = "search-control-redb::provider_authority"
construction_authorizes = false
provider_wire_visible = false
fields = [
  { name = "binding_id", type = "BindingId", presence = "required", basis = "S19.1 and S32.0", rule = "Strong identity; never supplied as authoritative request input." },
  { name = "installation_id", type = "InstallationId", presence = "required", basis = "S19.1", rule = "Must equal the daemon installation identity." },
  { name = "installation_incarnation_id", type = "InstallationIncarnationId", presence = "required", basis = "S19.1 and S32.0", rule = "Must equal the live installation incarnation." },
  { name = "peer_role", type = "closed PeerRole enum", presence = "required", basis = "proposed from S32.0 mutual-authenticated hello", rule = "Exact variants are owned by search-provider-protocol; arbitrary strings are forbidden." },
  { name = "peer_identity_digest", type = "Blake3Digest32", presence = "required", basis = "proposed from S32.0 mutual-authenticated hello", rule = "Stable comparison value only; never proof of authentication or a raw vendor/native identity." },
  { name = "pairing_generation", type = "NonZeroRevision", presence = "required", basis = "proposed currentness fence", rule = "Identifies one pairing; never zero, wraps, or reuses a retired value." },
  { name = "permitted_profile_ids", type = "BoundedSet<ProfileId>", presence = "required", basis = "proposed from S32.2 binding-filtered available_profiles", rule = "Filters capability exposure only and never grants recipe, read, exact-scan, or retrieval permission; empty means none." },
  { name = "issued_at", type = "UtcTimestamp", presence = "required", basis = "proposed lifecycle metadata", rule = "Explicit record time; not a substitute for current readback." },
  { name = "expires_at", type = "Option<UtcTimestamp>", presence = "required", basis = "proposed lifecycle ceiling", rule = "Null explicitly means no time-based binding expiry; otherwise strictly later than issued_at." },
  { name = "revocation_generation", type = "NonZeroRevision", presence = "required", basis = "S19.1 revocation fence", rule = "Sole owner of binding revocation generation; copied from the same current row into each grant." },
  { name = "status", type = "ProviderBindingStatus", presence = "required", basis = "proposed explicit lifecycle", rule = "Closed tags ACTIVE, REVOKED, EXPIRED; terminal rows cannot reactivate in place." },
]
excluded_existing_fields = [
  { name = "disclosure_ceiling_ref", reason = "P00 does not close its referent, owner, or relationship to SearchReadGrantClaims.disclosure_ceiling; an opaque reference cannot silently become authority." },
]

[[server_record]]
name = "AuthoritativeGrantPolicy"
record_kind = "nested_server_policy_value"
shape_owner = "search-contracts"
shape_module_proposal = "search-contracts::authority"
mutable_state_owner = "UNCONFIRMED"
proposed_mutable_state_owner = "search-access::grant"
mutable_state_owner_status = "UNCONFIRMED_PROPOSAL"
mutable_state_owner_basis = "The current search-access grant contract establishes validation and scope intersection, not standalone policy creation or replacement."
durability_adapter = "embedded in StandalonePolicyRecord via search-control-redb::provider_authority"
construction_authorizes = false
provider_wire_visible = false
fields = [
  { name = "binding_id", type = "BindingId", presence = "required", basis = "S19.1", rule = "Must match the paired binding exactly." },
  { name = "binding_generation", type = "NonZeroRevision", presence = "required", basis = "proposed currentness fence", rule = "Must equal the paired binding pairing_generation." },
  { name = "policy_generation", type = "NonZeroRevision", presence = "required", basis = "proposed policy-state revision", rule = "Advances on every policy replacement and is never reused." },
  { name = "installation_id", type = "InstallationId", presence = "required", basis = "S19.1", rule = "Must match the paired binding and live daemon." },
  { name = "installation_incarnation_id", type = "InstallationIncarnationId", presence = "required", basis = "S19.1", rule = "Must match the paired binding and live daemon." },
  { name = "principal_opaque_id", type = "OpaqueId", presence = "required", basis = "S19.1", rule = "Server-authoritative principal; opaque and bounded." },
  { name = "client_scope_ref", type = "OpaqueRef", presence = "required", basis = "S19.1", rule = "Server-authoritative scope reference; possession grants no authority." },
  { name = "scope_domain_id", type = "ScopeDomainId", presence = "required", basis = "S19.1", rule = "Server-authoritative domain identity." },
  { name = "allowed_membership_ids", type = "BoundedSet<SourceMembershipId>", presence = "required", basis = "S19.1", rule = "Finite ceiling; duplicate members reject; empty authorizes none." },
  { name = "allowed_corpus_or_portfolio_ids", type = "BoundedSet<CorpusOrPortfolioId>", presence = "required", basis = "S19.1", rule = "Finite ceiling; duplicate members reject; empty authorizes none." },
  { name = "reference_portfolio_revision", type = "Option<PortfolioRevision>", presence = "required", basis = "S19.1", rule = "Preserve the single optional wire field. Its mapping to allowed_corpus_or_portfolio_ids when one or more portfolio IDs are present is unresolved; do not derive a multi-portfolio mapping or add a new wire field in this proposal." },
  { name = "allowed_access_partitions", type = "BoundedSet<AccessPartitionId>", presence = "required", basis = "S19.1", rule = "Finite ceiling; duplicate members reject; empty authorizes none." },
  { name = "allowed_modalities", type = "BoundedSet<Modality>", presence = "required", basis = "S19.1", rule = "Finite ceiling; duplicate members reject; empty authorizes none." },
  { name = "permitted_recipe_families", type = "BoundedSet<RecipeFamilyId>", presence = "required", basis = "S19.1", rule = "Finite ceiling; duplicate members reject; empty authorizes none." },
  { name = "allowed_budget_classes", type = "BoundedSet<ProfileId>", presence = "required", basis = "proposed durable policy ceiling", rule = "Finite set; request selects one member for maximum_budget_class; no ordering or default selection." },
  { name = "sensitivity_ceiling", type = "SensitivityClass", presence = "required", basis = "S19.1", rule = "Request cannot widen this ceiling." },
  { name = "disclosure_ceiling", type = "DisclosureCeiling", presence = "required", basis = "S19.1", rule = "Request cannot widen this ceiling." },
  { name = "source_read_permission", type = "bool", presence = "required", basis = "S19.1", rule = "Request cannot widen; false forbids source read." },
  { name = "exact_scan_permission", type = "bool", presence = "required", basis = "S19.1", rule = "Request cannot widen; true requires source_read_permission." },
  { name = "maximum_ttl_ms", type = "positive u64 milliseconds", presence = "required", basis = "proposed finite policy ceiling", rule = "The policy value is an explicit finite upper ceiling; checked timestamp addition overflow denies issuance. Whether to add a global TTL ceiling is unresolved." },
]
excluded_existing_fields = [
  { name = "issued_boot_id", reason = "S19.1 makes this a per-grant claim; mint it from current daemon state rather than persist it as policy." },
  { name = "revocation_generation", reason = "The paired binding row is the sole owner; copy its current generation into the grant after atomic read." },
]

[[server_record]]
name = "StandalonePolicyRecord"
record_kind = "durable_server_record"
shape_owner = "search-contracts"
shape_module_proposal = "search-contracts::authority"
mutable_state_owner = "UNCONFIRMED"
proposed_mutable_state_owner = "search-access::grant"
mutable_state_owner_status = "UNCONFIRMED_PROPOSAL"
mutable_state_owner_basis = "The current search-access grant contract establishes validation and scope intersection, not standalone policy creation or replacement."
durability_adapter = "search-control-redb::provider_authority"
construction_authorizes = false
provider_wire_visible = false
fields = [
  { name = "policy", type = "AuthoritativeGrantPolicy", presence = "required", basis = "server policy contract", rule = "Embedded value; never encoded as SearchReadGrantClaims." },
  { name = "state", type = "StandalonePolicyState", presence = "required", basis = "proposed explicit lifecycle", rule = "Closed tags ACTIVE, REVOKED, EXPIRED; terminal rows cannot reactivate in place." },
  { name = "issued_at", type = "UtcTimestamp", presence = "required", basis = "proposed lifecycle metadata", rule = "Explicit policy issuance time." },
  { name = "expires_at", type = "Option<UtcTimestamp>", presence = "required", basis = "proposed lifecycle ceiling", rule = "Null explicitly means no time-based policy expiry; otherwise strictly later than issued_at." },
]

[atomic_read]
required = true
snapshot = "one current published control generation"
absence = "both rows absent means unregistered and grants nothing"
half_pair = "fail closed"
identity_match = ["binding_id", "installation_id", "installation_incarnation_id"]
generation_match = ["policy.binding_generation equals binding.pairing_generation"]
lifecycle_match = "both binding and policy are ACTIVE and unexpired"
stale_publication = "fail closed"
commit_receipt = "historical evidence only"
recovery_after_possible_write = "OUTCOME_UNKNOWN until exact readback with original mutation identity resolves it"

[grant_derivation]
input_policy = "current atomic ProviderBindingRecord plus StandalonePolicyRecord"
wire_output = "SearchReadGrantClaims"
wire_fields_generated_per_grant = ["grant_id", "issued_boot_id", "issued_at", "expires_at", "nonce"]
wire_revocation_generation_source = "current ProviderBindingRecord.revocation_generation"
wire_maximum_budget_class = "exactly one explicitly requested member of AuthoritativeGrantPolicy.allowed_budget_classes"
scope = "intersect explicit membership, corpus, access-partition, modality, and recipe requests with current policy; empty intersection denies; portfolio scope derivation remains blocked pending the single-revision mapping decision"
portfolio_revision_mapping = "BLOCKED_UNRESOLVED: preserve the existing set and singular optional revision wire fields; do not invent an array, order-based association, or architecture semantics"
request_may_widen = false
expires_at_rule = "no later than request TTL, policy.maximum_ttl_ms, binding expiry, or policy expiry"
protocol_auth_owner = "search-provider-protocol::binding"
grant_validation_and_intersection_owner = "search-access::grant"
concrete_composition_owner = "eliot-searchd"

[visibility]
provider_wire = false
server_record_result_variants = false
raw_credentials = false
plaintext_keys = false
vendor_native_types = false
vendor_identifiers = false
collection_names = false
point_ids = false
source_content = false


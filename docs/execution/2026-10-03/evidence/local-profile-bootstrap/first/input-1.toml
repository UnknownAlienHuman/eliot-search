schema_version = 1
project = "eliot-search"
candidate_id = "local-profile-bootstrap-evidence-v1"
status = "PROPOSED_REVIEW_PENDING"
claimable = false
instance_status = "NOT_PROVISIONED"
qualification_result = "UNAVAILABLE"
owner = "integration-owner"
based_on_commit = "0f691f1b3fd10755a3c8e650ddea6f9311842978"
scope = "local native profile trust bootstrap and its non-authoritative raw qualification evidence"

[boundary]
authority_records_created = false
closed_control_record_kind_added = false
issued_ticket_or_package_submission_required = false
search_runtime_required = false
orchestration_service = "none"
database = "none"
baseline_runtime = "native Rust, Git plumbing and Windows CNG only"
hardware_or_smart_card_required = false
different_windows_user_required = false
same_user_boundary = "processes with the same Windows token may request every key available to that account; distinct ActorIdentity values, public keys and tasks do not prove process or human isolation"
trusted_host_assumption = "the authorized integration owner, host OS, configured launcher, current Windows account, Git executable, CNG software provider and cooperative actor/task assignment are trusted and not compromised"
authority_source_boundary = "the standalone baseline is an authorized integration owner explicitly provisioning, inspecting and pinning the root public-key fingerprint through a separate owner action in protected host/launcher state outside the product Git repository; Git, a self-signed key, display names, usernames, environment values or hash equality alone do not create that authority"
external_authority_channel = "optional stronger profile only; no external signing service, second human, hardware token or new service is required by this localhost baseline"
root_key_present = false
host_pin_state_present = false

[host_pin_state_v1]
purpose = "authenticated local current-root state for bootstrap and activation under the trusted cooperative localhost assumption"
state_location = "absolute path explicitly configured by the integration owner in protected launcher configuration, outside the product Git repository; never derive it from Git, a remote, environment, username, display name, home directory or current checkout"
record_path_pattern = "<protected-host-state>/eliot-search/profile-bootstrap/root-pins/<20-digit-generation>.toml"
current_pointer_path = "<protected-host-state>/eliot-search/profile-bootstrap/current-root-pin.toml"
record_field_order = ["schema_version", "record_kind", "project_namespace", "generation", "root_key_id", "root_public_key_blob_hex", "owner_action_id"]
record_field_types = ["u16 exact 1", "ASCII exact local_root_pin_record_v1", "namespace component 1..96 ASCII bytes", "u64 generation starting at 1", "sha256- plus 64 lowercase hex", "144 lowercase hex characters for exact 72-byte P-256 public BCRYPT_ECCPUBLIC_BLOB", "OpaqueId 1..128 ASCII bytes identifying the explicit owner action; not an authority token"]
record_max_file_bytes = 4096
record_encoding = "canonical UTF-8 without BOM, LF only, exactly one final LF, fixed field order, no comments, escapes, duplicate keys or unknown fields"
record_authenticity = "trusted host OS plus the explicitly provisioned protected launcher-state ACL and owner action; the host record is not self-signed and its bytes in Git never establish authority"
current_pointer_field_order = ["schema_version", "record_kind", "state", "generation", "root_key_id", "record_sha256"]
current_pointer_field_types = ["u16 exact 1", "ASCII exact local_root_pin_head_v1", "ASCII exact ACTIVE, ROTATION_PENDING or DISABLED", "u64 exact generation", "sha256- plus 64 lowercase hex", "64 lowercase hex SHA-256 of exact immutable pin-record bytes"]
current_pointer_max_file_bytes = 1024
acl_rule = "protect the state directory and all ancestors; only the explicitly configured integration-owner principal may create, replace, delete or change ACLs; the configured launcher may read; reject broad write grants, inherited untrusted grants, reparse points and final-handle paths outside the configured state root"
same_principal_limit = "if owner, launcher and bootstrap share a Windows token, every process with that token is inside the trusted-host boundary and may reach account keys/state; this ACL does not claim process isolation"
initial_pin_rule = "a distinct explicit integration-owner action provisions or selects the root key, inspects the exact public blob and computed fingerprint, creates generation 1 with create-only semantics, reads back and verifies exact bytes, digest, blob and ACL, then creates the current pointer create-only; bootstrap never generates or self-trusts the root"
caller_check = "every authoritative bootstrap, review or activation operation requires an explicit --expected-root-key-id; open the configured current pointer and selected immutable record without following reparse points, validate canonical bytes, size, ACL, project namespace, generation and both record/pointer digests, hash the public blob, and require the caller pin, record root_key_id, blob fingerprint and signed-envelope root_key_id to be exactly equal"
currentness = "read the owner-pinned pointer and immutable record on every operation without cache; hold the host-state shared lock through the operation's authority check and publication/readback, while owner rotation requires the exclusive lock; unavailable lock, stale handle, changed pointer or uncertain readback fails closed"
create_only_readback = "generation records are immutable and create-only; an existing path is reusable only after exact byte, canonical encoding, digest and ACL readback; mismatch is an integrity failure; the current pointer is created initially and later switched only by explicit owner action using atomic replacement and exact readback"
rotation_and_replacement = "no implicit replacement or fallback; owner first switches the pointer to ROTATION_PENDING under the exclusive lock, then provisions and inspects a new key, creates and verifies generation+1 create-only, and atomically points to it only after exact readback; any failure leaves ROTATION_PENDING or DISABLED and all operations UNAVAILABLE; retain old records, invalidate old-root envelopes/evidence/reviews/snapshots for new authority, and require explicit new pin input and a fresh accepted binding"
external_revocation = "the baseline has no remote-global revocation; an owner may fail closed by switching the protected pointer to DISABLED; external revocation checking is an optional stronger profile"

[owner_pinned_root_acceptance]
acceptance_point = "future native bootstrap command requires explicit --expected-root-key-id sha256-<64-lowercase-hex> and --authority-envelope <file> arguments for every authoritative operation; compare the supplied pin with fresh protected host/launcher state and never discover it from the repository, a branch, environment fallback, username or self-signed envelope"
expected_root_key_id_type = "OpaqueId-shaped string sha256- plus exactly 64 lowercase hexadecimal characters; 71 ASCII bytes"
required_public_key_blob = "exact 72-byte public BCRYPT_ECCPUBLIC_BLOB for ECDSA P-256, represented as 144 lowercase hexadecimal characters in the envelope"
public_key_blob_validation = "decode 72 bytes; first 4 bytes are little-endian BCRYPT_ECDSA_PUBLIC_P256_MAGIC, next 4 bytes little-endian cbKey=32, followed by exactly 32-byte big-endian X and 32-byte big-endian Y coordinates; reject every other magic, width, length or point"
fingerprint_check = "SHA-256 over the exact 72 decoded public-blob bytes, formatted sha256- plus lowercase hex, must equal the explicit expected pin, fresh owner-pinned host record, current pointer and authority-envelope root_key_id"
envelope_check = "envelope root_key_id and root_public_key_blob_hex must equal the current host pin record; verify the root signature over the exact pre-signature envelope payload with that pinned public blob"
self_signed_root = "reject; an envelope cannot authorize its own root fingerprint"
host_currentness = "the trusted caller confirms a current protected owner-pinned host/launcher record on every operation; the tool authenticates local state only under the declared trusted-host/ACL assumption and cannot prove protection against compromise of that host or authorized token"
trace_fields = "authority_channel_id and authority_reference_sha256 retain their exact v1 positions and types; in the baseline they identify/hash the exact local host pin record or owner action for trace only and never prove channel authenticity or authority"
baseline_authority_channel_id = "local-owner-pin-state-v1"
baseline_authority_reference_sha256 = "SHA-256 of the exact active host pin record bytes read during the explicit envelope-signing owner action; this digest remains trace metadata and is not an authority proof"
trace_field_binding = "baseline authority_channel_id and authority_reference_sha256 must use the exact values above for reproducible evidence; signature validation still derives authority only from the current ACL-protected host pin record and explicit caller-pin equality"
missing_or_unverified_pin = "UNAVAILABLE and fail closed before key mapping, qualification acceptance, trust publication or issuance; no environment, Git, username or stale-cache fallback"
stronger_external_channel_profile = "an optional separately reviewed profile may add authenticated external delivery and revocation; its fields are not required for or proof of this baseline"

[authority_envelope_v1]
artifact_kind = "local_profile_bootstrap_authority_envelope_v1"
transport = "created and root-signed by an explicit authorized integration-owner action on the trusted localhost using the current owner-pinned root; its public bytes may also be copied into the first evidence commit"
encoding = "canonical UTF-8 without BOM, LF line endings, one final LF, ordered assignments, no comments, no TOML escapes"
max_file_bytes = 65536
field_order_before_signature = ["schema_version", "artifact_kind", "project_namespace", "generation", "root_key_id", "root_public_key_blob_hex", "authority_channel_id", "authority_reference_sha256", "candidate_profile_refs", "actor_authorizations"]
field_order_note = "this exact v1 top-level order is retained; the corrected localhost source does not change canonical signed field order or signature framing"
signature_table = "final [signature] table, fields signed_payload_sha256 then signature_bytes_hex"
actor_authorization_field_order = ["actor_identity", "bootstrap_role", "key_id", "key_container_name", "public_key_blob_hex", "allowed_operation_domains"]
top_level_field_types = ["schema_version=u16 exact 1", "artifact_kind=ASCII exact local_profile_bootstrap_authority_envelope_v1", "project_namespace=namespace component 1..96 ASCII bytes", "generation=u64 exact 1", "root_key_id=sha256- plus 64 lowercase hex", "root_public_key_blob_hex=144 lowercase hex characters", "authority_channel_id=OpaqueId 1..128 ASCII bytes", "authority_reference_sha256=64 lowercase hex", "candidate_profile_refs=1..8 unique QualifiedProfileRefV1 values sorted bytewise ASCII", "actor_authorizations=exactly two ordered inline tables", "signature=final table"]
actor_authorization_field_types = ["actor_identity=syntactically valid ActorIdentity, at most 160 ASCII bytes and explicitly root-authorized; no prior control-plane registration is presumed", "bootstrap_role=one exact bootstrap_roles value", "key_id=sha256- plus 64 lowercase hex and equal to SHA-256 of the decoded public blob", "key_container_name=exact key_container_pattern, at most 120 ASCII bytes", "public_key_blob_hex=exactly 144 lowercase hex characters", "allowed_operation_domains=nonempty ordered unique ASCII values, each 1..128 bytes"]
actors_exact_count = 2
actor_rows_sorted_by = "bytewise ASCII ActorIdentity ascending"
bootstrap_roles = ["bootstrap_operator", "independent_reviewer"]
operator_identity_rule = "syntactically valid exact ActorIdentity; exact value explicitly authorized by the signed envelope; bootstrap establishes this mapping without claiming prior registration; no display-name inference"
reviewer_identity_rule = "syntactically valid exact ActorIdentity whose class segment is reviewer; explicitly authorized by the signed envelope; no prior package-workflow registration is required"
operator_reviewer_distinct = "ActorIdentity strings and key IDs must differ; an actual separate reviewer task is mandatory"
allowed_domains_sorted_by = "bytewise ASCII ascending, unique, maximum 16 entries per actor, 1..128 ASCII bytes each"
operation_domain_grammar = "^[a-z][a-z0-9_]{0,127}$; bootstrap values are the two exact strings in bootstrap_domain_binding"
bootstrap_domain_binding = ["bootstrap_operator may use only local_profile_bootstrap_evidence_v1", "independent_reviewer may use only local_profile_bootstrap_review_v1"]
project_binding = "project_namespace must equal the namespace component of every candidate_profile_refs value and the project_namespace in each evidence body that names that envelope"
candidates_are_explicit = "candidate_profile_refs is a closed explicit allowlist for this envelope; evidence candidate_profile_ref must be an exact byte-for-byte member, not merely share a namespace or definition digest"
actor_binding = "the exact operator and reviewer ActorIdentity, role, key_id, container name and public blob in evidence/review must map to their corresponding envelope actor_authorizations row; no row swapping, aliasing or name-derived mapping"
key_container_pattern = "^EliotSearch-Approval-v1-[A-Za-z0-9._-]{1,96}$"
key_id_derivation = "sha256- plus lowercase SHA-256 of the exact decoded public BCRYPT_ECCPUBLIC_BLOB bytes"
root_key_disjoint_from_actor_keys = true
signature_preimage = "ASCII ELIOT-SEARCH/LOCAL-PROFILE-ROOT-AUTHORITY/V1 || 0x00 || u16be(schema_version=1) || raw32(SHA-256(exact bytes before [signature])) || raw32(root_key_id decoded from sha256- hex)"
signature_encoding = "exactly 64 bytes IEEE P1363 r[32]||s[32], lowercase-hex encoded in signature_bytes_hex; proposed wire encoding remains subject to independent qualification"
signed_body_boundary = "the signed body is the exact file prefix ending at the LF immediately before the [signature] line; the [signature] line and its fields are excluded; there is exactly one blank line between the body-final LF and [signature]"
signature_field_types = ["signed_payload_sha256=64 lowercase ASCII hex characters equal SHA-256 of the exact signed body", "signature_bytes_hex=128 lowercase ASCII hex characters decoding to exactly 64 bytes"]
signature_api_digest = "SHA-256 of the exact domain-separated preimage bytes is the digest supplied to CNG signing or verification; no implicit rehash, truncation or alternate digest"
canonical_text_rules = "one assignment per line in field_order_before_signature; exact key spelling and ` = ` delimiter; integers are decimal with no sign or leading zero except literal 0; strings are double-quoted ASCII with no escapes; string arrays use `[` + comma-separated double-quoted items without spaces + `]`; actor_authorizations is an ordered array of inline tables with no whitespace except one space after commas between fields, exact actor_authorization_field_order, and no whitespace around `=`; exactly one blank line precedes [signature]; signature fields use same key/delimiter rule; exactly one final LF"
external_authority_fields_are_proof = false
external_authority_fields_meaning = "root-signed trace metadata only; in the localhost baseline authority comes from comparing root_key_id and the exact public blob to the explicit caller pin and fresh protected host/launcher pin state under its ACL/trusted-host assumption"
root_private_key_custody = "root key is absent in this proposal; future provisioning and fingerprint inspection occur only in a distinct explicit integration-owner action outside bootstrap; trusted local software custody is the baseline and hardware or an external service is not required"
root_key_algorithm = "root public key is the exact ECDSA P-256 BCRYPT_ECCPUBLIC_BLOB defined above; root signature is proposed 64-byte P1363 ECDSA over SHA-256 of signature_preimage"
root_generation_rule = "bootstrap never creates, discovers, pins or self-trusts the root; root provisioning may occur only through the separate explicit integration-owner action described by host_pin_state_v1"
envelope_instance_created = false
root_private_key_generated = false
actor_keys_generated = false

[cng_key_provisioning_candidate]
provider = "Microsoft Software Key Storage Provider"
algorithm = "ECDSA P-256 with SHA-256 prehash"
key_scope = "persisted current-user key; do not set NCRYPT_MACHINE_KEY_FLAG"
create_rule = "never set NCRYPT_OVERWRITE_KEY_FLAG; existing mapped container name is a hard conflict"
silent_rule = "use NCRYPT_SILENT_FLAG for signing; UI requirement, provider absence or cancellation fails without fallback"
export_policy = "set NCRYPT_EXPORT_POLICY_PROPERTY DWORD 0 before key finalization and read back 0; qualification must separately demonstrate the exact provider rejects private export"
public_readback = "export exact BCRYPT_ECCPUBLIC_BLOB; recompute key_id; compare bytes and ID to root-signed authorization envelope"
secrets = "never write private key bytes, credentials or PINs to Git, evidence artifacts, control records or logs"
claims_not_proved = ["separate processes", "separate humans", "non-exportability without the executed provider probe", "root authority from local key possession"]

[bootstrap_artifact_locations]
raw_outcome_path = "swarm/profile-bootstrap/v1/raw/sha256/<first-two-lowercase-hex>/<64-lowercase-hex>.bin"
authority_envelope_path = "swarm/profile-bootstrap/v1/authority/sha256/<first-two-lowercase-hex>/<64-lowercase-hex>.toml"
evidence_path = "swarm/profile-bootstrap/v1/evidence/sha256/<first-two-lowercase-hex>/<64-lowercase-hex>.bin"
review_binding_path = "swarm/profile-bootstrap/v1/reviews/sha256/<first-two-lowercase-hex>/<64-lowercase-hex>.bin"
path_digest = "SHA-256 of exact file bytes; filename is full lowercase hex and parent directory is its first two hex characters"
git_object_id = "exact full existing GitObjectId tagged sha1:<40-lowercase-hex> or sha256:<64-lowercase-hex>, matching this repository object format"
locator_create_only = true
existing_path_rule = "reuse only if exact bytes, byte count, Git blob ID and independent SHA-256 all match; mismatch is integrity failure"
filter_and_path_rules = "disable Git filters and line-ending conversion; reject absolute paths, symlinks, traversal, alternate path spellings and ambient worktree resolution"
publication = "commit the evidence manifest and all referenced same-tree raw blobs together; commit the later review binding and its same-tree outputs separately; obtain each outer immutable ref only after its containing commit ID exists"
no_self_commit_reference = "an artifact may include same-tree blob locators without a commit; its outer immutable ref binds the exact containing commit after commit creation"
push = "no implicit remote push"
control_record_status = "these artifact_kind values are not ClosedControlRecordKind values, ImmutableRecordRef instances, tickets, submissions, reviews or authority receipts"

[bootstrap_locator_v1]
type_name = "BootstrapEvidenceRefV1 or BootstrapReviewBindingRefV1"
field_order = ["repository", "commit", "path", "git_blob_id", "exact_bytes", "sha256", "artifact_kind"]
field_types = ["RepositoryName ASCII 1..192 bytes", "GitObjectId exact tagged ASCII 45 or 71 bytes", "RepositoryRelativeSafePath ASCII 1..512 bytes", "GitObjectId exact tagged ASCII 45 or 71 bytes", "u64 unsigned big-endian", "Sha256Digest lowercase hex in TOML and raw32 in canonical binary values", "one closed BootstrapArtifactKindV1 value"]
artifact_kinds = ["ROOT_AUTHORITY_ENVELOPE_V1", "PROFILE_EVIDENCE_V1", "INDEPENDENT_REVIEW_BINDING_V1", "RAW_OUTCOME_V1", "ACTOR_TRUST_MANIFEST_V2"]
outer_reference_canonical_encoding = "ASCII ELIOT-SEARCH-BOOTSTRAP-LOCATOR || 0x00 || u16be(1) || u16be field_count=7 || ordinary ordered TLVs; no ClosedControlRecordKind field"
record_kind_relation = "artifact_kind is local to this proposal and never added to ClosedControlRecordKind by implication"
outer_locator_verification = "resolve repository identity and exact commit object; read path from that commit tree; reject symlink or non-blob; compare exact byte count, full algorithm-tagged Git blob ID, and SHA-256; require artifact_kind to match parsed bytes"

[same_tree_blob_locator_v1]
field_order = ["path", "git_blob_id", "exact_bytes", "sha256"]
field_types = ["RepositoryRelativeSafePath ASCII 1..512 bytes", "GitObjectId exact tagged ASCII 45 or 71 bytes", "u64 unsigned big-endian", "raw32 SHA-256"]
encoding = "u16be field_count=4 followed by ordinary ordered TLVs; resolved only against the exact containing evidence or review commit"
canonical_encoding = "ASCII ELIOT-SEARCH-SAME-TREE-BLOB-LOCATOR || 0x00 || u16be(1) || u16be field_count=4 || ordinary ordered TLVs"

[artifact_budgets]
max_authority_envelope_bytes = 65536
max_evidence_manifest_bytes = 262144
max_review_binding_bytes = 65536
max_raw_outcome_bytes_each = 1048576
max_raw_outcomes_per_evidence = 64
max_total_raw_outcome_bytes_per_evidence = 16777216
max_raw_review_output_bytes = 1048576
max_total_bootstrap_bytes_per_profile_instance = 33554432
max_working_memory_bytes = 16777216
max_bootstrap_operation_seconds = 120
max_read_only_recovery_seconds = 30
budget_failure = "typed failure before publication; no truncation, fallback, automatic deletion or PASS inference"

[binary_schema_v1]
encoding = "ASCII magic || 0x00 || u16be(1) || u16be(field_count) || ordered TLVs"
evidence_magic = "ELIOT-SEARCH-LOCAL-PROFILE-EVIDENCE"
review_magic = "ELIOT-SEARCH-LOCAL-PROFILE-REVIEW"
top_level_field_count = "exactly the number of entries in each artifact's field_order; the signature trailer is excluded"
tlv_header = "u16be ordinal || u8 wire_type || u32be exact value length || exact value bytes"
wire_type_codes = ["0x01=ASCII", "0x02=SHA256_RAW32", "0x03=U16BE", "0x04=U32BE", "0x05=U64BE", "0x06=GIT_OBJECT_ID_TAGGED_ASCII", "0x07=NESTED_TLV", "0x08=ORDERED_ARRAY", "0x09=RAW_BYTES", "0x0A=OPTIONAL", "0x0B=U8"]
nested_tlv = "u16be field_count followed by that many ordinary TLVs; ordinals start at 1"
ordered_array = "u32be element_count followed by repeated u32be exact_element_length and element bytes; no sorting unless a field rule requires it"
optional = "one byte 0x00 ABSENT or 0x01 PRESENT followed by the raw declared inner value with no extra type/length header"
integer_encoding = "unsigned fixed-width big-endian, no sign or alternate width"
git_object_id_encoding = "ASCII exact GitObjectId tagged form from swarm/schemas/types-v1.toml; compare tag to bound repository object format"
ascii_wire_domain = "unless a field has a stricter declared grammar, ASCII means bytes 0x20..0x7e only; no NUL, controls, DEL, Unicode or normalization"
unknown_or_reordered = "reject unknown, duplicate, missing, out-of-order, truncated, overlong and trailing bytes"
top_level_max_fields = 32
max_nested_depth = 4
max_ascii_value_bytes = 4096
max_probe_outcomes = 64
max_array_element_bytes = 16384
max_array_encoded_bytes = 1048576
u8_encoding = "exactly one unsigned byte"

[evidence_schema_v1]
artifact_kind = "PROFILE_EVIDENCE_V1"
field_order = ["schema_version", "artifact_kind", "run_id", "project_namespace", "candidate_profile_ref", "profile_definition_sha256", "source_base_commit", "root_key_id", "authority_envelope_same_tree_locator", "operator_actor_identity", "operator_key_id", "reviewer_actor_identity", "reviewer_key_id", "operator_task_id", "reviewer_task_id", "runtime_identity", "probe_outcomes"]
field_types = ["U16BE exact 1", "ASCII exact PROFILE_EVIDENCE_V1", "ASCII OpaqueId", "ASCII namespace grammar", "ASCII QualifiedProfileRefV1", "raw32", "GitObjectId tagged ASCII", "raw32", "NESTED_TLV SameTreeBlobLocatorV1", "ASCII ActorIdentity", "raw32", "ASCII ActorIdentity", "raw32", "ASCII OpaqueId", "ASCII OpaqueId", "NESTED_TLV RuntimeIdentityV1", "ORDERED_ARRAY<BootstrapProbeOutcomeV1>"]
runtime_identity_field_order = ["windows_build_identity", "rustc_version", "rustc_executable_sha256", "git_version", "git_executable_sha256", "repository_object_format", "cng_provider_name", "bootstrap_executable_sha256"]
runtime_identity_field_types = ["ASCII 1..128 bytes", "ASCII 1..64 bytes", "raw32", "ASCII 1..64 bytes", "raw32", "ASCII exact sha1 or sha256", "ASCII exact Microsoft Software Key Storage Provider", "raw32"]
probe_outcome_field_order = ["probe_id", "result_code", "input_sha256_optional", "raw_output_locator_optional", "unavailable_reason_optional"]
probe_outcome_field_types = ["ASCII from closed candidate probe_ids", "U8: 0=UNAVAILABLE, 1=PASS, 2=FAIL", "OPTIONAL raw32", "OPTIONAL NESTED_TLV SameTreeBlobLocatorV1", "OPTIONAL ASCII 1..512 bytes"]
probe_result_rule = "PASS and FAIL require exact input digest and raw output locator; UNAVAILABLE requires absent raw output and a nonempty reason; no result is inferred"
evidence_profile_ref_rule = "validate candidate_profile_ref under QualifiedProfileRefV1; require its namespace to equal project_namespace and envelope.project_namespace; require exact membership in envelope.candidate_profile_refs; then bind the exact definition digest from the reviewed profile candidate"
evidence_task_binding = "operator_task_id and reviewer_task_id are explicit integration-owner task assignments carried in evidence; the envelope v1 does not claim task IDs; each evidence actor/key pair must map to its exact envelope role, and the later review_task_id must equal reviewer_task_id and differ from operator_task_id"
same_tree_resolution = "authority envelope and raw output blobs resolve only within the exact commit that contains this evidence manifest"
manifest_contains_own_locator = false
manifest_contains_containing_commit = false
outcome_cardinality_and_order = "exactly one outcome for each mandatory_probe_ids entry, in that exact order; no duplicate, omitted or additional probe ID"
operator_signature_trailer = "append ASCII SIG1 followed by exactly 5 ordinary TLVs with ordinals 1..5 and types [ASCII QualifiedProfileRefV1, ASCII ActorIdentity, raw32 actor key_id, raw32 signed body SHA-256, RAW_BYTES exact 64-byte P1363 signature]; no count prefix"
operator_signature_preimage = "ASCII ELIOT-SEARCH/LOCAL-PROFILE-BOOTSTRAP-EVIDENCE/V1 || 0x00 || u16be(1) || LP16(candidate_profile_ref ASCII) || raw32(SHA-256(exact evidence body bytes before SIG1)) || raw32(root_key_id) || LP16(operator_actor_identity ASCII) || raw32(operator_key_id)"
operator_signature_digest_equality = "the raw32 signed body SHA-256 in trailer ordinal 4 must equal SHA-256(exact evidence body bytes before SIG1)"
operator_signature_verification = "signature-trailer profile_ref must equal evidence.candidate_profile_ref; actor_identity and key_id must equal evidence.operator_actor_identity/operator_key_id and the bootstrap_operator authorization in the root-signed envelope; project namespace, root pin and profile definition digest must satisfy machine_cross_bindings_v1; verify the exact preimage; signature trailer and its signature artifact are excluded from the evidence body hash"

[machine_cross_bindings_v1]
project_namespace_binding = "QualifiedProfileRefV1 namespace == authority_envelope_v1.project_namespace == evidence_schema_v1.project_namespace == host_pin_state_v1 record.project_namespace; reject mismatch before signing or accepting"
candidate_profile_binding = "evidence_schema_v1.candidate_profile_ref must be an exact value in the root-signed authority_envelope_v1.candidate_profile_refs list"
profile_and_definition_binding = "accepted evidence, accepted review and activation snapshot must carry the exact same candidate_profile_ref and profile_definition_sha256; the review signature-trailer profile_ref also equals that value"
actor_and_key_binding = "evidence operator identity/key match only the envelope bootstrap_operator row; evidence reviewer identity/key match only the envelope independent_reviewer row; review actor/key and activation actor rows repeat those exact pairs, public blobs and container names; all IDs and key IDs remain distinct"
task_binding = "evidence operator_task_id and reviewer_task_id are explicit and distinct; review_binding_v1.review_task_id equals evidence.reviewer_task_id and differs from evidence.operator_task_id; the actual reviewer task must inspect the exact evidence ref; envelope v1 contains actor/key roles but intentionally no task IDs"
task_to_actor_binding = "operator_task_id is bound to operator_actor_identity by the operator signature over the exact evidence body; reviewer_task_id is bound to reviewer_actor_identity by the independent review signature over review_task_id and the exact evidence digest; both actor/key pairs must map to their exact envelope rows"
review_reference_binding = "accepted review evidence_ref and evidence_exact_sha256 must identify the exact evidence artifact and exact full-file digest under BootstrapEvidenceRefV1"
activation_reference_binding = "activation snapshot profile_evidence_ref and profile_review_binding_ref must be the exact refs bound by the accepted review; both refs must resolve to records carrying the same profile_ref, definition digest, root pin and actor/key mapping"
definition_digest_encoding = "profile_definition_sha256 is the raw32 digest in binary artifacts and the exact lowercase 64-hex SHA-256 in TOML activation fields; no normalization or alias substitution"
failure_rule = "any cross-profile, namespace, definition digest, evidence/review ref, actor, key, task or root-pin substitution yields REJECTED or UNAVAILABLE and can never be repaired by a matching display name or trace field"

[review_binding_v1]
artifact_kind = "INDEPENDENT_REVIEW_BINDING_V1"
field_order_before_signature = ["schema_version", "artifact_kind", "review_task_id", "evidence_ref", "evidence_exact_sha256", "profile_definition_sha256", "root_key_id", "operator_actor_identity", "reviewer_actor_identity", "reviewer_key_id", "independent_verifier_version", "independent_verifier_sha256", "review_result", "reviewed_probe_ids", "raw_review_output_locator"]
field_types = ["U16BE exact 1", "ASCII exact INDEPENDENT_REVIEW_BINDING_V1", "ASCII OpaqueId", "NESTED_TLV BootstrapEvidenceRefV1", "raw32", "raw32", "raw32", "ASCII ActorIdentity", "ASCII ActorIdentity", "raw32", "ASCII 1..128 bytes", "raw32", "U8: 0=UNAVAILABLE, 1=ACCEPTED, 2=REJECTED", "ORDERED_ARRAY of unique closed probe IDs", "NESTED_TLV SameTreeBlobLocatorV1"]
independent_task_rule = "review_task_id differs from operator_task_id; reviewer ActorIdentity and root-mapped key ID differ from operator; actual separate reviewer task must inspect the exact evidence commit"
independent_verifier_rule = "review task uses a separately built verifier executable; its exact version and SHA-256 are required evidence inputs and must differ from the implementation-under-review executable"
review_result_rule = "ACCEPTED only if every mandatory probe is PASS and all raw inputs/outputs, exact profile and definition digest, evidence ref/digest, envelope actor mappings, task bindings and fresh owner-pinned host root state verify; otherwise REJECTED or UNAVAILABLE"
accepted_review_probe_order = "reviewed_probe_ids must exactly equal mandatory_probe_ids, in declared order, when review_result is ACCEPTED; other results must not claim a complete accepted set"
review_profile_binding = "review_binding_v1.profile_definition_sha256 and its signature-trailer profile_ref must exactly equal the reviewed evidence profile_definition_sha256 and candidate_profile_ref; evidence_ref, evidence_exact_sha256, root_key_id, operator_actor_identity, reviewer_actor_identity and reviewer_key_id must match the exact evidence and corresponding envelope rows"
review_task_binding = "review_task_id must equal evidence.reviewer_task_id and differ from evidence.operator_task_id; review is produced by the actual distinct reviewer task, not inferred from a distinct string"
signature_trailer = "after the exact pre-signature body append ASCII SIG1 || ordered signature TLVs for profile_ref QualifiedProfileRefV1, actor_identity ActorIdentity, actor_key_id raw32, signed_payload_sha256 raw32 and signature_bytes raw64 P1363"
signature_trailer_exact_framing = "ASCII SIG1 followed by exactly 5 ordinary TLVs with ordinals 1..5, wire types [0x01 ASCII, 0x01 ASCII, 0x02 SHA256_RAW32, 0x02 SHA256_RAW32, 0x09 RAW_BYTES], exact value lengths [profile_ref length, actor identity length, 32, 32, 64]; no count prefix and no trailing bytes"
signature_body_boundary = "the pre-signature body is the exact review bytes before the first byte of ASCII SIG1; SIG1 and all five TLVs are excluded"
signature_digest_equality = "trailer field signed_payload_sha256 must equal SHA-256(exact review body bytes before SIG1)"
signature_preimage = "ASCII ELIOT-SEARCH/LOCAL-PROFILE-BOOTSTRAP-REVIEW/V1 || 0x00 || u16be(1) || LP16(profile_ref ASCII) || raw32(SHA-256(exact pre-signature body bytes)) || raw32(evidence_exact_sha256) || LP16(reviewer_actor_identity ASCII) || raw32(root_key_id)"
signature_trailer_excluded_from_preimage = true
review_binding_contains_own_git_commit = false
signature_verification = "signature-trailer profile_ref must equal the exact evidence candidate_profile_ref; map actor_identity to reviewer_key_id in the independent_reviewer envelope row and evidence; verify exact 64-byte signature with the separately identified verifier and current owner-pinned root; readback-check review artifact bytes and SHA-256"
review_signature_is_profile_qualification = false

[activation_snapshot_v2]
manifest_kind = "actor_trust_manifest_v2"
head_kind = "actor_trust_head_v2"
manifest_path_pattern = "swarm/control-trust/v2/actor-manifests/<20-digit-generation>.toml"
head_path = "swarm/control-trust/v2/actor-trust-head.toml"
manifest_max_file_bytes = 262144
head_max_file_bytes = 65536
canonical_file_encoding = "UTF-8 without BOM, LF only, exactly one final LF, fixed field order, no comments, no escapes, no duplicate keys or unknown fields"
canonical_serializer_rule = "use authority_envelope_v1.canonical_text_rules with manifest_field_order and actor_field_order; locator tables use locator_inline_table_field_order and exact no-extra-space key-value syntax"
locator_inline_table_field_order = ["repository", "commit", "path", "git_blob_id", "exact_bytes", "sha256", "artifact_kind"]
manifest_field_order = ["schema_version", "record_kind", "status", "generation", "root_key_id", "profile_ref", "profile_definition_sha256", "actors", "profile_evidence_ref", "profile_review_binding_ref", "signature"]
manifest_field_types = ["u16 exact 2", "ASCII exact actor_trust_manifest_v2", "ASCII exact ACTIVE", "u64 generation starting 1", "sha256- plus 64 lowercase hex", "QualifiedProfileRefV1", "64 lowercase hex SHA-256", "exactly 2 ordered actor tables", "BootstrapEvidenceRefV1", "BootstrapReviewBindingRefV1", "final signature table"]
manifest_reference_inline_encoding = "each reference is one inline TOML table with fields in locator_inline_table_field_order; strings are exact quoted ASCII, exact_bytes is unsigned decimal, no omitted/extra fields"
actor_field_order = ["actor_identity", "key_id", "key_container_name", "public_key_blob_hex", "allowed_operation_domains", "registration_evidence_ref", "independent_review_ref"]
actor_field_types = ["ASCII ActorIdentity", "sha256- plus 64 lowercase hex", "key_container_pattern", "144 lowercase hex characters", "ordered unique ASCII domains", "BootstrapEvidenceRefV1", "BootstrapReviewBindingRefV1"]
actor_ordering_and_bounds = "exactly two entries sorted bytewise by ActorIdentity; identities and key IDs distinct; maximum 16 domains per actor, each 1..128 ASCII bytes; total canonical manifest <=262144 bytes"
operation_domain_activation_gate = "the authority envelope authorizes bootstrap domains only; any issuance operation domain may enter an ACTIVE trust manifest only after integration owner accepts the exact profile definition, profile instance, profile_evidence_ref, profile_review_binding_ref and independent qualification evidence; the domain set must equal an explicit accepted registry assignment and is never inferred from actor names or envelope fields"
activation_profile_binding = "manifest.profile_ref and profile_definition_sha256 must exactly equal accepted evidence and review values; both immutable refs must resolve to those exact same-profile records and root generation"
activation_actor_binding = "the exactly two actor rows must reproduce the evidence/envelope operator and reviewer ActorIdentity, key_id, key_container_name and public_key_blob_hex values without swapping; row order remains bytewise ActorIdentity and permitted operation domains are explicit accepted registry values"
later_approval_profile_adoption = "before authoritative issuance use, the separately maintained and integration-accepted approval-profile definition must adopt this exact QualifiedProfileRefV1, profile_definition_sha256, BootstrapEvidenceRefV1, BootstrapReviewBindingRefV1 and active TrustManifestRefV2/root-pin generation binding; this candidate does not edit or accept that profile draft"
manifest_path_derivation = "replace the final path component with the unsigned decimal generation left-padded with zeroes to exactly 20 ASCII digits and suffix .toml; create-only; generation starts at 1"
manifest_signature = "final [signature] table fields signed_payload_sha256 then signature_bytes_hex; use root P-256 key matching the explicit expected pin and freshly read owner-pinned host state, with exact 64-byte P1363 candidate encoding; domain ELIOT-SEARCH/LOCAL-PROFILE-ACTOR-TRUST-MANIFEST/V2"
manifest_signature_preimage = "ASCII ELIOT-SEARCH/LOCAL-PROFILE-ACTOR-TRUST-MANIFEST/V2 || 0x00 || u16be(2) || raw32(SHA-256(exact manifest body before [signature])) || raw32(decoded 64-hex suffix of root_key_id) || u64be(generation)"
head_field_types = ["u16 exact 2", "ASCII exact actor_trust_head_v2", "ASCII exact ACTIVE", "u64 generation equal manifest generation", "exact RepositoryName", "full tagged manifest commit OID", "exact manifest path", "full tagged manifest Git blob ID", "u64 exact manifest byte count", "64 lowercase hex SHA-256 of exact manifest file bytes", "sha256- plus 64 lowercase hex", "final root signature table"]
head_manifest_reference = "the repository, manifest commit, path, Git blob ID, exact byte count, SHA-256 and artifact kind together equal the full TrustManifestRefV2 locator; no abbreviated ID or moving ref is permitted"
head_signature_preimage = "ASCII ELIOT-SEARCH/LOCAL-PROFILE-ACTOR-TRUST-HEAD/V2 || 0x00 || u16be(2) || raw32(SHA-256(exact head body before [signature])) || raw32(decoded 64-hex suffix of root_key_id) || u64be(generation)"
signature_file_boundary = "as for authority_envelope_v1: exact body prefix through the LF immediately before [signature]; final signature table excluded"
signature_encoding = "signed_payload_sha256 is lowercase 64-hex SHA-256 of exact body; signature_bytes_hex is lowercase hex of exactly 64-byte P1363 r[32]||s[32]"
registration_evidence_ref_type = "BootstrapEvidenceRefV1, not ImmutableRecordRef"
independent_review_ref_type = "BootstrapReviewBindingRefV1, not independent_review_v1 or ImmutableRecordRef"
head_field_order = ["schema_version", "record_kind", "status", "generation", "manifest_repository", "manifest_commit", "manifest_path", "manifest_git_blob_id", "manifest_exact_bytes", "manifest_exact_record_file_sha256", "root_key_id", "signature"]
current_head_locator = "exact repository identity plus one explicitly configured full Git ref under refs/heads/; resolve that ref to a full GitObjectId commit, read swarm/control-trust/v2/actor-trust-head.toml from that exact commit tree, and reject absent, ambiguous, symbolic, non-blob or non-canonical content"
head_currentness = "read exact head from the current bound control-ref commit on every authoritative operation; verify root signature, referenced manifest blob/file SHA, generation, and equality with both explicit expected-root-key-id and fresh active owner-pinned host state; all trust-head transitions use compare-and-swap on the same configured ref with exact old full commit OID"
activation_publish_order = "commit immutable manifest first as a child of the exact old control-ref commit; construct signed head with exact manifest outer locator; create the head-containing commit as a child of the manifest commit; CAS the configured control ref from exact old commit OID directly to the head-containing commit; read back that exact ref and head before reporting publication; lost response is OUTCOME_UNKNOWN until readback"
head_ref_cannot_self_reference_commit = "head names the exact manifest commit/blob/file digest; head does not contain its own containing commit OID; the configured current control ref binds the head-containing commit"
root_generation = "starts at 1 and increases by exactly one; no wall-clock authority"
head_ref = "exact Git ref selected in integration-owned immutable configuration, full name under refs/heads/; no branch aliases, remote-tracking names, symbolic refs or environment fallback"
activation_registration_state = "PROPOSAL_ONLY; both record kinds/statuses remain unregistered and no instance exists"
closed_kind_boundary = "these proposed activation records would require later integration-owned schema/type registration; bootstrap evidence artifacts above remain outside ClosedControlRecordKind"

[retention]
published_artifacts = "append-only and create-only; never rewrite or delete a blob, evidence manifest, review binding, trust manifest or signed head referenced by an active or historical trust-head commit"
local_git_reachability = "the configured trust-head ref and its commit ancestry keep accepted artifacts reachable in this one repository; ref rewrite or repository loss is integrity/availability failure"
backup_and_retention_policy = "REQUIRED_EXTERNAL_INPUT: integration owner must define retention and recovery/backup policy before authoritative use; this proposal adds no remote backup, purge workflow or cross-clone guarantee"
automatic_purge = false

[currentness_and_threat_model]
root_pin_checked_on_every_authoritative_operation = true
root_pin_source = "fresh protected host/launcher current pointer and immutable pin record provisioned by a distinct explicit integration-owner action outside Git"
head_root_must_equal_explicit_caller_pin = true
head_root_must_equal_current_owner_pin = true
head_root_must_equal_manifest_root = true
caller_currentness_duty = "supply --expected-root-key-id on every authoritative operation and require the tool to reread the active protected host/launcher pointer and pin record; if ACL, canonical bytes, pointer generation, root fingerprint or currentness cannot be confirmed under the trusted-host assumption, keep result UNAVAILABLE"
tool_external_channel_claim = "external channel fields are trace metadata only and are not part of the baseline; a separately reviewed stronger profile may add external channel freshness or revocation"
local_head_scope = "one exact repository and bound control ref; no cross-clone or remote-global currentness"
same_user_process_isolation = false
actor_distinction_rule = "distinct exact ActorIdentity strings, distinct root-mapped key IDs and an actual separate reviewer task; never infer distinct humans or OS principals"
hardware = "not required by the localhost baseline; optional separately qualified custody only"
trust_boundary = "a process with the trusted Windows token may reach its account keys and host pin state; signatures prove key use under this host assumption, not process isolation, distinct humans or independent custody"
external_channel_profile = "optional stronger profile and never a substitute for the current local pin check"

[standalone_sequence]
steps = [
  "1. In a distinct explicit owner action outside bootstrap and outside the Git repository, the authorized integration owner provisions or selects the root key, inspects its exact public blob and computed fingerprint, and create-only pins that record in protected host/launcher state with exact ACL and readback. This proposal has no actual root key or host pin state.",
  "2. Every authoritative operation explicitly supplies --expected-root-key-id. The native tool freshly reads the active protected pin pointer and immutable record without path or environment discovery, verifies ACL, canonical bytes, generation and blob digest, and requires exact equality with the caller pin and signed artifacts. Missing, changed, stale or uncertain pin state stays UNAVAILABLE.",
  "3. Under the trusted cooperative localhost assumption, the integration owner explicitly assigns operator/reviewer ActorIdentity and task IDs and exact key-container names; operator and reviewer provisioning actions read back their public keys, then a separate explicit local owner action signs the v1 envelope mapping those exact actor/key pairs and bootstrap-only domains. The envelope retains the existing canonical v1 field order; its authority_channel_id/reference fields are trace metadata, not proof.",
  "4. The operator supplies the exact owner-pinned root ID and envelope; the tool verifies the envelope, candidate profile allowlist and all namespace/actor/key bindings, executes bounded probes and signs PROFILE_EVIDENCE_V1. One Git commit publishes the evidence, exact envelope copy and raw outputs at create-only paths; no control record, ticket or Search process is required.",
  "5. A separate reviewer task resolves the exact evidence ref after its commit exists, verifies all exact profile, definition, root, actor, key and task bindings with the independently identified verifier, and signs INDEPENDENT_REVIEW_BINDING_V1 in a later commit. The reviewer task ID equals evidence.reviewer_task_id and differs from operator_task_id; this does not claim process or human isolation.",
  "6. The local root signer verifies the exact evidence and review refs, then creates the proposed actor_trust_manifest_v2/head_v2 under an explicit owner action; publish create-only artifacts in order, CAS the configured control ref and read it back. Integration-owner acceptance must still register the exact profile instance and qualification, and the later approval-profile definition must adopt the same profile ref, definition digest, evidence/review refs and trust-snapshot/root generation before issuance use.",
]
ticket_dependency = false
package_submission_dependency = false
search_runtime_dependency = false
actual_separate_reviewer_task_required = true

[qualification_plan]
suite_id = "local_profile_bootstrap_v1"
executed = false
all_results = "UNAVAILABLE"
mandatory_probe_ids = [
  "QualifiedProfileRefV1_grammar_and_existing_qualified_opaque_id_consumers_fail_closed",
  "explicit_expected_pin_matches_fresh_owner_pinned_host_state_on_every_operation",
  "host_pin_record_create_only_acl_exact_readback_currentness_and_fail_closed_rotation",
  "root_authority_envelope_exact_preimage_signature_and_mutation_rejection",
  "envelope_project_namespace_mismatch_rejected",
  "evidence_candidate_profile_not_listed_in_root_envelope_rejected",
  "evidence_review_activation_cross_profile_substitution_rejected",
  "profile_definition_digest_mismatch_across_evidence_review_activation_rejected",
  "operator_reviewer_actor_key_container_or_public_blob_substitution_rejected",
  "operator_reviewer_task_substitution_or_equal_tasks_rejected",
  "review_profile_ref_or_evidence_ref_substitution_rejected",
  "activation_evidence_or_review_ref_substitution_rejected",
  "current_user_key_create_only_and_exact_public_blob_readback",
  "export_policy_readback_and_private_export_denial",
  "CNG_P1363_sign_verify_matches_separately_built_verifier",
  "signature_domain_actor_profile_and_payload_mutations_reject_without_fallback",
  "exact_git_content_addressed_blob_and_outer_immutable_locator_readback",
  "trust_head_owner_pin_manifest_generation_and_same_ref_CAS_currentness",
  "actual_separate_reviewer_task_binds_exact_evidence_and_raw_outcome",
  "same_user_processes_can_reach_account_keys_and_no_isolation_claim_is_emitted",
  "missing_mismatched_stale_or_disabled_host_pin_stays_UNAVAILABLE",
  "bootstrap_evidence_and_review_complete_without_ticket_submission_or_search_runtime",
  "signature_trailer_and_own_digest_excluded_from_signed_payload_preimage",
  "binary_TLV_order_bounds_and_trailing_bytes_rejected",
]
pass_rule = "every mandatory probe has exact immutable raw input/output, the separate reviewer accepts the exact cross-bound refs under the current owner-pinned host state, and the integration owner accepts the profile; no prose-only or inferred PASS"
no_pass_created = true

[required_external_inputs]
items = [
  "the actual root public BCRYPT_ECCPUBLIC_BLOB and exact fingerprint, after future explicit integration-owner provisioning, inspection and pinning; no key or pin exists in this proposal",
  "the exact protected host/launcher state path and ACL configuration, current pin pointer/record readback, and configured owner action; no host state is created here",
  "root-signed authority envelope mapping exact operator/reviewer ActorIdentity values, public keys and allowed bootstrap domains",
  "actual repository identity, object format, Git executable identity, control-ref name and native Rust/CNG runtime hashes",
  "actual operator and reviewer current-user key material created by a future provisioning run; no keys are generated by this proposal",
  "separately built independent verifier executable identity and SHA-256",
  "integration-owned acceptance of QualifiedOpaqueId grammar, bootstrap artifact schema, actor_trust_manifest_v2/head_v2 and profile instance/qualification refs",
  "actual raw outcomes and independent review binding; all remain UNAVAILABLE",
  "the exact operator/reviewer task assignments, accepted profile definition digest, and separately reviewed local root rotation procedure before any root change",
  "an authenticated external authority channel only if an optional stronger profile is selected; it is not a standalone-baseline prerequisite",
]

# Machine-readable package status matrix.
# `source = "present"` records source presence only; it is not integration, qualification, or enablement.
#
# `disposition` values:
# - active: selected implementation/package boundary;
# - legacy_profile: substantive source exists but a selected replacement owns future semantics;
# - optional_disabled: optional source/profile exists but is not publicly enabled;
# - evaluation_only: evaluation/evidence package, never product authority;
# - tooling_only: developer/qualification tooling, never product startup authority.


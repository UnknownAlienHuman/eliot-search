capability_descriptor_is_binding_filtered = true
capability_availability_grants_authority = false
client_requested_scope_is_authority = false
provider_result_contains_client_disposition = false
raw_qdrant_or_redb_access_from_clients = false
reverse_write_channel = false
handle_possession_grants_access = false
handle_expansion_reauthorizes_live_state = true
unsaved_research_export_allowed = false
ordinary_export_transfers_ownership = false
new_core_recipe_allowed = false

[optional_profiles]

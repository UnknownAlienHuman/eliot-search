required_files = [
  "README.md",
  "W8_GENERIC_CLIENT_EDGE_CONTRACTS_1.0.md",
  "manifest.toml",
]

[[owner]]
package = "search-provider-protocol"
function_contract = "crates/search-provider-protocol/FUNCTIONS.md"
hardening_contract = "crates/search-provider-protocol/W8_HARDENING.md"
owns = [
  "local_frame_and_session",
  "pairing_and_binding_lifecycle",
  "request_progress_terminal_state",
  "binding_filtered_capability_descriptor",
]

[[owner]]
package = "eliot-searchd"
integration_contract = "bins/eliot-searchd/W8_INTEGRATION.md"
owns = [
  "generic_edge_composition",
  "authoritative_capability_snapshot_inputs",
  "server_side_standalone_grant_minting",
  "optional_profile_feature_and_gate_activation",
]

[[owner]]
package = "eliot-search"
function_contract = "bins/eliot-search/FUNCTIONS.md"
client_contract = "bins/eliot-search/W8_CLIENT.md"
owns = [
  "standalone_cli_argument_mapping",
  "local_endpoint_and_pairing_client",
  "protocol_session_and_capability_consumption",
  "truthful_progress_terminal_rendering",
  "explicit_exit_status",
]

[[owner]]
package = "search-eliot-adapter"
function_contract = "crates/search-eliot-adapter/FUNCTIONS.md"
optional = true
enabled_by_default = false
owns = [
  "eliot_scope_view_fence_mapping",
  "generic_result_to_eliot_provider_result_mapping",
  "reverse_authority_guard",
]

[[owner]]
package = "search-research-export-adapter"
function_contract = "crates/search-research-export-adapter/FUNCTIONS.md"
optional = true
enabled_by_default = false
owns = [
  "eliotr_normalized_v1_manifest",
  "retained_native_readback_and_wire_sha256",
  "ownership_mode_and_cutover_receipt_validation",
  "bounded_bundle_assembly",
]


name: Temporary P00 bootstrap verification

on:
  push:
    branches:
      - chore/45-p00-integration-bootstrap

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Report exact toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Validate integration bootstrap
        shell: pwsh
        run: |
          python -m py_compile tools/validate-integration-bootstrap.py qualification/integration-bootstrap/test_integration_bootstrap_v1.py
          python qualification/integration-bootstrap/test_integration_bootstrap_v1.py
          ./tools/validate-integration-bootstrap.ps1 -Json

      - name: Verify Cargo lockfile reproducibility
        shell: pwsh
        run: |
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Verify Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo doc --workspace --no-deps --locked

      - name: Verify clean checkout
        shell: pwsh
        run: git diff --exit-code

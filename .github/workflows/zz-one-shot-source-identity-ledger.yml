name: one-shot make source identity operations atomic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-source-identity-ledger.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-source-identity-ledger
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Replace digest-only operation map with typed terminal outcomes
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee source-identity-ledger-patch.log
          from pathlib import Path

          path = Path('crates/search-source/search-source-identity/src/lib.rs')
          text = path.read_text()

          catalog_anchor = '''/// Finite deterministic source identity catalog.
          #[derive(Clone, Debug)]
          pub struct SourceIdentityCatalog {'''
          operation_types = '''#[derive(Clone, Debug, Eq, PartialEq)]
          enum IdentityOperationOutcome {
              Registered(SourceIdentityRecord),
              PathRebound(IdentityMutationReceipt),
              ContentObserved(IdentityMutationReceipt),
              RootRelocated(RootRelocationReceipt),
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          struct IdentityOperationRecord {
              operation: MutationIdentity,
              request_digest: Blake3Digest32,
              outcome: IdentityOperationOutcome,
          }

          /// Finite deterministic source identity catalog.
          #[derive(Clone, Debug)]
          pub struct SourceIdentityCatalog {'''
          if 'enum IdentityOperationOutcome {' not in text:
              if catalog_anchor not in text:
                  raise SystemExit('SourceIdentityCatalog anchor missing')
              text = text.replace(catalog_anchor, operation_types, 1)

          field_old = '    operations: BTreeMap<search_contracts::OpaqueId, Blake3Digest32>,\n'
          field_new = '    operations: BTreeMap<search_contracts::OpaqueId, IdentityOperationRecord>,\n'
          if field_old in text:
              text = text.replace(field_old, field_new, 1)
          elif field_new not in text:
              raise SystemExit('source identity operation map anchor missing')

          register_start = text.index('    /// Registers one externally allocated source identity.')
          register_end = text.index('\n    /// Rebinds a source to an exact new path while retaining source identity.', register_start)
          register_replacement = '''    /// Registers one externally allocated source identity.
              pub fn register_new(
                  &mut self,
                  source_id: SourceId,
                  candidate: NewSourceCandidate,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<SourceIdentityRecord, IdentityError> {
                  if let Some(outcome) = self.replay_operation(&operation, request_digest)? {
                      return match outcome {
                          IdentityOperationOutcome::Registered(record) => Ok(record.clone()),
                          IdentityOperationOutcome::PathRebound(_)
                          | IdentityOperationOutcome::ContentObserved(_)
                          | IdentityOperationOutcome::RootRelocated(_) => {
                              Err(IdentityError::OperationReplayMismatch)
                          }
                      };
                  }
                  self.ensure_operation_capacity()?;
                  if self.by_source.contains_key(&source_id) {
                      return Err(IdentityError::SourceIdCollision);
                  }
                  if self.by_stable_key.contains_key(&candidate.stable_key) {
                      return Err(IdentityError::StableIdentityCollision);
                  }
                  if let Some(path) = candidate.path_binding {
                      if self.by_path_binding.contains_key(&path.path_binding_id) {
                          return Err(IdentityError::PathBindingCollision);
                      }
                  }
                  if self.by_source.len() >= self.max_sources {
                      return Err(IdentityError::SourceCapacityExceeded);
                  }
                  let record = SourceIdentityRecord {
                      source_id,
                      stable_key: candidate.stable_key,
                      root_binding: candidate.root_binding,
                      path_binding: candidate.path_binding,
                      content_observation: None,
                      record_revision: NonZeroRevision::new(1)
                          .map_err(|_| IdentityError::ContractExhausted)?,
                  };
                  self.by_stable_key.insert(record.stable_key, source_id);
                  if let Some(path) = record.path_binding {
                      self.by_path_binding.insert(path.path_binding_id, source_id);
                  }
                  self.by_source.insert(source_id, record.clone());
                  self.commit_operation(
                      operation,
                      request_digest,
                      IdentityOperationOutcome::Registered(record.clone()),
                  );
                  Ok(record)
              }
          '''
          text = text[:register_start] + register_replacement + text[register_end:]

          rebind_start = text.index('    /// Rebinds a source to an exact new path while retaining source identity.')
          rebind_end = text.index('\n    /// Records a new content observation without changing source/path identity.', rebind_start)
          rebind_replacement = '''    /// Rebinds a source to an exact new path while retaining source identity.
              pub fn rebind_path(
                  &mut self,
                  source_id: SourceId,
                  expected_stable_key: StableSourceKey,
                  expected_record_revision: NonZeroRevision,
                  new_path: PathBinding,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
                  readback_receipt: ReceiptRef,
              ) -> Result<IdentityMutationReceipt, IdentityError> {
                  if let Some(outcome) = self.replay_operation(&operation, request_digest)? {
                      return match outcome {
                          IdentityOperationOutcome::PathRebound(receipt) => Ok(receipt.clone()),
                          IdentityOperationOutcome::Registered(_)
                          | IdentityOperationOutcome::ContentObserved(_)
                          | IdentityOperationOutcome::RootRelocated(_) => {
                              Err(IdentityError::OperationReplayMismatch)
                          }
                      };
                  }
                  self.ensure_operation_capacity()?;
                  if self
                      .by_path_binding
                      .get(&new_path.path_binding_id)
                      .is_some_and(|existing| *existing != source_id)
                  {
                      return Err(IdentityError::PathBindingCollision);
                  }
                  let current = self
                      .by_source
                      .get(&source_id)
                      .cloned()
                      .ok_or(IdentityError::NotFound)?;
                  if current.stable_key != expected_stable_key {
                      return Err(IdentityError::StableIdentityMismatch);
                  }
                  if current.record_revision != expected_record_revision {
                      return Err(IdentityError::RevisionConflict);
                  }
                  let expected_path_revision = match current.path_binding {
                      Some(path) => path
                          .revision
                          .checked_next()
                          .map_err(|_| IdentityError::ContractExhausted)?,
                      None => NonZeroRevision::new(1)
                          .map_err(|_| IdentityError::ContractExhausted)?,
                  };
                  if new_path.revision != expected_path_revision {
                      return Err(IdentityError::RevisionConflict);
                  }
                  let next_record_revision = current
                      .record_revision
                      .checked_next()
                      .map_err(|_| IdentityError::ContractExhausted)?;
                  let updated = SourceIdentityRecord {
                      path_binding: Some(new_path),
                      record_revision: next_record_revision,
                      ..current.clone()
                  };
                  let receipt = IdentityMutationReceipt {
                      source_id,
                      record_revision: next_record_revision,
                      operation: operation.clone(),
                      readback_receipt,
                  };

                  if let Some(old) = current.path_binding {
                      self.by_path_binding.remove(&old.path_binding_id);
                  }
                  self.by_path_binding
                      .insert(new_path.path_binding_id, source_id);
                  self.by_source.insert(source_id, updated);
                  self.commit_operation(
                      operation,
                      request_digest,
                      IdentityOperationOutcome::PathRebound(receipt.clone()),
                  );
                  Ok(receipt)
              }
          '''
          text = text[:rebind_start] + rebind_replacement + text[rebind_end:]

          observe_start = text.index('    /// Records a new content observation without changing source/path identity.')
          observe_end = text.index('\n    /// Relocates the physical root while preserving logical source identity.', observe_start)
          observe_replacement = '''    /// Records a new content observation without changing source/path identity.
              pub fn observe_content(
                  &mut self,
                  source_id: SourceId,
                  observation: ContentObservation,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<IdentityMutationReceipt, IdentityError> {
                  if let Some(outcome) = self.replay_operation(&operation, request_digest)? {
                      return match outcome {
                          IdentityOperationOutcome::ContentObserved(receipt) => {
                              Ok(receipt.clone())
                          }
                          IdentityOperationOutcome::Registered(_)
                          | IdentityOperationOutcome::PathRebound(_)
                          | IdentityOperationOutcome::RootRelocated(_) => {
                              Err(IdentityError::OperationReplayMismatch)
                          }
                      };
                  }
                  self.ensure_operation_capacity()?;
                  let current = self
                      .by_source
                      .get(&source_id)
                      .cloned()
                      .ok_or(IdentityError::NotFound)?;
                  let expected_observation_revision = match current.content_observation {
                      Some(value) => value
                          .revision
                          .checked_next()
                          .map_err(|_| IdentityError::ContractExhausted)?,
                      None => NonZeroRevision::new(1)
                          .map_err(|_| IdentityError::ContractExhausted)?,
                  };
                  if observation.revision != expected_observation_revision {
                      return Err(IdentityError::RevisionConflict);
                  }
                  let next_record_revision = current
                      .record_revision
                      .checked_next()
                      .map_err(|_| IdentityError::ContractExhausted)?;
                  let updated = SourceIdentityRecord {
                      content_observation: Some(observation),
                      record_revision: next_record_revision,
                      ..current
                  };
                  let receipt = IdentityMutationReceipt {
                      source_id,
                      record_revision: next_record_revision,
                      operation: operation.clone(),
                      readback_receipt: observation.receipt,
                  };
                  self.by_source.insert(source_id, updated);
                  self.commit_operation(
                      operation,
                      request_digest,
                      IdentityOperationOutcome::ContentObserved(receipt.clone()),
                  );
                  Ok(receipt)
              }
          '''
          text = text[:observe_start] + observe_replacement + text[observe_end:]

          relocate_start = text.index('    /// Relocates the physical root while preserving logical source identity.')
          relocate_end = text.index('\n    fn register_operation(', relocate_start)
          relocate_replacement = '''    /// Relocates the physical root while preserving logical source identity.
              pub fn relocate_root(
                  &mut self,
                  source_id: SourceId,
                  authorization: RootRelocationAuthorization,
                  observed_new_binding: RootBinding,
                  readback_receipt: ReceiptRef,
              ) -> Result<RootRelocationReceipt, IdentityError> {
                  if let Some(outcome) = self.replay_operation(
                      &authorization.operation,
                      authorization.request_digest,
                  )? {
                      return match outcome {
                          IdentityOperationOutcome::RootRelocated(receipt) => {
                              Ok(receipt.clone())
                          }
                          IdentityOperationOutcome::Registered(_)
                          | IdentityOperationOutcome::PathRebound(_)
                          | IdentityOperationOutcome::ContentObserved(_) => {
                              Err(IdentityError::OperationReplayMismatch)
                          }
                      };
                  }
                  self.ensure_operation_capacity()?;
                  let current = self
                      .by_source
                      .get(&source_id)
                      .cloned()
                      .ok_or(IdentityError::NotFound)?;
                  if current.root_binding.logical_root_binding_id
                      != authorization.logical_root_binding_id
                      || current.root_binding.revision
                          != authorization.expected_revision
                      || current.root_binding.physical_root_digest
                          != authorization.old_physical_root_digest
                  {
                      return Err(IdentityError::RootBindingMismatch);
                  }
                  let expected_revision = current
                      .root_binding
                      .revision
                      .checked_next()
                      .map_err(|_| IdentityError::ContractExhausted)?;
                  if observed_new_binding.logical_root_binding_id
                      != authorization.logical_root_binding_id
                      || observed_new_binding.physical_root_digest
                          != authorization.new_physical_root_digest
                      || observed_new_binding.revision != expected_revision
                  {
                      return Err(IdentityError::RelocationReadbackMismatch);
                  }
                  let next_record_revision = current
                      .record_revision
                      .checked_next()
                      .map_err(|_| IdentityError::ContractExhausted)?;
                  let updated = SourceIdentityRecord {
                      root_binding: observed_new_binding,
                      record_revision: next_record_revision,
                      ..current
                  };
                  let receipt = RootRelocationReceipt {
                      source_id,
                      logical_root_binding_id: authorization.logical_root_binding_id,
                      new_revision: expected_revision,
                      new_physical_root_digest: authorization.new_physical_root_digest,
                      operation: authorization.operation.clone(),
                      authorization_receipt: authorization.authorization_receipt,
                      readback_receipt,
                  };
                  self.by_source.insert(source_id, updated);
                  self.commit_operation(
                      authorization.operation,
                      authorization.request_digest,
                      IdentityOperationOutcome::RootRelocated(receipt.clone()),
                  );
                  Ok(receipt)
              }

              fn replay_operation(
                  &self,
                  operation: &MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<Option<&IdentityOperationOutcome>, IdentityError> {
                  let Some(existing) = self.operations.get(&operation.operation_id) else {
                      return Ok(None);
                  };
                  if existing.operation != *operation
                      || existing.request_digest != request_digest
                  {
                      return Err(IdentityError::OperationConflict);
                  }
                  Ok(Some(&existing.outcome))
              }

              fn ensure_operation_capacity(&self) -> Result<(), IdentityError> {
                  if self.operations.len() >= self.max_operations {
                      Err(IdentityError::OperationCapacityExceeded)
                  } else {
                      Ok(())
                  }
              }

              fn commit_operation(
                  &mut self,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
                  outcome: IdentityOperationOutcome,
              ) {
                  self.operations.insert(
                      operation.operation_id.clone(),
                      IdentityOperationRecord {
                          operation,
                          request_digest,
                          outcome,
                      },
                  );
              }
          '''
          text = text[:relocate_start] + relocate_replacement + text[relocate_end:]

          old_helper_start = text.find('    fn register_operation(', text.index('fn commit_operation'))
          if old_helper_start != -1:
              old_helper_end = text.index('\n}\n\nimpl Default for SourceIdentityCatalog', old_helper_start)
              text = text[:old_helper_start] + text[old_helper_end:]

          error_anchor = '''    /// Operation identity was reused with another request digest.
              OperationConflict,
              /// Finite operation capacity is exhausted.'''
          error_replacement = '''    /// Operation identity was reused with another request digest or identity.
              OperationConflict,
              /// Exact operation replay was attempted through another mutation kind.
              OperationReplayMismatch,
              /// Finite operation capacity is exhausted.'''
          if 'OperationReplayMismatch,' not in text:
              if error_anchor not in text:
                  raise SystemExit('IdentityError operation anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::OperationConflict => "SOURCE_IDENTITY_OPERATION_CONFLICT",
                      Self::OperationCapacityExceeded => "SOURCE_IDENTITY_OPERATION_CAPACITY",'''
          code_replacement = '''            Self::OperationConflict => "SOURCE_IDENTITY_OPERATION_CONFLICT",
                      Self::OperationReplayMismatch => {
                          "SOURCE_IDENTITY_OPERATION_REPLAY_MISMATCH"
                      }
                      Self::OperationCapacityExceeded => "SOURCE_IDENTITY_OPERATION_CAPACITY",'''
          if 'SOURCE_IDENTITY_OPERATION_REPLAY_MISMATCH' not in text:
              if code_anchor not in text:
                  raise SystemExit('IdentityError operation code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-source/search-source-identity/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Atomic typed operation ledger

          Source-identity operations enter the ledger only after their complete
          state mutation succeeds. The ledger retains the full immutable
          `MutationIdentity`, request digest, mutation kind, and terminal
          record/receipt. Exact replay returns that original outcome; replaying
          the same operation through another mutation kind is rejected.
          '''
          if '## Atomic typed operation ledger' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify identity operation atomicity and replay
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-source-identity --all-targets --locked
            cargo test -p search-source-identity --all-targets --locked
            cargo clippy -p search-source-identity --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'enum IdentityOperationOutcome' crates/search-source/search-source-identity/src/lib.rs
            grep -q 'fn replay_operation' crates/search-source/search-source-identity/src/lib.rs
            if grep -q 'fn register_operation' crates/search-source/search-source-identity/src/lib.rs; then
              echo 'eager digest-only operation registration remains'
              exit 1
            fi
            git diff --check
          } 2>&1 | tee source-identity-ledger-verify.log

      - name: Commit verified ledger repair or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-source-identity-ledger.yml
          mkdir -p qualification/source-identity
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/source-identity/LAST_FAILURE.txt
            cat > qualification/source-identity/OPERATION_LEDGER_VERIFIED.md <<EOF
          # Source identity operation ledger

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Rejected mutations no longer consume operation IDs. Successful
          operations retain typed terminal outcomes, and exact replay returns the
          original record or receipt without reapplying state.
          EOF
            git add -A
            subject="fix(source-identity): make operation ledger atomic and typed"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-source-identity-ledger.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 500 source-identity-ledger-patch.log 2>/dev/null || true
              tail -n 900 source-identity-ledger-verify.log 2>/dev/null || true
            } > qualification/source-identity/LAST_FAILURE.txt
            git add -A
            subject="verify(source-identity): record failed typed-ledger repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

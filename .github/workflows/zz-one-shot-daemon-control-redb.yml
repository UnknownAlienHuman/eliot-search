name: one-shot wire persistent control redb into daemon

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-daemon-control-redb.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-daemon-control-redb
  cancel-in-progress: false

jobs:
  integrate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require clean dual-platform baseline
        shell: bash
        run: |
          test -f qualification/CURRENT_STATUS.md
          test ! -f qualification/CURRENT_FAILURES.txt
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            echo 'unresolved qualification failure marker exists'
            find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print
            exit 1
          fi

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Apply daemon control-store integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest_path = Path('bins/eliot-searchd/Cargo.toml')
          manifest = manifest_path.read_text()
          if '[dependencies]' not in manifest:
              manifest += '\n[dependencies]\n'
          for dependency in (
              'search-contracts.workspace = true',
              'search-control-redb.workspace = true',
          ):
              if dependency not in manifest:
                  start = manifest.index('[dependencies]') + len('[dependencies]')
                  end = manifest.find('\n[', start)
                  if end == -1:
                      end = len(manifest)
                  manifest = manifest[:end] + '\n' + dependency + manifest[end:]
          manifest_path.write_text(manifest)

          path = Path('bins/eliot-searchd/src/main.rs')
          text = path.read_text()

          if 'use search_control_redb::{' not in text:
              anchor = 'use std::time::{Duration, SystemTime, UNIX_EPOCH};\n'
              imports = '''use std::time::{Duration, SystemTime, UNIX_EPOCH};

          use search_contracts::OpaqueId;
          use search_control_redb::{
              BackendSnapshot, ControlBackend, ControlOperationKeyEncoder, RedbBackendError,
              RedbControlBackend, SchemaVersion,
          };
          '''
              if anchor not in text:
                  raise SystemExit('daemon std import anchor missing')
              text = text.replace(anchor, imports, 1)

          if 'const CONTROL_SCHEMA_VERSION:' not in text:
              anchor = 'const VERSION: &str = env!("CARGO_PKG_VERSION");\n'
              replacement = anchor + 'const CONTROL_SCHEMA_VERSION: u32 = 1;\n'
              if anchor not in text:
                  raise SystemExit('daemon VERSION anchor missing')
              text = text.replace(anchor, replacement, 1)

          if 'struct DaemonOperationKeyEncoder;' not in text:
              anchor = '\nstruct RuntimeState {\n'
              helper = '''
          #[derive(Clone, Copy, Debug, Default)]
          struct DaemonOperationKeyEncoder;

          impl ControlOperationKeyEncoder for DaemonOperationKeyEncoder {
              fn encode_operation_key(
                  &self,
                  _operation_id: &OpaqueId,
              ) -> Result<Vec<u8>, RedbBackendError> {
                  Err(RedbBackendError::InvalidOperationKey)
              }
          }

          type DaemonControlStore = RedbControlBackend<DaemonOperationKeyEncoder>;

          fn open_control_store(path: &Path) -> Result<DaemonControlStore, DaemonError> {
              reject_symlink(path)?;
              let schema = SchemaVersion::new(CONTROL_SCHEMA_VERSION)
                  .map_err(DaemonError::ControlContract)?;
              if path.exists() {
                  RedbControlBackend::open(path, schema, DaemonOperationKeyEncoder)
                      .map_err(DaemonError::ControlStore)
              } else {
                  RedbControlBackend::create(path, schema, DaemonOperationKeyEncoder)
                      .map_err(DaemonError::ControlStore)
              }
          }

          fn load_control_snapshot(
              store: &DaemonControlStore,
          ) -> Result<BackendSnapshot, DaemonError> {
              store
                  .load_snapshot()
                  .map_err(DaemonError::ControlStore)
          }
          '''
              if anchor not in text:
                  raise SystemExit('RuntimeState anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          runtime_start = text.index('struct RuntimeState {')
          runtime_end = text.index('\n}\n\nimpl RuntimeState', runtime_start)
          runtime_block = text[runtime_start:runtime_end]
          if 'control_store: Option<DaemonControlStore>' not in runtime_block:
              runtime_block = runtime_block.replace(
                  '    endpoint_published: bool,',
                  '    endpoint_published: bool,\n    control_store: Option<DaemonControlStore>,',
                  1,
              )
              text = text[:runtime_start] + runtime_block + text[runtime_end:]

          acquire_start = text.index('    fn acquire(options: &ServeOptions)')
          acquire_end = text.index('\n    fn publish_endpoint(', acquire_start)
          acquire = text[acquire_start:acquire_end]
          if 'let control_path = options.state_dir.join("control.redb");' not in acquire:
              endpoint_anchor = '        let endpoint_path = options.state_dir.join("endpoint.txt");\n'
              endpoint_replacement = endpoint_anchor + '        let control_path = options.state_dir.join("control.redb");\n'
              if endpoint_anchor not in acquire:
                  raise SystemExit('RuntimeState control path anchor missing')
              acquire = acquire.replace(endpoint_anchor, endpoint_replacement, 1)
              reject_anchor = '        reject_symlink(&endpoint_path)?;\n'
              reject_replacement = reject_anchor + '        reject_symlink(&control_path)?;\n'
              if reject_anchor not in acquire:
                  raise SystemExit('RuntimeState reject path anchor missing')
              acquire = acquire.replace(reject_anchor, reject_replacement, 1)

          if 'let control_store = match open_control_store(&control_path)' not in acquire:
              ok_index = acquire.rfind('        Ok(Self {')
              if ok_index == -1:
                  raise SystemExit('RuntimeState initializer anchor missing')
              setup = '''        let control_store = match open_control_store(&control_path) {
                  Ok(store) => store,
                  Err(error) => {
                      let _ = owner.unlock();
                      drop(owner);
                      let _ = fs::remove_file(&owner_path);
                      return Err(error);
                  }
              };
              load_control_snapshot(&control_store)?;

          '''
              acquire = acquire[:ok_index] + setup + acquire[ok_index:]

          if 'control_store: Some(control_store),' not in acquire:
              initializer_anchor = '            endpoint_published: false,\n'
              initializer_replacement = initializer_anchor + '            control_store: Some(control_store),\n'
              if initializer_anchor not in acquire:
                  raise SystemExit('RuntimeState control field initializer anchor missing')
              acquire = acquire.replace(initializer_anchor, initializer_replacement, 1)

          text = text[:acquire_start] + acquire + text[acquire_end:]

          if 'fn control_revision(&self)' not in text:
              publish_anchor = '    fn publish_endpoint(\n'
              method = '''    fn control_revision(&self) -> Result<u64, DaemonError> {
                  let store = self
                      .control_store
                      .as_ref()
                      .ok_or(DaemonError::ControlStoreUnavailable)?;
                  Ok(load_control_snapshot(store)?.revision)
              }

          '''
              index = text.index(publish_anchor, text.index('impl RuntimeState'))
              text = text[:index] + method + text[index:]

          serve_start = text.index('fn serve(options: ServeOptions)')
          serve_end = text.index('\n#[derive(Clone, Debug, Eq, Ord, PartialEq, PartialOrd)]', serve_start)
          serve = text[serve_start:serve_end]
          if 'let control_revision = state.control_revision()?;' not in serve:
              anchor = '    let mut state = RuntimeState::acquire(&options)?;\n'
              replacement = anchor + '    let control_revision = state.control_revision()?;\n'
              if anchor not in serve:
                  raise SystemExit('serve RuntimeState anchor missing')
              serve = serve.replace(anchor, replacement, 1)
          serve = serve.replace(
              'indexed_available=false version={VERSION}",',
              'indexed_available=false control_revision={control_revision} version={VERSION}",',
          )
          old_listener = '    let outcome = serve_listener(&listener, &token, &source_roots);'
          new_listener = '    let outcome = serve_listener(&listener, &token, &source_roots, control_revision);'
          if old_listener in serve:
              serve = serve.replace(old_listener, new_listener, 1)
          elif new_listener not in serve:
              raise SystemExit('serve_listener invocation anchor missing')
          text = text[:serve_start] + serve + text[serve_end:]

          # Thread control revision through listener, connection, and dispatch.
          text = text.replace(
              '''fn serve_listener(
              listener: &TcpListener,
              token: &[u8],
              source_roots: &[SourceRoot],
          ) -> Result<(), DaemonError> {''',
              '''fn serve_listener(
              listener: &TcpListener,
              token: &[u8],
              source_roots: &[SourceRoot],
              control_revision: u64,
          ) -> Result<(), DaemonError> {''',
          )
          text = text.replace(
              'handle_connection(&mut stream, token, source_roots)?',
              'handle_connection(&mut stream, token, source_roots, control_revision)?',
          )
          text = text.replace(
              '''fn handle_connection(
              stream: &mut TcpStream,
              token: &[u8],
              source_roots: &[SourceRoot],
          ) -> Result<bool, DaemonError> {''',
              '''fn handle_connection(
              stream: &mut TcpStream,
              token: &[u8],
              source_roots: &[SourceRoot],
              control_revision: u64,
          ) -> Result<bool, DaemonError> {''',
          )
          text = text.replace(
              'let response = dispatch(request, token, source_roots);',
              'let response = dispatch(request, token, source_roots, control_revision);',
          )
          text = text.replace(
              'fn dispatch(request: &str, expected_token: &[u8], source_roots: &[SourceRoot]) -> DaemonResponse {',
              '''fn dispatch(
              request: &str,
              expected_token: &[u8],
              source_roots: &[SourceRoot],
              control_revision: u64,
          ) -> DaemonResponse {''',
          )

          text = text.replace(
              '"OK HEALTH state=ready direct_available={} indexed_available=false",',
              '"OK HEALTH state=ready direct_available={} indexed_available=false control_revision={control_revision}",',
          )
          text = text.replace(
              '"OK STATUS lifecycle=ready profile=DIRECT_DEV roots={} direct_available={} indexed_available=false",',
              '"OK STATUS lifecycle=ready profile=DIRECT_DEV roots={} direct_available={} indexed_available=false control_revision={control_revision}",',
          )

          # Existing self-test listener does not open RuntimeState; revision zero is explicit test-only state.
          text = re.sub(
              r'serve_listener\(&listener, &server_token, &server_roots\)',
              'serve_listener(&listener, &server_token, &server_roots, 0)',
              text,
          )

          drop_start = text.index('impl Drop for RuntimeState {')
          drop_end = text.index('\n}\n\n#[derive(Clone, Debug, Eq, PartialEq)]', drop_start)
          drop_block = text[drop_start:drop_end]
          if 'self.control_store.take()' not in drop_block:
              unlock_anchor = '        if let Some(owner_file) = self.owner_file.take() {\n'
              store_drop = '''        if let Some(control_store) = self.control_store.take() {
                  drop(control_store);
              }
          '''
              if unlock_anchor not in drop_block:
                  raise SystemExit('RuntimeState owner unlock anchor missing')
              drop_block = drop_block.replace(unlock_anchor, store_drop + unlock_anchor, 1)
              text = text[:drop_start] + drop_block + text[drop_end:]

          error_enum_start = text.index('enum DaemonError {')
          error_enum_end = text.index('\n}\n\nimpl DaemonError', error_enum_start)
          error_enum = text[error_enum_start:error_enum_end]
          if 'ControlStore(RedbBackendError)' not in error_enum:
              error_enum = error_enum.replace(
                  '    ResponseTooLarge,',
                  '''    ResponseTooLarge,
              ControlStoreUnavailable,
              ControlContract(search_control_redb::ControlError),
              ControlStore(RedbBackendError),''',
                  1,
              )
              text = text[:error_enum_start] + error_enum + text[error_enum_end:]

          exit_start = text.index('    const fn exit_code(&self) -> u8 {')
          exit_end = text.index('\n    }\n}\n\nimpl std::fmt::Display for DaemonError', exit_start)
          exit_block = text[exit_start:exit_end]
          if 'Self::ControlStoreUnavailable' not in exit_block:
              anchor = '            | Self::ResponseTooLarge => 4,'
              replacement = '''            | Self::ResponseTooLarge
                      | Self::ControlStoreUnavailable
                      | Self::ControlContract(_)
                      | Self::ControlStore(_) => 4,'''
              if anchor not in exit_block:
                  raise SystemExit('DaemonError exit-code anchor missing')
              exit_block = exit_block.replace(anchor, replacement, 1)
              text = text[:exit_start] + exit_block + text[exit_end:]

          display_start = text.index('impl std::fmt::Display for DaemonError {')
          display_end = text.index('\n}\n\nimpl std::error::Error for DaemonError', display_start)
          display = text[display_start:display_end]
          if 'Self::ControlStore(error)' not in display:
              anchor = '            Self::ResponseTooLarge => formatter.write_str("bounded daemon response is too large"),\n'
              replacement = anchor + '''            Self::ControlStoreUnavailable => {
                          formatter.write_str("persistent control store is unavailable")
                      }
                      Self::ControlContract(error) => {
                          write!(formatter, "control contract failure: {error}")
                      }
                      Self::ControlStore(error) => {
                          write!(formatter, "persistent control store failure: {error}")
                      }
          '''
              if anchor not in display:
                  raise SystemExit('DaemonError display anchor missing')
              display = display.replace(anchor, replacement, 1)
              text = text[:display_start] + display + text[display_end:]

          if 'control_store_creates_and_reopens_schema' not in text:
              tests = r'''

          #[cfg(test)]
          mod control_store_tests {
              use std::fs;
              use std::time::{SystemTime, UNIX_EPOCH};

              use super::{load_control_snapshot, open_control_store};

              #[test]
              fn control_store_creates_and_reopens_schema() {
                  let unique = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .expect("system time")
                      .as_nanos();
                  let directory = std::env::temp_dir().join(format!(
                      "eliot-searchd-control-{}-{unique}",
                      std::process::id()
                  ));
                  fs::create_dir_all(&directory).expect("create control test directory");
                  let path = directory.join("control.redb");

                  let store = open_control_store(&path).expect("create control database");
                  let first = load_control_snapshot(&store).expect("initial snapshot");
                  assert_eq!(first.revision, 0);
                  assert!(first.records.is_empty());
                  drop(store);
                  assert!(path.is_file());

                  let reopened = open_control_store(&path).expect("reopen control database");
                  let second = load_control_snapshot(&reopened).expect("reopened snapshot");
                  assert_eq!(second.schema_version, first.schema_version);
                  assert_eq!(second.revision, first.revision);
                  assert_eq!(second.records, first.records);
                  drop(reopened);
                  fs::remove_dir_all(directory).expect("remove control test directory");
              }
          }
          '''
              text += tests

          path.write_text(text)

          docs_path = Path('docs/QUICKSTART.md')
          docs = docs_path.read_text()
          if '- `control.redb`' not in docs:
              anchor = '- `owner.lock` — exclusive live-owner marker;\n'
              replacement = anchor + '- `control.redb` — persistent versioned control database;\n'
              if anchor in docs:
                  docs = docs.replace(anchor, replacement, 1)
              else:
                  docs += '\n- `control.redb` — persistent versioned control database.\n'
          if 'control_revision' not in docs:
              docs += '''

          ## Persistent control store

          Every daemon start opens or creates `control.redb` under the owned state
          directory and verifies schema version `1` before publishing readiness.
          `health` and `status` include the authoritative control revision. The
          database remains open until shutdown and is closed before the runtime
          owner lock is released. The current daemon integration validates and
          retains the control database; lifecycle mutation records are added by
          the next composition stage.
          '''
          docs_path.write_text(docs)
          PY
          cargo fmt --all

      - name: Verify persistent daemon control integration
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo check -p eliot-searchd --all-targets --locked
          cargo test -p eliot-searchd --all-targets --locked
          cargo clippy -p eliot-searchd --all-targets --locked -- -D warnings
          cargo run --locked -q -p eliot-searchd -- --self-test
          cargo run --locked -q -p eliot-search -- --self-test
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pwsh -NoProfile -File qualification/direct-runtime/test_windows_runner.ps1
          fi
          cargo check --workspace --all-targets --locked
          git diff --check

      - name: Preserve verified tree for finalizer
        shell: bash
        run: |
          git diff --binary > "$RUNNER_TEMP/daemon-control-redb.patch"

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: daemon-control-redb-${{ matrix.os }}
          path: ${{ runner.temp }}/daemon-control-redb.patch
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Download Linux verified patch
        uses: actions/download-artifact@v4
        with:
          name: daemon-control-redb-ubuntu-latest
          path: ${{ runner.temp }}/linux

      - name: Download Windows verified patch
        uses: actions/download-artifact@v4
        with:
          name: daemon-control-redb-windows-latest
          path: ${{ runner.temp }}/windows

      - name: Require identical verified patches and commit
        shell: bash
        run: |
          set -euo pipefail
          cmp "$RUNNER_TEMP/linux/daemon-control-redb.patch" \
              "$RUNNER_TEMP/windows/daemon-control-redb.patch"
          git apply --index "$RUNNER_TEMP/linux/daemon-control-redb.patch"
          rm -f .github/workflows/zz-one-shot-daemon-control-redb.yml
          mkdir -p qualification/daemon-control
          cat > qualification/daemon-control/REDB_INTEGRATION_VERIFIED.md <<EOF
          # Daemon persistent control-store integration

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`
          Platforms: \`ubuntu-latest\`, \`windows-latest\`
          Rust: \`1.98.0\`

          The daemon now opens or creates a versioned persistent \`control.redb\`
          under its owned state directory before publishing readiness, retains
          the database for the process lifetime, reports its authoritative
          revision, and closes it before releasing the owner lock. Both platforms
          passed daemon tests and workspace compilation; Windows passed the full
          DIRECT start-search-stop-restart qualification.
          EOF
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(daemon): wire persistent redb control store [skip ci]"
          git push origin HEAD:main

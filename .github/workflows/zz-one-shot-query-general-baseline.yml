name: one-shot fix General query baseline

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-query-general-baseline.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-query-general-baseline
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Enforce Direct-or-Lexical baseline for General queries
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee query-general-patch.log
          from pathlib import Path

          path = Path('crates/search-query/search-query-planner/src/lib.rs')
          text = path.read_text()

          old_general = '''        QueryFamily::General => &[
                      (PlanLegKind::Direct, Requirement::Required),
                      (PlanLegKind::Lexical, Requirement::Optional),'''
          new_general = '''        QueryFamily::General => &[
                      (PlanLegKind::Direct, Requirement::Optional),
                      (PlanLegKind::Lexical, Requirement::Optional),'''
          if old_general in text:
              text = text.replace(old_general, new_general, 1)
          elif new_general not in text:
              raise SystemExit('General desired-leg anchor missing')

          no_legs = '''    if legs.is_empty() {
                  return Err(PlannerError::NoExecutableLegs);
              }
              request
                  .access_filter'''
          baseline_check = '''    if legs.is_empty() {
                  return Err(PlannerError::NoExecutableLegs);
              }
              if request.family == QueryFamily::General
                  && !legs.iter().any(|leg| is_general_baseline(leg.kind))
              {
                  return Err(PlannerError::GeneralBaselineUnavailable);
              }
              request
                  .access_filter'''
          if 'PlannerError::GeneralBaselineUnavailable' not in text:
              if no_legs not in text:
                  raise SystemExit('post-planning baseline-check anchor missing')
              text = text.replace(no_legs, baseline_check, 1)

          helper_anchor = '\nfn all_leg_kinds() -> [PlanLegKind; 7] {\n'
          helper = '''
          const fn is_general_baseline(kind: PlanLegKind) -> bool {
              matches!(kind, PlanLegKind::Direct | PlanLegKind::Lexical)
          }
          '''
          if 'const fn is_general_baseline(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('planner helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          error_anchor = '''    /// No executable leg remains.
              NoExecutableLegs,
              /// Candidate/work/ordinal arithmetic overflowed.'''
          error_replacement = '''    /// No executable leg remains.
              NoExecutableLegs,
              /// General search has neither a Direct nor Lexical baseline leg.
              GeneralBaselineUnavailable,
              /// Candidate/work/ordinal arithmetic overflowed.'''
          if 'GeneralBaselineUnavailable,' not in text:
              if error_anchor not in text:
                  raise SystemExit('PlannerError baseline anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::NoExecutableLegs => "QUERY_PLANNER_NO_EXECUTABLE_LEGS",
                      Self::BudgetOverflow => "QUERY_PLANNER_BUDGET_OVERFLOW",'''
          code_replacement = '''            Self::NoExecutableLegs => "QUERY_PLANNER_NO_EXECUTABLE_LEGS",
                      Self::GeneralBaselineUnavailable => {
                          "QUERY_PLANNER_GENERAL_BASELINE_UNAVAILABLE"
                      }
                      Self::BudgetOverflow => "QUERY_PLANNER_BUDGET_OVERFLOW",'''
          if 'QUERY_PLANNER_GENERAL_BASELINE_UNAVAILABLE' not in text:
              if code_anchor not in text:
                  raise SystemExit('PlannerError code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          if 'general_accepts_either_baseline_but_not_optional_depth_alone' not in text:
              tests = r'''

          #[cfg(test)]
          mod tests {
              use super::{
                  PlanLegKind, QueryFamily, Requirement, desired_legs,
                  is_general_baseline,
              };

              #[test]
              fn general_declares_both_baselines_optional_individually() {
                  let desired = desired_legs(QueryFamily::General);
                  assert_eq!(
                      desired.get(&PlanLegKind::Direct),
                      Some(&Requirement::Optional)
                  );
                  assert_eq!(
                      desired.get(&PlanLegKind::Lexical),
                      Some(&Requirement::Optional)
                  );
              }

              #[test]
              fn general_accepts_either_baseline_but_not_optional_depth_alone() {
                  assert!(is_general_baseline(PlanLegKind::Direct));
                  assert!(is_general_baseline(PlanLegKind::Lexical));
                  assert!(!is_general_baseline(PlanLegKind::Overlay));
                  assert!(!is_general_baseline(PlanLegKind::Code));
                  assert!(!is_general_baseline(PlanLegKind::Semantic));
                  assert!(!is_general_baseline(PlanLegKind::Document));
              }
          }
          '''
              text += tests

          path.write_text(text)

          functions_path = Path('crates/search-query/search-query-planner/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## General-query baseline rule

          `QueryFamily::General` may execute with either a ready `Direct` leg or
          a ready `Lexical` leg. Neither leg is individually mandatory, but at
          least one must survive readiness and budget selection. Overlay, code,
          semantic, and document legs may deepen that baseline; they cannot form
          a truthful General plan by themselves.
          '''
          if '## General-query baseline rule' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify General baseline semantics
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-query-planner --all-targets --locked
            cargo test -p search-query-planner --all-targets --locked
            cargo clippy -p search-query-planner --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            git diff --check
          } 2>&1 | tee query-general-verify.log

      - name: Commit verified planner repair or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-query-general-baseline.yml
          mkdir -p qualification/query-planner
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/query-planner/LAST_FAILURE.txt
            cat > qualification/query-planner/GENERAL_BASELINE_VERIFIED.md <<EOF
          # General query baseline

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          General queries now accept either a ready Direct baseline or a ready
          Lexical baseline. Optional overlay/code/semantic/document depth cannot
          form a General plan without one of those baseline legs.
          EOF
            git add -A
            subject="fix(query-planner): allow Direct-or-Lexical General baseline"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-query-general-baseline.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 300 query-general-patch.log 2>/dev/null || true
              tail -n 600 query-general-verify.log 2>/dev/null || true
            } > qualification/query-planner/LAST_FAILURE.txt
            git add -A
            subject="verify(query-planner): record failed General-baseline repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

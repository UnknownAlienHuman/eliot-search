name: one-shot main-only cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-one-shot-main-only-cleanup.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-main-only-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW_PATH: .github/workflows/zz-one-shot-main-only-cleanup.yml
    steps:
      - name: Close open pull requests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pulls < <(
            gh api --paginate "repos/${REPO}/pulls?state=open&per_page=100" --jq '.[].number'
          )
          for pull in "${pulls[@]}"; do
            gh api -X PATCH "repos/${REPO}/pulls/${pull}" -f state=closed
          done

      - name: Cancel legacy workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runs < <(
            gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting") | .id'
          )
          for run in "${runs[@]}"; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              gh api -X POST "repos/${REPO}/actions/runs/${run}/cancel" || true
            fi
          done

      - name: Delete every branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name'
          )
          for branch in "${branches[@]}"; do
            if [ "$branch" != main ]; then
              encoded="$(jq -rn --arg value "heads/${branch}" '$value|@uri')"
              gh api -X DELETE "repos/${REPO}/git/refs/${encoded}"
            fi
          done

      - name: Verify main is the only branch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name'
          )
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != main ]; then
            printf 'Unexpected remaining branches:\n' >&2
            printf '  %s\n' "${branches[@]}" >&2
            exit 1
          fi

      - name: Delete this one-shot workflow from main
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPO}/contents/${WORKFLOW_PATH}?ref=main" --jq .sha)"
          gh api -X DELETE "repos/${REPO}/contents/${WORKFLOW_PATH}" \
            -f message='chore: remove completed one-shot branch cleanup' \
            -f sha="$sha" \
            -f branch=main

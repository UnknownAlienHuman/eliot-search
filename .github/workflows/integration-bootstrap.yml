name: P00 integration bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify the committed lockfile or print a Cargo-generated preview
        required: true
        default: verify
        type: choice
        options:
          - verify
          - print-lock

permissions:
  contents: read

concurrency:
  group: p00-integration-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Report exact toolchain
        shell: pwsh
        run: |
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Compile and run bootstrap qualification corpus
        shell: pwsh
        run: |
          python -m py_compile tools/validate-integration-bootstrap.py qualification/integration-bootstrap/test_integration_bootstrap_v1.py
          python qualification/integration-bootstrap/test_integration_bootstrap_v1.py

      - name: Validate bootstrap structure
        if: inputs.mode == 'verify'
        shell: pwsh
        run: ./tools/validate-integration-bootstrap.ps1 -Json

      - name: Generate lockfile preview
        if: inputs.mode == 'print-lock'
        shell: pwsh
        run: |
          ./tools/validate-integration-bootstrap.ps1 -AllowMissingLock -Json
          cargo generate-lockfile
          Write-Output '--- CARGO_LOCK_BEGIN ---'
          Get-Content Cargo.lock
          Write-Output '--- CARGO_LOCK_END ---'

      - name: Verify Cargo lockfile is reproducible
        if: inputs.mode == 'verify'
        shell: pwsh
        run: |
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock

      - name: Verify Rust workspace
        if: inputs.mode == 'verify'
        shell: pwsh
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo doc --workspace --no-deps --locked

      - name: Verify clean checkout
        if: inputs.mode == 'verify'
        shell: pwsh
        run: git diff --exit-code

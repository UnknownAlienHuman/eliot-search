name: one-shot harden model input secrecy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-model-input-secrecy.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-model-input-secrecy
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Remove plaintext cloning and digest debug leakage
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee model-input-patch.log
          from pathlib import Path

          path = Path('crates/search-model-provider/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              '''/// Plaintext input whose debug representation is always redacted.
          #[derive(Clone, Eq, PartialEq)]''',
              '''/// Plaintext input whose debug representation is always redacted.
          ///
          /// The owned plaintext is deliberately non-cloneable:
          ///
          /// ```compile_fail
          /// use search_model_provider::ModelInput;
          ///
          /// fn duplicate(input: &ModelInput) {
          ///     let _copy = input.clone();
          /// }
          /// ```
          #[derive(Eq, PartialEq)]''',
              1,
          )
          for struct_name in ('EmbeddingRequest', 'RerankCandidate', 'RerankRequest'):
              marker = f'#[derive(Clone, Debug, Eq, PartialEq)]\npub struct {struct_name}'
              replacement = f'#[derive(Debug, Eq, PartialEq)]\npub struct {struct_name}'
              if marker not in text:
                  if replacement not in text:
                      raise SystemExit(f'derive anchor missing for {struct_name}')
              else:
                  text = text.replace(marker, replacement, 1)

          old_debug = '''        formatter
                      .debug_struct("ModelInput")
                      .field("bytes", &format_args!("<redacted:{} bytes>", self.bytes.len()))
                      .field("digest", &self.digest)
                      .finish()'''
          new_debug = '''        formatter
                      .debug_struct("ModelInput")
                      .field("bytes", &format_args!("<redacted:{} bytes>", self.bytes.len()))
                      .field("digest", &"<redacted>")
                      .finish()'''
          if old_debug not in text:
              if '.field("digest", &"<redacted>")' not in text:
                  raise SystemExit('ModelInput Debug anchor missing')
          else:
              text = text.replace(old_debug, new_debug, 1)

          if 'model_input_debug_redacts_plaintext_and_digest' not in text:
              tests = r'''

          #[cfg(test)]
          mod tests {
              use super::ModelInput;
              use search_contracts::Blake3Digest32;

              #[test]
              fn model_input_debug_redacts_plaintext_and_digest() {
                  let input = ModelInput::new(
                      b"secret model input".to_vec(),
                      Blake3Digest32::from_bytes([0xab; 32]),
                      1024,
                  )
                  .expect("bounded model input");
                  let rendered = format!("{input:?}");
                  assert!(rendered.contains("<redacted:18 bytes>"));
                  assert!(rendered.contains("digest: \"<redacted>\""));
                  assert!(!rendered.contains("secret model input"));
                  assert!(!rendered.to_ascii_lowercase().contains("abababab"));
              }
          }
          '''
              text += tests

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Verify model provider secrecy boundary
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-model-provider --all-targets --locked
            cargo test -p search-model-provider --locked
            cargo test -p search-model-provider --doc --locked
            cargo clippy -p search-model-provider --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            git diff --check
          } 2>&1 | tee model-input-verify.log

      - name: Commit verified hardening or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-model-input-secrecy.yml
          mkdir -p qualification/model-provider
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/model-provider/LAST_FAILURE.txt
            cat > qualification/model-provider/INPUT_SECRECY_VERIFIED.md <<EOF
          # Model input secrecy boundary

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Owned model plaintext and request types containing it are non-cloneable.
          \`Debug\` exposes neither plaintext nor its digest. Compile-fail and
          runtime redaction tests are part of the crate qualification.
          EOF
            git add -A
            subject="fix(model-provider): make plaintext inputs non-cloneable"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-model-input-secrecy.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 250 model-input-patch.log 2>/dev/null || true
              tail -n 500 model-input-verify.log 2>/dev/null || true
            } > qualification/model-provider/LAST_FAILURE.txt
            git add -A
            subject="verify(model-provider): record failed input-secrecy repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

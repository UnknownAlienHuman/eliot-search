name: Package map and relationship coverage v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-map-coverage-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and inspect Rust coverage generation boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test coverage_graph_parity
          cargo test --locked -p xtask --test coverage_graph_generation_boundary
          cargo test --locked -p xtask --test coverage_graph_generator
          cargo test --locked -p xtask --test coverage_graph_validation_boundary

      - name: Validate generated graph and bounded package maps
        shell: pwsh
        run: |
          cargo run --locked --quiet -p xtask -- generate coverage-graph --check --json
          cargo run --locked --quiet -p xtask -- generate package-maps --check --json
          cargo run --locked --quiet -p xtask -- validate coverage-graph --json
          cargo run --locked --quiet -p xtask -- validate package-maps --json

      - name: Revalidate architecture, swarm and function registries
        shell: pwsh
        run: |
          cargo run --locked --quiet -p xtask -- validate architecture-coverage --json
          cargo run --locked --quiet -p xtask -- validate architecture-coverage-contracts --json
          ./tools/validate-swarm.ps1 -Json
          ./tools/validate-function-packets.ps1 -Json

      - name: Verify no generated drift
        shell: pwsh
        run: git diff --exit-code

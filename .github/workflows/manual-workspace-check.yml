name: Manual production check

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native platform to check
        required: true
        default: windows-2025
        type: choice
        options: [windows-2025, ubuntu-24.04]
      package:
        description: One affected Cargo package
        required: true
        default: eliot-searchd
        type: string
      target:
        description: Library or same-named installed binary
        required: true
        default: bin
        type: choice
        options: [lib, bin]
      features:
        description: Optional comma-separated features required by this consumer
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add clippy
          rustc -Vv
      - name: Check and Clippy without tests
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^[A-Za-z0-9_-]+$ ]] || exit 2
          args=(--locked -p "$PACKAGE")
          case "$TARGET" in
            lib) args+=(--lib) ;;
            bin) args+=(--bin "$PACKAGE") ;;
            *) exit 2 ;;
          esac
          if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
          git rev-parse HEAD
          cargo check "${args[@]}"
          cargo clippy "${args[@]}" -- -D warnings
          git diff --exit-code

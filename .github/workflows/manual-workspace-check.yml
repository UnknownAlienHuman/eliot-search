name: Manual workspace diagnostic

# Explicit dispatch only. Normal implementation slices use the smallest local
# compiler/Clippy closure for changed production owners and real consumers.
# This broad diagnostic issues no acceptance, readiness or release result.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted platform for this diagnostic
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-2025
      strict_clippy:
        description: Also run strict workspace Clippy
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-workspace-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify clean exact checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Install Clippy
        if: ${{ inputs.strict_clippy }}
        shell: bash
        run: rustup component add --toolchain 1.98.0 clippy

      - name: Read current workspace metadata
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Check default workspace targets
        shell: bash
        run: cargo +1.98.0 check --workspace --locked

      - name: Run strict workspace Clippy
        if: ${{ inputs.strict_clippy }}
        shell: bash
        run: cargo +1.98.0 clippy --workspace --locked -- -D warnings

      - name: Refuse verification-side source changes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Record evidence boundary
        if: ${{ always() }}
        shell: bash
        env:
          CHECKED_SHA: ${{ github.sha }}
          CHECKED_RUNNER: ${{ inputs.runner }}
          STRICT_CLIPPY: ${{ inputs.strict_clippy }}
        run: |
          {
            printf '## Manual workspace diagnostic\n\n'
            printf 'SHA: `%s`  \nRunner: `%s`  \nStrict Clippy requested: `%s`\n\n' "$CHECKED_SHA" "$CHECKED_RUNNER" "$STRICT_CLIPPY"
            printf 'This run records raw compiler output only. It does not establish Windows durability, live Qdrant behavior, relevance, scale, recovery, product readiness or release acceptance.\n'
          } >> "$GITHUB_STEP_SUMMARY"

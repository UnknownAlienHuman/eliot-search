name: Manual production check

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Native platform to check
        required: true
        default: windows-2025
        type: choice
        options: [windows-2025, ubuntu-24.04]
      scope:
        description: >
          owner = one package target (inner loop);
          merge-gate = whole workspace with every test target plus cargo deny
        required: true
        default: merge-gate
        type: choice
        options: [merge-gate, owner]
      package:
        description: One affected Cargo package (scope=owner only)
        required: false
        default: eliot-searchd
        type: string
      target:
        description: Library or same-named installed binary (scope=owner only)
        required: true
        default: bin
        type: choice
        options: [lib, bin]
      features:
        description: Optional comma-separated features required by this consumer
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add clippy
          rustc -Vv
      - name: Owner target check and Clippy
        if: inputs.scope == 'owner'
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE" =~ ^[A-Za-z0-9_-]+$ ]] || exit 2
          args=(--locked -p "$PACKAGE")
          case "$TARGET" in
            lib) args+=(--lib) ;;
            bin) args+=(--bin "$PACKAGE") ;;
            *) exit 2 ;;
          esac
          if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
          git rev-parse HEAD
          cargo check "${args[@]}"
          cargo clippy "${args[@]}" -- -D warnings
          git diff --exit-code
      # An owner-narrow --lib/--bin run never compiles a test target, so a test
      # that stopped building stays invisible to it. --all-targets is the only
      # command that sees #[cfg(test)] and tests/**; it is the merge gate.
      - name: Merge gate, including every test target
        if: inputs.scope == 'merge-gate'
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          args=(--workspace --all-targets --locked)
          if [[ -n "$FEATURES" ]]; then args+=(--features "$FEATURES"); fi
          git rev-parse HEAD
          cargo clippy "${args[@]}" -- -D warnings
          cargo test --workspace --locked
          git diff --exit-code
      - name: Dependency policy
        if: inputs.scope == 'merge-gate'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --locked check

name: Manual workspace check

# Explicit dispatch only. This workflow never generates or commits product code.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted platform for this single workspace check
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - windows-2025
      core_tests:
        description: Also execute control, preparation and primary-runtime regression tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-workspace-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout the exact dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V
      - name: Check complete workspace once
        shell: bash
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked
      - name: Execute control and preparation regression tests
        if: ${{ inputs.core_tests }}
        shell: bash
        run: cargo +1.98.0 test --locked -p search-control-redb -p search-materializer -p search-unitizer -p search-exact --lib
      - name: Execute primary-runtime and process regression tests
        if: ${{ inputs.core_tests }}
        shell: bash
        run: cargo +1.98.0 test --locked -p eliot-searchd --bin eliot-searchd --bin eliot-search-sealed-recover --test persistent_roots_process --test direct_preparation_process

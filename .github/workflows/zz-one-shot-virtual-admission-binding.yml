name: one-shot bind virtual admission attestation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-virtual-admission-binding.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-virtual-admission-binding
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require clean qualified baseline
        shell: bash
        run: |
          test -f qualification/CURRENT_STATUS.md
          test ! -f qualification/CURRENT_FAILURES.txt
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            echo 'unresolved qualification failure marker exists'
            find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print
            exit 1
          fi

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Bind expected virtual snapshot and provider identity
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee virtual-admission-patch.log
          from pathlib import Path

          path = Path('crates/search-source/search-source-admission/src/lib.rs')
          text = path.read_text()

          attestation_end = '''pub struct VirtualSnapshotAttestation {
              /// Digest of immutable snapshot bytes.
              pub snapshot_digest: Blake3Digest32,
              /// Digest of provider artifact/identity binding.
              pub provider_identity_digest: Blake3Digest32,
              /// Content-free provider readback receipt.
              pub receipt: ReceiptRef,
          }
          '''
          expectation_type = '''pub struct VirtualSnapshotAttestation {
              /// Digest of immutable snapshot bytes.
              pub snapshot_digest: Blake3Digest32,
              /// Digest of provider artifact/identity binding.
              pub provider_identity_digest: Blake3Digest32,
              /// Content-free provider readback receipt.
              pub receipt: ReceiptRef,
          }

          /// Exact virtual snapshot/provider identity expected by authority.
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct VirtualSnapshotExpectation {
              /// Digest of the immutable snapshot bytes that may be admitted.
              pub snapshot_digest: Blake3Digest32,
              /// Digest of the exact qualified provider identity/revision.
              pub provider_identity_digest: Blake3Digest32,
          }
          '''
          if 'pub struct VirtualSnapshotExpectation {' not in text:
              if attestation_end not in text:
                  raise SystemExit('VirtualSnapshotAttestation anchor missing')
              text = text.replace(attestation_end, expectation_type, 1)

          request_anchor = '''    /// Required only for virtual snapshots.
              pub virtual_snapshot_attestation: Option<VirtualSnapshotAttestation>,'''
          request_replacement = '''    /// Expected immutable snapshot/provider identity for virtual admission.
              pub virtual_snapshot_expectation: Option<VirtualSnapshotExpectation>,
              /// Exact provider attestation, required only for virtual snapshots.
              pub virtual_snapshot_attestation: Option<VirtualSnapshotAttestation>,'''
          request_region = text[text.index('pub struct AdmissionRequest'):text.index('/// Immutable exact binding granted')]
          if 'virtual_snapshot_expectation:' not in request_region:
              if request_anchor not in text:
                  raise SystemExit('AdmissionRequest virtual attestation anchor missing')
              text = text.replace(request_anchor, request_replacement, 1)

          grant_anchor = '''    /// Digest of the canonical sorted evidence set.
              pub evidence_digest: Blake3Digest32,
              /// Monotone logical grant revision.'''
          grant_replacement = '''    /// Digest of the canonical sorted evidence set.
              pub evidence_digest: Blake3Digest32,
              /// Exact admitted virtual snapshot/provider attestation, when applicable.
              pub virtual_snapshot_attestation: Option<VirtualSnapshotAttestation>,
              /// Monotone logical grant revision.'''
          grant_region = text[text.index('pub struct AdmissionGrant'):text.index('/// Typed reason for a denied admission.')]
          if 'virtual_snapshot_attestation:' not in grant_region:
              if grant_anchor not in text:
                  raise SystemExit('AdmissionGrant evidence anchor missing')
              text = text.replace(grant_anchor, grant_replacement, 1)

          reason_anchor = '''    /// Virtual snapshot lacks a bound attestation.
              VirtualAttestationMissing,
          }'''
          reason_replacement = '''    /// Virtual snapshot lacks an authority expectation.
              VirtualExpectationMissing,
              /// Virtual snapshot lacks a bound provider attestation.
              VirtualAttestationMissing,
          }'''
          if 'VirtualExpectationMissing,' not in text:
              if reason_anchor not in text:
                  raise SystemExit('AdmissionReason virtual anchor missing')
              text = text.replace(reason_anchor, reason_replacement, 1)

          old_presence = '''    if request.modality == SourceModality::VirtualSnapshot
                  && request.virtual_snapshot_attestation.is_none()
              {
                  reasons.insert(AdmissionReason::VirtualAttestationMissing);
              }

              if !reasons.is_empty() {'''
          new_binding = '''    let admitted_virtual_snapshot = match request.modality {
                  SourceModality::VirtualSnapshot => match (
                      request.virtual_snapshot_expectation,
                      request.virtual_snapshot_attestation.as_ref(),
                  ) {
                      (None, _) => {
                          reasons.insert(AdmissionReason::VirtualExpectationMissing);
                          None
                      }
                      (Some(_), None) => {
                          reasons.insert(AdmissionReason::VirtualAttestationMissing);
                          None
                      }
                      (Some(expected), Some(attestation)) => {
                          if attestation.snapshot_digest != expected.snapshot_digest
                              || attestation.provider_identity_digest
                                  != expected.provider_identity_digest
                          {
                              return AdmissionDecision::Quarantined(
                                  AdmissionError::VirtualAttestationMismatch,
                              );
                          }
                          Some(attestation.clone())
                      }
                  },
                  SourceModality::File
                  | SourceModality::DirectoryInventory
                  | SourceModality::UnsavedBuffer
                  | SourceModality::ImportedSnapshot => {
                      if request.virtual_snapshot_expectation.is_some()
                          || request.virtual_snapshot_attestation.is_some()
                      {
                          return AdmissionDecision::Quarantined(
                              AdmissionError::UnexpectedVirtualAttestation,
                          );
                      }
                      None
                  }
              };

              if !reasons.is_empty() {'''
          if old_presence in text:
              text = text.replace(old_presence, new_binding, 1)
          elif 'let admitted_virtual_snapshot = match request.modality' not in text:
              raise SystemExit('decide_admission virtual presence check anchor missing')

          grant_init_anchor = '''        request_digest: request.request_digest,
                  evidence_digest,
                  grant_revision,'''
          grant_init_replacement = '''        request_digest: request.request_digest,
                  evidence_digest,
                  virtual_snapshot_attestation: admitted_virtual_snapshot,
                  grant_revision,'''
          if 'virtual_snapshot_attestation: admitted_virtual_snapshot' not in text:
              if grant_init_anchor not in text:
                  raise SystemExit('AdmissionGrant initializer anchor missing')
              text = text.replace(grant_init_anchor, grant_init_replacement, 1)

          error_anchor = '''    /// Two receipts claim the same evidence class.
              DuplicateEvidence,
              /// Operation identity was reused with another request digest.'''
          error_replacement = '''    /// Two receipts claim the same evidence class.
              DuplicateEvidence,
              /// Provider attestation differs from expected snapshot/provider identity.
              VirtualAttestationMismatch,
              /// Non-virtual source carried virtual expectation or attestation fields.
              UnexpectedVirtualAttestation,
              /// Operation identity was reused with another request digest.'''
          if 'VirtualAttestationMismatch,' not in text:
              if error_anchor not in text:
                  raise SystemExit('AdmissionError virtual anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::DuplicateEvidence => "SOURCE_ADMISSION_DUPLICATE_EVIDENCE",
                      Self::OperationConflict => "SOURCE_ADMISSION_OPERATION_CONFLICT",'''
          code_replacement = '''            Self::DuplicateEvidence => "SOURCE_ADMISSION_DUPLICATE_EVIDENCE",
                      Self::VirtualAttestationMismatch => {
                          "SOURCE_ADMISSION_VIRTUAL_ATTESTATION_MISMATCH"
                      }
                      Self::UnexpectedVirtualAttestation => {
                          "SOURCE_ADMISSION_UNEXPECTED_VIRTUAL_ATTESTATION"
                      }
                      Self::OperationConflict => "SOURCE_ADMISSION_OPERATION_CONFLICT",'''
          if 'SOURCE_ADMISSION_VIRTUAL_ATTESTATION_MISMATCH' not in text:
              if code_anchor not in text:
                  raise SystemExit('AdmissionError code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-source/search-source-admission/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Virtual snapshot authority binding

          Virtual admission requires an independently supplied expected snapshot
          digest and qualified provider-identity digest. The provider attestation
          must match both fields exactly, and the accepted attestation is retained
          in the immutable grant. Non-virtual modalities reject virtual-only
          expectation or attestation fields as contradictory state.
          '''
          if '## Virtual snapshot authority binding' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify virtual admission binding and workspace
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-source-admission --all-targets --locked
            cargo test -p search-source-admission --all-targets --locked
            cargo clippy -p search-source-admission --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pub struct VirtualSnapshotExpectation' crates/search-source/search-source-admission/src/lib.rs
            grep -q 'virtual_snapshot_attestation: admitted_virtual_snapshot' crates/search-source/search-source-admission/src/lib.rs
            grep -q 'VirtualAttestationMismatch' crates/search-source/search-source-admission/src/lib.rs
            git diff --check
          } 2>&1 | tee virtual-admission-verify.log

      - name: Commit verified authority binding or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-virtual-admission-binding.yml
          mkdir -p qualification/source-admission
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/source-admission/LAST_FAILURE.txt
            cat > qualification/source-admission/VIRTUAL_BINDING_VERIFIED.md <<EOF
          # Virtual snapshot admission binding

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Virtual snapshot admission now requires exact expected snapshot and
          provider-identity digests, verifies both against the provider
          attestation, and retains that attestation in the immutable grant.
          EOF
            git add -A
            subject="fix(source-admission): bind virtual grants to exact attestation"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-virtual-admission-binding.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 400 virtual-admission-patch.log 2>/dev/null || true
              tail -n 750 virtual-admission-verify.log 2>/dev/null || true
            } > qualification/source-admission/LAST_FAILURE.txt
            git add -A
            subject="verify(source-admission): record failed virtual-binding repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

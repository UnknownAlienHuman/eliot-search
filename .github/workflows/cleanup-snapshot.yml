name: Temporary Cargo lock normalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  normalize:
    if: github.head_ref == 'codex/cleanup-register-r067' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Let Cargo remove unused entries from the original exact pins
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          git show f3d710131aa3b06a63198694bed7ec82b1e251df:Cargo.lock > Cargo.lock
          cp Cargo.lock "$RUNNER_TEMP/base-lock.toml"
          cargo +1.98.0 metadata --format-version 1 > "$RUNNER_TEMP/resolved-metadata.json"
          cargo +1.98.0 metadata --locked --format-version 1 > /dev/null
      - name: Verify no package upgrade and create only an unattached lock blob
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import base64, hashlib, json, os, pathlib, tomllib, urllib.request
          base = tomllib.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'base-lock.toml').read_text())
          data = pathlib.Path('Cargo.lock').read_bytes()
          current = tomllib.loads(data.decode())
          old = {(p['name'], p['version'], p.get('source')): p for p in base['package']}
          for package in current['package']:
              key = (package['name'], package['version'], package.get('source'))
              assert key in old, ('Unexpected new pin', key)
              assert package.get('checksum') == old[key].get('checksum'), key
          expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/git/blobs', data=payload, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              created = json.load(response)
          assert created['sha'] == expected
          print('Cargo-generated unattached lock blob:', expected)
          print('Preserved exact versions/checksums:', len(current['package']))
          print('Removed entries:', len(base['package']) - len(current['package']))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'normalized-lock-sha.txt').write_text(expected + '\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-normalized-lock
          path: |
            Cargo.lock
            ${{ runner.temp }}/normalized-lock-sha.txt
          retention-days: 3
          if-no-files-found: error

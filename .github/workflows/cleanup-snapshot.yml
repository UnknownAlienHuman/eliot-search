name: Temporary cleanup verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  production:
    if: github.head_ref == 'codex/cleanup-register-r067' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository compiler and Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
      - name: Compare baseline and proposed production binaries without tests
        shell: bash
        env:
          BASE_SHA: f3d710131aa3b06a63198694bed7ec82b1e251df
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cleanup-checks"
          failed=0
          for revision in "$BASE_SHA" "$HEAD_SHA"; do
            git checkout --detach "$revision"
            git rev-parse HEAD
            for operation in metadata check clippy; do
              case "$operation" in
                metadata) args=(metadata --locked --no-deps --format-version 1) ;;
                check) args=(check --locked -p eliot-search --bin eliot-search -p eliot-searchd --bin eliot-searchd) ;;
                clippy) args=(clippy --locked -p eliot-search --bin eliot-search -p eliot-searchd --bin eliot-searchd -- -D warnings) ;;
              esac
              if cargo +1.98.0 "${args[@]}" > "$RUNNER_TEMP/cleanup-checks/$revision-$operation.log" 2>&1; then result=0; else result=$?; fi
              printf '%s %s exit=%s\n' "$revision" "$operation" "$result" | tee -a "$RUNNER_TEMP/cleanup-checks/outcomes.txt"
              if [[ "$revision" == "$HEAD_SHA" && "$result" != 0 ]]; then failed=1; fi
            done
            git diff --exit-code
          done
          git checkout --detach "$HEAD_SHA"
          exit "$failed"
      - name: Preserve raw outcomes including pre-existing failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-checks-${{ matrix.runner }}
          path: ${{ runner.temp }}/cleanup-checks
          retention-days: 3
          if-no-files-found: warn

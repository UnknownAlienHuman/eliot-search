name: one-shot implement deterministic standard nDCG

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-standard-ndcg.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-standard-ndcg
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require clean qualified baseline
        shell: bash
        run: |
          test -f qualification/CURRENT_STATUS.md
          test ! -f qualification/CURRENT_FAILURES.txt
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            echo 'unresolved qualification failure marker exists'
            find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print
            exit 1
          fi

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Replace reciprocal-rank discount with deterministic log2 discount
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee ndcg-patch.log
          from pathlib import Path

          path = Path('crates/search-eval/src/lib.rs')
          text = path.read_text()

          constant_anchor = '''/// Fixed metric scale. One million represents `1.0`.
          pub const METRIC_SCALE: u64 = 1_000_000;
          '''
          constants = '''/// Fixed metric scale. One million represents `1.0`.
          pub const METRIC_SCALE: u64 = 1_000_000;
          const LOG2_FRACTION_BITS: u32 = 32;
          const LOG2_SCALE: u128 = 1_u128 << LOG2_FRACTION_BITS;
          const NORMALIZED_ONE: u128 = 1_u128 << 63;
          const NORMALIZED_TWO: u128 = 1_u128 << 64;
          '''
          if 'const LOG2_FRACTION_BITS:' not in text:
              if constant_anchor not in text:
                  raise SystemExit('metric scale anchor missing')
              text = text.replace(constant_anchor, constants, 1)

          old = '''fn discounted_gain(gain: u64, rank: usize) -> Result<u128, EvalError> {
              let denominator = u128::try_from(rank)
                  .map_err(|_| EvalError::MetricOverflow)?
                  .checked_add(1)
                  .ok_or(EvalError::MetricOverflow)?;
              u128::from(gain)
                  .checked_mul(u128::from(METRIC_SCALE))
                  .ok_or(EvalError::MetricOverflow)
                  .map(|value| value / denominator)
          }'''
          new = '''fn discounted_gain(gain: u64, rank: usize) -> Result<u128, EvalError> {
              let position = u64::try_from(rank)
                  .map_err(|_| EvalError::MetricOverflow)?
                  .checked_add(2)
                  .ok_or(EvalError::MetricOverflow)?;
              let log2_denominator = log2_scaled(position)?;
              if log2_denominator == 0 {
                  return Err(EvalError::MetricOverflow);
              }
              u128::from(gain)
                  .checked_mul(u128::from(METRIC_SCALE))
                  .and_then(|value| value.checked_mul(LOG2_SCALE))
                  .ok_or(EvalError::MetricOverflow)
                  .map(|value| value / log2_denominator)
          }

          /// Computes `log2(value)` as unsigned Q32.32 without floats/libm.
          fn log2_scaled(value: u64) -> Result<u128, EvalError> {
              if value == 0 {
                  return Err(EvalError::MetricOverflow);
              }
              let integer_part = 63_u32
                  .checked_sub(value.leading_zeros())
                  .ok_or(EvalError::MetricOverflow)?;
              let normalization_shift = 63_u32
                  .checked_sub(integer_part)
                  .ok_or(EvalError::MetricOverflow)?;
              let mut normalized = u128::from(value)
                  .checked_shl(normalization_shift)
                  .ok_or(EvalError::MetricOverflow)?;
              if normalized < NORMALIZED_ONE || normalized >= NORMALIZED_TWO {
                  return Err(EvalError::MetricOverflow);
              }
              let mut result = u128::from(integer_part)
                  .checked_shl(LOG2_FRACTION_BITS)
                  .ok_or(EvalError::MetricOverflow)?;
              for fractional_bit in 1..=LOG2_FRACTION_BITS {
                  normalized = normalized
                      .checked_mul(normalized)
                      .ok_or(EvalError::MetricOverflow)?
                      >> 63;
                  if normalized >= NORMALIZED_TWO {
                      normalized >>= 1;
                      result |= 1_u128 << (LOG2_FRACTION_BITS - fractional_bit);
                  }
              }
              Ok(result)
          }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'fn log2_scaled(value: u64)' not in text:
              raise SystemExit('discounted_gain anchor missing')

          if 'log2_discount_is_exact_for_powers_of_two' not in text:
              tests = r'''

          #[cfg(test)]
          mod discount_tests {
              use super::{
                  LOG2_SCALE, METRIC_SCALE, discounted_gain, log2_scaled,
              };

              #[test]
              fn log2_discount_is_exact_for_powers_of_two() {
                  assert_eq!(log2_scaled(2), Ok(LOG2_SCALE));
                  assert_eq!(log2_scaled(4), Ok(2 * LOG2_SCALE));
                  assert_eq!(log2_scaled(8), Ok(3 * LOG2_SCALE));
                  assert_eq!(
                      discounted_gain(7, 0),
                      Ok(7 * u128::from(METRIC_SCALE))
                  );
              }

              #[test]
              fn standard_discount_decreases_monotonically() {
                  let first = discounted_gain(7, 0).expect("rank zero discount");
                  let second = discounted_gain(7, 1).expect("rank one discount");
                  let third = discounted_gain(7, 2).expect("rank two discount");
                  let fourth = discounted_gain(7, 3).expect("rank three discount");
                  assert!(first > second);
                  assert!(second > third);
                  assert!(third > fourth);
                  assert_eq!(third, 7 * u128::from(METRIC_SCALE) / 2);
              }

              #[test]
              fn log2_fraction_lies_between_adjacent_powers() {
                  let value = log2_scaled(3).expect("log2 three");
                  assert!(value > LOG2_SCALE);
                  assert!(value < 2 * LOG2_SCALE);
              }
          }
          '''
              text += tests

          path.write_text(text)

          functions_path = Path('crates/search-eval/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Standard deterministic nDCG

          DCG now uses the standard `gain / log2(rank + 2)` discount. `log2` is
          computed by a deterministic integer Q32.32 binary-logarithm algorithm;
          no floating-point or platform libm result participates in metric or
          regression ordering. Powers of two are exact and fractional discounts
          are monotone.
          '''
          if '## Standard deterministic nDCG' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify standard deterministic nDCG and workspace
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-eval --all-targets --locked
            cargo test -p search-eval --all-targets --locked
            cargo clippy -p search-eval --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'fn log2_scaled(value: u64)' crates/search-eval/src/lib.rs
            if sed -n '/fn discounted_gain/,/fn aggregate_metrics/p' crates/search-eval/src/lib.rs | grep -q 'checked_add(1)'; then
              echo 'reciprocal-rank discount remains in nDCG helper'
              exit 1
            fi
            git diff --check
          } 2>&1 | tee ndcg-verify.log

      - name: Commit verified metric repair or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-standard-ndcg.yml
          mkdir -p qualification/eval
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/eval/LAST_FAILURE.txt
            cat > qualification/eval/STANDARD_NDCG_VERIFIED.md <<EOF
          # Standard deterministic nDCG

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          DCG discount is now \`gain / log2(rank + 2)\`, computed with a
          deterministic Q32.32 integer logarithm. No float or platform libm
          result participates in evaluation/regression ordering.
          EOF
            git add -A
            subject="fix(eval): implement standard deterministic nDCG"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-standard-ndcg.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 350 ndcg-patch.log 2>/dev/null || true
              tail -n 700 ndcg-verify.log 2>/dev/null || true
            } > qualification/eval/LAST_FAILURE.txt
            git add -A
            subject="verify(eval): record failed standard-nDCG repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

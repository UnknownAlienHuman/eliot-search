name: one-shot make handle revocation recoverable

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-handle-revoke-recovery.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-handle-revoke-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Determine whether baseline is clean
        id: baseline
        shell: bash
        run: |
          proceed=true
          test -f qualification/CURRENT_STATUS.md || proceed=false
          test ! -f qualification/CURRENT_FAILURES.txt || proceed=false
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Install exact Rust toolchain
        if: steps.baseline.outputs.proceed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Replace receipt-trusting revoke with prepare finish recover
        id: patch
        if: steps.baseline.outputs.proceed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee handle-revoke-patch.log
          from pathlib import Path

          path = Path('crates/search-query/search-handles/src/lib.rs')
          text = path.read_text()

          old_revoked = '''    /// Explicit revocation is durable.
              Revoked {
                  /// Immutable revocation operation.
                  operation: MutationIdentity,
                  /// Content-free revocation receipt.
                  receipt: ReceiptRef,
              },'''
          new_revoked = '''    /// Revocation is prepared but not yet verified.
              RevokePrepared {
                  /// Immutable revocation operation.
                  operation: MutationIdentity,
                  /// Digest of exact canonical revocation request.
                  request_digest: Blake3Digest32,
              },
              /// Explicit revocation is durable.
              Revoked {
                  /// Immutable revocation operation.
                  operation: MutationIdentity,
                  /// Digest of exact canonical revocation request.
                  request_digest: Blake3Digest32,
                  /// Content-free revocation readback receipt.
                  receipt: ReceiptRef,
              },'''
          if old_revoked in text:
              text = text.replace(old_revoked, new_revoked, 1)
          elif 'RevokePrepared {' not in text:
              raise SystemExit('HandleState Revoked anchor missing')

          write_effect_anchor = '''pub struct HandleWriteEffect {
              /// Expected record after durable readback.
              pub record: HandleRecord,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of complete canonical request.
              pub request_digest: Blake3Digest32,
          }
          '''
          revoke_types = '''pub struct HandleWriteEffect {
              /// Expected record after durable readback.
              pub record: HandleRecord,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of complete canonical request.
              pub request_digest: Blake3Digest32,
          }

          /// Exact effect authorizing durable revocation of one active handle.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct HandleRevokeEffect {
              /// Exact active record expected before revocation.
              pub expected_active_record: HandleRecord,
              /// Immutable revocation operation.
              pub operation: MutationIdentity,
              /// Digest of exact canonical revocation request.
              pub request_digest: Blake3Digest32,
          }
          '''
          if 'pub struct HandleRevokeEffect {' not in text:
              if write_effect_anchor not in text:
                  raise SystemExit('HandleWriteEffect anchor missing')
              text = text.replace(write_effect_anchor, revoke_types, 1)

          receipt_anchor = '''pub struct HandleReceipt {
              /// Stable handle identity.
              pub handle_id: HandleId,
              /// Record revision.
              pub record_revision: u64,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact store readback receipt.
              pub store_receipt: ReceiptRef,
          }
          '''
          recovery_type = '''pub struct HandleReceipt {
              /// Stable handle identity.
              pub handle_id: HandleId,
              /// Record revision.
              pub record_revision: u64,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact store readback receipt.
              pub store_receipt: ReceiptRef,
          }

          /// Authoritative recovery result for a handle revocation.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum HandleRevokeRecovery {
              /// Exact revoked record was verified.
              Revoked(HandleReceipt),
              /// Exact unchanged active record remains; retry is safe.
              NotApplied {
                  /// Content-free active-record readback receipt.
                  receipt: ReceiptRef,
              },
              /// Durable state remains unverifiable.
              OutcomeUnknown,
              /// Missing or conflicting handle identity/record was observed.
              Quarantined,
          }
          '''
          if 'pub enum HandleRevokeRecovery {' not in text:
              if receipt_anchor not in text:
                  raise SystemExit('HandleReceipt anchor missing')
              text = text.replace(receipt_anchor, recovery_type, 1)

          revoke_start = text.index('    /// Revokes one active handle after exact durable readback.')
          revoke_end = text.index('\n    /// Expires an active handle at an explicit verified time.', revoke_start)
          revoke_replacement = '''    /// Prepares revocation of one exact active handle.
              pub fn prepare_revoke(
                  &mut self,
                  handle_id: HandleId,
                  expected_record_revision: u64,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<HandleRevokeEffect, HandleError> {
                  if let Some(existing_digest) = self.operations.get(&operation.operation_id) {
                      if *existing_digest != request_digest {
                          return Err(HandleError::OperationConflict);
                      }
                      let record = self.records.get(&handle_id).ok_or(
                          HandleError::OperationMismatch,
                      )?;
                      return match &record.state {
                          HandleState::RevokePrepared {
                              operation: expected,
                              request_digest: expected_digest,
                          } if expected == &operation
                              && *expected_digest == request_digest
                              && record.record_revision == expected_record_revision => {
                              let mut active = record.clone();
                              active.state = HandleState::Active;
                              Ok(HandleRevokeEffect {
                                  expected_active_record: active,
                                  operation,
                                  request_digest,
                              })
                          }
                          HandleState::OutcomeUnknown {
                              operation: expected,
                              request_digest: expected_digest,
                          } if expected == &operation
                              && *expected_digest == request_digest => {
                              Err(HandleError::OutcomeUnknown)
                          }
                          HandleState::Revoked {
                              operation: expected,
                              request_digest: expected_digest,
                              ..
                          } if expected == &operation
                              && *expected_digest == request_digest => {
                              Err(HandleError::OperationAlreadyTerminal)
                          }
                          _ => Err(HandleError::OperationMismatch),
                      };
                  }
                  if self.operations.len() >= self.max_operations {
                      return Err(HandleError::OperationCapacityExceeded);
                  }
                  let current = self
                      .records
                      .get(&handle_id)
                      .cloned()
                      .ok_or(HandleError::NotFound)?;
                  if current.record_revision != expected_record_revision {
                      return Err(HandleError::RevisionConflict);
                  }
                  if !matches!(current.state, HandleState::Active) {
                      return Err(HandleError::InvalidTransition);
                  }
                  let effect = HandleRevokeEffect {
                      expected_active_record: current,
                      operation: operation.clone(),
                      request_digest,
                  };
                  self.operations
                      .insert(operation.operation_id.clone(), request_digest);
                  self.records
                      .get_mut(&handle_id)
                      .ok_or(HandleError::NotFound)?
                      .state = HandleState::RevokePrepared {
                      operation,
                      request_digest,
                  };
                  Ok(effect)
              }

              /// Accepts or recovers revocation after exact durable readback.
              pub fn finish_revoke(
                  &mut self,
                  effect: HandleRevokeEffect,
                  readback: &HandleReadback,
              ) -> Result<HandleReceipt, HandleError> {
                  match self.recover_revoke(effect, readback)? {
                      HandleRevokeRecovery::Revoked(receipt) => Ok(receipt),
                      HandleRevokeRecovery::NotApplied { .. } => {
                          Err(HandleError::MutationNotApplied)
                      }
                      HandleRevokeRecovery::OutcomeUnknown => {
                          Err(HandleError::OutcomeUnknown)
                      }
                      HandleRevokeRecovery::Quarantined => {
                          Err(HandleError::ReadbackMismatch)
                      }
                  }
              }

              /// Marks a possible durable revocation commit as outcome-unknown.
              pub fn mark_revoke_outcome_unknown(
                  &mut self,
                  effect: &HandleRevokeEffect,
              ) -> Result<(), HandleError> {
                  let record = self
                      .records
                      .get_mut(&effect.expected_active_record.handle_id)
                      .ok_or(HandleError::NotFound)?;
                  match &record.state {
                      HandleState::RevokePrepared {
                          operation,
                          request_digest,
                      } if operation == &effect.operation
                          && *request_digest == effect.request_digest => {
                          record.state = HandleState::OutcomeUnknown {
                              operation: effect.operation.clone(),
                              request_digest: effect.request_digest,
                          };
                          Ok(())
                      }
                      HandleState::OutcomeUnknown {
                          operation,
                          request_digest,
                      } if operation == &effect.operation
                          && *request_digest == effect.request_digest => Ok(()),
                      _ => Err(HandleError::OperationMismatch),
                  }
              }

              /// Resolves a possible revocation commit by exact durable readback.
              pub fn recover_revoke(
                  &mut self,
                  effect: HandleRevokeEffect,
                  readback: &HandleReadback,
              ) -> Result<HandleRevokeRecovery, HandleError> {
                  let handle_id = effect.expected_active_record.handle_id;
                  let current = self
                      .records
                      .get(&handle_id)
                      .cloned()
                      .ok_or(HandleError::NotFound)?;
                  match &current.state {
                      HandleState::RevokePrepared {
                          operation,
                          request_digest,
                      }
                      | HandleState::OutcomeUnknown {
                          operation,
                          request_digest,
                      } if operation == &effect.operation
                          && *request_digest == effect.request_digest => {}
                      HandleState::Revoked {
                          operation,
                          request_digest,
                          receipt,
                      } if operation == &effect.operation
                          && *request_digest == effect.request_digest => {
                          return Ok(HandleRevokeRecovery::Revoked(HandleReceipt {
                              handle_id,
                              record_revision: current.record_revision,
                              operation: effect.operation,
                              store_receipt: receipt.clone(),
                          }));
                      }
                      HandleState::Quarantined => {
                          return Ok(HandleRevokeRecovery::Quarantined);
                      }
                      _ => return Err(HandleError::OperationMismatch),
                  }

                  match readback {
                      HandleReadback::Present { record, receipt } => {
                          let next_revision = effect
                              .expected_active_record
                              .record_revision
                              .checked_add(1)
                              .ok_or(HandleError::RevisionOverflow)?;
                          let mut expected_revoked =
                              effect.expected_active_record.clone();
                          expected_revoked.record_revision = next_revision;
                          expected_revoked.state = HandleState::Revoked {
                              operation: effect.operation.clone(),
                              request_digest: effect.request_digest,
                              receipt: receipt.clone(),
                          };
                          if record == &expected_revoked {
                              self.records.insert(handle_id, expected_revoked);
                              return Ok(HandleRevokeRecovery::Revoked(
                                  HandleReceipt {
                                      handle_id,
                                      record_revision: next_revision,
                                      operation: effect.operation,
                                      store_receipt: receipt.clone(),
                                  },
                              ));
                          }
                          if record == &effect.expected_active_record {
                              self.records.insert(
                                  handle_id,
                                  effect.expected_active_record,
                              );
                              self.operations
                                  .remove(&effect.operation.operation_id);
                              return Ok(HandleRevokeRecovery::NotApplied {
                                  receipt: receipt.clone(),
                              });
                          }
                          self.records
                              .get_mut(&handle_id)
                              .ok_or(HandleError::NotFound)?
                              .state = HandleState::Quarantined;
                          Ok(HandleRevokeRecovery::Quarantined)
                      }
                      HandleReadback::Unverifiable => {
                          self.records
                              .get_mut(&handle_id)
                              .ok_or(HandleError::NotFound)?
                              .state = HandleState::OutcomeUnknown {
                              operation: effect.operation,
                              request_digest: effect.request_digest,
                          };
                          Ok(HandleRevokeRecovery::OutcomeUnknown)
                      }
                      HandleReadback::Absent { .. } | HandleReadback::Conflict => {
                          self.records
                              .get_mut(&handle_id)
                              .ok_or(HandleError::NotFound)?
                              .state = HandleState::Quarantined;
                          Ok(HandleRevokeRecovery::Quarantined)
                      }
                  }
              }
          '''
          text = text[:revoke_start] + revoke_replacement + text[revoke_end:]

          error_anchor = '''    /// Operation identity was reused with another request digest.
              OperationConflict,
              /// Handle identity is unknown.'''
          error_replacement = '''    /// Operation identity was reused with another request digest.
              OperationConflict,
              /// Applied revocation operation is already terminal.
              OperationAlreadyTerminal,
              /// Authoritative readback proved revocation was not applied.
              MutationNotApplied,
              /// Handle identity is unknown.'''
          if 'OperationAlreadyTerminal,' not in text:
              if error_anchor not in text:
                  raise SystemExit('HandleError operation anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::OperationConflict => "HANDLE_OPERATION_CONFLICT",
                      Self::NotFound => "HANDLE_NOT_FOUND",'''
          code_replacement = '''            Self::OperationConflict => "HANDLE_OPERATION_CONFLICT",
                      Self::OperationAlreadyTerminal => "HANDLE_OPERATION_ALREADY_TERMINAL",
                      Self::MutationNotApplied => "HANDLE_MUTATION_NOT_APPLIED",
                      Self::NotFound => "HANDLE_NOT_FOUND",'''
          if 'HANDLE_OPERATION_ALREADY_TERMINAL' not in text:
              if code_anchor not in text:
                  raise SystemExit('HandleError operation code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-query/search-handles/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Revocation mutation protocol

          Revocation is now a prepare/finish/recover protocol. A prepared effect
          carries the exact active content-free record and immutable operation
          fence. Only exact durable readback of the expected revoked record makes
          revocation terminal. Exact unchanged active readback is `NotApplied`,
          unverifiable state remains outcome-unknown, and absence/conflict
          quarantines. Callers can no longer mutate local state by merely passing
          a receipt value.
          '''
          if '## Revocation mutation protocol' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify revocation protocol and workspace
        id: verify
        if: steps.baseline.outputs.proceed == 'true' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-handles --all-targets --locked
            cargo test -p search-handles --all-targets --locked
            cargo clippy -p search-handles --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pub struct HandleRevokeEffect' crates/search-query/search-handles/src/lib.rs
            grep -q 'pub fn prepare_revoke' crates/search-query/search-handles/src/lib.rs
            grep -q 'pub fn recover_revoke' crates/search-query/search-handles/src/lib.rs
            if grep -q 'pub fn revoke(' crates/search-query/search-handles/src/lib.rs; then
              echo 'receipt-trusting revoke method remains'
              exit 1
            fi
            git diff --check
          } 2>&1 | tee handle-revoke-verify.log

      - name: Commit verified protocol, bounded failure, or defer cleanly
        if: always()
        shell: bash
        env:
          PROCEED: ${{ steps.baseline.outputs.proceed }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-handle-revoke-recovery.yml
          mkdir -p qualification/handles
          if [ "$PROCEED" != true ]; then
            git add -A
            subject="chore: remove deferred handle-revoke workflow"
          elif [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/handles/REVOKE_RECOVERY_FAILURE.txt
            cat > qualification/handles/REVOKE_RECOVERY_VERIFIED.md <<EOF
          # Handle revocation recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Revocation now requires prepared immutable intent and exact durable
          record readback. Unchanged state is retryable, uncertain state remains
          unknown, and absence or conflict quarantines.
          EOF
            git add -A
            subject="fix(handles): make revocation readback-driven and recoverable"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-handle-revoke-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 550 handle-revoke-patch.log 2>/dev/null || true
              tail -n 950 handle-revoke-verify.log 2>/dev/null || true
            } > qualification/handles/REVOKE_RECOVERY_FAILURE.txt
            git add -A
            subject="verify(handles): record failed revoke-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "$subject [skip ci]"
            git push origin HEAD:main
          fi
          if [ "$PROCEED" = true ] && { [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; }; then
            exit 1
          fi

name: Manual workspace check

# Human-dispatched verification only. Never generate or commit product code in CI.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: manual-workspace-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the exact dispatched revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V
      - name: Check complete workspace once
        shell: bash
        run: cargo +1.98.0 check --workspace --all-targets --all-features --locked

name: repair-source-contract-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-repair-source-contract-once.yml

permissions:
  contents: write

concurrency:
  group: repair-source-contract-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --no-self-update
          rustup override set 1.98.0

      - name: Align shared identity and source-spine tests
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          contracts = Path('crates/search-contracts/src/source.rs')
          text = contracts.read_text(encoding='utf-8')
          old = '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct SourceIdentity {'
          new = '#[derive(Clone, Debug, Eq, Hash, Ord, PartialEq, PartialOrd)]\npub struct SourceIdentity {'
          if old not in text:
              raise SystemExit('SourceIdentity derive did not match expected source')
          contracts.write_text(text.replace(old, new, 1), encoding='utf-8')

          registry = Path('crates/search-source/search-source-registry/src/lib.rs')
          text = registry.read_text(encoding='utf-8')
          text, imports = re.subn(
              r'    use search_contracts::OwnerEpoch;',
              '    use search_contracts::{\n'
              '        OpaqueCanonicalBytes, OwnerEpoch, SourceId, SourceIdentityKind,\n'
              '        SourceNamespaceId,\n'
              '    };',
              text,
              count=1,
          )
          helper = '''    fn source_identity(name: &str) -> SourceIdentity {
              let mut source_id = [0_u8; 16];
              for (index, byte) in name.bytes().enumerate() {
                  let slot = index % source_id.len();
                  source_id[slot] ^= byte;
              }
              SourceIdentity {
                  source_namespace_id: SourceNamespaceId::from_bytes([1; 16]),
                  source_id: SourceId::from_bytes(source_id),
                  identity_kind: SourceIdentityKind::NtfsFile,
                  stable_identity_components: OpaqueCanonicalBytes::from_validated(
                      format!("registry-test:{name}").into_bytes(),
                  )
                  .expect("stable identity components"),
              }
          }

          '''
          text, helpers = re.subn(
              r'    fn source_identity\(name: &str\) -> SourceIdentity \{.*?\n    \}\n\n(?=    fn source_binding)',
              helper,
              text,
              count=1,
              flags=re.S,
          )
          if imports != 1 or helpers != 1:
              raise SystemExit(f'registry patch mismatch: imports={imports}, helpers={helpers}')
          registry.write_text(text, encoding='utf-8')

          reconcile = Path('crates/search-source/search-source-reconcile/src/lib.rs')
          text = reconcile.read_text(encoding='utf-8')
          text, imports = re.subn(
              r'    use search_contracts::\{OwnerEpoch, ReceiptRef\};',
              '    use search_contracts::{\n'
              '        OpaqueCanonicalBytes, OwnerEpoch, ReceiptRef, SourceId,\n'
              '        SourceIdentityKind, SourceNamespaceId,\n'
              '    };',
              text,
              count=1,
          )
          helper = '''    fn source_identity() -> SourceIdentity {
              SourceIdentity {
                  source_namespace_id: SourceNamespaceId::from_bytes([1; 16]),
                  source_id: SourceId::from_bytes([2; 16]),
                  identity_kind: SourceIdentityKind::NtfsFile,
                  stable_identity_components: OpaqueCanonicalBytes::from_validated(
                      b"reconcile-test:source".to_vec(),
                  )
                  .expect("stable identity components"),
              }
          }

          '''
          text, helpers = re.subn(
              r'    fn source_identity\(\) -> SourceIdentity \{.*?\n    \}\n\n(?=    fn path)',
              helper,
              text,
              count=1,
              flags=re.S,
          )
          if imports != 1 or helpers != 1:
              raise SystemExit(f'reconcile patch mismatch: imports={imports}, helpers={helpers}')
          reconcile.write_text(text, encoding='utf-8')
          PY

      - name: Format and qualify the repaired source spine
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            crates/search-contracts/src/source.rs \
            crates/search-source/search-source-identity/src/lib.rs \
            crates/search-source/search-source-identity/src/current.rs \
            crates/search-source/search-source-registry/src/lib.rs \
            crates/search-source/search-source-reconcile/src/lib.rs
          cargo check -p search-contracts --all-targets --locked
          cargo test -p search-source-identity --all-targets --locked
          cargo test -p search-source-registry --all-targets --locked
          cargo test -p search-source-reconcile --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked

      - name: Commit compiler-qualified contract and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-repair-source-contract-once.yml
          git add \
            crates/search-contracts/src/source.rs \
            crates/search-source/search-source-identity/src/lib.rs \
            crates/search-source/search-source-identity/src/current.rs \
            crates/search-source/search-source-registry/src/lib.rs \
            crates/search-source/search-source-reconcile/src/lib.rs
          if ! git diff --quiet; then
            echo 'Unexpected unstaged changes:' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(source): align identity, registry, and reconciliation contracts'
          git pull --rebase origin main
          git push origin HEAD:main
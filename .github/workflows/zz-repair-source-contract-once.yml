          cargo test -p search-source-identity --all-targets --locked
          cargo test -p search-source-registry --all-targets --locked
          cargo test -p search-source-reconcile --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked

      - name: Commit compiler-qualified contract and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-repair-source-contract-once.yml
          git add \
            crates/search-contracts/src/source.rs \
            crates/search-source/search-source-identity/src/lib.rs \
            crates/search-source/search-source-identity/src/current.rs \
            crates/search-source/search-source-registry/src/lib.rs \
            crates/search-source/search-source-reconcile/src/lib.rs
          if ! git diff --quiet; then
            echo 'Unexpected unstaged changes:' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(source): align identity, registry, and reconciliation contracts'
          git pull --rebase origin main
          git push origin HEAD:main
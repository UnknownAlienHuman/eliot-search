name: A022 Qdrant direct connect

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: read

concurrency:
  group: a022-qdrant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update

      - name: Check bridge library
        shell: bash
        run: cargo +1.98.0 check -p search-qdrant-bridge --lib --locked

      - name: Clippy bridge library
        shell: bash
        run: cargo +1.98.0 clippy -p search-qdrant-bridge --lib --locked -- -D warnings

name: Context materialization plan v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Test captured helper parity vectors
        shell: pwsh
        run: cargo test --locked -p xtask --test context_materialization_parity

      - name: Run Rust materialization-plan behavioral corpus
        shell: pwsh
        run: cargo test --locked -p xtask --test context_materialization_builder

      - name: Validate planner registry and authority ceiling
        shell: pwsh
        run: ./tools/validate-context-materialization-plan.ps1 -Json

      - name: Revalidate context artifact candidate
        shell: pwsh
        run: ./tools/validate-context-artifact-candidate.ps1 -Json

      - name: Revalidate accepted evidence digest
        shell: pwsh
        run: ./tools/validate-accepted-evidence-digest.ps1 -Json

      - name: Revalidate ticket issuance contracts
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

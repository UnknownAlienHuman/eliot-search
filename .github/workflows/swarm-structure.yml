name: Swarm structure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate topology and implementation packets
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate registry, Cargo and launch state
        shell: pwsh
        run: ./tools/validate-swarm.ps1 -Json

      - name: Validate functions, configuration and W3 qualification
        shell: pwsh
        run: ./tools/validate-implementation-packets.ps1 -Json

      - name: Validate W4 registry and current-workspace qualification
        shell: pwsh
        run: ./tools/validate-current-packets.ps1 -Json

      - name: Validate W5 cross-contract, settings and Rust syntax qualification
        shell: pwsh
        run: ./tools/validate-w5-current.ps1 -Json

      - name: Validate W6 subject, comparison and exact-proof packets
        shell: pwsh
        run: ./tools/validate-proof-packets.ps1 -Json

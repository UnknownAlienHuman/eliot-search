name: Final clean coverage validation v2

on:
  push:
    branches:
      - audit/coverage-recheck-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate generated graph and package maps
        shell: pwsh
        run: |
          python tools/generate-coverage-graph-v2.py --check --json
          python tools/generate-package-maps-v2.py --check --json
          python tools/validate-coverage-graph-v2.py --json
          python tools/validate-package-maps-v2.py --json

      - name: Validate architecture, swarm and function closure
        shell: pwsh
        run: |
          python tools/validate-architecture-coverage.py --json
          ./tools/validate-swarm.ps1 -Json
          ./tools/validate-function-packets.ps1 -Json
          ./tools/validate-p00-ticket-drafts.ps1 -Json

      - name: Compile coverage tooling
        shell: pwsh
        run: |
          python -m py_compile tools/coverage_graph_v2.py
          python -m py_compile tools/generate-coverage-graph-v2.py
          python -m py_compile tools/validate-coverage-graph-v2.py
          python -m py_compile tools/package_maps_v2.py
          python -m py_compile tools/generate-package-maps-v2.py
          python -m py_compile tools/validate-package-maps-v2.py

      - name: Verify clean checkout
        shell: pwsh
        run: git diff --exit-code

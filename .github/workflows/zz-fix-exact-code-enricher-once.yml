name: fix-exact-code-enricher-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-fix-exact-code-enricher-once.yml

permissions:
  contents: write

concurrency:
  group: fix-exact-code-enricher-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --no-self-update
          rustup override set 1.98.0

      - name: Repair exact-input and parser closure ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          exact = Path('crates/search-query/search-exact/src/lib.rs')
          text = exact.read_text(encoding='utf-8')
          text, lifetimes = re.subn(
              r"impl ExactInput<'_> \{\n    fn bytes\(self\) -> &\[u8\] \{",
              "impl<'a> ExactInput<'a> {\n    fn bytes(self) -> &'a [u8] {",
              text,
              count=1,
          )
          text, loops = re.subn(
              r'    for span in spans \{\n        let exact_match = projector\.project\(item, readback, &plan\.predicate, span\)\?;',
              '    for span in &spans {\n        let exact_match = projector.project(item, readback, &plan.predicate, *span)?;',
              text,
              count=1,
          )
          if lifetimes != 1 or loops != 1:
              raise SystemExit(
                  f'exact patch mismatch: lifetimes={lifetimes}, loops={loops}'
              )
          exact.write_text(text, encoding='utf-8')

          enricher = Path('crates/search-prep/search-code-enricher/src/lib.rs')
          text = enricher.read_text(encoding='utf-8')
          text, imports = re.subn(
              r'(MAX_LIST_ITEMS,) OpaqueId, (ProfileId,)',
              r'\1 \2',
              text,
              count=1,
          )
          text, trims = re.subn(
              r'\.strip_prefix\((name|"not")\)\n\s*\.and_then\(str::trim_start\)\n\s*\.strip_prefix\(\'\(\'\)',
              lambda match: (
                  f'.strip_prefix({match.group(1)})\n'
                  '            .map(str::trim_start)\n'
                  "            .and_then(|body| body.strip_prefix('('))"
              ),
              text,
          )
          text, digest_signatures = re.subn(
              r'(fn digest_list\(\n    domain: &\[u8\],\n    values: &\[Blake3Digest32\],\n)'
              r'    blake3_256: impl Fn\(&\[u8\]\) -> \[u8; 32\],',
              r'\1    blake3_256: &impl Fn(&[u8]) -> [u8; 32],',
              text,
              count=1,
          )
          text, digest_calls = re.subn(
              r'(digest_list\(\n        b"eliot-search/(?:structural-fact|structural-relation)-set/v1",\n'
              r'        &(?:fact|relation)_digests,\n)        blake3_256,',
              r'\1        &blake3_256,',
              text,
          )
          if imports != 1 or trims != 2 or digest_signatures != 1 or digest_calls != 2:
              raise SystemExit(
                  'enricher patch mismatch: '
                  f'imports={imports}, trims={trims}, '
                  f'digest_signatures={digest_signatures}, digest_calls={digest_calls}'
              )
          enricher.write_text(text, encoding='utf-8')
          PY
          rustfmt --edition 2024 \
            crates/search-query/search-exact/src/lib.rs \
            crates/search-prep/search-code-enricher/src/lib.rs

      - name: Qualify exact search and structural enrichment
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p search-exact --all-targets --locked
          cargo test -p search-exact --all-targets --locked
          cargo check -p search-code-enricher --all-targets --locked
          cargo test -p search-code-enricher --all-targets --locked
          git diff --check

      - name: Commit qualified repairs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-fix-exact-code-enricher-once.yml
          git add \
            crates/search-query/search-exact/src/lib.rs \
            crates/search-prep/search-code-enricher/src/lib.rs
          if ! git diff --quiet; then
            echo 'Unexpected unstaged changes:' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(query): repair exact and code enrichment ownership'
          git pull --rebase origin main
          git push origin HEAD:main
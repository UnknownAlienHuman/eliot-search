name: one-shot consolidated repository audit v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-consolidated-audit-v2.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-consolidated-repository-audit-v2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 105
    env:
      REPO: UnknownAlienHuman/eliot-search
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for every earlier repository workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(35)
          do {
            $response = gh api --paginate "repos/$env:REPO/actions/runs?per_page=100" | ConvertFrom-Json
            $others = @($response.workflow_runs | Where-Object {
              [string]$_.id -ne $env:GITHUB_RUN_ID -and
              $_.status -in @('queued', 'in_progress', 'waiting', 'requested', 'pending')
            })
            if ($others.Count -eq 0) { break }
            Write-Host "Waiting for $($others.Count) earlier workflow run(s)."
            $others | Select-Object id, name, status, head_sha | Format-Table | Out-String | Write-Host
            Start-Sleep -Seconds 20
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($others.Count -ne 0) {
            throw 'Timed out waiting for earlier workflow runs.'
          }

      - name: Reset to latest main and remove completed one-shot files
        id: sync
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main
          $base = (git rev-parse HEAD).Trim()
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Get-ChildItem .github/workflows/zz-one-shot-*.yml -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Write-Host "Auditing exact main commit $base"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V

      - name: Run complete qualification matrix
        id: verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failures = [Collections.Generic.List[string]]::new()
          $log = Join-Path $PWD 'qualification-audit-v2.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          function Invoke-Checked {
            param([string]$Name, [scriptblock]$Command)
            "`n===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
            if ($null -eq $code) { $code = 0 }
            if ($code -ne 0) { $failures.Add("$Name (exit $code)") }
            $global:LASTEXITCODE = 0
          }

          Invoke-Checked 'PowerShell parsers' {
            foreach ($file in @(
              'tools/eliot-search-dev.ps1',
              'qualification/direct-runtime/test_windows_runner.ps1'
            )) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $file), [ref]$tokens, [ref]$errors
              ) > $null
              if ($errors.Count -ne 0) {
                $errors | Format-List -Force | Out-String | Write-Error
                exit 1
              }
            }
          }
          Invoke-Checked 'Bootstrap qualification' {
            python -m py_compile tools/validate-integration-bootstrap.py qualification/integration-bootstrap/test_integration_bootstrap_v1.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python qualification/integration-bootstrap/test_integration_bootstrap_v1.py
          }
          Invoke-Checked 'Unresolved failure markers' {
            $markers = @(Get-ChildItem qualification -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(^LAST_FAILURE|FAILURE|FAIL\.txt|FAILURES)' })
            if ($markers.Count -ne 0) {
              $markers.FullName | Write-Output
              exit 1
            }
          }
          Invoke-Checked 'Lockfile reproducibility' {
            Copy-Item Cargo.lock Cargo.lock.before
            cargo generate-lockfile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --exit-code -- Cargo.lock
            $code = $LASTEXITCODE
            Move-Item Cargo.lock.before Cargo.lock -Force
            if ($code -ne 0) { exit $code }
          }
          Invoke-Checked 'Rust format' { cargo fmt --all -- --check }
          Invoke-Checked 'Workspace compile' { cargo check --workspace --all-targets --locked }
          Invoke-Checked 'Workspace tests' { cargo test --workspace --all-targets --locked }
          Invoke-Checked 'Workspace Clippy' { cargo clippy --workspace --all-targets --locked -- -D warnings }
          Invoke-Checked 'Workspace rustdoc' { cargo doc --workspace --no-deps --locked }
          Invoke-Checked 'Daemon self-test' { cargo run --locked -q -p eliot-searchd -- --self-test }
          Invoke-Checked 'CLI self-test' { cargo run --locked -q -p eliot-search -- --self-test }
          Invoke-Checked 'Model worker self-test' { cargo run --locked -q -p eliot-search-model-worker -- --self-test }
          Invoke-Checked 'Document worker self-test' { cargo run --locked -q -p eliot-search-doc-worker -- --self-test }
          Invoke-Checked 'Windows DIRECT E2E' { pwsh -NoProfile -File qualification/direct-runtime/test_windows_runner.ps1 }
          Invoke-Checked 'Diff whitespace' { git diff --check }

          "`n===== SUMMARY =====" | Tee-Object -FilePath $log -Append
          if ($failures.Count -ne 0) {
            $failures | ForEach-Object { "FAIL: $_" } | Tee-Object -FilePath $log -Append
            exit 1
          }
          'PASS: complete qualification matrix.' | Tee-Object -FilePath $log -Append

      - name: Prove only main branch remains
        id: branches
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branches = @(gh api --paginate "repos/$env:REPO/branches?per_page=100" --jq '.[].name')
          foreach ($branch in $branches) {
            if ($branch -eq 'main') { continue }
            $encoded = [Uri]::EscapeDataString($branch)
            gh api -X DELETE "repos/$env:REPO/git/refs/heads/$encoded"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $remaining = @(gh api --paginate "repos/$env:REPO/branches?per_page=100" --jq '.[].name')
          if ($remaining.Count -ne 1 -or $remaining[0] -ne 'main') {
            $remaining | Write-Output
            throw 'Only main may remain.'
          }

      - name: Publish exact audit outcome and self-delete
        if: always()
        shell: pwsh
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BRANCH_OUTCOME: ${{ steps.branches.outcome }}
          TESTED_SHA: ${{ steps.sync.outputs.base_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/zz-one-shot-*.yml -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory qualification -Force | Out-Null
          $now = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $success = $env:VERIFY_OUTCOME -eq 'success' -and $env:BRANCH_OUTCOME -eq 'success'

          if ($success) {
            @"
# Current repository qualification

Status: **PASS**

- Tested main commit: ``$env:TESTED_SHA``
- Verified at: ``$now``
- Runner: ``windows-latest``
- Rust toolchain: ``1.98.0``
- Branches: ``main`` only

Passed lockfile reproducibility, PowerShell parsers, bootstrap corpus,
workspace format/compile/tests/Clippy/rustdoc, four executable self-tests,
Windows DIRECT start-search-stop-restart, failure-marker scan, and whitespace
validation.

## Proven scope

This proves the current workspace, concrete components present in the tree, and
the authenticated DIRECT runtime baseline. It does not by itself claim that
production Qdrant transport, complete daemon composition of every source/index
stage, or real model/document backends are implemented.
"@ | Set-Content qualification/CURRENT_STATUS.md -Encoding utf8NoBOM
            Remove-Item qualification/CURRENT_FAILURES.txt -Force -ErrorAction SilentlyContinue
            $subject = 'verify: refresh consolidated green repository status'
          }
          else {
            $tail = if (Test-Path qualification-audit-v2.log) {
              (Get-Content qualification-audit-v2.log -Tail 1200) -join "`n"
            } else { 'qualification-audit-v2.log was not produced' }
            @"
Status: FAIL
Tested main commit: $env:TESTED_SHA
Verified at: $now
Verification outcome: $env:VERIFY_OUTCOME
Branch outcome: $env:BRANCH_OUTCOME

--- bounded audit log tail ---
$tail
"@ | Set-Content qualification/CURRENT_FAILURES.txt -Encoding utf8NoBOM
            Remove-Item qualification/CURRENT_STATUS.md -Force -ErrorAction SilentlyContinue
            $subject = 'verify: record consolidated repository failures v2'
          }

          Remove-Item qualification-audit-v2.log -Force -ErrorAction SilentlyContinue
          Remove-Item Cargo.lock.before -Force -ErrorAction SilentlyContinue
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (-not (git diff --cached --quiet)) {
            git commit -m "$subject [skip ci]"
            git fetch origin main
            $origin = (git rev-parse origin/main).Trim()
            if ($origin -ne $env:TESTED_SHA) {
              throw "main changed during audit: tested=$env:TESTED_SHA current=$origin"
            }
            git push origin HEAD:main
          }
          if (-not $success) { exit 1 }

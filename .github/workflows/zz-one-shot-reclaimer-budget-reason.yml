name: one-shot fix reclaim action-budget reason

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-reclaimer-budget-reason.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-reclaimer-budget-reason
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Make action-budget retention truthful
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee reclaimer-reason-patch.log
          from pathlib import Path

          path = Path('crates/search-index-qdrant/search-index-reclaimer/src/lib.rs')
          text = path.read_text()
          enum_anchor = '''    /// Generation is inside the configured newest-generation retention window.
              GenerationRetentionWindow,
              /// Candidate lifecycle is not terminally reclaimable.'''
          enum_replacement = '''    /// Generation is inside the configured newest-generation retention window.
              GenerationRetentionWindow,
              /// Current reclaim plan exhausted its finite action budget.
              ActionBudgetExceeded,
              /// Candidate lifecycle is not terminally reclaimable.'''
          if 'ActionBudgetExceeded,' not in text:
              if enum_anchor not in text:
                  raise SystemExit('RetainReason enum anchor missing')
              text = text.replace(enum_anchor, enum_replacement, 1)

          old_block = '''        if actions.len() >= policy.max_actions() {
                      retained.push(RetainedCandidate {
                          candidate_id: candidate.candidate_id.clone(),
                          collection_generation_id: candidate.collection_generation_id,
                          reason: RetainReason::GenerationRetentionWindow,
                      });
                      continue;
                  }'''
          new_block = '''        if let Some(reason) = action_budget_retain_reason(
                      actions.len(),
                      policy.max_actions(),
                  ) {
                      retained.push(RetainedCandidate {
                          candidate_id: candidate.candidate_id.clone(),
                          collection_generation_id: candidate.collection_generation_id,
                          reason,
                      });
                      continue;
                  }'''
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          elif 'action_budget_retain_reason(' not in text:
              raise SystemExit('reclaim action-capacity block missing')

          helper_anchor = '\nfn validate_snapshot(\n'
          helper = '''
          const fn action_budget_retain_reason(
              current_actions: usize,
              max_actions: usize,
          ) -> Option<RetainReason> {
              if current_actions >= max_actions {
                  Some(RetainReason::ActionBudgetExceeded)
              } else {
                  None
              }
          }
          '''
          if 'const fn action_budget_retain_reason(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('reclaimer helper anchor missing')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          if 'action_budget_reports_its_actual_retain_reason' not in text:
              tests = '''

          #[cfg(test)]
          mod tests {
              use super::{
                  RetainReason, action_budget_retain_reason,
              };

              #[test]
              fn action_budget_reports_its_actual_retain_reason() {
                  assert_eq!(action_budget_retain_reason(0, 1), None);
                  assert_eq!(
                      action_budget_retain_reason(1, 1),
                      Some(RetainReason::ActionBudgetExceeded)
                  );
                  assert_eq!(
                      action_budget_retain_reason(2, 1),
                      Some(RetainReason::ActionBudgetExceeded)
                  );
              }
          }
          '''
              text += tests

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Verify truthful reclaim planning
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-index-reclaimer --all-targets --locked
            cargo test -p search-index-reclaimer --all-targets --locked
            cargo clippy -p search-index-reclaimer --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            git diff --check
          } 2>&1 | tee reclaimer-reason-verify.log

      - name: Commit verified truthfulness fix or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-reclaimer-budget-reason.yml
          mkdir -p qualification/index-reclaimer
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/index-reclaimer/LAST_FAILURE.txt
            cat > qualification/index-reclaimer/ACTION_BUDGET_REASON_VERIFIED.md <<EOF
          # Reclaim action-budget reason

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          A candidate retained because the finite action list is full is now
          classified as \`ActionBudgetExceeded\`, not as a generation-retention
          policy decision.
          EOF
            git add -A
            subject="fix(reclaimer): report action-budget retention truthfully"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-reclaimer-budget-reason.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 250 reclaimer-reason-patch.log 2>/dev/null || true
              tail -n 500 reclaimer-reason-verify.log 2>/dev/null || true
            } > qualification/index-reclaimer/LAST_FAILURE.txt
            git add -A
            subject="verify(reclaimer): record failed action-budget reason repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

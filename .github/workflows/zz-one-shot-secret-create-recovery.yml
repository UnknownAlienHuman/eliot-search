name: one-shot add secret create recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-secret-create-recovery.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-secret-create-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Add bounded pending-create and authoritative recovery
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee secret-create-patch.log
          from pathlib import Path

          path = Path('crates/search-runtime/search-os-secrets/src/lib.rs')
          text = path.read_text()

          write_effect_end = '''pub struct SecretWriteEffect {
              /// Opaque target locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version expected after readback.
              pub version: NonZeroRevision,
              /// Digest of exact ciphertext bytes supplied to the adapter.
              pub ciphertext_digest: Blake3Digest32,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
          }
          '''
          pending_types = '''pub struct SecretWriteEffect {
              /// Opaque target locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version expected after readback.
              pub version: NonZeroRevision,
              /// Digest of exact ciphertext bytes supplied to the adapter.
              pub ciphertext_digest: Blake3Digest32,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
          }

          /// Process-local lifecycle of a not-yet-committed secret create.
          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          pub enum PendingSecretCreateState {
              /// Exact write effect is prepared but no external mutation is known.
              Prepared,
              /// The platform write may have completed and requires readback.
              OutcomeUnknown,
              /// Conflicting readback blocks retry and use.
              Quarantined,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          struct PendingSecretCreate {
              effect: SecretWriteEffect,
              state: PendingSecretCreateState,
          }
          '''
          if 'pub enum PendingSecretCreateState {' not in text:
              if write_effect_end not in text:
                  raise SystemExit('SecretWriteEffect anchor missing')
              text = text.replace(write_effect_end, pending_types, 1)

          receipt_end = '''pub struct SecretTransitionReceipt {
              /// Opaque secret locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version after the transition, or the final deleted version.
              pub version: NonZeroRevision,
              /// Logical record revision after the transition.
              pub record_revision: NonZeroRevision,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
              /// Exact platform readback receipt.
              pub platform_receipt: ReceiptRef,
          }
          '''
          recovery_type = '''pub struct SecretTransitionReceipt {
              /// Opaque secret locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version after the transition, or the final deleted version.
              pub version: NonZeroRevision,
              /// Logical record revision after the transition.
              pub record_revision: NonZeroRevision,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
              /// Exact platform readback receipt.
              pub platform_receipt: ReceiptRef,
          }

          /// Authoritative recovery result for an unresolved create.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum SecretCreateRecovery {
              /// Exact stored value was verified and committed to the catalog.
              Created(SecretTransitionReceipt),
              /// Exact reference is authoritatively absent; retry is safe.
              NotApplied {
                  /// Content-free absence observation receipt.
                  receipt: ReceiptRef,
              },
              /// Platform state remains unverifiable.
              OutcomeUnknown,
              /// Conflicting identity/version/ciphertext evidence was observed.
              Quarantined,
          }
          '''
          if 'pub enum SecretCreateRecovery {' not in text:
              if receipt_end not in text:
                  raise SystemExit('SecretTransitionReceipt anchor missing')
              text = text.replace(receipt_end, recovery_type, 1)

          catalog_anchor = '''    records: BTreeMap<SecretReference, SecretRecord>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          catalog_replacement = '''    records: BTreeMap<SecretReference, SecretRecord>,
              pending_creates: BTreeMap<SecretReference, PendingSecretCreate>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          if 'pending_creates: BTreeMap<SecretReference, PendingSecretCreate>' not in text:
              if catalog_anchor not in text:
                  raise SystemExit('SecretCatalog field anchor missing')
              text = text.replace(catalog_anchor, catalog_replacement, 1)

          constructor_anchor = '''            records: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          constructor_replacement = '''            records: BTreeMap::new(),
                      pending_creates: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          if 'pending_creates: BTreeMap::new()' not in text:
              if constructor_anchor not in text:
                  raise SystemExit('SecretCatalog constructor anchor missing')
              text = text.replace(constructor_anchor, constructor_replacement, 1)

          prepare_start = text.index('    /// Prepares creation of one new bound secret.')
          prepare_end = text.index('\n    /// Commits a prepared create only after exact platform readback.', prepare_start)
          prepare_replacement = '''    /// Prepares creation of one new bound secret.
              ///
              /// The exact effect is retained before it can cross a platform
              /// mutation boundary. Equal prepared replay returns the same
              /// effect; an outcome-unknown create cannot be blindly reissued.
              pub fn prepare_create(
                  &mut self,
                  reference: SecretReference,
                  binding: SecretBinding,
                  ciphertext_digest: Blake3Digest32,
                  operation: SecretOperation,
              ) -> Result<SecretWriteEffect, SecretError> {
                  if self.records.contains_key(&reference) {
                      return Err(SecretError::AlreadyExists);
                  }
                  let effect = SecretWriteEffect {
                      reference: reference.clone(),
                      binding,
                      version: NonZeroRevision::new(1)
                          .map_err(|_| SecretError::ContractExhausted)?,
                      ciphertext_digest,
                      operation,
                  };
                  if let Some(pending) = self.pending_creates.get(&reference) {
                      if pending.effect != effect {
                          return Err(SecretError::CreatePendingConflict);
                      }
                      return match pending.state {
                          PendingSecretCreateState::Prepared => Ok(effect),
                          PendingSecretCreateState::OutcomeUnknown => {
                              Err(SecretError::OutcomeUnknown)
                          }
                          PendingSecretCreateState::Quarantined => {
                              Err(SecretError::CreateQuarantined)
                          }
                      };
                  }
                  let occupied = self
                      .records
                      .len()
                      .checked_add(self.pending_creates.len())
                      .ok_or(SecretError::RecordCapacityExceeded)?;
                  if occupied >= self.max_records {
                      return Err(SecretError::RecordCapacityExceeded);
                  }
                  self.register_operation(&effect.operation)?;
                  self.pending_creates.insert(
                      reference,
                      PendingSecretCreate {
                          effect: effect.clone(),
                          state: PendingSecretCreateState::Prepared,
                      },
                  );
                  Ok(effect)
              }
          '''
          text = text[:prepare_start] + prepare_replacement + text[prepare_end:]

          finish_start = text.index('    /// Commits a prepared create only after exact platform readback.')
          finish_end = text.index('\n    /// Prepares an exact one-version rotation.', finish_start)
          finish_replacement = '''    /// Commits a prepared create only after exact platform readback.
              pub fn finish_create(
                  &mut self,
                  effect: SecretWriteEffect,
                  readback: &SecretReadback,
              ) -> Result<SecretTransitionReceipt, SecretError> {
                  let pending = self
                      .pending_creates
                      .get(&effect.reference)
                      .cloned()
                      .ok_or(SecretError::CreateNotPrepared)?;
                  if pending.effect != effect {
                      return Err(SecretError::OperationMismatch);
                  }
                  if pending.state == PendingSecretCreateState::Quarantined {
                      return Err(SecretError::CreateQuarantined);
                  }
                  match verify_present_readback(&effect, readback) {
                      Ok(platform_receipt) => {
                          self.commit_create(effect, platform_receipt)
                      }
                      Err(SecretError::OutcomeUnknown) => {
                          if let Some(pending) = self
                              .pending_creates
                              .get_mut(&effect.reference)
                          {
                              pending.state = PendingSecretCreateState::OutcomeUnknown;
                          }
                          Err(SecretError::OutcomeUnknown)
                      }
                      Err(error) => {
                          if let Some(pending) = self
                              .pending_creates
                              .get_mut(&effect.reference)
                          {
                              pending.state = PendingSecretCreateState::Quarantined;
                          }
                          Err(error)
                      }
                  }
              }

              /// Resolves a possible create commit by exact authoritative readback.
              pub fn recover_create(
                  &mut self,
                  reference: &SecretReference,
                  operation: &SecretOperation,
                  readback: &SecretReadback,
              ) -> Result<SecretCreateRecovery, SecretError> {
                  let pending = self
                      .pending_creates
                      .get(reference)
                      .cloned()
                      .ok_or(SecretError::CreateNotPrepared)?;
                  if &pending.effect.operation != operation {
                      return Err(SecretError::OperationMismatch);
                  }
                  if pending.state == PendingSecretCreateState::Quarantined {
                      return Ok(SecretCreateRecovery::Quarantined);
                  }
                  match readback {
                      SecretReadback::Present { .. } => {
                          match verify_present_readback(&pending.effect, readback) {
                              Ok(platform_receipt) => self
                                  .commit_create(pending.effect, platform_receipt)
                                  .map(SecretCreateRecovery::Created),
                              Err(_) => {
                                  if let Some(pending) = self.pending_creates.get_mut(reference) {
                                      pending.state = PendingSecretCreateState::Quarantined;
                                  }
                                  Ok(SecretCreateRecovery::Quarantined)
                              }
                          }
                      }
                      SecretReadback::Absent { receipt } => {
                          self.pending_creates.remove(reference);
                          Ok(SecretCreateRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      SecretReadback::Unverifiable => {
                          if let Some(pending) = self.pending_creates.get_mut(reference) {
                              pending.state = PendingSecretCreateState::OutcomeUnknown;
                          }
                          Ok(SecretCreateRecovery::OutcomeUnknown)
                      }
                      SecretReadback::Conflict => {
                          if let Some(pending) = self.pending_creates.get_mut(reference) {
                              pending.state = PendingSecretCreateState::Quarantined;
                          }
                          Ok(SecretCreateRecovery::Quarantined)
                      }
                  }
              }

              /// Returns the process-local lifecycle of one pending create.
              #[must_use]
              pub fn pending_create_state(
                  &self,
                  reference: &SecretReference,
              ) -> Option<PendingSecretCreateState> {
                  self.pending_creates.get(reference).map(|pending| pending.state)
              }

              fn commit_create(
                  &mut self,
                  effect: SecretWriteEffect,
                  platform_receipt: ReceiptRef,
              ) -> Result<SecretTransitionReceipt, SecretError> {
                  if self.records.contains_key(&effect.reference) {
                      return Err(SecretError::AlreadyExists);
                  }
                  let record_revision = NonZeroRevision::new(1)
                      .map_err(|_| SecretError::ContractExhausted)?;
                  let record = SecretRecord::new_active(
                      effect.reference.clone(),
                      effect.binding,
                      effect.version,
                      effect.ciphertext_digest,
                      record_revision,
                  );
                  self.pending_creates.remove(&effect.reference);
                  self.records.insert(effect.reference.clone(), record);
                  Ok(SecretTransitionReceipt {
                      reference: effect.reference,
                      binding: effect.binding,
                      version: effect.version,
                      record_revision,
                      operation: effect.operation,
                      platform_receipt,
                  })
              }
          '''
          text = text[:finish_start] + finish_replacement + text[finish_end:]

          mark_start = text.index('    /// Marks a prepared external mutation as outcome-unknown.')
          mark_end = text.index('\n    /// Issues a plaintext lease only for an exact active binding/version.', mark_start)
          mark_replacement = '''    /// Marks a prepared external mutation as outcome-unknown.
              pub fn mark_outcome_unknown(
                  &mut self,
                  reference: &SecretReference,
                  operation: &SecretOperation,
                  mutation: UnknownSecretMutation,
              ) -> Result<(), SecretError> {
                  if mutation == UnknownSecretMutation::Create {
                      let pending = self
                          .pending_creates
                          .get_mut(reference)
                          .ok_or(SecretError::CreateNotPrepared)?;
                      if &pending.effect.operation != operation {
                          return Err(SecretError::OperationMismatch);
                      }
                      if pending.state == PendingSecretCreateState::Quarantined {
                          return Err(SecretError::CreateQuarantined);
                      }
                      pending.state = PendingSecretCreateState::OutcomeUnknown;
                      return Ok(());
                  }

                  let record = self
                      .records
                      .get_mut(reference)
                      .ok_or(SecretError::NotFound)?;
                  let (expected_operation, expected_mutation) = match &record.state {
                      SecretRecordState::RotationPrepared { operation, .. } => {
                          (operation, UnknownSecretMutation::Rotate)
                      }
                      SecretRecordState::DeletePrepared { operation } => {
                          (operation, UnknownSecretMutation::Delete)
                      }
                      _ => return Err(SecretError::InvalidTransition),
                  };
                  if expected_operation != operation || expected_mutation != mutation {
                      return Err(SecretError::OperationMismatch);
                  }
                  record.state = SecretRecordState::OutcomeUnknown {
                      mutation,
                      operation: operation.clone(),
                  };
                  Ok(())
              }
          '''
          text = text[:mark_start] + mark_replacement + text[mark_end:]

          error_anchor = '''    /// Opaque reference already has a logical record.
              AlreadyExists,
              /// User/installation/incarnation/purpose binding differs.'''
          error_replacement = '''    /// Opaque reference already has a logical record.
              AlreadyExists,
              /// Create completion/recovery has no retained prepared effect.
              CreateNotPrepared,
              /// Same reference has another pending create effect.
              CreatePendingConflict,
              /// Pending create is quarantined by conflicting readback.
              CreateQuarantined,
              /// User/installation/incarnation/purpose binding differs.'''
          if 'CreateNotPrepared,' not in text:
              if error_anchor not in text:
                  raise SystemExit('SecretError create anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::AlreadyExists => "SECRET_ALREADY_EXISTS",
                      Self::BindingMismatch => "SECRET_BINDING_MISMATCH",'''
          code_replacement = '''            Self::AlreadyExists => "SECRET_ALREADY_EXISTS",
                      Self::CreateNotPrepared => "SECRET_CREATE_NOT_PREPARED",
                      Self::CreatePendingConflict => "SECRET_CREATE_PENDING_CONFLICT",
                      Self::CreateQuarantined => "SECRET_CREATE_QUARANTINED",
                      Self::BindingMismatch => "SECRET_BINDING_MISMATCH",'''
          if 'SECRET_CREATE_NOT_PREPARED' not in text:
              if code_anchor not in text:
                  raise SystemExit('SecretError code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-runtime/search-os-secrets/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Create outcome recovery

          Every secret create is retained as a bounded pending effect before the
          platform write can occur. `OutcomeUnknown` blocks blind reissue.
          Authoritative recovery accepts only exact binding/version/ciphertext
          readback, classifies exact absence as `NotApplied`, and quarantines
          conflicting evidence. Rotation and deletion outcome kinds must also
          match their prepared transition.
          '''
          if '## Create outcome recovery' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify secret create recovery and workspace
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-os-secrets --all-targets --locked
            cargo test -p search-os-secrets --all-targets --locked
            cargo clippy -p search-os-secrets --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pending_creates: BTreeMap<SecretReference, PendingSecretCreate>' crates/search-runtime/search-os-secrets/src/lib.rs
            grep -q 'pub fn recover_create' crates/search-runtime/search-os-secrets/src/lib.rs
            grep -q 'UnknownSecretMutation::Create' crates/search-runtime/search-os-secrets/src/lib.rs
            git diff --check
          } 2>&1 | tee secret-create-verify.log

      - name: Commit verified recovery or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-secret-create-recovery.yml
          mkdir -p qualification/os-secrets
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/os-secrets/LAST_FAILURE.txt
            cat > qualification/os-secrets/CREATE_RECOVERY_VERIFIED.md <<EOF
          # Secret create recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Secret creates now retain their exact effect before the platform
          mutation boundary. Unknown outcomes block blind replay and resolve only
          through exact Present, exact Absent, Unverifiable, or quarantined
          conflicting readback.
          EOF
            git add -A
            subject="fix(secrets): retain and recover unknown create outcomes"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-secret-create-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 350 secret-create-patch.log 2>/dev/null || true
              tail -n 700 secret-create-verify.log 2>/dev/null || true
            } > qualification/os-secrets/LAST_FAILURE.txt
            git add -A
            subject="verify(secrets): record failed create-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

name: Stage-specific read sets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-readsets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate stages and repeated-package contexts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate package and function registries
        shell: pwsh
        run: |
          & ./tools/validate-swarm.ps1 -Json
          & ./tools/validate-function-packets.ps1 -Json

      - name: Validate stage registry and reused-package contexts
        shell: pwsh
        run: ./tools/validate-stage-readsets.ps1 -Json

      - name: Validate current stage packets
        shell: pwsh
        run: |
          & ./tools/validate-implementation-packets.ps1 -Json
          & ./tools/validate-current-packets.ps1 -Json
          & ./tools/validate-w5-current.ps1 -Json
          & ./tools/validate-proof-packets.ps1 -Json
          & ./tools/validate-w7-lifecycle.ps1 -Json
          & ./tools/validate-w8-client-edge.ps1 -Json
          & ./tools/validate-w9-product-pulse.ps1 -Json
          & ./tools/validate-w10-optional-depth.ps1 -Json

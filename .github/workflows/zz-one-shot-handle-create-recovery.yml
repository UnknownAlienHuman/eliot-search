name: one-shot add handle create recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-handle-create-recovery.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-handle-create-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Retain exact handle create effect and recover it
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee handle-create-patch.log
          from pathlib import Path

          path = Path('crates/search-query/search-handles/src/lib.rs')
          text = path.read_text()

          effect_end = '''pub struct HandleWriteEffect {
              /// Expected record after durable readback.
              pub record: HandleRecord,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of complete canonical request.
              pub request_digest: Blake3Digest32,
          }
          '''
          pending_types = '''pub struct HandleWriteEffect {
              /// Expected record after durable readback.
              pub record: HandleRecord,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of complete canonical request.
              pub request_digest: Blake3Digest32,
          }

          /// Process-local lifecycle of a not-yet-committed handle create.
          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          pub enum PendingHandleCreateState {
              /// Exact content-free handle record is prepared.
              Prepared,
              /// Durable create may have committed and requires readback.
              OutcomeUnknown,
              /// Conflicting durable evidence blocks resolution and replay.
              Quarantined,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          struct PendingHandleCreate {
              effect: HandleWriteEffect,
              state: PendingHandleCreateState,
          }
          '''
          if 'pub enum PendingHandleCreateState {' not in text:
              if effect_end not in text:
                  raise SystemExit('HandleWriteEffect anchor missing')
              text = text.replace(effect_end, pending_types, 1)

          receipt_end = '''pub struct HandleReceipt {
              /// Stable handle identity.
              pub handle_id: HandleId,
              /// Record revision.
              pub record_revision: u64,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact store readback receipt.
              pub store_receipt: ReceiptRef,
          }
          '''
          recovery_type = '''pub struct HandleReceipt {
              /// Stable handle identity.
              pub handle_id: HandleId,
              /// Record revision.
              pub record_revision: u64,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact store readback receipt.
              pub store_receipt: ReceiptRef,
          }

          /// Authoritative recovery result for an unresolved handle create.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum HandleCreateRecovery {
              /// Exact handle record was verified and committed locally.
              Created(HandleReceipt),
              /// Exact handle ID is authoritatively absent; retry is safe.
              NotApplied {
                  /// Content-free absence receipt.
                  receipt: ReceiptRef,
              },
              /// Durable state remains unverifiable.
              OutcomeUnknown,
              /// Conflicting handle identity or record was observed.
              Quarantined,
          }
          '''
          if 'pub enum HandleCreateRecovery {' not in text:
              if receipt_end not in text:
                  raise SystemExit('HandleReceipt anchor missing')
              text = text.replace(receipt_end, recovery_type, 1)

          field_anchor = '''    records: BTreeMap<HandleId, HandleRecord>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          field_replacement = '''    records: BTreeMap<HandleId, HandleRecord>,
              pending_creates: BTreeMap<HandleId, PendingHandleCreate>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          if 'pending_creates: BTreeMap<HandleId, PendingHandleCreate>' not in text:
              if field_anchor not in text:
                  raise SystemExit('HandleCatalog field anchor missing')
              text = text.replace(field_anchor, field_replacement, 1)

          constructor_anchor = '''            records: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          constructor_replacement = '''            records: BTreeMap::new(),
                      pending_creates: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          if 'pending_creates: BTreeMap::new()' not in text:
              if constructor_anchor not in text:
                  raise SystemExit('HandleCatalog constructor anchor missing')
              text = text.replace(constructor_anchor, constructor_replacement, 1)

          prepare_start = text.index('    /// Prepares creation of one handle record.')
          prepare_end = text.index('\n    /// Accepts creation only after exact durable readback.', prepare_start)
          prepare_replacement = '''    /// Prepares creation of one handle record.
              ///
              /// Only token digest and content-free target/binding evidence enter
              /// the retained pending record; bearer token bytes are absent.
              pub fn prepare_create(
                  &mut self,
                  request: CreateHandleRequest,
              ) -> Result<HandleWriteEffect, HandleError> {
                  validate_create_request(&request, self.max_invalidation_refs)?;
                  if self.records.contains_key(&request.handle_id) {
                      return Err(HandleError::HandleIdCollision);
                  }
                  let record = HandleRecord {
                      handle_id: request.handle_id,
                      kind: request.kind,
                      token_digest: request.token_digest,
                      binding_id: request.binding_id,
                      grant_id: request.grant_id,
                      access_policy_revision: request.access_policy_revision,
                      owner_epoch: request.owner_epoch,
                      target: request.target,
                      issued_at_unix_ms: request.issued_at_unix_ms,
                      expires_at_unix_ms: request.expires_at_unix_ms,
                      retention_receipt: request.retention_receipt,
                      invalidation_refs: request.invalidation_refs,
                      record_revision: 1,
                      state: HandleState::Active,
                  };
                  let effect = HandleWriteEffect {
                      record,
                      operation: request.operation,
                      request_digest: request.request_digest,
                  };
                  if let Some(pending) = self.pending_creates.get(&effect.record.handle_id) {
                      if pending.effect != effect {
                          return Err(HandleError::CreatePendingConflict);
                      }
                      return match pending.state {
                          PendingHandleCreateState::Prepared => Ok(effect),
                          PendingHandleCreateState::OutcomeUnknown => {
                              Err(HandleError::OutcomeUnknown)
                          }
                          PendingHandleCreateState::Quarantined => {
                              Err(HandleError::CreateQuarantined)
                          }
                      };
                  }
                  let occupied = self
                      .records
                      .len()
                      .checked_add(self.pending_creates.len())
                      .ok_or(HandleError::HandleCapacityExceeded)?;
                  if occupied >= self.max_handles {
                      return Err(HandleError::HandleCapacityExceeded);
                  }
                  self.register_operation(&effect.operation, effect.request_digest)?;
                  self.pending_creates.insert(
                      effect.record.handle_id,
                      PendingHandleCreate {
                          effect: effect.clone(),
                          state: PendingHandleCreateState::Prepared,
                      },
                  );
                  Ok(effect)
              }
          '''
          text = text[:prepare_start] + prepare_replacement + text[prepare_end:]

          finish_start = text.index('    /// Accepts creation only after exact durable readback.')
          finish_end = text.index('\n    /// Resolves a bearer token only after all current authority checks pass.', finish_start)
          finish_replacement = '''    /// Accepts creation only after exact durable readback.
              pub fn finish_create(
                  &mut self,
                  effect: HandleWriteEffect,
                  readback: &HandleReadback,
              ) -> Result<HandleReceipt, HandleError> {
                  if let Some(existing) = self.records.get(&effect.record.handle_id) {
                      let receipt = match readback {
                          HandleReadback::Present { record, receipt }
                              if record == existing && record == &effect.record => receipt.clone(),
                          HandleReadback::Unverifiable => {
                              return Err(HandleError::OutcomeUnknown);
                          }
                          HandleReadback::Present { .. }
                          | HandleReadback::Absent { .. }
                          | HandleReadback::Conflict => {
                              return Err(HandleError::ReadbackMismatch);
                          }
                      };
                      return Ok(HandleReceipt {
                          handle_id: existing.handle_id,
                          record_revision: existing.record_revision,
                          operation: effect.operation,
                          store_receipt: receipt,
                      });
                  }

                  let pending = self
                      .pending_creates
                      .get(&effect.record.handle_id)
                      .cloned()
                      .ok_or(HandleError::CreateNotPrepared)?;
                  if pending.effect != effect {
                      return Err(HandleError::OperationMismatch);
                  }
                  if pending.state == PendingHandleCreateState::Quarantined {
                      return Err(HandleError::CreateQuarantined);
                  }
                  match readback {
                      HandleReadback::Present { record, receipt }
                          if record == &effect.record => {
                              self.commit_pending_create(pending, receipt.clone())
                          }
                      HandleReadback::Unverifiable => {
                          if let Some(pending) = self
                              .pending_creates
                              .get_mut(&effect.record.handle_id)
                          {
                              pending.state = PendingHandleCreateState::OutcomeUnknown;
                          }
                          Err(HandleError::OutcomeUnknown)
                      }
                      HandleReadback::Present { .. }
                      | HandleReadback::Absent { .. }
                      | HandleReadback::Conflict => {
                          if let Some(pending) = self
                              .pending_creates
                              .get_mut(&effect.record.handle_id)
                          {
                              pending.state = PendingHandleCreateState::Quarantined;
                          }
                          Err(HandleError::ReadbackMismatch)
                      }
                  }
              }

              /// Marks a prepared handle create as outcome-unknown.
              pub fn mark_create_outcome_unknown(
                  &mut self,
                  handle_id: HandleId,
                  operation: &MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<(), HandleError> {
                  let pending = self
                      .pending_creates
                      .get_mut(&handle_id)
                      .ok_or(HandleError::CreateNotPrepared)?;
                  if &pending.effect.operation != operation
                      || pending.effect.request_digest != request_digest
                  {
                      return Err(HandleError::OperationMismatch);
                  }
                  if pending.state == PendingHandleCreateState::Quarantined {
                      return Err(HandleError::CreateQuarantined);
                  }
                  pending.state = PendingHandleCreateState::OutcomeUnknown;
                  Ok(())
              }

              /// Resolves a possible handle create commit by exact readback.
              pub fn recover_create(
                  &mut self,
                  handle_id: HandleId,
                  operation: &MutationIdentity,
                  request_digest: Blake3Digest32,
                  readback: &HandleReadback,
              ) -> Result<HandleCreateRecovery, HandleError> {
                  let pending = self
                      .pending_creates
                      .get(&handle_id)
                      .cloned()
                      .ok_or(HandleError::CreateNotPrepared)?;
                  if &pending.effect.operation != operation
                      || pending.effect.request_digest != request_digest
                  {
                      return Err(HandleError::OperationMismatch);
                  }
                  if pending.state == PendingHandleCreateState::Quarantined {
                      return Ok(HandleCreateRecovery::Quarantined);
                  }
                  match readback {
                      HandleReadback::Present { record, receipt }
                          if record == &pending.effect.record => self
                              .commit_pending_create(pending, receipt.clone())
                              .map(HandleCreateRecovery::Created),
                      HandleReadback::Absent { receipt } => {
                          self.pending_creates.remove(&handle_id);
                          Ok(HandleCreateRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      HandleReadback::Unverifiable => {
                          if let Some(pending) = self.pending_creates.get_mut(&handle_id) {
                              pending.state = PendingHandleCreateState::OutcomeUnknown;
                          }
                          Ok(HandleCreateRecovery::OutcomeUnknown)
                      }
                      HandleReadback::Present { .. } | HandleReadback::Conflict => {
                          if let Some(pending) = self.pending_creates.get_mut(&handle_id) {
                              pending.state = PendingHandleCreateState::Quarantined;
                          }
                          Ok(HandleCreateRecovery::Quarantined)
                      }
                  }
              }

              /// Returns the process-local lifecycle of a pending handle create.
              #[must_use]
              pub fn pending_create_state(
                  &self,
                  handle_id: HandleId,
              ) -> Option<PendingHandleCreateState> {
                  self.pending_creates.get(&handle_id).map(|pending| pending.state)
              }

              fn commit_pending_create(
                  &mut self,
                  pending: PendingHandleCreate,
                  store_receipt: ReceiptRef,
              ) -> Result<HandleReceipt, HandleError> {
                  let handle_id = pending.effect.record.handle_id;
                  if self.records.contains_key(&handle_id) {
                      return Err(HandleError::HandleIdCollision);
                  }
                  self.pending_creates.remove(&handle_id);
                  self.records
                      .insert(handle_id, pending.effect.record.clone());
                  Ok(HandleReceipt {
                      handle_id,
                      record_revision: pending.effect.record.record_revision,
                      operation: pending.effect.operation,
                      store_receipt,
                  })
              }
          '''
          text = text[:finish_start] + finish_replacement + text[finish_end:]

          quarantine_start = text.index('    /// Quarantines one contradictory handle record.')
          quarantine_end = text.index('\n    fn register_operation(', quarantine_start)
          quarantine_replacement = '''    /// Quarantines one contradictory handle record or pending create.
              pub fn quarantine(&mut self, handle_id: HandleId) -> Result<(), HandleError> {
                  let mut found = false;
                  if let Some(pending) = self.pending_creates.get_mut(&handle_id) {
                      pending.state = PendingHandleCreateState::Quarantined;
                      found = true;
                  }
                  if let Some(record) = self.records.get_mut(&handle_id) {
                      record.state = HandleState::Quarantined;
                      found = true;
                  }
                  if found {
                      Ok(())
                  } else {
                      Err(HandleError::NotFound)
                  }
              }
          '''
          text = text[:quarantine_start] + quarantine_replacement + text[quarantine_end:]

          error_anchor = '''    /// Handle identity already belongs to another record.
              HandleIdCollision,
              /// Handle catalog capacity is exhausted.'''
          error_replacement = '''    /// Handle identity already belongs to another record.
              HandleIdCollision,
              /// Create completion/recovery has no retained pending effect.
              CreateNotPrepared,
              /// Same handle identity has another pending create effect.
              CreatePendingConflict,
              /// Pending create is quarantined by conflicting durable readback.
              CreateQuarantined,
              /// Prepared operation differs from completion or recovery request.
              OperationMismatch,
              /// Handle catalog capacity is exhausted.'''
          if 'CreateNotPrepared,' not in text:
              if error_anchor not in text:
                  raise SystemExit('HandleError create anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::HandleIdCollision => "HANDLE_ID_COLLISION",
                      Self::HandleCapacityExceeded => "HANDLE_CAPACITY_EXCEEDED",'''
          code_replacement = '''            Self::HandleIdCollision => "HANDLE_ID_COLLISION",
                      Self::CreateNotPrepared => "HANDLE_CREATE_NOT_PREPARED",
                      Self::CreatePendingConflict => "HANDLE_CREATE_PENDING_CONFLICT",
                      Self::CreateQuarantined => "HANDLE_CREATE_QUARANTINED",
                      Self::OperationMismatch => "HANDLE_OPERATION_MISMATCH",
                      Self::HandleCapacityExceeded => "HANDLE_CAPACITY_EXCEEDED",'''
          if 'HANDLE_CREATE_NOT_PREPARED' not in text:
              if code_anchor not in text:
                  raise SystemExit('HandleError code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-query/search-handles/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Handle create recovery

          A handle create retains the exact content-free record before durable
          mutation. Bearer bytes never enter the catalog; only the token digest
          is retained. Unknown outcomes block blind create replay and resolve by
          exact Present, exact Absent, Unverifiable, or quarantined conflict.
          '''
          if '## Handle create recovery' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify handle create recovery and workspace
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-handles --all-targets --locked
            cargo test -p search-handles --all-targets --locked
            cargo clippy -p search-handles --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pending_creates: BTreeMap<HandleId, PendingHandleCreate>' crates/search-query/search-handles/src/lib.rs
            grep -q 'pub fn recover_create' crates/search-query/search-handles/src/lib.rs
            grep -q 'pub fn mark_create_outcome_unknown' crates/search-query/search-handles/src/lib.rs
            git diff --check
          } 2>&1 | tee handle-create-verify.log

      - name: Commit verified recovery or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-handle-create-recovery.yml
          mkdir -p qualification/handles
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/handles/LAST_FAILURE.txt
            cat > qualification/handles/CREATE_RECOVERY_VERIFIED.md <<EOF
          # Handle create recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Handle creates now retain an exact content-free effect before durable
          mutation. Unknown outcomes block blind replay and resolve only through
          authoritative readback. Bearer token bytes remain outside the catalog.
          EOF
            git add -A
            subject="fix(handles): retain and recover unknown create outcomes"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-handle-create-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 400 handle-create-patch.log 2>/dev/null || true
              tail -n 750 handle-create-verify.log 2>/dev/null || true
            } > qualification/handles/LAST_FAILURE.txt
            git add -A
            subject="verify(handles): record failed create-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

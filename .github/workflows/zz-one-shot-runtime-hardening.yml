name: one-shot harden DIRECT runtime identity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-runtime-hardening.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-harden-direct-runtime
  cancel-in-progress: false

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Apply endpoint and final-handle identity hardening
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee runtime-hardening-patch.log
          from pathlib import Path

          daemon_path = Path('bins/eliot-searchd/src/main.rs')
          daemon = daemon_path.read_text()

          import_anchor = 'use std::net::{IpAddr, SocketAddr, TcpListener, TcpStream};\n'
          imports = '''use std::net::{IpAddr, SocketAddr, TcpListener, TcpStream};
          #[cfg(unix)]
          use std::os::unix::fs::MetadataExt as _;
          #[cfg(windows)]
          use std::os::windows::fs::{MetadataExt as _, OpenOptionsExt as _};
          '''
          if import_anchor not in daemon:
              raise SystemExit('daemon import anchor missing')
          daemon = daemon.replace(import_anchor, imports, 1)

          constant_anchor = 'const IO_TIMEOUT: Duration = Duration::from_secs(10);\n'
          constants = '''const IO_TIMEOUT: Duration = Duration::from_secs(10);
          #[cfg(windows)]
          const FILE_ATTRIBUTE_REPARSE_POINT: u32 = 0x0000_0400;
          #[cfg(windows)]
          const FILE_FLAG_OPEN_REPARSE_POINT: u32 = 0x0020_0000;
          #[cfg(windows)]
          const FILE_SHARE_READ: u32 = 0x0000_0001;
          '''
          if constant_anchor not in daemon:
              raise SystemExit('daemon constant anchor missing')
          daemon = daemon.replace(constant_anchor, constants, 1)

          old_descriptor = 'ELIOT_SEARCH_ENDPOINT_V1\\naddress={address}\\nprotocol={PROTOCOL}\\nversion={VERSION}\\ndirect_available={direct_available}\\nindexed_available=false\\n'
          new_descriptor = 'ELIOT_SEARCH_ENDPOINT_V1\\naddress={address}\\nprotocol={PROTOCOL}\\nversion={VERSION}\\ninstance_pid={}\\ndirect_available={direct_available}\\nindexed_available=false\\n'
          if old_descriptor not in daemon:
              raise SystemExit('daemon endpoint descriptor anchor missing')
          daemon = daemon.replace(old_descriptor, new_descriptor, 1)
          old_format_tail = '''            direct_available
                  );'''
          new_format_tail = '''            std::process::id(),
                      direct_available
                  );'''
          if old_format_tail not in daemon:
              raise SystemExit('daemon endpoint format arguments missing')
          daemon = daemon.replace(old_format_tail, new_format_tail, 1)

          daemon = daemon.replace(
              'if metadata.file_type().is_symlink() {',
              'if metadata_is_link_like(&metadata) {',
          )

          scan_start = daemon.index('fn scan_file(')
          scan_end = daemon.index('\nimpl SearchAccumulator {', scan_start)
          hardened_scan = r'''#[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct StableFileIdentity {
              storage_domain: u64,
              object: u64,
          }

          #[cfg(unix)]
          fn stable_file_identity(metadata: &fs::Metadata) -> Option<StableFileIdentity> {
              Some(StableFileIdentity {
                  storage_domain: metadata.dev(),
                  object: metadata.ino(),
              })
          }

          #[cfg(windows)]
          fn stable_file_identity(metadata: &fs::Metadata) -> Option<StableFileIdentity> {
              Some(StableFileIdentity {
                  storage_domain: u64::from(metadata.volume_serial_number()?),
                  object: metadata.file_index()?,
              })
          }

          #[cfg(not(any(unix, windows)))]
          fn stable_file_identity(_metadata: &fs::Metadata) -> Option<StableFileIdentity> {
              None
          }

          fn metadata_is_link_like(metadata: &fs::Metadata) -> bool {
              if metadata.file_type().is_symlink() {
                  return true;
              }
              #[cfg(windows)]
              {
                  return metadata.file_attributes() & FILE_ATTRIBUTE_REPARSE_POINT != 0;
              }
              #[cfg(not(windows))]
              {
                  false
              }
          }

          fn open_stable_file(path: &Path) -> io::Result<File> {
              let mut options = OpenOptions::new();
              options.read(true);
              #[cfg(windows)]
              {
                  options
                      .share_mode(FILE_SHARE_READ)
                      .custom_flags(FILE_FLAG_OPEN_REPARSE_POINT);
              }
              options.open(path)
          }

          fn scan_file(
              root_index: usize,
              root: &Path,
              path: &Path,
              accumulator: &mut SearchAccumulator,
          ) {
              if accumulator.files_scanned >= MAX_FILES_SCANNED {
                  accumulator.partial = true;
                  accumulator.hard_stop = true;
                  return;
              }
              accumulator.files_scanned += 1;

              let path_before = match fs::symlink_metadata(path) {
                  Ok(metadata) if metadata.is_file() && !metadata_is_link_like(&metadata) => metadata,
                  _ => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let canonical_before = match fs::canonicalize(path) {
                  Ok(canonical) if canonical == path && canonical.starts_with(root) => canonical,
                  _ => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let expected_identity = match stable_file_identity(&path_before) {
                  Some(identity) => identity,
                  None => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let mut file = match open_stable_file(path) {
                  Ok(file) => file,
                  Err(_) => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let before = match file.metadata() {
                  Ok(metadata)
                      if metadata.is_file()
                          && !metadata_is_link_like(&metadata)
                          && stable_file_identity(&metadata) == Some(expected_identity) => metadata,
                  _ => {
                      accumulator.record_gap();
                      return;
                  }
              };
              if before.len() > u64::try_from(MAX_FILE_BYTES).expect("file ceiling fits u64") {
                  accumulator.record_gap();
                  return;
              }
              let Some(next_total) = accumulator.bytes_scanned.checked_add(before.len()) else {
                  accumulator.partial = true;
                  accumulator.hard_stop = true;
                  return;
              };
              if next_total > MAX_TOTAL_BYTES {
                  accumulator.partial = true;
                  accumulator.hard_stop = true;
                  return;
              }

              let mut bytes = Vec::new();
              if file
                  .by_ref()
                  .take(
                      u64::try_from(MAX_FILE_BYTES)
                          .expect("file ceiling fits u64")
                          .saturating_add(1),
                  )
                  .read_to_end(&mut bytes)
                  .is_err()
                  || bytes.len() > MAX_FILE_BYTES
              {
                  accumulator.record_gap();
                  return;
              }

              let after = match file.metadata() {
                  Ok(metadata) => metadata,
                  Err(_) => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let path_after = match fs::symlink_metadata(path) {
                  Ok(metadata) if metadata.is_file() && !metadata_is_link_like(&metadata) => metadata,
                  _ => {
                      accumulator.record_gap();
                      return;
                  }
              };
              let canonical_after = match fs::canonicalize(path) {
                  Ok(canonical) => canonical,
                  Err(_) => {
                      accumulator.record_gap();
                      return;
                  }
              };
              if canonical_after != canonical_before
                  || stable_file_identity(&after) != Some(expected_identity)
                  || stable_file_identity(&path_after) != Some(expected_identity)
                  || !same_file_snapshot(&before, &after)
                  || u64::try_from(bytes.len()).ok() != Some(before.len())
              {
                  accumulator.record_gap();
                  return;
              }
              accumulator.bytes_scanned = next_total;

              let Ok(text) = std::str::from_utf8(&bytes) else {
                  accumulator.record_gap();
                  return;
              };
              let relative = match canonical_before.strip_prefix(root) {
                  Ok(relative) => relative.to_string_lossy().replace('\\', "/"),
                  Err(_) => {
                      accumulator.record_gap();
                      return;
                  }
              };
              if relative.as_bytes().len() > MAX_RELATIVE_PATH_BYTES {
                  accumulator.record_gap();
                  return;
              }

              for (index, line) in text.lines().enumerate() {
                  if !line.to_lowercase().contains(&accumulator.query_lower) {
                      continue;
                  }
                  accumulator.total_matches = accumulator.total_matches.saturating_add(1);
                  if accumulator.hits.len() >= accumulator.result_limit {
                      continue;
                  }
                  let line_number = u64::try_from(index)
                      .ok()
                      .and_then(|value| value.checked_add(1))
                      .unwrap_or(u64::MAX);
                  let preview = line.chars().take(MAX_PREVIEW_CHARS).collect::<String>();
                  accumulator.hits.push(SearchHit {
                      root_index,
                      relative_path: relative.clone(),
                      line_number,
                      preview,
                  });
              }
          }

          fn same_file_snapshot(before: &fs::Metadata, after: &fs::Metadata) -> bool {
              if stable_file_identity(before).is_none()
                  || stable_file_identity(before) != stable_file_identity(after)
                  || before.len() != after.len()
              {
                  return false;
              }
              #[cfg(unix)]
              {
                  before.mode() == after.mode()
                      && before.mtime() == after.mtime()
                      && before.mtime_nsec() == after.mtime_nsec()
                      && before.ctime() == after.ctime()
                      && before.ctime_nsec() == after.ctime_nsec()
              }
              #[cfg(windows)]
              {
                  before.file_attributes() == after.file_attributes()
                      && before.creation_time() == after.creation_time()
                      && before.last_write_time() == after.last_write_time()
                      && before.file_size() == after.file_size()
              }
              #[cfg(not(any(unix, windows)))]
              {
                  false
              }
          }
          '''
          daemon = daemon[:scan_start] + hardened_scan + daemon[scan_end:]

          reject_start = daemon.index('fn reject_symlink(')
          reject_end = daemon.index('\n\nstruct RuntimeState', reject_start)
          hardened_reject = '''fn reject_symlink(path: &Path) -> Result<(), DaemonError> {
              match fs::symlink_metadata(path) {
                  Ok(metadata) if metadata_is_link_like(&metadata) => Err(DaemonError::SymlinkDenied),
                  Ok(_) => Ok(()),
                  Err(error) if error.kind() == io::ErrorKind::NotFound => Ok(()),
                  Err(error) => Err(DaemonError::Io(error)),
              }
          }'''
          daemon = daemon[:reject_start] + hardened_reject + daemon[reject_end:]
          daemon_path.write_text(daemon)

          cli_path = Path('bins/eliot-search/src/main.rs')
          cli = cli_path.read_text()
          cli = cli.replace(
              '''    version: String,
              direct_available: bool,''',
              '''    version: String,
              instance_pid: u32,
              direct_available: bool,''',
              1,
          )
          cli = cli.replace(
              '''    let mut version = None;
              let mut direct_available = None;''',
              '''    let mut version = None;
              let mut instance_pid = None;
              let mut direct_available = None;''',
              1,
          )
          cli = cli.replace(
              '''            "version" if version.is_none() => version = Some(value.to_owned()),
              "direct_available" if direct_available.is_none() => {''',
              '''            "version" if version.is_none() => version = Some(value.to_owned()),
              "instance_pid" if instance_pid.is_none() => {
                  let parsed = value
                      .parse::<u32>()
                      .map_err(|_| ClientError::InvalidDescriptor)?;
                  if parsed == 0 {
                      return Err(ClientError::InvalidDescriptor);
                  }
                  instance_pid = Some(parsed);
              }
              "direct_available" if direct_available.is_none() => {''',
              1,
          )
          cli = cli.replace(
              '''        version: version.ok_or(ClientError::InvalidDescriptor)?,
              direct_available:''',
              '''        version: version.ok_or(ClientError::InvalidDescriptor)?,
              instance_pid: instance_pid.ok_or(ClientError::InvalidDescriptor)?,
              direct_available:''',
              1,
          )
          cli = cli.replace(
              '''    if descriptor.protocol != PROTOCOL || !descriptor.address.ip().is_loopback() {''',
              '''    if descriptor.protocol != PROTOCOL
              || descriptor.version.is_empty()
              || descriptor.instance_pid == 0
              || !descriptor.address.ip().is_loopback()
              {''',
              1,
          )
          cli_path.write_text(cli)

          runner_path = Path('tools/eliot-search-dev.ps1')
          runner = runner_path.read_text()
          function_start = runner.index('function Get-EndpointGeneration {')
          switch_start = runner.index('\nswitch ($Command)', function_start)
          endpoint_functions = r'''function Get-EndpointInstancePid {
              if (-not (Test-Path -LiteralPath $EndpointFile -PathType Leaf)) {
                  return $null
              }
              Assert-PlainPath -Path $EndpointFile
              foreach ($line in Get-Content -LiteralPath $EndpointFile) {
                  if (-not $line.StartsWith('instance_pid=', [StringComparison]::Ordinal)) {
                      continue
                  }
                  $parsed = 0
                  $value = $line.Substring('instance_pid='.Length)
                  if (-not [int]::TryParse($value, [ref]$parsed) -or $parsed -le 0) {
                      throw 'Endpoint descriptor contains an invalid instance PID.'
                  }
                  return $parsed
              }
              throw 'Endpoint descriptor does not contain an instance PID.'
          }

          function Wait-NewEndpoint {
              param([Parameter(Mandatory)][Diagnostics.Process]$Process)

              $deadline = [DateTime]::UtcNow.AddMilliseconds($TimeoutMs)
              do {
                  if ($Process.HasExited) {
                      throw "Daemon exited before publishing its endpoint; exit code $($Process.ExitCode)."
                  }
                  $endpointPid = Get-EndpointInstancePid
                  if ($null -ne $endpointPid -and $endpointPid -eq $Process.Id) {
                      return
                  }
                  Start-Sleep -Milliseconds 100
              } while ([DateTime]::UtcNow -lt $deadline)
              throw "Daemon did not publish its endpoint within ${TimeoutMs}ms."
          }
          '''
          runner = runner[:function_start] + endpoint_functions + runner[switch_start:]
          runner = runner.replace(
              '        $previousGeneration = Get-EndpointGeneration\n',
              '',
              1,
          )
          runner = runner.replace(
              '            Wait-NewEndpoint -Process $process -PreviousGeneration $previousGeneration',
              '            Wait-NewEndpoint -Process $process',
              1,
          )
          runner_path.write_text(runner)

          test_path = Path('bins/eliot-searchd/tests/direct_runtime.rs')
          test = test_path.read_text()
          address_block = '''            assert!(address.ip().is_loopback());
              return address;'''
          pid_block = '''            assert!(address.ip().is_loopback());
              let instance_pid = text
                  .lines()
                  .find_map(|line| line.strip_prefix("instance_pid="))
                  .expect("endpoint descriptor instance PID")
                  .parse::<u32>()
                  .expect("valid endpoint instance PID");
              assert_eq!(instance_pid, child.id());
              return address;'''
          if address_block not in test:
              raise SystemExit('runtime test endpoint anchor missing')
          test_path.write_text(test.replace(address_block, pid_block, 1))

          docs_path = Path('docs/QUICKSTART.md')
          docs = docs_path.read_text()
          docs = docs.replace(
              '- `endpoint.txt` — a token-free loopback endpoint descriptor;',
              '- `endpoint.txt` — a token-free loopback descriptor bound to the exact daemon PID;',
          )
          docs = docs.replace('- bounded daemon stdout/stderr logs.\n', '')
          docs = docs.replace(
              '- one open file handle for metadata-before, read, and metadata-after verification;',
              '- one open file handle for metadata-before, read, and metadata-after verification;\n- stable volume/device plus file-object identity checked across path and handle observations;\n- Windows write/delete sharing denied while the exact read handle is active;',
          )
          docs_path.write_text(docs)
          PY
          cargo fmt --all 2>&1 | tee -a runtime-hardening-patch.log

      - name: Validate hardened workspace and runtime
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/eliot-search-dev.ps1),[ref]$tokens,[ref]$errors)>$null;if($errors.Count){$errors|Format-List -Force|Out-String|Write-Error;exit 1}'
            pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path qualification/direct-runtime/test_windows_runner.ps1),[ref]$tokens,[ref]$errors)>$null;if($errors.Count){$errors|Format-List -Force|Out-String|Write-Error;exit 1}'
            cargo fmt --all -- --check
            cargo check --workspace --all-targets --locked
            cargo test --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo doc --workspace --no-deps --locked
            cargo run --locked -q -p eliot-searchd -- --self-test
            cargo run --locked -q -p eliot-search -- --self-test
            cargo run --locked -q -p eliot-search-model-worker -- --self-test
            cargo run --locked -q -p eliot-search-doc-worker -- --self-test
            pwsh -NoProfile -File qualification/direct-runtime/test_windows_runner.ps1
            git diff --check
          } 2>&1 | tee runtime-hardening-verify.log

      - name: Commit only a fully verified hardening or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-runtime-hardening.yml
          mkdir -p qualification/direct-runtime
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            cat > qualification/direct-runtime/LAST_VERIFIED.md <<EOF
          # DIRECT runtime verification

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`
          Verified working tree: endpoint PID binding plus stable final-handle identity hardening.
          Runner: \`windows-latest\`
          Rust: \`1.98.0\`

          Passed workspace formatting, compile, tests, Clippy with warnings denied,
          rustdoc, all executable self-tests, Rust daemon integration tests, and
          the Windows start/search/stop/restart path with spaces and persisted roots.
          EOF
            rm -f qualification/direct-runtime/LAST_FAILURE.txt qualification/direct-runtime/LAST_HARDENING_FAILURE.txt
            git add -A
            subject="fix(runtime): bind endpoint and DIRECT reads to stable identities"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-runtime-hardening.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              printf '%s\n' '--- patch log tail ---'
              tail -n 300 runtime-hardening-patch.log 2>/dev/null || true
              printf '%s\n' '--- verification log tail ---'
              tail -n 500 runtime-hardening-verify.log 2>/dev/null || true
            } > qualification/direct-runtime/LAST_HARDENING_FAILURE.txt
            git add -A
            subject="verify(runtime): record failed identity hardening"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

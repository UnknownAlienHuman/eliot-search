name: Temporary P00 validator parser repair

on:
  push:
    branches:
      - "prep/p00-foundation-acceptance-matrix"

permissions:
  contents: write

concurrency:
  group: temp-p00-parser-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-validate:
    name: Repair parsers and execute Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Patch bracketed TOML array terminators
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          replacements = {
              Path("tools/validate-p00-ticket-drafts.ps1"): (
                  r"""    $match = [regex]::Match($Text, ('(?ms)^{0}\s*=\s*\[(.*?)\]' -f [regex]::Escape($Key)))""",
                  r"""    $match = [regex]::Match($Text, ('(?ms)^{0}[ \t]*=[ \t]*\[(.*?)\][ \t]*\r?$' -f [regex]::Escape($Key)))""",
              ),
              Path("tools/validate-ticket-issuance-contracts.ps1"): (
                  r"""    $pattern = '(?ms)^{0}\s*=\s*\[(.*?)\]' -f [regex]::Escape($Key)""",
                  r"""    $pattern = '(?ms)^{0}[ \t]*=[ \t]*\[(.*?)\][ \t]*\r?$' -f [regex]::Escape($Key)""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one legacy array regex, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          '@ | python -

      - name: Remove temporary automatic workflow from validation tree
        shell: pwsh
        run: Remove-Item .github/workflows/_temp-p00-foundation-acceptance.yml -Force

      - name: Check textual patch
        shell: pwsh
        run: git diff --check

      - name: Compile Python validator
        shell: pwsh
        run: python -m py_compile tools/validate-p00-foundation-acceptance.py

      - name: Validate P00 foundation acceptance closure
        shell: pwsh
        run: python tools/validate-p00-foundation-acceptance.py --json

      - name: Revalidate repository topology
        shell: pwsh
        run: ./tools/validate-swarm.ps1 -Json

      - name: Revalidate P00 drafts
        shell: pwsh
        run: ./tools/validate-p00-ticket-drafts.ps1 -Json

      - name: Revalidate ticket issuance schemas
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

      - name: Commit verified parser repairs and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate-p00-ticket-drafts.ps1 tools/validate-ticket-issuance-contracts.ps1 .github/workflows/_temp-p00-foundation-acceptance.yml
          git commit -m "fix: parse bracketed TOML arrays exactly"
          git push origin HEAD:refs/heads/prep/p00-foundation-acceptance-matrix

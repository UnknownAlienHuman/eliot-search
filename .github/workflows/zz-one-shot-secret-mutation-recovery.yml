name: one-shot recover secret rotation and deletion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-secret-mutation-recovery.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-secret-mutation-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Determine whether baseline is clean
        id: baseline
        shell: bash
        run: |
          proceed=true
          test -f qualification/CURRENT_STATUS.md || proceed=false
          test ! -f qualification/CURRENT_FAILURES.txt || proceed=false
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "clean baseline: $proceed"

      - name: Install exact Rust toolchain
        if: steps.baseline.outputs.proceed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Preserve unknown rotation metadata and add exact recovery
        id: patch
        if: steps.baseline.outputs.proceed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee secret-mutation-patch.log
          from pathlib import Path

          path = Path('crates/search-runtime/search-os-secrets/src/lib.rs')
          text = path.read_text()

          old_unknown = '''    /// An external mutation may have completed.
              OutcomeUnknown {
                  /// Mutation kind.
                  mutation: UnknownSecretMutation,
                  /// Immutable operation requiring readback.
                  operation: SecretOperation,
              },'''
          new_unknown = '''    /// An external mutation may have completed.
              OutcomeUnknown {
                  /// Mutation kind.
                  mutation: UnknownSecretMutation,
                  /// Immutable operation requiring readback.
                  operation: SecretOperation,
                  /// Expected next version for rotation; absent for deletion.
                  next_version: Option<NonZeroRevision>,
                  /// Expected replacement ciphertext digest; absent for deletion.
                  ciphertext_digest: Option<Blake3Digest32>,
              },'''
          if old_unknown in text:
              text = text.replace(old_unknown, new_unknown, 1)
          elif 'next_version: Option<NonZeroRevision>' not in text:
              raise SystemExit('SecretRecordState OutcomeUnknown anchor missing')

          receipt_anchor = '''pub struct SecretTransitionReceipt {
              /// Opaque secret locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version after the transition, or the final deleted version.
              pub version: NonZeroRevision,
              /// Logical record revision after the transition.
              pub record_revision: NonZeroRevision,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
              /// Exact platform readback receipt.
              pub platform_receipt: ReceiptRef,
          }
          '''
          recovery_types = '''pub struct SecretTransitionReceipt {
              /// Opaque secret locator.
              pub reference: SecretReference,
              /// Exact authority binding.
              pub binding: SecretBinding,
              /// Version after the transition, or the final deleted version.
              pub version: NonZeroRevision,
              /// Logical record revision after the transition.
              pub record_revision: NonZeroRevision,
              /// Immutable mutation identity.
              pub operation: SecretOperation,
              /// Exact platform readback receipt.
              pub platform_receipt: ReceiptRef,
          }

          /// Authoritative recovery of a rotation attempt.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum SecretRotationRecovery {
              /// Exact replacement version is present.
              Rotated(SecretTransitionReceipt),
              /// Exact old version remains; retry is safe.
              NotApplied {
                  /// Content-free current-version readback receipt.
                  receipt: ReceiptRef,
              },
              /// Platform state remains unverifiable.
              OutcomeUnknown,
              /// Missing or conflicting identity/version/ciphertext evidence.
              Quarantined,
          }

          /// Authoritative recovery of a deletion attempt.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum SecretDeleteRecovery {
              /// Exact reference is absent and deletion is terminal.
              Deleted(SecretTransitionReceipt),
              /// Exact old version remains; retry is safe.
              NotApplied {
                  /// Content-free current-version readback receipt.
                  receipt: ReceiptRef,
              },
              /// Platform state remains unverifiable.
              OutcomeUnknown,
              /// Missing or conflicting identity/version/ciphertext evidence.
              Quarantined,
          }
          '''
          if 'pub enum SecretRotationRecovery {' not in text:
              if receipt_anchor not in text:
                  raise SystemExit('SecretTransitionReceipt anchor missing')
              text = text.replace(receipt_anchor, recovery_types, 1)

          field_anchor = '''    pending_creates: BTreeMap<SecretReference, PendingSecretCreate>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          field_replacement = '''    pending_creates: BTreeMap<SecretReference, PendingSecretCreate>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,
              terminal_receipts: BTreeMap<OpaqueId, SecretTransitionReceipt>,'''
          if 'terminal_receipts: BTreeMap<OpaqueId, SecretTransitionReceipt>' not in text:
              if field_anchor not in text:
                  raise SystemExit('SecretCatalog operation field anchor missing')
              text = text.replace(field_anchor, field_replacement, 1)

          constructor_anchor = '''            pending_creates: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          constructor_replacement = '''            pending_creates: BTreeMap::new(),
                      operations: BTreeMap::new(),
                      terminal_receipts: BTreeMap::new(),'''
          if 'terminal_receipts: BTreeMap::new()' not in text:
              if constructor_anchor not in text:
                  raise SystemExit('SecretCatalog constructor anchor missing')
              text = text.replace(constructor_anchor, constructor_replacement, 1)

          for method_name in ('prepare_create', 'prepare_rotation', 'prepare_delete'):
              start = text.index(f'    pub fn {method_name}(')
              body = text.index('    ) -> Result<', start)
              brace = text.index(' {\n', body) + len(' {\n')
              region_end = text.find('\n    ///', brace)
              region = text[brace:region_end]
              if 'reject_terminal_operation' not in region[:500]:
                  operation_expression = '&operation'
                  if method_name == 'prepare_create':
                      operation_expression = '&operation'
                  insertion = f'        self.reject_terminal_operation({operation_expression})?;\n'
                  text = text[:brace] + insertion + text[brace:]

          rotation_start = text.index('    /// Commits an exact prepared rotation after readback.')
          rotation_end = text.index('\n    /// Prepares deletion of one exact bound reference.', rotation_start)
          rotation_replacement = '''    /// Commits or recovers an exact prepared rotation after readback.
              pub fn finish_rotation(
                  &mut self,
                  effect: SecretWriteEffect,
                  readback: &SecretReadback,
              ) -> Result<SecretTransitionReceipt, SecretError> {
                  match self.recover_rotation(effect, readback)? {
                      SecretRotationRecovery::Rotated(receipt) => Ok(receipt),
                      SecretRotationRecovery::NotApplied { .. } => {
                          Err(SecretError::MutationNotApplied)
                      }
                      SecretRotationRecovery::OutcomeUnknown => {
                          Err(SecretError::OutcomeUnknown)
                      }
                      SecretRotationRecovery::Quarantined => {
                          Err(SecretError::ReadbackMismatch)
                      }
                  }
              }

              /// Resolves a possible rotation commit by exact authoritative readback.
              pub fn recover_rotation(
                  &mut self,
                  effect: SecretWriteEffect,
                  readback: &SecretReadback,
              ) -> Result<SecretRotationRecovery, SecretError> {
                  let current = self
                      .records
                      .get(&effect.reference)
                      .cloned()
                      .ok_or(SecretError::NotFound)?;
                  let (operation, next_version, next_digest) = match &current.state {
                      SecretRecordState::RotationPrepared {
                          operation,
                          next_version,
                          ciphertext_digest,
                      } => (operation, *next_version, *ciphertext_digest),
                      SecretRecordState::OutcomeUnknown {
                          mutation: UnknownSecretMutation::Rotate,
                          operation,
                          next_version: Some(next_version),
                          ciphertext_digest: Some(ciphertext_digest),
                      } => (operation, *next_version, *ciphertext_digest),
                      SecretRecordState::Quarantined => {
                          return Ok(SecretRotationRecovery::Quarantined);
                      }
                      _ => return Err(SecretError::InvalidTransition),
                  };
                  if operation != &effect.operation
                      || next_version != effect.version
                      || next_digest != effect.ciphertext_digest
                      || current.binding != effect.binding
                  {
                      return Err(SecretError::OperationMismatch);
                  }

                  match readback {
                      SecretReadback::Present {
                          binding,
                          version,
                          ciphertext_digest,
                          receipt,
                      } if *binding == effect.binding
                          && *version == effect.version
                          && *ciphertext_digest == effect.ciphertext_digest => {
                          let record = self
                              .records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?;
                          record.version = effect.version;
                          record.ciphertext_digest = effect.ciphertext_digest;
                          record.record_revision = record
                              .record_revision
                              .checked_next()
                              .map_err(|_| SecretError::ContractExhausted)?;
                          record.state = SecretRecordState::Active;
                          let transition = SecretTransitionReceipt {
                              reference: effect.reference,
                              binding: effect.binding,
                              version: effect.version,
                              record_revision: record.record_revision,
                              operation: effect.operation,
                              platform_receipt: receipt.clone(),
                          };
                          self.record_terminal_receipt(transition.clone());
                          Ok(SecretRotationRecovery::Rotated(transition))
                      }
                      SecretReadback::Present {
                          binding,
                          version,
                          ciphertext_digest,
                          receipt,
                      } if *binding == current.binding
                          && *version == current.version
                          && *ciphertext_digest == current.ciphertext_digest => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::Active;
                          Ok(SecretRotationRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      SecretReadback::Unverifiable => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::OutcomeUnknown {
                              mutation: UnknownSecretMutation::Rotate,
                              operation: effect.operation,
                              next_version: Some(effect.version),
                              ciphertext_digest: Some(effect.ciphertext_digest),
                          };
                          Ok(SecretRotationRecovery::OutcomeUnknown)
                      }
                      SecretReadback::Present { .. }
                      | SecretReadback::Absent { .. }
                      | SecretReadback::Conflict => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::Quarantined;
                          Ok(SecretRotationRecovery::Quarantined)
                      }
                  }
              }
          '''
          text = text[:rotation_start] + rotation_replacement + text[rotation_end:]

          delete_start = text.index('    /// Commits deletion only after the platform proves exact absence.')
          delete_end = text.index('\n    /// Marks a prepared external mutation as outcome-unknown.', delete_start)
          delete_replacement = '''    /// Commits or recovers deletion after exact authoritative readback.
              pub fn finish_delete(
                  &mut self,
                  effect: SecretDeleteEffect,
                  readback: &SecretReadback,
              ) -> Result<SecretTransitionReceipt, SecretError> {
                  match self.recover_delete(effect, readback)? {
                      SecretDeleteRecovery::Deleted(receipt) => Ok(receipt),
                      SecretDeleteRecovery::NotApplied { .. } => {
                          Err(SecretError::MutationNotApplied)
                      }
                      SecretDeleteRecovery::OutcomeUnknown => {
                          Err(SecretError::OutcomeUnknown)
                      }
                      SecretDeleteRecovery::Quarantined => {
                          Err(SecretError::DeleteReadbackMismatch)
                      }
                  }
              }

              /// Resolves a possible deletion commit by exact authoritative readback.
              pub fn recover_delete(
                  &mut self,
                  effect: SecretDeleteEffect,
                  readback: &SecretReadback,
              ) -> Result<SecretDeleteRecovery, SecretError> {
                  let current = self
                      .records
                      .get(&effect.reference)
                      .cloned()
                      .ok_or(SecretError::NotFound)?;
                  let operation = match &current.state {
                      SecretRecordState::DeletePrepared { operation } => operation,
                      SecretRecordState::OutcomeUnknown {
                          mutation: UnknownSecretMutation::Delete,
                          operation,
                          next_version: None,
                          ciphertext_digest: None,
                      } => operation,
                      SecretRecordState::Deleted {
                          operation,
                          receipt,
                      } if operation == &effect.operation => {
                          let transition = self
                              .terminal_receipts
                              .get(&operation.mutation().operation_id)
                              .cloned()
                              .ok_or(SecretError::LedgerCorrupt)?;
                          if transition.platform_receipt != *receipt {
                              return Err(SecretError::LedgerCorrupt);
                          }
                          return Ok(SecretDeleteRecovery::Deleted(transition));
                      }
                      SecretRecordState::Quarantined => {
                          return Ok(SecretDeleteRecovery::Quarantined);
                      }
                      _ => return Err(SecretError::InvalidTransition),
                  };
                  if operation != &effect.operation
                      || current.binding != effect.binding
                      || current.version != effect.version
                  {
                      return Err(SecretError::OperationMismatch);
                  }

                  match readback {
                      SecretReadback::Absent { receipt } => {
                          let record = self
                              .records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?;
                          record.record_revision = record
                              .record_revision
                              .checked_next()
                              .map_err(|_| SecretError::ContractExhausted)?;
                          record.state = SecretRecordState::Deleted {
                              operation: effect.operation.clone(),
                              receipt: receipt.clone(),
                          };
                          let transition = SecretTransitionReceipt {
                              reference: effect.reference,
                              binding: effect.binding,
                              version: effect.version,
                              record_revision: record.record_revision,
                              operation: effect.operation,
                              platform_receipt: receipt.clone(),
                          };
                          self.record_terminal_receipt(transition.clone());
                          Ok(SecretDeleteRecovery::Deleted(transition))
                      }
                      SecretReadback::Present {
                          binding,
                          version,
                          ciphertext_digest,
                          receipt,
                      } if *binding == current.binding
                          && *version == current.version
                          && *ciphertext_digest == current.ciphertext_digest => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::Active;
                          Ok(SecretDeleteRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      SecretReadback::Unverifiable => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::OutcomeUnknown {
                              mutation: UnknownSecretMutation::Delete,
                              operation: effect.operation,
                              next_version: None,
                              ciphertext_digest: None,
                          };
                          Ok(SecretDeleteRecovery::OutcomeUnknown)
                      }
                      SecretReadback::Present { .. } | SecretReadback::Conflict => {
                          self.records
                              .get_mut(&effect.reference)
                              .ok_or(SecretError::NotFound)?
                              .state = SecretRecordState::Quarantined;
                          Ok(SecretDeleteRecovery::Quarantined)
                      }
                  }
              }
          '''
          text = text[:delete_start] + delete_replacement + text[delete_end:]

          mark_start = text.index('    /// Marks a prepared external mutation as outcome-unknown.')
          mark_end = text.index('\n    /// Issues a plaintext lease only for an exact active binding/version.', mark_start)
          mark_replacement = '''    /// Marks a prepared external mutation as outcome-unknown.
              pub fn mark_outcome_unknown(
                  &mut self,
                  reference: &SecretReference,
                  operation: &SecretOperation,
                  mutation: UnknownSecretMutation,
              ) -> Result<(), SecretError> {
                  if mutation == UnknownSecretMutation::Create {
                      let pending = self
                          .pending_creates
                          .get_mut(reference)
                          .ok_or(SecretError::CreateNotPrepared)?;
                      if &pending.effect.operation != operation {
                          return Err(SecretError::OperationMismatch);
                      }
                      if pending.state == PendingSecretCreateState::Quarantined {
                          return Err(SecretError::CreateQuarantined);
                      }
                      pending.state = PendingSecretCreateState::OutcomeUnknown;
                      return Ok(());
                  }

                  let record = self
                      .records
                      .get_mut(reference)
                      .ok_or(SecretError::NotFound)?;
                  record.state = match (&record.state, mutation) {
                      (
                          SecretRecordState::RotationPrepared {
                              operation: expected,
                              next_version,
                              ciphertext_digest,
                          },
                          UnknownSecretMutation::Rotate,
                      ) if expected == operation => SecretRecordState::OutcomeUnknown {
                          mutation,
                          operation: operation.clone(),
                          next_version: Some(*next_version),
                          ciphertext_digest: Some(*ciphertext_digest),
                      },
                      (
                          SecretRecordState::DeletePrepared {
                              operation: expected,
                          },
                          UnknownSecretMutation::Delete,
                      ) if expected == operation => SecretRecordState::OutcomeUnknown {
                          mutation,
                          operation: operation.clone(),
                          next_version: None,
                          ciphertext_digest: None,
                      },
                      _ => return Err(SecretError::OperationMismatch),
                  };
                  Ok(())
              }
          '''
          text = text[:mark_start] + mark_replacement + text[mark_end:]

          helper_anchor = '    fn register_operation(&mut self, operation: &SecretOperation) -> Result<(), SecretError> {'
          helpers = '''    /// Returns an applied terminal transition by exact operation identity.
              pub fn terminal_receipt(
                  &self,
                  operation: &SecretOperation,
              ) -> Result<Option<&SecretTransitionReceipt>, SecretError> {
                  let Some(receipt) = self
                      .terminal_receipts
                      .get(&operation.mutation().operation_id)
                  else {
                      return Ok(None);
                  };
                  if &receipt.operation != operation {
                      return Err(SecretError::OperationConflict);
                  }
                  Ok(Some(receipt))
              }

              fn reject_terminal_operation(
                  &self,
                  operation: &SecretOperation,
              ) -> Result<(), SecretError> {
                  if self.terminal_receipt(operation)?.is_some() {
                      Err(SecretError::OperationAlreadyTerminal)
                  } else {
                      Ok(())
                  }
              }

              fn record_terminal_receipt(&mut self, receipt: SecretTransitionReceipt) {
                  self.terminal_receipts.insert(
                      receipt.operation.mutation().operation_id.clone(),
                      receipt,
                  );
              }

          '''
          if 'fn reject_terminal_operation(' not in text:
              if helper_anchor not in text:
                  raise SystemExit('SecretCatalog operation helper anchor missing')
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          # Ensure create commit also records its terminal receipt.
          commit_start = text.index('    fn commit_create(')
          commit_end = text.index('\n    /// Prepares an exact one-version rotation.', commit_start)
          commit_region = text[commit_start:commit_end]
          old_return = '''        Ok(SecretTransitionReceipt {
                      reference: effect.reference,
                      binding: effect.binding,
                      version: effect.version,
                      record_revision,
                      operation: effect.operation,
                      platform_receipt,
                  })'''
          new_return = '''        let receipt = SecretTransitionReceipt {
                      reference: effect.reference,
                      binding: effect.binding,
                      version: effect.version,
                      record_revision,
                      operation: effect.operation,
                      platform_receipt,
                  };
                  self.record_terminal_receipt(receipt.clone());
                  Ok(receipt)'''
          if old_return in commit_region:
              commit_region = commit_region.replace(old_return, new_return, 1)
              text = text[:commit_start] + commit_region + text[commit_end:]
          elif 'self.record_terminal_receipt(receipt.clone())' not in commit_region:
              raise SystemExit('commit_create terminal receipt anchor missing')

          error_anchor = '''    /// Mutation identity was reused with another canonical request.
              OperationConflict,
              /// Record capacity is exhausted.'''
          error_replacement = '''    /// Mutation identity was reused with another canonical request.
              OperationConflict,
              /// Applied operation already has one terminal receipt.
              OperationAlreadyTerminal,
              /// Authoritative recovery proved that the mutation was not applied.
              MutationNotApplied,
              /// Internal operation/receipt state is contradictory.
              LedgerCorrupt,
              /// Record capacity is exhausted.'''
          if 'OperationAlreadyTerminal,' not in text:
              if error_anchor not in text:
                  raise SystemExit('SecretError terminal anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::OperationConflict => "SECRET_OPERATION_CONFLICT",
                      Self::RecordCapacityExceeded => "SECRET_RECORD_CAPACITY_EXCEEDED",'''
          code_replacement = '''            Self::OperationConflict => "SECRET_OPERATION_CONFLICT",
                      Self::OperationAlreadyTerminal => "SECRET_OPERATION_ALREADY_TERMINAL",
                      Self::MutationNotApplied => "SECRET_MUTATION_NOT_APPLIED",
                      Self::LedgerCorrupt => "SECRET_LEDGER_CORRUPT",
                      Self::RecordCapacityExceeded => "SECRET_RECORD_CAPACITY_EXCEEDED",'''
          if 'SECRET_OPERATION_ALREADY_TERMINAL' not in text:
              if code_anchor not in text:
                  raise SystemExit('SecretError terminal code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-runtime/search-os-secrets/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Rotation and deletion recovery

          Rotation outcome-unknown state preserves the exact next version and
          ciphertext digest. Authoritative recovery distinguishes the exact new
          version, exact unchanged old version, unverifiable state, and conflict.
          Deletion similarly distinguishes exact absence from exact unchanged
          presence. Applied transitions retain a terminal receipt, preventing the
          same operation from being applied twice.
          '''
          if '## Rotation and deletion recovery' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify secret mutation recovery and workspace
        id: verify
        if: steps.baseline.outputs.proceed == 'true' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-os-secrets --all-targets --locked
            cargo test -p search-os-secrets --all-targets --locked
            cargo clippy -p search-os-secrets --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pub enum SecretRotationRecovery' crates/search-runtime/search-os-secrets/src/lib.rs
            grep -q 'pub enum SecretDeleteRecovery' crates/search-runtime/search-os-secrets/src/lib.rs
            grep -q 'next_version: Option<NonZeroRevision>' crates/search-runtime/search-os-secrets/src/lib.rs
            grep -q 'terminal_receipts: BTreeMap<OpaqueId, SecretTransitionReceipt>' crates/search-runtime/search-os-secrets/src/lib.rs
            git diff --check
          } 2>&1 | tee secret-mutation-verify.log

      - name: Commit verified recovery, bounded failure, or defer cleanly
        if: always()
        shell: bash
        env:
          PROCEED: ${{ steps.baseline.outputs.proceed }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-secret-mutation-recovery.yml
          mkdir -p qualification/os-secrets
          if [ "$PROCEED" != true ]; then
            git add -A
            subject="chore: remove deferred secret-recovery workflow"
          elif [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/os-secrets/MUTATION_RECOVERY_FAILURE.txt
            cat > qualification/os-secrets/MUTATION_RECOVERY_VERIFIED.md <<EOF
          # Secret rotation and deletion recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Outcome-unknown rotation retains exact replacement metadata; rotation
          and deletion recover through authoritative present/absent readback.
          Applied operations retain terminal receipts and cannot be applied twice.
          EOF
            git add -A
            subject="fix(secrets): recover rotation and deletion exactly once"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-secret-mutation-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 550 secret-mutation-patch.log 2>/dev/null || true
              tail -n 950 secret-mutation-verify.log 2>/dev/null || true
            } > qualification/os-secrets/MUTATION_RECOVERY_FAILURE.txt
            git add -A
            subject="verify(secrets): record failed mutation-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "$subject [skip ci]"
            git push origin HEAD:main
          fi
          if [ "$PROCEED" = true ] && { [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; }; then
            exit 1
          fi

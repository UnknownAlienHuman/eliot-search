name: Temporary F1 CLI verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  cli:
    if: github.head_ref == 'codex/f1-cli-r068' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned compiler and Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
      - name: Compare actual CLI default and legacy-feature targets without tests
        shell: bash
        env:
          BASE_SHA: '26497dfd7319e22b6faf4f28e15b9695bf007c18'
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          set +e
          out="$RUNNER_TEMP/f1-cli"
          mkdir -p "$out"
          failed=0
          for revision in "$BASE_SHA" "$HEAD_SHA"; do
            git checkout --detach "$revision" || exit 1
            git rev-parse HEAD
            for mode in default harness; do
              features=()
              if [ "$mode" = harness ]; then features=(--features legacy-loopback-harness); fi
              for operation in check clippy; do
                args=("$operation" --locked -p eliot-search --bin eliot-search "${features[@]}")
                if [ "$operation" = clippy ]; then args+=(--no-deps -- -D warnings); fi
                cargo +1.98.0 "${args[@]}" > "$out/$revision-$mode-$operation.log" 2>&1
                result=$?
                printf '%s %s %s exit=%s\n' "$revision" "$mode" "$operation" "$result" | tee -a "$out/outcomes.txt"
                if [ "$revision" = "$HEAD_SHA" ] && [ "$result" -ne 0 ]; then failed=1; fi
              done
            done
            git diff --exit-code || exit 1
          done
          git checkout --detach "$HEAD_SHA" || exit 1
          exit "$failed"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1-cli-${{ matrix.os }}
          path: ${{ runner.temp }}/f1-cli
          retention-days: 3
      - name: Snapshot the exact reviewed public tree
        if: always() && matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          mkdir -p "$RUNNER_TEMP/f1-snapshot"
          git archive --format=tar.gz --output="$RUNNER_TEMP/f1-snapshot/checkout.tar.gz" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/f1-snapshot/checkout-tree.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/f1-snapshot/checkout-sha.txt"
      - name: Export tracked files only
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1-cli-snapshot
          path: ${{ runner.temp }}/f1-snapshot
          retention-days: 1

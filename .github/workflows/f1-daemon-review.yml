name: Temporary F1 daemon verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'bins/eliot-searchd/**'
      - '.github/workflows/f1-daemon-review.yml'

permissions:
  contents: read

jobs:
  daemon:
    if: github.head_ref == 'codex/f1-daemon-r069' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install repository compiler and Clippy
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
      - name: Compare default and explicit harness daemon targets without tests
        shell: bash
        env:
          BASE_SHA: d7ec099e4a7cf107c190ee6b124cc7cd496bfeee
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          set +e
          output="$RUNNER_TEMP/daemon-checks"
          mkdir -p "$output" || exit 1
          result=0
          for revision in "$BASE_SHA" "$HEAD_SHA"; do
            git checkout --detach "$revision" || exit 1
            for selection in default harness; do
              features=()
              if [ "$selection" = harness ]; then features=(--features legacy-loopback-harness); fi
              for operation in check clippy; do
                extra=()
                if [ "$operation" = clippy ]; then extra=(--no-deps -- -D warnings); fi
                cargo +1.98.0 "$operation" --locked -p eliot-searchd --bin eliot-searchd "${features[@]}" "${extra[@]}" > "$output/$revision-$selection-$operation.log" 2>&1
                code=$?
                printf '%s %s %s exit=%s\n' "$revision" "$selection" "$operation" "$code" | tee -a "$output/outcomes.txt"
                if [ "$revision" = "$HEAD_SHA" ] && [ "$code" -ne 0 ]; then result=1; fi
              done
            done
            git diff --exit-code || exit 1
          done
          git checkout --detach "$HEAD_SHA" || exit 1
          exit "$result"
      - name: Preserve exact diagnostics including inherited failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r069-daemon-${{ matrix.runner }}
          path: ${{ runner.temp }}/daemon-checks
          retention-days: 3
          if-no-files-found: warn

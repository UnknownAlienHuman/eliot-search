name: Temporary context artifact candidate v1 connector handoff

on:
  push:
    branches:
      - "prep/context-artifact-candidate-v1"

permissions:
  contents: write

jobs:
  integrate-and-qualify:
    name: Build qualified non-workflow tree for connector publication
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Detect one-shot bootstrap input
        id: bootstrap
        shell: pwsh
        run: |
          if (Test-Path .bootstrap/context-artifact-integrate.ps1) {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Integrate qualify and publish non-workflow tree
        if: steps.bootstrap.outputs.present == 'true'
        shell: pwsh
        run: ./.bootstrap/context-artifact-integrate.ps1

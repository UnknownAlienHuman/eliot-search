name: Coverage recheck v2

on:
  push:
    branches:
      - audit/coverage-recheck-v2

permissions:
  contents: write

concurrency:
  group: coverage-recheck-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-audit:
    if: ${{ !contains(github.event.head_commit.message, '[generated-coverage]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply reviewed exact routing, structural-role and re-entry refinements
        run: |
          python tools/patch-coverage-router-v2.py
          python tools/patch-coverage-closure-v3.py
          python tools/patch-progressive-reentry-v3.py

      - name: Generate exact relation graph and bounded package maps
        run: |
          python tools/generate-coverage-graph-v2.py --json
          python tools/generate-package-maps-v2.py --json

      - name: Validate graph, maps, Cargo topology and legacy architecture closure
        run: |
          python tools/generate-coverage-graph-v2.py --check --json
          python tools/generate-package-maps-v2.py --check --json
          python tools/validate-coverage-graph-v2.py --json
          python tools/validate-package-maps-v2.py --json
          python tools/validate-architecture-coverage.py --json

      - name: Print final bounded summary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from coverage_graph_v2 import build_graph
          from package_maps_v2 import build_outputs
          graph = build_graph()
          _, stats = build_outputs()
          print({
              'packages': len(graph['package_rows']),
              'modules': len(graph['module_rows']),
              'operations': len(graph['operation_rows']),
              'documentation_nodes': len(graph['documentation_rows']),
              'dependency_edges': len(graph['dependency_rows']),
              'progressive_reentry_edges': sum(row['requires_stage_reentry'] for row in graph['dependency_rows']),
              'weak_modules': graph['weak_modules'],
              'public_facades': sum(row['route_kind'] == 'public_facade' for row in graph['operation_rows']),
              'semantic_low': sum(row['route_kind'] == 'semantic_low' for row in graph['operation_rows']),
              'package_map_files': stats['map_files'],
              'dependency_cycle': stats['cycle'],
          })
          PY

      - name: Commit generated coverage graph and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/coverage_graph_v2.py \
            tools/validate-coverage-graph-v2.py \
            tools/validate-architecture-coverage.py \
            tools/package_maps_v2.py \
            tools/validate-package-maps-v2.py \
            swarm/coverage/manifest.toml \
            swarm/coverage/operation-modules.toml \
            swarm/coverage/documentation-nodes.toml \
            swarm/coverage/dependency-edges.toml \
            swarm/coverage/module-coverage.toml \
            swarm/coverage/package-map-index.toml \
            swarm/coverage/documentation-file-index-v2.toml \
            swarm/coverage/integration-map-v2.toml \
            swarm/coverage/package-maps \
            docs/handoff/COVERAGE_GRAPH_V2.md \
            docs/handoff/PACKAGE_MAP_INDEX_V2.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "coverage: generate exact package relation maps [generated-coverage]"
          git push origin HEAD:audit/coverage-recheck-v2

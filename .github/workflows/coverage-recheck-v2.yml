name: Coverage recheck v2

on:
  push:
    branches:
      - audit/coverage-recheck-v2

permissions:
  contents: write

concurrency:
  group: coverage-recheck-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-audit:
    if: ${{ !contains(github.event.head_commit.message, '[generated-coverage]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Generate exact operation, documentation, dependency and module coverage registries
        run: python tools/generate-coverage-graph-v2.py --json

      - name: Print routes requiring review
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from coverage_graph_v2 import build_graph
          graph = build_graph()
          for route_kind in ('public_facade', 'semantic_low'):
              rows = [row for row in graph['operation_rows'] if row['route_kind'] == route_kind]
              print(f'\n## {route_kind}: {len(rows)}')
              for row in rows:
                  print(f"{row['id']} -> {row['module']} | score={row['score']} | contexts={row['source_contexts']}")
          print(f"\n## weak_modules: {len(graph['weak_modules'])}")
          for module in graph['weak_modules']:
              print(module)
          PY

      - name: Validate generated graph
        run: |
          python tools/generate-coverage-graph-v2.py --check --json
          python tools/validate-coverage-graph-v2.py --json
          python tools/validate-architecture-coverage.py --json

      - name: Commit generated coverage graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/validate-architecture-coverage.py \
            swarm/coverage/manifest.toml \
            swarm/coverage/operation-modules.toml \
            swarm/coverage/documentation-nodes.toml \
            swarm/coverage/dependency-edges.toml \
            swarm/coverage/module-coverage.toml \
            docs/handoff/COVERAGE_GRAPH_V2.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "coverage: generate exact relation graph [generated-coverage]"
          git push origin HEAD:audit/coverage-recheck-v2

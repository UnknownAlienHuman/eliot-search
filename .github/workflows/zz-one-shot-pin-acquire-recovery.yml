name: one-shot add epoch pin acquire recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-pin-acquire-recovery.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-pin-acquire-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Retain pending pin acquisition and protect reclaim
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee pin-acquire-patch.log
          from pathlib import Path

          path = Path('crates/search-index-qdrant/search-epoch-pins/src/lib.rs')
          text = path.read_text()

          effect_end = '''pub struct PinWriteEffect {
              /// Exact pin expected after durable readback.
              pub pin: EpochPin,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of exact canonical request.
              pub request_digest: Blake3Digest32,
          }
          '''
          pending_types = '''pub struct PinWriteEffect {
              /// Exact pin expected after durable readback.
              pub pin: EpochPin,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Digest of exact canonical request.
              pub request_digest: Blake3Digest32,
          }

          /// Process-local lifecycle of a pending pin acquisition.
          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          pub enum PendingPinAcquireState {
              /// Exact pin record is prepared before durable mutation.
              Prepared,
              /// Durable acquisition may have committed and requires readback.
              OutcomeUnknown,
              /// Conflicting durable evidence blocks retry and reclaim.
              Quarantined,
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          struct PendingPinAcquire {
              effect: PinWriteEffect,
              state: PendingPinAcquireState,
          }
          '''
          if 'pub enum PendingPinAcquireState {' not in text:
              if effect_end not in text:
                  raise SystemExit('PinWriteEffect anchor missing')
              text = text.replace(effect_end, pending_types, 1)

          receipt_end = '''pub struct PinReceipt {
              /// Stable pin identity.
              pub pin_id: EpochPinId,
              /// Collection generation.
              pub collection_generation_id: CollectionGenerationId,
              /// Protected epoch.
              pub epoch: Epoch,
              /// Runtime owner epoch.
              pub owner_epoch: OwnerEpoch,
              /// Pin record revision.
              pub record_revision: NonZeroRevision,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact durable readback receipt.
              pub readback_receipt: ReceiptRef,
          }
          '''
          recovery_type = '''pub struct PinReceipt {
              /// Stable pin identity.
              pub pin_id: EpochPinId,
              /// Collection generation.
              pub collection_generation_id: CollectionGenerationId,
              /// Protected epoch.
              pub epoch: Epoch,
              /// Runtime owner epoch.
              pub owner_epoch: OwnerEpoch,
              /// Pin record revision.
              pub record_revision: NonZeroRevision,
              /// Immutable operation identity.
              pub operation: MutationIdentity,
              /// Exact durable readback receipt.
              pub readback_receipt: ReceiptRef,
          }

          /// Authoritative recovery result for an unresolved pin acquisition.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum PinAcquireRecovery {
              /// Exact pin was verified and committed to the active set.
              Acquired(PinReceipt),
              /// Exact pin ID is authoritatively absent; retry is safe.
              NotApplied {
                  /// Content-free absence receipt.
                  receipt: ReceiptRef,
              },
              /// Durable state remains unverifiable; pin stays protective.
              OutcomeUnknown,
              /// Conflicting pin identity or record was observed.
              Quarantined,
          }
          '''
          if 'pub enum PinAcquireRecovery {' not in text:
              if receipt_end not in text:
                  raise SystemExit('PinReceipt anchor missing')
              text = text.replace(receipt_end, recovery_type, 1)

          field_anchor = '''    pins: BTreeMap<EpochPinId, EpochPin>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          field_replacement = '''    pins: BTreeMap<EpochPinId, EpochPin>,
              pending_acquires: BTreeMap<EpochPinId, PendingPinAcquire>,
              operations: BTreeMap<OpaqueId, Blake3Digest32>,'''
          if 'pending_acquires: BTreeMap<EpochPinId, PendingPinAcquire>' not in text:
              if field_anchor not in text:
                  raise SystemExit('EpochPinSet field anchor missing')
              text = text.replace(field_anchor, field_replacement, 1)

          constructor_anchor = '''            pins: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          constructor_replacement = '''            pins: BTreeMap::new(),
                      pending_acquires: BTreeMap::new(),
                      operations: BTreeMap::new(),'''
          if 'pending_acquires: BTreeMap::new()' not in text:
              if constructor_anchor not in text:
                  raise SystemExit('EpochPinSet constructor anchor missing')
              text = text.replace(constructor_anchor, constructor_replacement, 1)

          prepare_start = text.index('    /// Prepares acquisition of one new pin.')
          prepare_end = text.index('\n    /// Accepts pin acquisition only after exact durable readback.', prepare_start)
          prepare_replacement = '''    /// Prepares acquisition of one new pin.
              ///
              /// The exact pin is retained and immediately becomes reclaim-
              /// protective before the durable mutation may occur.
              pub fn prepare_acquire(
                  &mut self,
                  request: AcquirePinRequest,
              ) -> Result<PinWriteEffect, PinError> {
                  validate_owner_shape(request.owner, &request.operation_owner_id)?;
                  if self.pins.contains_key(&request.pin_id) {
                      return Err(PinError::PinIdCollision);
                  }
                  let pin = EpochPin {
                      pin_id: request.pin_id,
                      owner: request.owner,
                      operation_owner_id: request.operation_owner_id,
                      collection_generation_id: request.collection_generation_id,
                      epoch: request.epoch,
                      owner_epoch: request.owner_epoch,
                      binding_digest: request.binding_digest,
                      lease: request.lease,
                      record_revision: NonZeroRevision::new(1)
                          .map_err(|_| PinError::ContractExhausted)?,
                      state: PinState::Active,
                  };
                  let effect = PinWriteEffect {
                      pin,
                      operation: request.operation,
                      request_digest: request.request_digest,
                  };
                  if let Some(pending) = self.pending_acquires.get(&effect.pin.pin_id) {
                      if pending.effect != effect {
                          return Err(PinError::AcquirePendingConflict);
                      }
                      return match pending.state {
                          PendingPinAcquireState::Prepared => Ok(effect),
                          PendingPinAcquireState::OutcomeUnknown => {
                              Err(PinError::OutcomeUnknown)
                          }
                          PendingPinAcquireState::Quarantined => {
                              Err(PinError::AcquireQuarantined)
                          }
                      };
                  }
                  let occupied = self
                      .pins
                      .len()
                      .checked_add(self.pending_acquires.len())
                      .ok_or(PinError::PinCapacityExceeded)?;
                  if occupied >= self.max_pins {
                      return Err(PinError::PinCapacityExceeded);
                  }
                  let next_revision = self
                      .revision
                      .checked_add(1)
                      .ok_or(PinError::RevisionOverflow)?;
                  self.register_operation(&effect.operation, effect.request_digest)?;
                  self.pending_acquires.insert(
                      effect.pin.pin_id.clone(),
                      PendingPinAcquire {
                          effect: effect.clone(),
                          state: PendingPinAcquireState::Prepared,
                      },
                  );
                  self.revision = next_revision;
                  Ok(effect)
              }
          '''
          text = text[:prepare_start] + prepare_replacement + text[prepare_end:]

          finish_start = text.index('    /// Accepts pin acquisition only after exact durable readback.')
          finish_end = text.index('\n    /// Renews an active pin after exact readback.', finish_start)
          finish_replacement = '''    /// Accepts pin acquisition only after exact durable readback.
              pub fn finish_acquire(
                  &mut self,
                  effect: PinWriteEffect,
                  readback: &PinReadback,
              ) -> Result<PinReceipt, PinError> {
                  if let Some(existing) = self.pins.get(&effect.pin.pin_id) {
                      let receipt = match readback {
                          PinReadback::Present { pin, receipt }
                              if pin == existing && pin == &effect.pin => receipt.clone(),
                          PinReadback::Unverifiable => return Err(PinError::OutcomeUnknown),
                          PinReadback::Present { .. }
                          | PinReadback::Absent { .. }
                          | PinReadback::Conflict => return Err(PinError::ReadbackMismatch),
                      };
                      return Ok(PinReceipt {
                          pin_id: existing.pin_id.clone(),
                          collection_generation_id: existing.collection_generation_id,
                          epoch: existing.epoch,
                          owner_epoch: existing.owner_epoch,
                          record_revision: existing.record_revision,
                          operation: effect.operation,
                          readback_receipt: receipt,
                      });
                  }

                  let pending = self
                      .pending_acquires
                      .get(&effect.pin.pin_id)
                      .cloned()
                      .ok_or(PinError::AcquireNotPrepared)?;
                  if pending.effect != effect {
                      return Err(PinError::OperationMismatch);
                  }
                  if pending.state == PendingPinAcquireState::Quarantined {
                      return Err(PinError::AcquireQuarantined);
                  }
                  match readback {
                      PinReadback::Present { pin, receipt } if pin == &effect.pin => {
                          self.commit_pending_acquire(pending, receipt.clone())
                      }
                      PinReadback::Unverifiable => {
                          self.set_pending_acquire_state(
                              &effect.pin.pin_id,
                              PendingPinAcquireState::OutcomeUnknown,
                          )?;
                          Err(PinError::OutcomeUnknown)
                      }
                      PinReadback::Present { .. }
                      | PinReadback::Absent { .. }
                      | PinReadback::Conflict => {
                          self.set_pending_acquire_state(
                              &effect.pin.pin_id,
                              PendingPinAcquireState::Quarantined,
                          )?;
                          Err(PinError::ReadbackMismatch)
                      }
                  }
              }

              /// Marks a prepared pin acquisition as outcome-unknown.
              pub fn mark_acquire_outcome_unknown(
                  &mut self,
                  pin_id: &EpochPinId,
                  operation: &MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<(), PinError> {
                  let pending = self
                      .pending_acquires
                      .get(pin_id)
                      .ok_or(PinError::AcquireNotPrepared)?;
                  if &pending.effect.operation != operation
                      || pending.effect.request_digest != request_digest
                  {
                      return Err(PinError::OperationMismatch);
                  }
                  if pending.state == PendingPinAcquireState::Quarantined {
                      return Err(PinError::AcquireQuarantined);
                  }
                  self.set_pending_acquire_state(
                      pin_id,
                      PendingPinAcquireState::OutcomeUnknown,
                  )
              }

              /// Resolves a possible pin acquisition by exact durable readback.
              pub fn recover_acquire(
                  &mut self,
                  pin_id: &EpochPinId,
                  operation: &MutationIdentity,
                  request_digest: Blake3Digest32,
                  readback: &PinReadback,
              ) -> Result<PinAcquireRecovery, PinError> {
                  let pending = self
                      .pending_acquires
                      .get(pin_id)
                      .cloned()
                      .ok_or(PinError::AcquireNotPrepared)?;
                  if &pending.effect.operation != operation
                      || pending.effect.request_digest != request_digest
                  {
                      return Err(PinError::OperationMismatch);
                  }
                  if pending.state == PendingPinAcquireState::Quarantined {
                      return Ok(PinAcquireRecovery::Quarantined);
                  }
                  match readback {
                      PinReadback::Present { pin, receipt }
                          if pin == &pending.effect.pin => self
                              .commit_pending_acquire(pending, receipt.clone())
                              .map(PinAcquireRecovery::Acquired),
                      PinReadback::Absent { receipt } => {
                          let next_revision = self
                              .revision
                              .checked_add(1)
                              .ok_or(PinError::RevisionOverflow)?;
                          self.pending_acquires.remove(pin_id);
                          self.revision = next_revision;
                          Ok(PinAcquireRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      PinReadback::Unverifiable => {
                          self.set_pending_acquire_state(
                              pin_id,
                              PendingPinAcquireState::OutcomeUnknown,
                          )?;
                          Ok(PinAcquireRecovery::OutcomeUnknown)
                      }
                      PinReadback::Present { .. } | PinReadback::Conflict => {
                          self.set_pending_acquire_state(
                              pin_id,
                              PendingPinAcquireState::Quarantined,
                          )?;
                          Ok(PinAcquireRecovery::Quarantined)
                      }
                  }
              }

              /// Returns the lifecycle of one pending pin acquisition.
              #[must_use]
              pub fn pending_acquire_state(
                  &self,
                  pin_id: &EpochPinId,
              ) -> Option<PendingPinAcquireState> {
                  self.pending_acquires.get(pin_id).map(|pending| pending.state)
              }

              fn set_pending_acquire_state(
                  &mut self,
                  pin_id: &EpochPinId,
                  state: PendingPinAcquireState,
              ) -> Result<(), PinError> {
                  let current = self
                      .pending_acquires
                      .get(pin_id)
                      .ok_or(PinError::AcquireNotPrepared)?;
                  if current.state == state {
                      return Ok(());
                  }
                  let next_revision = self
                      .revision
                      .checked_add(1)
                      .ok_or(PinError::RevisionOverflow)?;
                  self.pending_acquires
                      .get_mut(pin_id)
                      .ok_or(PinError::AcquireNotPrepared)?
                      .state = state;
                  self.revision = next_revision;
                  Ok(())
              }

              fn commit_pending_acquire(
                  &mut self,
                  pending: PendingPinAcquire,
                  readback_receipt: ReceiptRef,
              ) -> Result<PinReceipt, PinError> {
                  let pin_id = pending.effect.pin.pin_id.clone();
                  if self.pins.contains_key(&pin_id) {
                      return Err(PinError::PinIdCollision);
                  }
                  let next_revision = self
                      .revision
                      .checked_add(1)
                      .ok_or(PinError::RevisionOverflow)?;
                  self.pending_acquires.remove(&pin_id);
                  self.pins.insert(pin_id.clone(), pending.effect.pin.clone());
                  self.revision = next_revision;
                  Ok(PinReceipt {
                      pin_id,
                      collection_generation_id: pending.effect.pin.collection_generation_id,
                      epoch: pending.effect.pin.epoch,
                      owner_epoch: pending.effect.pin.owner_epoch,
                      record_revision: pending.effect.pin.record_revision,
                      operation: pending.effect.operation,
                      readback_receipt,
                  })
              }
          '''
          text = text[:finish_start] + finish_replacement + text[finish_end:]

          snapshot_start = text.index('    /// Builds a complete protective pin snapshot at an explicit instant.')
          snapshot_end = text.index('\n    /// Quarantines a pin; it remains protective.', snapshot_start)
          snapshot_replacement = '''    /// Builds a complete protective pin snapshot at an explicit instant.
              ///
              /// Pending acquisitions are always included regardless of lease
              /// expiry because their durable outcome has not been resolved.
              pub fn snapshot(
                  &self,
                  observed_at: MonotonicInstant,
                  snapshot_digest: Blake3Digest32,
                  receipt: ReceiptRef,
              ) -> PinSnapshot {
                  let mut protective = BTreeMap::new();
                  for pin in self
                      .pins
                      .values()
                      .filter(|pin| pin.protects_reclaim_at(observed_at))
                  {
                      protective.insert(pin.pin_id.clone(), pin.clone());
                  }
                  for pending in self.pending_acquires.values() {
                      protective.insert(
                          pending.effect.pin.pin_id.clone(),
                          pending.effect.pin.clone(),
                      );
                  }
                  PinSnapshot {
                      revision: self.revision,
                      observed_at,
                      protective_pins: protective.into_values().collect(),
                      snapshot_digest,
                      receipt,
                  }
              }
          '''
          text = text[:snapshot_start] + snapshot_replacement + text[snapshot_end:]

          quarantine_start = text.index('    /// Quarantines a pin; it remains protective.')
          quarantine_end = text.index('\n    fn register_operation(', quarantine_start)
          quarantine_replacement = '''    /// Quarantines a pin or pending acquisition; it remains protective.
              pub fn quarantine(&mut self, pin_id: &EpochPinId) -> Result<(), PinError> {
                  if self.pending_acquires.contains_key(pin_id) {
                      return self.set_pending_acquire_state(
                          pin_id,
                          PendingPinAcquireState::Quarantined,
                      );
                  }
                  let pin = self.pins.get_mut(pin_id).ok_or(PinError::NotFound)?;
                  pin.state = PinState::Quarantined;
                  Ok(())
              }
          '''
          text = text[:quarantine_start] + quarantine_replacement + text[quarantine_end:]

          error_anchor = '''    /// Pin identity already belongs to another record.
              PinIdCollision,
              /// Pin identity is unknown.'''
          error_replacement = '''    /// Pin identity already belongs to another record.
              PinIdCollision,
              /// Acquisition completion/recovery has no retained pending effect.
              AcquireNotPrepared,
              /// Same pin identity has another pending acquisition effect.
              AcquirePendingConflict,
              /// Pending acquisition is quarantined by conflicting readback.
              AcquireQuarantined,
              /// Pin identity is unknown.'''
          if 'AcquireNotPrepared,' not in text:
              if error_anchor not in text:
                  raise SystemExit('PinError acquire anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::PinIdCollision => "EPOCH_PIN_ID_COLLISION",
                      Self::NotFound => "EPOCH_PIN_NOT_FOUND",'''
          code_replacement = '''            Self::PinIdCollision => "EPOCH_PIN_ID_COLLISION",
                      Self::AcquireNotPrepared => "EPOCH_PIN_ACQUIRE_NOT_PREPARED",
                      Self::AcquirePendingConflict => "EPOCH_PIN_ACQUIRE_PENDING_CONFLICT",
                      Self::AcquireQuarantined => "EPOCH_PIN_ACQUIRE_QUARANTINED",
                      Self::NotFound => "EPOCH_PIN_NOT_FOUND",'''
          if 'EPOCH_PIN_ACQUIRE_NOT_PREPARED' not in text:
              if code_anchor not in text:
                  raise SystemExit('PinError code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-index-qdrant/search-epoch-pins/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Acquire outcome recovery

          A pin becomes reclaim-protective when its exact acquisition effect is
          prepared, before durable mutation. Prepared, outcome-unknown, and
          quarantined acquisitions are included in every protective snapshot.
          Protection is removed only after exact authoritative `Absent` readback
          or later verified release of an acquired pin.
          '''
          if '## Acquire outcome recovery' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify pin acquisition recovery and reclaim protection
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-epoch-pins --all-targets --locked
            cargo test -p search-epoch-pins --all-targets --locked
            cargo clippy -p search-epoch-pins --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pending_acquires: BTreeMap<EpochPinId, PendingPinAcquire>' crates/search-index-qdrant/search-epoch-pins/src/lib.rs
            grep -q 'pub fn recover_acquire' crates/search-index-qdrant/search-epoch-pins/src/lib.rs
            grep -q 'for pending in self.pending_acquires.values()' crates/search-index-qdrant/search-epoch-pins/src/lib.rs
            git diff --check
          } 2>&1 | tee pin-acquire-verify.log

      - name: Commit verified recovery or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-pin-acquire-recovery.yml
          mkdir -p qualification/epoch-pins
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/epoch-pins/LAST_FAILURE.txt
            cat > qualification/epoch-pins/ACQUIRE_RECOVERY_VERIFIED.md <<EOF
          # Epoch pin acquire recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Pending and outcome-unknown acquisitions remain reclaim-protective.
          Protection is removed only after authoritative absence or verified
          release of the acquired pin.
          EOF
            git add -A
            subject="fix(epoch-pins): retain and protect pending acquisitions"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-pin-acquire-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 450 pin-acquire-patch.log 2>/dev/null || true
              tail -n 800 pin-acquire-verify.log 2>/dev/null || true
            } > qualification/epoch-pins/LAST_FAILURE.txt
            git add -A
            subject="verify(epoch-pins): record failed acquire-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

name: one-shot recover immutable revision deletion

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-revision-delete-recovery.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-revision-delete-recovery
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Determine whether baseline is clean
        id: baseline
        shell: bash
        run: |
          proceed=true
          test -f qualification/CURRENT_STATUS.md || proceed=false
          test ! -f qualification/CURRENT_FAILURES.txt || proceed=false
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Install exact Rust toolchain
        if: steps.baseline.outputs.proceed == 'true'
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Add exact deletion recovery and atomic operation admission
        id: patch
        if: steps.baseline.outputs.proceed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee revision-delete-patch.log
          from pathlib import Path

          path = Path('crates/search-source/search-revision-store/src/lib.rs')
          text = path.read_text()

          receipt_anchor = '''pub struct RevisionObjectReceipt {
              /// Exact object key.
              pub key: RevisionObjectKey,
              /// Logical record revision.
              pub record_revision: NonZeroRevision,
              /// Ciphertext digest, retained even after logical deletion.
              pub ciphertext_digest: Blake3Digest32,
              /// Immutable mutation identity.
              pub operation: MutationIdentity,
              /// Exact backend readback receipt.
              pub backend_receipt: ReceiptRef,
          }
          '''
          recovery_type = '''pub struct RevisionObjectReceipt {
              /// Exact object key.
              pub key: RevisionObjectKey,
              /// Logical record revision.
              pub record_revision: NonZeroRevision,
              /// Ciphertext digest, retained even after logical deletion.
              pub ciphertext_digest: Blake3Digest32,
              /// Immutable mutation identity.
              pub operation: MutationIdentity,
              /// Exact backend readback receipt.
              pub backend_receipt: ReceiptRef,
          }

          /// Authoritative recovery result for an immutable-object deletion.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum RevisionDeleteRecovery {
              /// Exact object absence was verified and deletion is terminal.
              Deleted(RevisionObjectReceipt),
              /// Exact unchanged object remains; retry is safe.
              NotApplied {
                  /// Content-free exact-object readback receipt.
                  receipt: ReceiptRef,
              },
              /// Backend state remains unverifiable.
              OutcomeUnknown,
              /// Missing or conflicting identity/digest evidence was observed.
              Quarantined,
          }
          '''
          if 'pub enum RevisionDeleteRecovery {' not in text:
              if receipt_anchor not in text:
                  raise SystemExit('RevisionObjectReceipt anchor missing')
              text = text.replace(receipt_anchor, recovery_type, 1)

          prepare_start = text.index('    /// Prepares exact deletion of one immutable object.')
          prepare_end = text.index('\n    /// Accepts deletion only after exact backend absence readback.', prepare_start)
          prepare_replacement = '''    /// Prepares exact deletion of one immutable object.
              ///
              /// Validation completes before a new operation identity is retained.
              /// Exact prepared replay returns the original effect; unknown and
              /// terminal operations cannot be blindly reissued.
              pub fn prepare_delete(
                  &mut self,
                  key: RevisionObjectKey,
                  expected_record_revision: NonZeroRevision,
                  operation: MutationIdentity,
                  request_digest: Blake3Digest32,
              ) -> Result<RevisionDeleteEffect, RevisionStoreError> {
                  if let Some(existing_digest) = self.operations.get(&operation.operation_id) {
                      if *existing_digest != request_digest {
                          return Err(RevisionStoreError::OperationConflict);
                      }
                      let record = self
                          .records
                          .get(&key)
                          .ok_or(RevisionStoreError::OperationMismatch)?;
                      return match &record.state {
                          RevisionObjectState::DeletePrepared {
                              operation: expected,
                              request_digest: expected_digest,
                          } if expected == &operation
                              && *expected_digest == request_digest
                              && record.record_revision == expected_record_revision => {
                              Ok(RevisionDeleteEffect {
                                  key,
                                  expected_ciphertext_digest: record.ciphertext_digest,
                                  operation,
                                  request_digest,
                              })
                          }
                          RevisionObjectState::OutcomeUnknown {
                              mutation: UnknownRevisionMutation::Delete,
                              operation: expected,
                              request_digest: expected_digest,
                          } if expected == &operation
                              && *expected_digest == request_digest => {
                              Err(RevisionStoreError::OutcomeUnknown)
                          }
                          RevisionObjectState::Deleted {
                              operation: expected,
                              ..
                          } if expected == &operation => {
                              Err(RevisionStoreError::OperationAlreadyTerminal)
                          }
                          _ => Err(RevisionStoreError::OperationMismatch),
                      };
                  }
                  if self.operations.len() >= self.limits.max_operations {
                      return Err(RevisionStoreError::OperationCapacityExceeded);
                  }
                  let record = self.records.get(&key).ok_or(RevisionStoreError::NotFound)?;
                  if record.record_revision != expected_record_revision {
                      return Err(RevisionStoreError::RevisionConflict);
                  }
                  if !matches!(record.state, RevisionObjectState::Active) {
                      return Err(RevisionStoreError::InvalidTransition);
                  }
                  let effect = RevisionDeleteEffect {
                      key,
                      expected_ciphertext_digest: record.ciphertext_digest,
                      operation: operation.clone(),
                      request_digest,
                  };
                  self.operations
                      .insert(operation.operation_id.clone(), request_digest);
                  self.records
                      .get_mut(&key)
                      .ok_or(RevisionStoreError::NotFound)?
                      .state = RevisionObjectState::DeletePrepared {
                      operation,
                      request_digest,
                  };
                  Ok(effect)
              }
          '''
          text = text[:prepare_start] + prepare_replacement + text[prepare_end:]

          finish_start = text.index('    /// Accepts deletion only after exact backend absence readback.')
          finish_end = text.index('\n    /// Marks a prepared mutation as outcome-unknown.', finish_start)
          finish_replacement = '''    /// Accepts or recovers deletion after exact backend readback.
              pub fn finish_delete(
                  &mut self,
                  effect: RevisionDeleteEffect,
                  readback: &RevisionReadback,
              ) -> Result<RevisionObjectReceipt, RevisionStoreError> {
                  match self.recover_delete(effect, readback)? {
                      RevisionDeleteRecovery::Deleted(receipt) => Ok(receipt),
                      RevisionDeleteRecovery::NotApplied { .. } => {
                          Err(RevisionStoreError::MutationNotApplied)
                      }
                      RevisionDeleteRecovery::OutcomeUnknown => {
                          Err(RevisionStoreError::OutcomeUnknown)
                      }
                      RevisionDeleteRecovery::Quarantined => {
                          Err(RevisionStoreError::DeleteReadbackMismatch)
                      }
                  }
              }

              /// Resolves a possible deletion commit by authoritative readback.
              pub fn recover_delete(
                  &mut self,
                  effect: RevisionDeleteEffect,
                  readback: &RevisionReadback,
              ) -> Result<RevisionDeleteRecovery, RevisionStoreError> {
                  let current = self.records.get(&effect.key).cloned().ok_or(
                      RevisionStoreError::NotFound,
                  )?;
                  match &current.state {
                      RevisionObjectState::DeletePrepared {
                          operation,
                          request_digest,
                      }
                      | RevisionObjectState::OutcomeUnknown {
                          mutation: UnknownRevisionMutation::Delete,
                          operation,
                          request_digest,
                      } if operation == &effect.operation
                          && *request_digest == effect.request_digest => {}
                      RevisionObjectState::Deleted {
                          operation,
                          receipt,
                      } if operation == &effect.operation => {
                          return Ok(RevisionDeleteRecovery::Deleted(
                              RevisionObjectReceipt {
                                  key: effect.key,
                                  record_revision: current.record_revision,
                                  ciphertext_digest: current.ciphertext_digest,
                                  operation: effect.operation,
                                  backend_receipt: receipt.clone(),
                              },
                          ));
                      }
                      RevisionObjectState::Quarantined => {
                          return Ok(RevisionDeleteRecovery::Quarantined);
                      }
                      _ => return Err(RevisionStoreError::OperationMismatch),
                  }
                  if current.ciphertext_digest != effect.expected_ciphertext_digest {
                      return Err(RevisionStoreError::ReadbackMismatch);
                  }

                  match readback {
                      RevisionReadback::Absent { receipt } => {
                          let record = self
                              .records
                              .get_mut(&effect.key)
                              .ok_or(RevisionStoreError::NotFound)?;
                          record.record_revision = record
                              .record_revision
                              .checked_next()
                              .map_err(|_| RevisionStoreError::ContractExhausted)?;
                          record.state = RevisionObjectState::Deleted {
                              operation: effect.operation.clone(),
                              receipt: receipt.clone(),
                          };
                          Ok(RevisionDeleteRecovery::Deleted(
                              RevisionObjectReceipt {
                                  key: effect.key,
                                  record_revision: record.record_revision,
                                  ciphertext_digest: record.ciphertext_digest,
                                  operation: effect.operation,
                                  backend_receipt: receipt.clone(),
                              },
                          ))
                      }
                      RevisionReadback::Present {
                          key,
                          cipher_suite,
                          key_domain_id,
                          associated_data_digest,
                          ciphertext_digest,
                          plaintext_bytes,
                          ciphertext_bytes,
                          receipt,
                      } if *key == current.key
                          && *cipher_suite == current.cipher_suite
                          && *key_domain_id == current.key_domain_id
                          && *associated_data_digest == current.associated_data_digest
                          && *ciphertext_digest == current.ciphertext_digest
                          && *plaintext_bytes == current.plaintext_bytes
                          && *ciphertext_bytes == current.ciphertext_bytes => {
                          self.records
                              .get_mut(&effect.key)
                              .ok_or(RevisionStoreError::NotFound)?
                              .state = RevisionObjectState::Active;
                          self.operations
                              .remove(&effect.operation.operation_id);
                          Ok(RevisionDeleteRecovery::NotApplied {
                              receipt: receipt.clone(),
                          })
                      }
                      RevisionReadback::Unverifiable => {
                          self.records
                              .get_mut(&effect.key)
                              .ok_or(RevisionStoreError::NotFound)?
                              .state = RevisionObjectState::OutcomeUnknown {
                              mutation: UnknownRevisionMutation::Delete,
                              operation: effect.operation,
                              request_digest: effect.request_digest,
                          };
                          Ok(RevisionDeleteRecovery::OutcomeUnknown)
                      }
                      RevisionReadback::Present { .. } | RevisionReadback::Conflict => {
                          self.records
                              .get_mut(&effect.key)
                              .ok_or(RevisionStoreError::NotFound)?
                              .state = RevisionObjectState::Quarantined;
                          Ok(RevisionDeleteRecovery::Quarantined)
                      }
                  }
              }
          '''
          text = text[:finish_start] + finish_replacement + text[finish_end:]

          error_anchor = '''    /// Operation identity was reused with another request digest.
              OperationConflict,
              /// Operation ledger capacity is exhausted.'''
          error_replacement = '''    /// Operation identity was reused with another request digest.
              OperationConflict,
              /// Applied deletion operation is already terminal.
              OperationAlreadyTerminal,
              /// Authoritative readback proved the deletion was not applied.
              MutationNotApplied,
              /// Operation ledger capacity is exhausted.'''
          if 'OperationAlreadyTerminal,' not in text:
              if error_anchor not in text:
                  raise SystemExit('RevisionStoreError operation anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::OperationConflict => "REVISION_STORE_OPERATION_CONFLICT",
                      Self::OperationCapacityExceeded => "REVISION_STORE_OPERATION_CAPACITY",'''
          code_replacement = '''            Self::OperationConflict => "REVISION_STORE_OPERATION_CONFLICT",
                      Self::OperationAlreadyTerminal => {
                          "REVISION_STORE_OPERATION_ALREADY_TERMINAL"
                      }
                      Self::MutationNotApplied => "REVISION_STORE_MUTATION_NOT_APPLIED",
                      Self::OperationCapacityExceeded => "REVISION_STORE_OPERATION_CAPACITY",'''
          if 'REVISION_STORE_OPERATION_ALREADY_TERMINAL' not in text:
              if code_anchor not in text:
                  raise SystemExit('RevisionStoreError operation code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          path.write_text(text)

          functions_path = Path('crates/search-source/search-revision-store/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Delete outcome recovery

          Immutable-object deletion now resolves exact absence as terminal
          deletion, exact unchanged presence as `NotApplied`, unverifiable state
          as outcome-unknown, and mismatched identity/digest as quarantine.
          Rejected prepare requests do not consume operation IDs; exact prepared
          replay returns the original effect and terminal operations cannot be
          blindly reissued.
          '''
          if '## Delete outcome recovery' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify deletion recovery and workspace
        id: verify
        if: steps.baseline.outputs.proceed == 'true' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-revision-store --all-targets --locked
            cargo test -p search-revision-store --all-targets --locked
            cargo clippy -p search-revision-store --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pub enum RevisionDeleteRecovery' crates/search-source/search-revision-store/src/lib.rs
            grep -q 'pub fn recover_delete' crates/search-source/search-revision-store/src/lib.rs
            grep -q 'RevisionStoreError::MutationNotApplied' crates/search-source/search-revision-store/src/lib.rs
            git diff --check
          } 2>&1 | tee revision-delete-verify.log

      - name: Commit verified recovery, bounded failure, or defer cleanly
        if: always()
        shell: bash
        env:
          PROCEED: ${{ steps.baseline.outputs.proceed }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-revision-delete-recovery.yml
          mkdir -p qualification/revision-store
          if [ "$PROCEED" != true ]; then
            git add -A
            subject="chore: remove deferred revision-delete workflow"
          elif [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/revision-store/DELETE_RECOVERY_FAILURE.txt
            cat > qualification/revision-store/DELETE_RECOVERY_VERIFIED.md <<EOF
          # Immutable revision deletion recovery

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Deletion now distinguishes exact absence, exact unchanged object,
          unverifiable outcome, and conflicting object evidence. Rejected
          prepares no longer consume operation IDs.
          EOF
            git add -A
            subject="fix(revision-store): recover deletion from exact readback"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-revision-delete-recovery.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 500 revision-delete-patch.log 2>/dev/null || true
              tail -n 900 revision-delete-verify.log 2>/dev/null || true
            } > qualification/revision-store/DELETE_RECOVERY_FAILURE.txt
            git add -A
            subject="verify(revision-store): record failed delete-recovery repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "$subject [skip ci]"
            git push origin HEAD:main
          fi
          if [ "$PROCEED" = true ] && { [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; }; then
            exit 1
          fi

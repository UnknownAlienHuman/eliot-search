name: temporary materialize and verify search-contracts

on:
  push:
    branches:
      - "work/46-search-contracts"
    paths:
      - ".github/workflows/zz-temp-materialize-search-contracts.yml"

permissions:
  contents: write

concurrency:
  group: materialize-search-contracts
  cancel-in-progress: false

jobs:
  materialize-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prove current main is an ancestor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "b56ea2d64e9ca854f529fee4678c656d3eda2f69"

      - name: Reconstruct and verify exact source payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/tmp/search-contracts-payload.bin.00 \
            .github/tmp/search-contracts-payload.bin.01 \
            .github/tmp/search-contracts-payload.bin.02 \
            > /tmp/search-contracts-payload.tar.xz
          echo '024a7aed587ac20611828a140be48c17d031fa5a99f55cf882664a9b0994c56d  /tmp/search-contracts-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/search-contracts-payload.tar.xz

      - name: Remove the temporary transfer surface from the proposed tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/zz-temp-materialize-search-contracts.yml \
            .github/tmp/search-contracts-payload.part* \
            .github/tmp/search-contracts-payload.bin.*
          rmdir .github/tmp 2>/dev/null || true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Run package and workspace gates on Linux
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check -p search-contracts --all-targets --locked
          cargo +1.98.0 test -p search-contracts --all-targets --locked
          cargo +1.98.0 clippy -p search-contracts --all-targets --locked -- -D warnings
          cargo +1.98.0 doc -p search-contracts --no-deps --locked
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --all-targets --locked

      - name: Enforce exact package-only final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main
          mapfile -t changed < <(git diff --name-only origin/main -- .)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              crates/search-contracts/*) ;;
              *) echo "unexpected final path: $path" >&2; exit 1 ;;
            esac
          done
          test "$(find crates/search-contracts/src -type f -name '*.rs' -print0 | xargs -0 cat | wc -l)" -le 8000
          test "$(find crates/search-contracts/src crates/search-contracts/tests -type f -name '*.rs' -print0 | xargs -0 cat | wc -l)" -le 10000

      - name: Commit and push the validated package tree
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          mapfile -t staged < <(git diff --cached --name-only origin/main)
          test "${#staged[@]}" -gt 0
          for path in "${staged[@]}"; do
            case "$path" in
              crates/search-contracts/*) ;;
              *) echo "unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done
          git commit -m "feat(contracts): implement P00 canonical kernel (#46)"
          git push origin HEAD:refs/heads/work/46-search-contracts
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-windows:
    needs: materialize-linux
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact validated package commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.materialize-linux.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Run exact Windows package gate
        shell: pwsh
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check -p search-contracts --all-targets --locked
          cargo +1.98.0 test -p search-contracts --all-targets --locked
          cargo +1.98.0 clippy -p search-contracts --all-targets --locked -- -D warnings
          cargo +1.98.0 doc -p search-contracts --no-deps --locked
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 test --workspace --all-targets --locked
          git diff --exit-code

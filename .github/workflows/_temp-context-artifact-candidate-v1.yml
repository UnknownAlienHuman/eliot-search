name: Temporary context artifact candidate v1 integration

on:
  push:
    branches:
      - "prep/context-artifact-candidate-v1"

permissions:
  contents: write

concurrency:
  group: temp-context-artifact-candidate-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-qualify:
    name: Integrate candidate builder and execute full Windows qualification
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Materialize candidate layer and navigation
        shell: pwsh
        run: |
          @'
          from pathlib import Path, PurePosixPath
          import base64
          import io
          import zipfile

          archive_b64 = "".join(path.read_text(encoding="ascii") for path in sorted(Path(".bootstrap").glob("context-artifact-v1.*.b64")))
          archive = base64.b64decode(archive_b64)
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              for info in bundle.infolist():
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or any(part in {"", ".", ".."} for part in pure.parts):
                      raise SystemExit(f"unsafe archive path: {info.filename}")
                  path = Path(*pure.parts)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(bundle.read(info))

          def replace_once(relative: str, old: str, new: str) -> None:
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one navigation marker, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace_once("docs/handoff/README.md", '- [TICKET_ISSUANCE_PLANNER_INDEX.md](TICKET_ISSUANCE_PLANNER_INDEX.md) — executable immutable-tree\n  schema-v2 preflight, 30-case corpus and non-circular advisory plan digest; it creates no authority.\n', '- [TICKET_ISSUANCE_PLANNER_INDEX.md](TICKET_ISSUANCE_PLANNER_INDEX.md) — executable immutable-tree\n  schema-v2 preflight, 30-case corpus and non-circular advisory plan digest; it creates no authority.\n- [CONTEXT_ARTIFACT_CANDIDATE_INDEX.md](CONTEXT_ARTIFACT_CANDIDATE_INDEX.md) — deterministic\n  `ELIOT_SWARM_CONTEXT_1` candidate builder, exact bundle parser and 20-case qualification; output is\n  local, unsigned and never a `context_manifest_v1` instance.\n')
          replace_once("tools/README.md", '`READY_FOR_CONTEXT_MATERIALIZATION_PREVIEW` authorizes nothing. The planner never materializes context,\nissues a ticket or lease, publishes a handoff, accepts G0/W0 or advances launch state. The validator runs\nthe 30-case corpus and requires the current repository decision to remain `BLOCKED_MISSING_SELECTION`.\n\n## Implementation and qualification packets\n', '`READY_FOR_CONTEXT_MATERIALIZATION_PREVIEW` authorizes nothing. The planner never materializes context,\nissues a ticket or lease, publishes a handoff, accepts G0/W0 or advances launch state. The validator runs\nthe 30-case corpus and requires the current repository decision to remain `BLOCKED_MISSING_SELECTION`.\n\n### Context artifact candidate builder v1\n\n```powershell\npwsh -NoProfile -File tools/build-context-artifact-candidate.ps1 `\n  -Package search-contracts `\n  -BaseCommit sha1:<full-commit> `\n  -OutputRoot artifacts/context-artifact-candidates/local `\n  -PrintResult\n\npwsh -NoProfile -File tools/validate-context-artifact-candidate.ps1 -Json\n```\n\nThe builder consumes a successful immutable-tree ticket preflight and creates one exact\n`ELIOT_SWARM_CONTEXT_1` bundle plus adjacent canonical metadata below the ignored candidate-artifact\nroot. It normalizes declared UTF-8 sources to LF, extracts closed selectors as canonical JSON, embeds\nexact accepted handoff bytes, and parses the finished length-framed bundle before writing it.\n\nThe output is explicitly unsigned and unstored: unresolved artifact-store references, dual signatures,\ncontrol-record path/blob identity and independent readback prevent it from being a `context_manifest_v1`\ninstance. It does not mutate a control root or authorize ticket issuance, a lease or implementation.\n\n## Implementation and qualification packets\n')
          replace_once("docs/handoff/P00_DRAFT_CONTROL_PLANE.md", 'Changing any source byte, registry selector, accepted handoff, ordering or base commit creates a different\ncontext and ticket. A context artifact cannot be amended after writer acknowledgement.\n', 'Changing any source byte, registry selector, accepted handoff, ordering or base commit creates a different\ncontext and ticket. A context artifact cannot be amended after writer acknowledgement.\n\n### Candidate construction boundary\n\n`tools/build-context-artifact-candidate.py` may deterministically construct and parse the exact\nwriter-visible `ELIOT_SWARM_CONTEXT_1` bytes before authoritative storage. Its output remains an ignored,\nunsigned local candidate. It cannot populate `swarm/context-manifests/`, invent an artifact-store ref,\nprovide dual signatures, claim independent readback or authorize ticket issuance. The integration owner\nmust still execute the authoritative materialization operation and commit the separately reviewed\n`context_manifest_v1` record.\n')
          replace_once("swarm/CONTEXT_MANIFEST_TEMPLATE.md", 'The schema-level `writer_visible_artifact_count` is one. The artifact is bounded materialized content\nderived only from declared sources and fragments. The manifest contains identities and metadata, not\nembedded source bodies.\n', 'The schema-level `writer_visible_artifact_count` is one. The artifact is bounded materialized content\nderived only from declared sources and fragments. The manifest contains identities and metadata, not\nembedded source bodies.\n\nA locally generated `context_artifact_candidate_v1` may prove deterministic bundle bytes and metadata,\nbut it is not this manifest. Until an artifact store returns an immutable readback-verified ref and two\ndistinct actors bind signatures to the final record, all manifest identity/signature fields remain\nunresolved and no file may be created under `swarm/context-manifests/`.\n')
          replace_once("docs/handoff/TICKET_ISSUANCE_PLANNER_INDEX.md", '## Current disposition\n', '## Next bounded operation\n\n- [`CONTEXT_ARTIFACT_CANDIDATE_INDEX.md`](CONTEXT_ARTIFACT_CANDIDATE_INDEX.md) — builds and parses exact\n  writer-visible context bytes after a preview-ready selection while preserving zero control authority.\n\n## Current disposition\n')
          '@ | python -

      - name: Remove temporary bootstrap inputs and workflow
        shell: pwsh
        run: |
          Remove-Item .bootstrap -Recurse -Force
          Remove-Item .github/workflows/_temp-context-artifact-candidate-v1.yml -Force

      - name: Check textual integrity
        shell: pwsh
        run: git diff --check

      - name: Compile builder, validator and corpus
        shell: pwsh
        run: |
          python -m py_compile `
            tools/build-context-artifact-candidate.py `
            tools/context_artifact_builder_v1/__init__.py `
            tools/context_artifact_builder_v1/core.py `
            tools/context_artifact_builder_v1/bundle.py `
            tools/context_artifact_builder_v1/extract.py `
            tools/context_artifact_builder_v1/build.py `
            tools/validate-context-artifact-candidate.py `
            qualification/context-artifact/test_context_artifact_candidate_v1.py

      - name: Commit final tree before immutable-tree checks
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add deterministic context artifact candidate builder"
          git push origin HEAD:refs/heads/prep/context-artifact-candidate-v1

      - name: Run twenty-case candidate corpus
        shell: pwsh
        run: python qualification/context-artifact/test_context_artifact_candidate_v1.py

      - name: Validate candidate registry, schema and current build
        shell: pwsh
        run: ./tools/validate-context-artifact-candidate.ps1 -Json

      - name: Revalidate ticket issuance planner
        shell: pwsh
        run: ./tools/validate-ticket-issuance-plan.ps1 -Json

      - name: Revalidate repository topology
        shell: pwsh
        run: ./tools/validate-swarm.ps1 -Json

      - name: Revalidate P00 drafts
        shell: pwsh
        run: ./tools/validate-p00-ticket-drafts.ps1 -Json

      - name: Revalidate ticket issuance schemas
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

      - name: Revalidate P00 acceptance boundary
        shell: pwsh
        run: ./tools/validate-p00-foundation-acceptance.ps1 -Json

      - name: Build and inspect current search-contracts candidate
        shell: pwsh
        run: |
          $format = git rev-parse --show-object-format
          $head = git rev-parse HEAD
          $base = "${format}:${head}"
          ./tools/build-context-artifact-candidate.ps1 `
            -Package search-contracts `
            -BaseCommit $base `
            -OutputRoot artifacts/context-artifact-candidates/workflow `
            -PrintResult

          $candidate = Get-ChildItem `
            artifacts/context-artifact-candidates/workflow/search-contracts/*.json |
            Select-Object -First 1
          $record = Get-Content $candidate.FullName -Raw | ConvertFrom-Json
          if ($record.status -ne 'ARTIFACT_CANDIDATE_NOT_STORED_NOT_SIGNED') {
            throw "Unexpected candidate status: $($record.status)"
          }
          if ($record.reason_codes.Count -ne 0) {
            throw "Unexpected candidate reasons: $($record.reason_codes -join ',')"
          }
          if ($record.control_record_mutations.Count -ne 0) {
            throw 'Candidate emitted a control-record mutation.'
          }
          if ($record.manifest_projection.schema_instance -ne $false) {
            throw 'Candidate projected a context manifest schema instance.'
          }
          foreach ($property in $record.authority.PSObject.Properties) {
            if ($property.Value -ne $false) {
              throw "Candidate enabled authority field: $($property.Name)"
            }
          }

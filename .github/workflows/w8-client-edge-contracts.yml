name: W8 generic client edge contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w8-client-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate W8 contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate W8 owner, authority, settings and evidence packets
        shell: pwsh
        run: ./tools/validate-w8-client-edge.ps1 -Json

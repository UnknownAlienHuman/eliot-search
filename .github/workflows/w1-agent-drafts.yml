name: W1 agent draft packets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1-agent-drafts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate W1 packets and non-claimable drafts
        shell: pwsh
        run: ./tools/validate-w1-agent-drafts.ps1 -Json

      - name: Revalidate package topology
        shell: pwsh
        run: ./tools/validate-swarm.ps1 -Json

      - name: Revalidate control-plane schemas
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

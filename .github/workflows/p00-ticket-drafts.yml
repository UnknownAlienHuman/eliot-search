name: P00 draft ticket control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p00-ticket-drafts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate non-claimable P00 drafts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate package, function and stage registries
        shell: pwsh
        run: |
          & ./tools/validate-swarm.ps1 -Json
          & ./tools/validate-function-packets.ps1 -Json
          & ./tools/validate-stage-readsets.ps1 -Json

      - name: Validate non-claimable ticket, context, lease and review control plane
        shell: pwsh
        run: ./tools/validate-p00-ticket-drafts.ps1 -Json

      - name: Validate ticket issuance record schemas
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

name: one-shot bind model request permits and deadlines

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-model-request-permits.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-model-request-permits
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Bind in-flight accounting to exact permits and deadlines
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee model-permit-patch.log
          from pathlib import Path

          cargo_path = Path('crates/search-model-provider/Cargo.toml')
          cargo = cargo_path.read_text()
          if 'search-ports.workspace = true' not in cargo:
              anchor = 'search-contracts.workspace = true\n'
              if anchor not in cargo:
                  raise SystemExit('search-model-provider dependency anchor missing')
              cargo = cargo.replace(
                  anchor,
                  anchor + 'search-ports.workspace = true\n',
                  1,
              )
              cargo_path.write_text(cargo)

          path = Path('crates/search-model-provider/src/lib.rs')
          text = path.read_text()
          import_anchor = '''use search_contracts::{
              ArtifactDigest, Blake3Digest32, CandidateId, OpaqueId, OwnerEpoch, ProfileId,
              ReceiptRef, RequestId,
          };
          '''
          import_replacement = '''use search_contracts::{
              ArtifactDigest, Blake3Digest32, CandidateId, OpaqueId, OwnerEpoch, ProfileId,
              ReceiptRef, RequestId,
          };
          use search_ports::MonotonicInstant;
          '''
          if 'use search_ports::MonotonicInstant;' not in text:
              if import_anchor not in text:
                  raise SystemExit('model provider import anchor missing')
              text = text.replace(import_anchor, import_replacement, 1)

          field_anchor = '''pub struct ModelProviderSupervisor {
              state: ModelProviderState,
              in_flight: usize,
          }'''
          field_replacement = '''pub struct ModelProviderSupervisor {
              state: ModelProviderState,
              in_flight: BTreeMap<RequestId, ModelRequestPermit>,
          }'''
          if 'in_flight: BTreeMap<RequestId, ModelRequestPermit>' not in text:
              if field_anchor not in text:
                  raise SystemExit('ModelProviderSupervisor field anchor missing')
              text = text.replace(field_anchor, field_replacement, 1)
              text = text.replace('in_flight: 0,', 'in_flight: BTreeMap::new(),')

          admit_start = text.index('    /// Reserves one finite in-flight request slot.')
          admit_end = text.index('\n    /// Begins graceful drain.', admit_start)
          admit_replacement = '''    /// Reserves one finite request slot under an exact request identity.
              pub fn admit(
                  &mut self,
                  request_id: RequestId,
                  capability: ModelCapability,
                  owner_epoch: OwnerEpoch,
                  residency: ModelResidency,
                  issued_at: MonotonicInstant,
              ) -> Result<ModelRequestPermit, ModelError> {
                  let readiness = match &self.state {
                      ModelProviderState::Ready(readiness) => readiness,
                      ModelProviderState::Absent
                      | ModelProviderState::Stopped
                      | ModelProviderState::Closed => {
                          return Err(ModelError::ProviderUnavailable);
                      }
                      ModelProviderState::Starting { .. } => {
                          return Err(ModelError::ProviderStarting);
                      }
                      ModelProviderState::Degraded { .. } => {
                          return Err(ModelError::ProviderDegraded);
                      }
                      ModelProviderState::Draining(_) => {
                          return Err(ModelError::ProviderDraining);
                      }
                      ModelProviderState::Quarantined(_) => {
                          return Err(ModelError::ProviderQuarantined);
                      }
                  };
                  if readiness.owner_epoch != owner_epoch {
                      return Err(ModelError::OwnerEpochMismatch);
                  }
                  if readiness.residency != residency {
                      return Err(ModelError::ResidencyMismatch);
                  }
                  if !readiness.capabilities.contains(&capability) {
                      return Err(ModelError::CapabilityUnavailable);
                  }
                  if self.in_flight.contains_key(&request_id) {
                      return Err(ModelError::DuplicateRequest);
                  }
                  if self.in_flight.len() >= readiness.limits.max_in_flight() {
                      return Err(ModelError::InFlightLimitExceeded);
                  }
                  let deadline_ticks = issued_at
                      .ticks()
                      .checked_add(readiness.limits.request_deadline_ticks())
                      .ok_or(ModelError::DeadlineOverflow)?;
                  let permit = ModelRequestPermit {
                      request_id,
                      capability,
                      owner_epoch,
                      profile_id: readiness.artifact.profile_id.clone(),
                      session_digest: readiness.session_digest,
                      limits: readiness.limits,
                      issued_at,
                      deadline: MonotonicInstant::from_ticks(deadline_ticks),
                  };
                  self.in_flight.insert(request_id, permit.clone());
                  Ok(permit)
              }

              /// Releases only the exact admitted permit and classifies deadline.
              pub fn complete_request(
                  &mut self,
                  permit: &ModelRequestPermit,
                  completed_at: MonotonicInstant,
              ) -> Result<ModelRequestCompletion, ModelError> {
                  let active = self
                      .in_flight
                      .get(&permit.request_id)
                      .ok_or(ModelError::RequestNotInFlight)?;
                  if active != permit {
                      return Err(ModelError::PermitMismatch);
                  }
                  let timing = classify_request_time(
                      permit.issued_at,
                      permit.deadline,
                      completed_at,
                  )?;
                  self.in_flight.remove(&permit.request_id);
                  Ok(match timing {
                      RequestTimeState::Valid => ModelRequestCompletion::Completed,
                      RequestTimeState::Expired => ModelRequestCompletion::DeadlineExceeded,
                  })
              }
          '''
          text = text[:admit_start] + admit_replacement + text[admit_end:]
          text = text.replace('if self.in_flight != 0 {', 'if !self.in_flight.is_empty() {')

          permit_start = text.index('/// Process-local permit returned for one admitted request.')
          permit_end = text.index('\n/// Plaintext input whose debug representation is always redacted.', permit_start)
          permit_replacement = '''/// Process-local permit returned for one admitted request.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct ModelRequestPermit {
              /// Exact request identity owning the in-flight slot.
              pub request_id: RequestId,
              /// Admitted capability.
              pub capability: ModelCapability,
              /// Runtime owner epoch.
              pub owner_epoch: OwnerEpoch,
              /// Exact provider profile.
              pub profile_id: ProfileId,
              /// Exact provider session identity.
              pub session_digest: Blake3Digest32,
              /// Exact request limits.
              pub limits: ModelLimits,
              /// Monotonic permit issue instant.
              pub issued_at: MonotonicInstant,
              /// Exclusive monotonic request deadline.
              pub deadline: MonotonicInstant,
          }

          impl ModelRequestPermit {
              /// Returns whether dispatch/response use is still within the permit.
              #[must_use]
              pub fn is_valid_at(&self, now: MonotonicInstant) -> bool {
                  classify_request_time(self.issued_at, self.deadline, now)
                      == Ok(RequestTimeState::Valid)
              }
          }

          /// Terminal accounting result for one exact request permit.
          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          pub enum ModelRequestCompletion {
              /// Request completed inside its finite deadline.
              Completed,
              /// Slot was released, but the response cannot count as on-time.
              DeadlineExceeded,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum RequestTimeState {
              Valid,
              Expired,
          }

          fn classify_request_time(
              issued_at: MonotonicInstant,
              deadline: MonotonicInstant,
              observed_at: MonotonicInstant,
          ) -> Result<RequestTimeState, ModelError> {
              if observed_at < issued_at {
                  return Err(ModelError::ObservationBeforeIssue);
              }
              if observed_at >= deadline {
                  Ok(RequestTimeState::Expired)
              } else {
                  Ok(RequestTimeState::Valid)
              }
          }
          '''
          text = text[:permit_start] + permit_replacement + text[permit_end:]

          text = text.replace(
              'pub fn validate_embedding_request(request: &EmbeddingRequest) -> Result<(), ModelError> {',
              '''pub fn validate_embedding_request(
              request: &EmbeddingRequest,
              observed_at: MonotonicInstant,
          ) -> Result<(), ModelError> {''',
          )
          embedding_capability = '''    if request.permit.capability != ModelCapability::Embedding {
                  return Err(ModelError::CapabilityMismatch);
              }'''
          embedding_replacement = '''    if request.request_id != request.permit.request_id {
                  return Err(ModelError::RequestPermitMismatch);
              }
              if !request.permit.is_valid_at(observed_at) {
                  return Err(ModelError::RequestDeadlineExceeded);
              }
              if request.permit.capability != ModelCapability::Embedding {
                  return Err(ModelError::CapabilityMismatch);
              }'''
          if 'RequestPermitMismatch' not in text[text.index('pub fn validate_embedding_request'):text.index('/// Validates exact embedding response')]:
              if embedding_capability not in text:
                  raise SystemExit('embedding validation anchor missing')
              text = text.replace(embedding_capability, embedding_replacement, 1)

          text = text.replace(
              '''pub fn validate_embedding_response(
              request: &EmbeddingRequest,
              response: &ModelResponse,
          ) -> Result<(), ModelError> {
              validate_embedding_request(request)?;''',
              '''pub fn validate_embedding_response(
              request: &EmbeddingRequest,
              response: &ModelResponse,
              observed_at: MonotonicInstant,
          ) -> Result<(), ModelError> {
              validate_embedding_request(request, observed_at)?;''',
          )

          text = text.replace(
              'pub fn validate_rerank_request(request: &RerankRequest) -> Result<(), ModelError> {',
              '''pub fn validate_rerank_request(
              request: &RerankRequest,
              observed_at: MonotonicInstant,
          ) -> Result<(), ModelError> {''',
          )
          rerank_capability = '''    if request.permit.capability != ModelCapability::CandidateRerank {
                  return Err(ModelError::CapabilityMismatch);
              }'''
          rerank_replacement = '''    if request.request_id != request.permit.request_id {
                  return Err(ModelError::RequestPermitMismatch);
              }
              if !request.permit.is_valid_at(observed_at) {
                  return Err(ModelError::RequestDeadlineExceeded);
              }
              if request.permit.capability != ModelCapability::CandidateRerank {
                  return Err(ModelError::CapabilityMismatch);
              }'''
          rerank_region = text[text.index('pub fn validate_rerank_request'):text.index('/// Validates that reranking returns')]
          if 'RequestPermitMismatch' not in rerank_region:
              if rerank_capability not in text:
                  raise SystemExit('rerank validation anchor missing')
              text = text.replace(rerank_capability, rerank_replacement, 1)

          text = text.replace(
              '''pub fn validate_rerank_response(
              request: &RerankRequest,
              response: &ModelResponse,
          ) -> Result<(), ModelError> {
              validate_rerank_request(request)?;''',
              '''pub fn validate_rerank_response(
              request: &RerankRequest,
              response: &ModelResponse,
              observed_at: MonotonicInstant,
          ) -> Result<(), ModelError> {
              validate_rerank_request(request, observed_at)?;''',
          )

          error_anchor = '''    /// Concurrent request ceiling is reached.
              InFlightLimitExceeded,
              /// In-flight accounting underflowed.
              InFlightAccountingMismatch,
              /// Accepted requests remain during stop.'''
          error_replacement = '''    /// Concurrent request ceiling is reached.
              InFlightLimitExceeded,
              /// Request identity already owns an in-flight permit.
              DuplicateRequest,
              /// Request identity has no active permit.
              RequestNotInFlight,
              /// Completion permit differs from the admitted permit.
              PermitMismatch,
              /// Request object and permit identities differ.
              RequestPermitMismatch,
              /// Monotonic deadline computation overflowed.
              DeadlineOverflow,
              /// Request or response crossed its exclusive deadline.
              RequestDeadlineExceeded,
              /// Completion observation predates permit issue.
              ObservationBeforeIssue,
              /// Accepted requests remain during stop.'''
          if 'RequestNotInFlight,' not in text:
              if error_anchor not in text:
                  raise SystemExit('ModelError in-flight anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)
          text = text.replace(
              '''            Self::InFlightLimitExceeded => "MODEL_PROVIDER_IN_FLIGHT_LIMIT",
                      Self::InFlightAccountingMismatch => "MODEL_PROVIDER_IN_FLIGHT_ACCOUNTING",
                      Self::RequestsStillInFlight => "MODEL_PROVIDER_REQUESTS_IN_FLIGHT",''',
              '''            Self::InFlightLimitExceeded => "MODEL_PROVIDER_IN_FLIGHT_LIMIT",
                      Self::DuplicateRequest => "MODEL_PROVIDER_DUPLICATE_REQUEST",
                      Self::RequestNotInFlight => "MODEL_PROVIDER_REQUEST_NOT_IN_FLIGHT",
                      Self::PermitMismatch => "MODEL_PROVIDER_PERMIT_MISMATCH",
                      Self::RequestPermitMismatch => "MODEL_PROVIDER_REQUEST_PERMIT_MISMATCH",
                      Self::DeadlineOverflow => "MODEL_PROVIDER_DEADLINE_OVERFLOW",
                      Self::RequestDeadlineExceeded => "MODEL_PROVIDER_REQUEST_DEADLINE_EXCEEDED",
                      Self::ObservationBeforeIssue => "MODEL_PROVIDER_OBSERVATION_BEFORE_ISSUE",
                      Self::RequestsStillInFlight => "MODEL_PROVIDER_REQUESTS_IN_FLIGHT",''',
          )
          text = text.replace('    InFlightAccountingMismatch,\n', '')
          text = text.replace(
              '            Self::InFlightAccountingMismatch => "MODEL_PROVIDER_IN_FLIGHT_ACCOUNTING",\n',
              '',
          )

          if 'request_time_is_monotonic_and_deadline_is_exclusive' not in text:
              text += r'''

          #[cfg(test)]
          mod request_time_tests {
              use super::{
                  ModelError, RequestTimeState, classify_request_time,
              };
              use search_ports::MonotonicInstant;

              #[test]
              fn request_time_is_monotonic_and_deadline_is_exclusive() {
                  let issued = MonotonicInstant::from_ticks(10);
                  let deadline = MonotonicInstant::from_ticks(20);
                  assert_eq!(
                      classify_request_time(
                          issued,
                          deadline,
                          MonotonicInstant::from_ticks(9),
                      ),
                      Err(ModelError::ObservationBeforeIssue)
                  );
                  assert_eq!(
                      classify_request_time(issued, deadline, issued),
                      Ok(RequestTimeState::Valid)
                  );
                  assert_eq!(
                      classify_request_time(
                          issued,
                          deadline,
                          MonotonicInstant::from_ticks(19),
                      ),
                      Ok(RequestTimeState::Valid)
                  );
                  assert_eq!(
                      classify_request_time(issued, deadline, deadline),
                      Ok(RequestTimeState::Expired)
                  );
              }
          }
          '''

          path.write_text(text)

          functions_path = Path('crates/search-model-provider/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Exact request permits

          Provider admission is keyed by `RequestId` and returns a permit bound
          to capability, owner epoch, profile, session, limits, issue instant,
          and exclusive monotonic deadline. Completion releases only the exact
          stored permit. Expired responses free capacity but are classified as
          deadline-exceeded and cannot be accepted as successful model output.
          '''
          if '## Exact request permits' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify model permit accounting and deadlines
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-model-provider --all-targets --locked
            cargo test -p search-model-provider --all-targets --locked
            cargo clippy -p search-model-provider --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'in_flight: BTreeMap<RequestId, ModelRequestPermit>' crates/search-model-provider/src/lib.rs
            grep -q 'pub request_id: RequestId' crates/search-model-provider/src/lib.rs
            grep -q 'pub deadline: MonotonicInstant' crates/search-model-provider/src/lib.rs
            git diff --check
          } 2>&1 | tee model-permit-verify.log

      - name: Commit verified permit repair or bounded failure evidence
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-model-request-permits.yml
          mkdir -p qualification/model-provider
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/model-provider/PERMIT_FAILURE.txt
            cat > qualification/model-provider/REQUEST_PERMITS_VERIFIED.md <<EOF
          # Model request permits

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          In-flight capacity is keyed by exact request permits. Completion cannot
          release another request's slot, and request/response validation now
          enforces the configured exclusive monotonic deadline.
          EOF
            git add -A
            subject="fix(model-provider): bind slots and deadlines to request permits"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-model-request-permits.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 450 model-permit-patch.log 2>/dev/null || true
              tail -n 850 model-permit-verify.log 2>/dev/null || true
            } > qualification/model-provider/PERMIT_FAILURE.txt
            git add -A
            subject="verify(model-provider): record failed request-permit repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

name: Ticket issuance advisory planner v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticket-issuance-plan-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify schema-v2 fail-closed planner
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Compile Rust planner and run conformance corpus
        shell: pwsh
        run: |
          cargo check --locked -p xtask --all-targets
          cargo test --locked -p xtask --test ticket_issuance_builder
          cargo test --locked -p xtask --test ticket_issuance_conformance
          cargo test --locked -p xtask --test ticket_issuance_builder_runtime_boundary
          cargo test --locked -p xtask --test ticket_issuance_validation

      - name: Validate planner registry, schema and current result
        shell: pwsh
        run: ./tools/validate-ticket-issuance-plan.ps1 -Json

      - name: Revalidate repository topology
        shell: pwsh
        run: ./tools/validate-swarm.ps1 -Json

      - name: Revalidate P00 drafts
        shell: pwsh
        run: ./tools/validate-p00-ticket-drafts.ps1 -Json

      - name: Revalidate ticket issuance schemas
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1 -Json

      - name: Revalidate P00 acceptance boundary
        shell: pwsh
        run: ./tools/validate-p00-foundation-acceptance.ps1 -Json

      - name: Produce and inspect current advisory plan
        shell: pwsh
        run: |
          ./tools/plan-ticket-issuance.ps1 `
            -Package search-contracts `
            -Output artifacts/ticket-issuance-plans/search-contracts.json

          $plan = Get-Content artifacts/ticket-issuance-plans/search-contracts.json -Raw | ConvertFrom-Json
          if ($plan.decision -ne 'BLOCKED_MISSING_SELECTION') {
            throw "Unexpected current decision: $($plan.decision)"
          }
          if ($plan.reason_codes.Count -ne 0) {
            throw "Unexpected current reason codes: $($plan.reason_codes -join ',')"
          }
          if ($plan.mutations.Count -ne 0) {
            throw 'Planner emitted a mutation.'
          }
          foreach ($field in @(
            'authorizes_context_materialization',
            'authorizes_ticket_issuance',
            'creates_writer_lease',
            'authorizes_implementation',
            'publishes_package_handoff',
            'advances_launch_state'
          )) {
            if ($plan.$field -ne $false) {
              throw "Planner enabled authority field: $field"
            }
          }

      - name: Verify repository remains clean
        shell: pwsh
        run: git diff --exit-code

name: one-shot bind Qdrant stop readback to process identity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-qdrant-stop-readback.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-qdrant-stop-readback
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Require exact process identity in stop readback
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee qdrant-stop-readback-patch.log
          from pathlib import Path

          path = Path('crates/search-index-qdrant/search-qdrant-supervisor/src/lib.rs')
          text = path.read_text()

          stop_effect_end = '''pub struct StopEffect {
              /// Exact process identity.
              pub process: QdrantProcessIdentity,
              /// Immutable stop operation.
              pub operation: MutationIdentity,
              /// Graceful stop deadline.
              pub deadline: MonotonicInstant,
              /// Whether a qualified adapter may force termination after exact deadline
              /// and identity revalidation.
              pub allow_force_after_deadline: bool,
          }
          '''
          stop_readback = '''pub struct StopEffect {
              /// Exact process identity.
              pub process: QdrantProcessIdentity,
              /// Immutable stop operation.
              pub operation: MutationIdentity,
              /// Graceful stop deadline.
              pub deadline: MonotonicInstant,
              /// Whether a qualified adapter may force termination after exact deadline
              /// and identity revalidation.
              pub allow_force_after_deadline: bool,
          }

          /// Exact post-stop observation bound to one process incarnation.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum StopReadback {
              /// The exact target process is authoritatively absent.
              Absent {
                  /// Exact process identity whose absence was inspected.
                  process: QdrantProcessIdentity,
                  /// Content-free absence receipt.
                  receipt: ReceiptRef,
              },
              /// The exact target process produced a terminal exit observation.
              Exited {
                  /// Exact exited process identity.
                  process: QdrantProcessIdentity,
                  /// Closed exit classification.
                  class: ExitClass,
                  /// Content-free exit receipt.
                  receipt: ReceiptRef,
              },
              /// Exact target process is still live and ready.
              StillLive(QdrantReadiness),
              /// Another live process occupies the expected endpoint/storage scope.
              LiveConflict(QdrantProcessIdentity),
              /// Adapter could not classify exact target process state.
              Unverifiable,
          }
          '''
          if 'pub enum StopReadback {' not in text:
              if stop_effect_end not in text:
                  raise SystemExit('StopEffect anchor missing')
              text = text.replace(stop_effect_end, stop_readback, 1)

          finish_start = text.index('    /// Accepts exact process absence/expected exit after stop.')
          finish_end = text.index('\n    /// Explicitly quarantines process state.', finish_start)
          finish_replacement = '''    /// Accepts exact process absence or expected exit after stop.
              pub fn finish_stop(
                  &mut self,
                  readback: StopReadback,
              ) -> Result<StopReceipt, SupervisorError> {
                  let (instance, operation, request_digest) = match &self.state {
                      SupervisorState::Stopping {
                          instance,
                          operation,
                          request_digest,
                          ..
                      }
                      | SupervisorState::StopOutcomeUnknown {
                          instance,
                          operation,
                          request_digest,
                      } => (instance.clone(), operation.clone(), *request_digest),
                      _ => return Err(SupervisorError::InvalidTransition),
                  };
                  let expected_process = instance.readiness.process.clone();
                  let observation_receipt = match readback {
                      StopReadback::Absent { process, receipt }
                          if process == expected_process => receipt,
                      StopReadback::Exited {
                          process,
                          class: ExitClass::Expected | ExitClass::Forced,
                          receipt,
                      } if process == expected_process => receipt,
                      StopReadback::StillLive(readiness)
                          if readiness.process == expected_process => {
                          self.state = SupervisorState::StopOutcomeUnknown {
                              instance,
                              operation,
                              request_digest,
                          };
                          return Err(SupervisorError::StopOutcomeUnknown);
                      }
                      StopReadback::Exited {
                          process,
                          class,
                          ..
                      } if process == expected_process => {
                          self.state = SupervisorState::Failed {
                              instance,
                              exit_class: class,
                          };
                          return Err(SupervisorError::ProcessFailed);
                      }
                      StopReadback::Unverifiable => {
                          self.state = SupervisorState::StopOutcomeUnknown {
                              instance,
                              operation,
                              request_digest,
                          };
                          return Err(SupervisorError::StopOutcomeUnknown);
                      }
                      StopReadback::Absent { .. }
                      | StopReadback::Exited { .. }
                      | StopReadback::StillLive(_)
                      | StopReadback::LiveConflict(_) => {
                          self.state = SupervisorState::Quarantined {
                              last_instance_revision: Some(instance.instance_revision),
                              reason: SupervisorError::ProcessIdentityConflict,
                          };
                          return Err(SupervisorError::ProcessIdentityConflict);
                      }
                  };
                  let receipt = StopReceipt {
                      process: expected_process,
                      instance_revision: instance.instance_revision,
                      operation,
                      observation_receipt,
                  };
                  self.state = SupervisorState::Stopped {
                      last_instance_revision: Some(instance.instance_revision),
                  };
                  Ok(receipt)
              }
          '''
          text = text[:finish_start] + finish_replacement + text[finish_end:]

          path.write_text(text)

          functions_path = Path('crates/search-index-qdrant/search-qdrant-supervisor/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Exact stop readback

          Stop completion consumes `StopReadback`, not the broader health/start
          observation. `Absent`, `Exited`, and `StillLive` are explicitly bound
          to the target `QdrantProcessIdentity`. A mismatched process identity
          quarantines the supervisor. Unverifiable or still-live exact readback
          preserves the original stop request digest in `StopOutcomeUnknown`.
          '''
          if '## Exact stop readback' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify exact stop readback and workspace
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-qdrant-supervisor --all-targets --locked
            cargo test -p search-qdrant-supervisor --all-targets --locked
            cargo clippy -p search-qdrant-supervisor --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            grep -q 'pub enum StopReadback' crates/search-index-qdrant/search-qdrant-supervisor/src/lib.rs
            grep -q 'readback: StopReadback' crates/search-index-qdrant/search-qdrant-supervisor/src/lib.rs
            finish_block="$(sed -n '/Accepts exact process absence or expected exit after stop/,/Explicitly quarantines process state/p' crates/search-index-qdrant/search-qdrant-supervisor/src/lib.rs)"
            if printf '%s' "$finish_block" | grep -q 'ProcessObservation::Absent'; then
              echo 'unscoped process absence remains in finish_stop'
              exit 1
            fi
            if grep -q 'request_digest: Blake3Digest32::from_bytes(\[0; 32\])' crates/search-index-qdrant/search-qdrant-supervisor/src/lib.rs; then
              echo 'zero stop digest remains'
              exit 1
            fi
            git diff --check
          } 2>&1 | tee qdrant-stop-readback-verify.log

      - name: Commit verified readback repair or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-qdrant-stop-readback.yml
          mkdir -p qualification/qdrant-supervisor
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/qdrant-supervisor/STOP_READBACK_FAILURE.txt
            cat > qualification/qdrant-supervisor/STOP_READBACK_VERIFIED.md <<EOF
          # Qdrant stop readback

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Stop completion now requires an absence or exit observation explicitly
          bound to the exact target process incarnation. Still-live and
          unverifiable observations preserve the original request digest and
          remain outcome-unknown; mismatched identities quarantine.
          EOF
            git add -A
            subject="fix(qdrant-supervisor): bind stop readback to process identity"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-qdrant-stop-readback.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 350 qdrant-stop-readback-patch.log 2>/dev/null || true
              tail -n 750 qdrant-stop-readback-verify.log 2>/dev/null || true
            } > qualification/qdrant-supervisor/STOP_READBACK_FAILURE.txt
            git add -A
            subject="verify(qdrant-supervisor): record failed stop-readback repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

name: one-shot consolidated repository audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-consolidated-audit.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: one-shot-consolidated-repository-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      REPO: UnknownAlienHuman/eliot-search
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for every earlier repository workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(35)
          do {
            $response = gh api --paginate "repos/$env:REPO/actions/runs?per_page=100" | ConvertFrom-Json
            $others = @($response.workflow_runs | Where-Object {
              [string]$_.id -ne $env:GITHUB_RUN_ID -and
              $_.status -in @('queued', 'in_progress', 'waiting', 'requested', 'pending')
            })
            if ($others.Count -eq 0) {
              break
            }
            Write-Host "Waiting for $($others.Count) earlier workflow run(s):"
            $others | Select-Object id, name, status, head_sha | Format-Table | Out-String | Write-Host
            Start-Sleep -Seconds 20
          } while ([DateTime]::UtcNow -lt $deadline)
          if ($others.Count -ne 0) {
            throw 'Timed out waiting for earlier workflow runs to finish.'
          }

      - name: Reset to exact latest main and remove completed one-shot workflow files
        id: sync
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main
          $base = (git rev-parse HEAD).Trim()
          "base_sha=$base" >> $env:GITHUB_OUTPUT
          Get-ChildItem .github/workflows/zz-one-shot-*.yml -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Write-Host "Auditing exact latest main: $base"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0
          rustc -Vv
          cargo -V
          rustfmt -V
          cargo clippy -V
          pwsh -Version

      - name: Run consolidated qualification
        id: verify
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failures = [Collections.Generic.List[string]]::new()
          $log = Join-Path $PWD 'qualification-audit.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          function Invoke-Checked {
            param(
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][scriptblock]$Command
            )
            "`n===== $Name =====" | Tee-Object -FilePath $log -Append
            & $Command 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
            if ($null -eq $code) { $code = 0 }
            if ($code -ne 0) {
              $failures.Add("$Name (exit $code)")
            }
            $global:LASTEXITCODE = 0
          }

          Invoke-Checked 'PowerShell development runner parser' {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path tools/eliot-search-dev.ps1),
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | Format-List -Force | Out-String | Write-Error
              exit 1
            }
          }

          Invoke-Checked 'PowerShell Windows qualification parser' {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path qualification/direct-runtime/test_windows_runner.ps1),
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | Format-List -Force | Out-String | Write-Error
              exit 1
            }
          }

          Invoke-Checked 'Bootstrap qualification corpus' {
            python -m py_compile tools/validate-integration-bootstrap.py qualification/integration-bootstrap/test_integration_bootstrap_v1.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python qualification/integration-bootstrap/test_integration_bootstrap_v1.py
          }

          Invoke-Checked 'Unresolved qualification failure markers' {
            $markers = @(Get-ChildItem qualification -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match '(?i)(^LAST_FAILURE|FAILURE|FAIL\.txt|FAILURES)'
              })
            if ($markers.Count -ne 0) {
              $markers.FullName | Write-Output
              exit 1
            }
          }

          Invoke-Checked 'Rust formatting' {
            cargo fmt --all -- --check
          }
          Invoke-Checked 'Rust workspace compile' {
            cargo check --workspace --all-targets --locked
          }
          Invoke-Checked 'Rust workspace tests' {
            cargo test --workspace --all-targets --locked
          }
          Invoke-Checked 'Rust workspace Clippy' {
            cargo clippy --workspace --all-targets --locked -- -D warnings
          }
          Invoke-Checked 'Rust workspace documentation' {
            cargo doc --workspace --no-deps --locked
          }
          Invoke-Checked 'Daemon self-test' {
            cargo run --locked -q -p eliot-searchd -- --self-test
          }
          Invoke-Checked 'CLI self-test' {
            cargo run --locked -q -p eliot-search -- --self-test
          }
          Invoke-Checked 'Model worker self-test' {
            cargo run --locked -q -p eliot-search-model-worker -- --self-test
          }
          Invoke-Checked 'Document worker self-test' {
            cargo run --locked -q -p eliot-search-doc-worker -- --self-test
          }
          Invoke-Checked 'Windows start-search-stop-restart qualification' {
            pwsh -NoProfile -File qualification/direct-runtime/test_windows_runner.ps1
          }
          Invoke-Checked 'Diff whitespace validation' {
            git diff --check
          }

          "`n===== SUMMARY =====" | Tee-Object -FilePath $log -Append
          if ($failures.Count -ne 0) {
            $failures | ForEach-Object { "FAIL: $_" } |
              Tee-Object -FilePath $log -Append
            exit 1
          }
          'PASS: every consolidated qualification check completed.' |
            Tee-Object -FilePath $log -Append

      - name: Delete non-main branches and prove branch discipline
        id: branches
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branches = @(gh api --paginate "repos/$env:REPO/branches?per_page=100" --jq '.[].name')
          foreach ($branch in $branches) {
            if ($branch -eq 'main') { continue }
            $encoded = [Uri]::EscapeDataString($branch)
            Write-Host "Deleting obsolete branch: $branch"
            gh api -X DELETE "repos/$env:REPO/git/refs/heads/$encoded"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $remaining = @(gh api --paginate "repos/$env:REPO/branches?per_page=100" --jq '.[].name')
          $remaining | Write-Host
          if ($remaining.Count -ne 1 -or $remaining[0] -ne 'main') {
            throw 'Branch discipline check failed: only main may remain.'
          }

      - name: Publish one authoritative audit status and self-delete
        if: always()
        shell: pwsh
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BRANCH_OUTCOME: ${{ steps.branches.outcome }}
          TESTED_SHA: ${{ steps.sync.outputs.base_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item .github/workflows/zz-one-shot-*.yml -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory qualification -Force | Out-Null
          $now = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $success = $env:VERIFY_OUTCOME -eq 'success' -and $env:BRANCH_OUTCOME -eq 'success'

          if ($success) {
            @"
# Current repository qualification

Status: **PASS**

- Tested main commit: ``$env:TESTED_SHA``
- Verified at: ``$now``
- Runner: ``windows-latest``
- Rust toolchain: ``1.98.0``
- Branches after cleanup: ``main`` only

Passed:

- PowerShell parser checks;
- bootstrap qualification corpus;
- absence of unresolved failure markers;
- workspace format, compile, tests, Clippy with warnings denied, and rustdoc;
- daemon, CLI, model-worker, and document-worker self-tests;
- Windows DIRECT start/search/stop/restart qualification;
- repository whitespace and branch-discipline checks.

## Scope

This proves the current Rust workspace and runnable authenticated DIRECT baseline.
It does **not** claim that the complete product is finished. Concrete persistent
control/redb integration, full daemon orchestration of immutable revision →
materialization → unitization → lexical/index publication, production Qdrant
transport, and real model/document backends remain implementation work unless a
later qualification explicitly proves them.
"@ | Set-Content qualification/CURRENT_STATUS.md -Encoding utf8NoBOM
            Remove-Item qualification/CURRENT_FAILURES.txt -Force -ErrorAction SilentlyContinue
            $subject = 'verify: record consolidated green repository status'
          }
          else {
            $tail = if (Test-Path qualification-audit.log) {
              (Get-Content qualification-audit.log -Tail 900) -join "`n"
            }
            else {
              'qualification-audit.log was not produced'
            }
            @"
Status: FAIL
Tested main commit: $env:TESTED_SHA
Verified at: $now
Verification outcome: $env:VERIFY_OUTCOME
Branch outcome: $env:BRANCH_OUTCOME

--- bounded audit log tail ---
$tail
"@ | Set-Content qualification/CURRENT_FAILURES.txt -Encoding utf8NoBOM
            Remove-Item qualification/CURRENT_STATUS.md -Force -ErrorAction SilentlyContinue
            $subject = 'verify: record consolidated repository failures'
          }

          Remove-Item qualification-audit.log -Force -ErrorAction SilentlyContinue
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git diff --cached --quiet) {
            Write-Host 'No audit commit required.'
          }
          else {
            git commit -m "$subject [skip ci]"
            git fetch origin main
            $origin = (git rev-parse origin/main).Trim()
            if ($origin -ne $env:TESTED_SHA) {
              throw "main changed during consolidated audit: tested=$env:TESTED_SHA current=$origin"
            }
            git push origin HEAD:main
          }
          if (-not $success) { exit 1 }

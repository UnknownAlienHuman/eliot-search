name: one-shot require explicit Qdrant delete readback

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-qdrant-delete-proof.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-qdrant-delete-proof
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Replace omission-based delete inference with explicit absence facts
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee qdrant-delete-patch.log
          from pathlib import Path

          path = Path('crates/search-index-qdrant/search-qdrant-bridge/src/lib.rs')
          text = path.read_text()

          point_anchor = '''/// Exact schema readback from the concrete adapter.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct SchemaReadback {'''
          point_enum = '''/// Exact terminal readback for one point mutation action.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum PointMutationReadback {
              /// Exact point is present after an upsert.
              Present(PointReadback),
              /// Exact point is authoritatively absent after deletion.
              Absent {
                  /// Compact ID and complete logical-key digest.
                  identity: BridgePointIdentity,
                  /// Exact collection generation inspected.
                  collection_generation_id: CollectionGenerationId,
                  /// Content-free Qdrant absence receipt.
                  receipt: ReceiptRef,
              },
          }

          impl PointMutationReadback {
              fn identity(&self) -> BridgePointIdentity {
                  match self {
                      Self::Present(readback) => readback.identity,
                      Self::Absent { identity, .. } => *identity,
                  }
              }

              fn ordinal(&self) -> u8 {
                  match self {
                      Self::Present(_) => 0,
                      Self::Absent { .. } => 1,
                  }
              }
          }

          '''
          if 'pub enum PointMutationReadback {' not in text:
              if point_anchor not in text:
                  raise SystemExit('PointMutationReadback insertion anchor missing')
              text = text.replace(point_anchor, point_enum + point_anchor, 1)

          text = text.replace(
              'Applied(Vec<PointReadback>),',
              'Applied(Vec<PointMutationReadback>),',
          )
          text = text.replace(
              'fn digest_readbacks(&self, readbacks: &[PointReadback]) -> Blake3Digest32;',
              'fn digest_readbacks(&self, readbacks: &[PointMutationReadback]) -> Blake3Digest32;',
          )
          text = text.replace(
              ') -> Result<Vec<PointReadback>, Self::Error>;',
              ') -> Result<Vec<PointMutationReadback>, Self::Error>;',
          )

          verify_start = text.index('/// Validates exact applied mutation readback and builds a receipt.')
          verify_end = text.index('\n/// Validates a filtered search request before transport.', verify_start)
          verify_replacement = '''/// Validates exact applied mutation readback and builds a receipt.
          pub fn verify_mutation_outcome<D>(
              batch: &PointMutationBatch,
              schema: &CollectionSchema,
              limits: BridgeLimits,
              outcome: MutationTransportOutcome,
              digester: &D,
          ) -> Result<BridgeMutationReceipt, BridgeError>
          where
              D: BridgeDigester,
          {
              validate_mutation_batch(batch, schema, limits)?;
              let mut readbacks = match outcome {
                  MutationTransportOutcome::Applied(readbacks) => readbacks,
                  MutationTransportOutcome::Rejected(error) => return Err(error),
                  MutationTransportOutcome::OutcomeUnknown => {
                      return Err(BridgeError::OutcomeUnknown);
                  }
              };
              if readbacks.len() > limits.max_readback_points() {
                  return Err(BridgeError::ReadbackLimitExceeded);
              }
              let expected_count = batch
                  .upserts
                  .len()
                  .checked_add(batch.deletes.len())
                  .ok_or(BridgeError::ReadbackCountMismatch)?;
              if readbacks.len() != expected_count {
                  return Err(BridgeError::ReadbackCountMismatch);
              }

              readbacks.sort_by_key(|readback| (readback.identity(), readback.ordinal()));
              let expected_upserts = batch
                  .upserts
                  .iter()
                  .map(|point| (point.identity, point.payload.payload_digest))
                  .collect::<BTreeMap<_, _>>();
              let expected_deletes = batch
                  .deletes
                  .iter()
                  .map(|point| point.identity)
                  .collect::<BTreeSet<_>>();
              let mut facts = Vec::with_capacity(readbacks.len());
              for readback in &readbacks {
                  match readback {
                      PointMutationReadback::Present(point) => {
                          if point.collection_generation_id != batch.collection_generation_id {
                              return Err(BridgeError::MutationReadbackMismatch);
                          }
                          facts.push(PointReadbackFact::Present {
                              identity: point.identity,
                              payload_digest: point.payload_digest,
                          });
                      }
                      PointMutationReadback::Absent {
                          identity,
                          collection_generation_id,
                          ..
                      } => {
                          if *collection_generation_id != batch.collection_generation_id {
                              return Err(BridgeError::DeleteReadbackMismatch);
                          }
                          facts.push(PointReadbackFact::Absent {
                              identity: *identity,
                          });
                      }
                  }
              }
              verify_point_readback_facts(
                  &expected_upserts,
                  &expected_deletes,
                  &facts,
              )?;

              Ok(BridgeMutationReceipt {
                  collection_generation_id: batch.collection_generation_id,
                  schema_digest: batch.schema_digest,
                  operation: batch.operation.clone(),
                  request_digest: batch.request_digest,
                  upsert_count: batch.upserts.len(),
                  delete_count: batch.deletes.len(),
                  readback_digest: digester.digest_readbacks(&readbacks),
              })
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum PointReadbackFact {
              Present {
                  identity: BridgePointIdentity,
                  payload_digest: Blake3Digest32,
              },
              Absent {
                  identity: BridgePointIdentity,
              },
          }

          fn verify_point_readback_facts(
              expected_upserts: &BTreeMap<BridgePointIdentity, Blake3Digest32>,
              expected_deletes: &BTreeSet<BridgePointIdentity>,
              facts: &[PointReadbackFact],
          ) -> Result<(), BridgeError> {
              let expected_count = expected_upserts
                  .len()
                  .checked_add(expected_deletes.len())
                  .ok_or(BridgeError::ReadbackCountMismatch)?;
              if facts.len() != expected_count {
                  return Err(BridgeError::ReadbackCountMismatch);
              }

              let mut seen = BTreeSet::new();
              for fact in facts {
                  let identity = match fact {
                      PointReadbackFact::Present {
                          identity,
                          payload_digest,
                      } => {
                          if expected_deletes.contains(identity) {
                              return Err(BridgeError::DeleteReadbackMismatch);
                          }
                          if expected_upserts.get(identity) != Some(payload_digest) {
                              return Err(BridgeError::MutationReadbackMismatch);
                          }
                          *identity
                      }
                      PointReadbackFact::Absent { identity } => {
                          if !expected_deletes.contains(identity) {
                              return Err(BridgeError::MutationReadbackMismatch);
                          }
                          *identity
                      }
                  };
                  if !seen.insert(identity) {
                      return Err(BridgeError::DuplicatePointReadback);
                  }
              }
              Ok(())
          }
          '''
          text = text[:verify_start] + verify_replacement + text[verify_end:]

          error_anchor = '''    /// Mutation readback exceeds its finite ceiling.
              ReadbackLimitExceeded,
              /// Upsert readback identity/payload/generation differs.'''
          error_replacement = '''    /// Mutation readback exceeds its finite ceiling.
              ReadbackLimitExceeded,
              /// Readback set does not contain exactly one fact per mutation action.
              ReadbackCountMismatch,
              /// Same point identity appears more than once in mutation readback.
              DuplicatePointReadback,
              /// Upsert readback identity/payload/generation differs.'''
          if 'ReadbackCountMismatch,' not in text:
              if error_anchor not in text:
                  raise SystemExit('BridgeError readback anchor missing')
              text = text.replace(error_anchor, error_replacement, 1)

          code_anchor = '''            Self::ReadbackLimitExceeded => "QDRANT_BRIDGE_READBACK_LIMIT",
                      Self::MutationReadbackMismatch => "QDRANT_BRIDGE_MUTATION_READBACK_MISMATCH",'''
          code_replacement = '''            Self::ReadbackLimitExceeded => "QDRANT_BRIDGE_READBACK_LIMIT",
                      Self::ReadbackCountMismatch => "QDRANT_BRIDGE_READBACK_COUNT_MISMATCH",
                      Self::DuplicatePointReadback => "QDRANT_BRIDGE_DUPLICATE_POINT_READBACK",
                      Self::MutationReadbackMismatch => "QDRANT_BRIDGE_MUTATION_READBACK_MISMATCH",'''
          if 'QDRANT_BRIDGE_READBACK_COUNT_MISMATCH' not in text:
              if code_anchor not in text:
                  raise SystemExit('BridgeError readback code anchor missing')
              text = text.replace(code_anchor, code_replacement, 1)

          if 'delete_requires_explicit_absence_fact' not in text:
              tests = r'''

          #[cfg(test)]
          mod tests {
              use std::collections::{BTreeMap, BTreeSet};

              use super::{
                  Blake3Digest32, BridgeError, BridgePointIdentity,
                  PointReadbackFact, verify_point_readback_facts,
              };

              const fn identity(marker: u8) -> BridgePointIdentity {
                  BridgePointIdentity {
                      point_id: [marker; 16],
                      logical_key_digest: Blake3Digest32::from_bytes([marker; 32]),
                  }
              }

              #[test]
              fn delete_requires_explicit_absence_fact() {
                  let upsert = identity(1);
                  let deleted = identity(2);
                  let payload = Blake3Digest32::from_bytes([9; 32]);
                  let expected_upserts = BTreeMap::from([(upsert, payload)]);
                  let expected_deletes = BTreeSet::from([deleted]);

                  assert_eq!(
                      verify_point_readback_facts(
                          &expected_upserts,
                          &expected_deletes,
                          &[PointReadbackFact::Present {
                              identity: upsert,
                              payload_digest: payload,
                          }],
                      ),
                      Err(BridgeError::ReadbackCountMismatch)
                  );
                  assert_eq!(
                      verify_point_readback_facts(
                          &expected_upserts,
                          &expected_deletes,
                          &[
                              PointReadbackFact::Present {
                                  identity: upsert,
                                  payload_digest: payload,
                              },
                              PointReadbackFact::Absent { identity: deleted },
                          ],
                      ),
                      Ok(())
                  );
                  assert_eq!(
                      verify_point_readback_facts(
                          &expected_upserts,
                          &expected_deletes,
                          &[
                              PointReadbackFact::Present {
                                  identity: upsert,
                                  payload_digest: payload,
                              },
                              PointReadbackFact::Present {
                                  identity: deleted,
                                  payload_digest: payload,
                              },
                          ],
                      ),
                      Err(BridgeError::DeleteReadbackMismatch)
                  );
              }
          }
          '''
              text += tests

          path.write_text(text)

          functions_path = Path('crates/search-index-qdrant/search-qdrant-bridge/FUNCTIONS.md')
          functions = functions_path.read_text()
          section = '''

          ## Explicit mutation readback

          `MutationTransportOutcome::Applied` contains exactly one terminal
          `PointMutationReadback` for every requested action. Upserts require
          `Present` with the exact payload digest; deletes require an explicit
          authoritative `Absent` receipt. Omission from a response is never
          interpreted as successful deletion.
          '''
          if '## Explicit mutation readback' not in functions:
              functions_path.write_text(functions + section)
          PY
          cargo fmt --all

      - name: Verify explicit deletion proof
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-qdrant-bridge --all-targets --locked
            cargo test -p search-qdrant-bridge --all-targets --locked
            cargo clippy -p search-qdrant-bridge --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            git diff --check
          } 2>&1 | tee qdrant-delete-verify.log

      - name: Commit verified proof repair or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-qdrant-delete-proof.yml
          mkdir -p qualification/qdrant-bridge
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/qdrant-bridge/LAST_FAILURE.txt
            cat > qualification/qdrant-bridge/DELETE_READBACK_VERIFIED.md <<EOF
          # Qdrant delete readback

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Applied mutation outcomes now contain exactly one explicit terminal
          readback per point action. Deletion requires an authoritative
          \`Absent\` receipt; missing response entries cannot prove deletion.
          EOF
            git add -A
            subject="fix(qdrant-bridge): require explicit delete absence readback"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-qdrant-delete-proof.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 300 qdrant-delete-patch.log 2>/dev/null || true
              tail -n 650 qdrant-delete-verify.log 2>/dev/null || true
            } > qualification/qdrant-bridge/LAST_FAILURE.txt
            git add -A
            subject="verify(qdrant-bridge): record failed delete-readback repair"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

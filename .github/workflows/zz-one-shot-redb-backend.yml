name: one-shot implement concrete redb control backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-redb-backend.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-redb-control-backend
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Require clean qualified baseline
        shell: bash
        run: |
          test -f qualification/CURRENT_STATUS.md
          test ! -f qualification/CURRENT_FAILURES.txt
          if find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print -quit | grep -q .; then
            echo 'unresolved qualification failure marker exists'
            find qualification -type f \( -iname '*FAIL*.txt' -o -name 'LAST_FAILURE.txt' -o -name '*FAILURE.txt' \) -print
            exit 1
          fi

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Add redb and blake3 workspace dependencies
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee redb-dependencies.log
          from pathlib import Path

          root = Path('Cargo.toml')
          text = root.read_text()
          section = '[workspace.dependencies]'
          if section not in text:
              raise SystemExit('workspace.dependencies section is required')
          start = text.index(section) + len(section)
          end = text.find('\n[', start)
          if end == -1:
              end = len(text)
          block = text[start:end]
          additions = []
          if '\nredb =' not in '\n' + block:
              additions.append('redb = "3"')
          if '\nblake3 =' not in '\n' + block:
              additions.append('blake3 = "1.8"')
          if additions:
              insertion = '\n' + '\n'.join(additions)
              text = text[:end] + insertion + text[end:]
              root.write_text(text)

          crate = Path('crates/search-control-redb/Cargo.toml')
          manifest = crate.read_text()
          dep_section = '[dependencies]'
          if dep_section not in manifest:
              manifest += '\n[dependencies]\n'
          for dependency in ('redb.workspace = true', 'blake3.workspace = true'):
              if dependency not in manifest:
                  dep_start = manifest.index(dep_section) + len(dep_section)
                  dep_end = manifest.find('\n[', dep_start)
                  if dep_end == -1:
                      dep_end = len(manifest)
                  manifest = manifest[:dep_end] + '\n' + dependency + manifest[dep_end:]
          crate.write_text(manifest)
          PY
          cargo generate-lockfile

      - name: Implement transactional redb backend
        id: patch
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cat > crates/search-control-redb/src/redb_backend.rs <<'RS' 2> redb-patch.log
          //! Concrete transactional `redb` backend for the control journal.

          use std::collections::BTreeSet;
          use std::fmt;
          use std::path::Path;

          use redb::{Database, ReadableTable, TableDefinition};
          use search_contracts::{Blake3Digest32, OpaqueId};

          use crate::{
              BackendCommit, BackendSnapshot, ControlBackend, ControlError, ControlKey,
              ControlMutation, ControlRecordClass, ControlValue, SchemaVersion,
          };

          const META_TABLE: TableDefinition<&str, &[u8]> =
              TableDefinition::new("eliot_control_meta_v1");
          const RECORD_TABLE: TableDefinition<&[u8], &[u8]> =
              TableDefinition::new("eliot_control_records_v1");
          const OPERATION_TABLE: TableDefinition<&[u8], &[u8]> =
              TableDefinition::new("eliot_control_operations_v1");
          const META_SCHEMA_VERSION: &str = "schema_version";
          const META_JOURNAL_REVISION: &str = "journal_revision";
          const MAX_OPERATION_KEY_BYTES: usize = 4 * 1024;
          const OPERATION_RECORD_BYTES: usize = 80;

          /// Canonically encodes the complete immutable operation identity.
          ///
          /// The encoder is supplied by composition because [`OpaqueId`] does not
          /// expose vendor-storage bytes. Equal operation identities must always
          /// return equal, non-empty bytes; distinct identities must not collide.
          pub trait ControlOperationKeyEncoder {
              /// Returns finite canonical bytes for one operation identity.
              fn encode_operation_key(
                  &self,
                  operation_id: &OpaqueId,
              ) -> Result<Vec<u8>, RedbBackendError>;
          }

          /// Concrete transactional control backend backed by one `redb` database.
          pub struct RedbControlBackend<E> {
              database: Database,
              operation_keys: E,
          }

          impl<E> RedbControlBackend<E>
          where
              E: ControlOperationKeyEncoder,
          {
              /// Creates or opens a database and initializes exact schema metadata.
              pub fn create(
                  path: impl AsRef<Path>,
                  schema_version: SchemaVersion,
                  operation_keys: E,
              ) -> Result<Self, RedbBackendError> {
                  let database = Database::create(path)
                      .map_err(|_| RedbBackendError::DatabaseOpenFailed)?;
                  let backend = Self {
                      database,
                      operation_keys,
                  };
                  backend.initialize(schema_version)?;
                  Ok(backend)
              }

              /// Opens an existing database and verifies its exact schema version.
              pub fn open(
                  path: impl AsRef<Path>,
                  expected_schema_version: SchemaVersion,
                  operation_keys: E,
              ) -> Result<Self, RedbBackendError> {
                  let database = Database::open(path)
                      .map_err(|_| RedbBackendError::DatabaseOpenFailed)?;
                  let backend = Self {
                      database,
                      operation_keys,
                  };
                  let snapshot = backend.load_snapshot_internal()?;
                  if snapshot.schema_version != expected_schema_version {
                      return Err(RedbBackendError::SchemaMismatch);
                  }
                  Ok(backend)
              }

              fn initialize(
                  &self,
                  schema_version: SchemaVersion,
              ) -> Result<(), RedbBackendError> {
                  let transaction = self
                      .database
                      .begin_write()
                      .map_err(|_| RedbBackendError::TransactionFailed)?;
                  {
                      let mut meta = transaction
                          .open_table(META_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      match meta
                          .get(META_SCHEMA_VERSION)
                          .map_err(|_| RedbBackendError::StorageFailed)?
                      {
                          Some(existing) => {
                              let existing = decode_u32(existing.value())?;
                              if existing != schema_version.get() {
                                  return Err(RedbBackendError::SchemaMismatch);
                              }
                          }
                          None => {
                              let encoded = schema_version.get().to_be_bytes();
                              meta.insert(META_SCHEMA_VERSION, encoded.as_slice())
                                  .map_err(|_| RedbBackendError::StorageFailed)?;
                          }
                      }
                      if meta
                          .get(META_JOURNAL_REVISION)
                          .map_err(|_| RedbBackendError::StorageFailed)?
                          .is_none()
                      {
                          let encoded = 0_u64.to_be_bytes();
                          meta.insert(META_JOURNAL_REVISION, encoded.as_slice())
                              .map_err(|_| RedbBackendError::StorageFailed)?;
                      }
                  }
                  {
                      transaction
                          .open_table(RECORD_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      transaction
                          .open_table(OPERATION_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                  }
                  transaction
                      .commit()
                      .map_err(|_| RedbBackendError::CommitOutcomeUnknown)
              }

              fn operation_key(
                  &self,
                  operation_id: &OpaqueId,
              ) -> Result<Vec<u8>, RedbBackendError> {
                  let key = self.operation_keys.encode_operation_key(operation_id)?;
                  if key.is_empty() || key.len() > MAX_OPERATION_KEY_BYTES {
                      return Err(RedbBackendError::InvalidOperationKey);
                  }
                  Ok(key)
              }

              fn load_snapshot_internal(&self) -> Result<BackendSnapshot, RedbBackendError> {
                  let transaction = self
                      .database
                      .begin_read()
                      .map_err(|_| RedbBackendError::TransactionFailed)?;
                  let (schema_version, revision) = {
                      let meta = transaction
                          .open_table(META_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      let schema_version = meta
                          .get(META_SCHEMA_VERSION)
                          .map_err(|_| RedbBackendError::StorageFailed)?
                          .ok_or(RedbBackendError::CorruptDatabase)
                          .and_then(|value| decode_u32(value.value()))?;
                      let revision = meta
                          .get(META_JOURNAL_REVISION)
                          .map_err(|_| RedbBackendError::StorageFailed)?
                          .ok_or(RedbBackendError::CorruptDatabase)
                          .and_then(|value| decode_u64(value.value()))?;
                      (
                          SchemaVersion::new(schema_version)
                              .map_err(|_| RedbBackendError::SchemaMismatch)?,
                          revision,
                      )
                  };
                  let records = {
                      let table = transaction
                          .open_table(RECORD_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      let iterator = table
                          .iter()
                          .map_err(|_| RedbBackendError::StorageFailed)?;
                      let mut records = Vec::new();
                      for entry in iterator {
                          let (key, value) =
                              entry.map_err(|_| RedbBackendError::StorageFailed)?;
                          let key = key.value();
                          let value = value.value();
                          if key.is_empty() {
                              return Err(RedbBackendError::CorruptDatabase);
                          }
                          records.push((
                              ControlKey(key.to_vec()),
                              decode_control_value(value)?,
                          ));
                      }
                      records
                  };
                  Ok(BackendSnapshot {
                      schema_version,
                      revision,
                      records,
                  })
              }
          }

          impl<E> ControlBackend for RedbControlBackend<E>
          where
              E: ControlOperationKeyEncoder,
          {
              type BackendError = RedbBackendError;

              fn load_snapshot(&self) -> Result<BackendSnapshot, Self::BackendError> {
                  self.load_snapshot_internal()
              }

              fn guarded_commit(
                  &mut self,
                  mutation: &ControlMutation,
              ) -> Result<BackendCommit, Self::BackendError> {
                  validate_mutation_shape(mutation)?;
                  let operation_key =
                      self.operation_key(&mutation.operation.operation_id)?;
                  let transaction = self
                      .database
                      .begin_write()
                      .map_err(|_| RedbBackendError::TransactionFailed)?;

                  if let Some(existing) = {
                      let operations = transaction
                          .open_table(OPERATION_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      operations
                          .get(operation_key.as_slice())
                          .map_err(|_| RedbBackendError::StorageFailed)?
                          .map(|value| decode_operation_record(value.value()))
                          .transpose()?
                  } {
                      if existing.payload_digest != mutation.payload_digest {
                          return Err(RedbBackendError::IdempotencyConflict);
                      }
                      return Ok(BackendCommit {
                          revision: existing.after_revision,
                          commit_digest: existing.commit_digest,
                      });
                  }

                  let before_revision = {
                      let meta = transaction
                          .open_table(META_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      meta.get(META_JOURNAL_REVISION)
                          .map_err(|_| RedbBackendError::StorageFailed)?
                          .ok_or(RedbBackendError::CorruptDatabase)
                          .and_then(|value| decode_u64(value.value()))?
                  };
                  if before_revision != mutation.expected_revision {
                      return Err(RedbBackendError::RevisionConflict);
                  }
                  let after_revision = before_revision
                      .checked_add(1)
                      .ok_or(RedbBackendError::RevisionOverflow)?;
                  let commit_digest = canonical_commit_digest(
                      operation_key.as_slice(),
                      mutation,
                      before_revision,
                      after_revision,
                  )?;

                  {
                      let mut records = transaction
                          .open_table(RECORD_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      for key in &mutation.deletes {
                          records
                              .remove(key.as_bytes())
                              .map_err(|_| RedbBackendError::StorageFailed)?;
                      }
                      for write in &mutation.writes {
                          let encoded = encode_control_value(&write.value);
                          records
                              .insert(write.key.as_bytes(), encoded.as_slice())
                              .map_err(|_| RedbBackendError::StorageFailed)?;
                      }
                  }
                  {
                      let mut operations = transaction
                          .open_table(OPERATION_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      let encoded = encode_operation_record(OperationRecord {
                          payload_digest: mutation.payload_digest,
                          before_revision,
                          after_revision,
                          commit_digest,
                      });
                      operations
                          .insert(operation_key.as_slice(), encoded.as_slice())
                          .map_err(|_| RedbBackendError::StorageFailed)?;
                  }
                  {
                      let mut meta = transaction
                          .open_table(META_TABLE)
                          .map_err(|_| RedbBackendError::TableFailed)?;
                      let encoded = after_revision.to_be_bytes();
                      meta.insert(META_JOURNAL_REVISION, encoded.as_slice())
                          .map_err(|_| RedbBackendError::StorageFailed)?;
                  }
                  transaction
                      .commit()
                      .map_err(|_| RedbBackendError::CommitOutcomeUnknown)?;
                  Ok(BackendCommit {
                      revision: after_revision,
                      commit_digest,
                  })
              }

              fn read_operation_digest(
                  &self,
                  operation_id: &OpaqueId,
              ) -> Result<Option<Blake3Digest32>, Self::BackendError> {
                  let operation_key = self.operation_key(operation_id)?;
                  let transaction = self
                      .database
                      .begin_read()
                      .map_err(|_| RedbBackendError::TransactionFailed)?;
                  let operations = transaction
                      .open_table(OPERATION_TABLE)
                      .map_err(|_| RedbBackendError::TableFailed)?;
                  operations
                      .get(operation_key.as_slice())
                      .map_err(|_| RedbBackendError::StorageFailed)?
                      .map(|value| {
                          decode_operation_record(value.value())
                              .map(|record| record.payload_digest)
                      })
                      .transpose()
              }

              fn map_backend_error(error: &Self::BackendError) -> ControlError {
                  match error {
                      RedbBackendError::SchemaMismatch => ControlError::SchemaMismatch,
                      RedbBackendError::RevisionConflict => ControlError::RevisionConflict,
                      RedbBackendError::RevisionOverflow => ControlError::RevisionOverflow,
                      RedbBackendError::IdempotencyConflict => {
                          ControlError::IdempotencyConflict
                      }
                      RedbBackendError::CommitOutcomeUnknown => ControlError::OutcomeUnknown,
                      RedbBackendError::InvalidOperationKey
                      | RedbBackendError::CorruptDatabase
                      | RedbBackendError::DatabaseOpenFailed
                      | RedbBackendError::TransactionFailed
                      | RedbBackendError::TableFailed
                      | RedbBackendError::StorageFailed => ControlError::Quarantined,
                  }
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          struct OperationRecord {
              payload_digest: Blake3Digest32,
              before_revision: u64,
              after_revision: u64,
              commit_digest: Blake3Digest32,
          }

          fn validate_mutation_shape(
              mutation: &ControlMutation,
          ) -> Result<(), RedbBackendError> {
              if mutation.writes.is_empty() && mutation.deletes.is_empty() {
                  return Err(RedbBackendError::CorruptDatabase);
              }
              let mut keys = BTreeSet::new();
              for write in &mutation.writes {
                  if !keys.insert(write.key.as_bytes().to_vec()) {
                      return Err(RedbBackendError::CorruptDatabase);
                  }
              }
              for key in &mutation.deletes {
                  if !keys.insert(key.as_bytes().to_vec()) {
                      return Err(RedbBackendError::CorruptDatabase);
                  }
              }
              Ok(())
          }

          fn canonical_commit_digest(
              operation_key: &[u8],
              mutation: &ControlMutation,
              before_revision: u64,
              after_revision: u64,
          ) -> Result<Blake3Digest32, RedbBackendError> {
              let mut hasher = blake3::Hasher::new();
              hasher.update(b"ELIOT_CONTROL_COMMIT_V1");
              hash_bytes(&mut hasher, operation_key)?;
              hasher.update(mutation.payload_digest.as_bytes());
              hasher.update(&before_revision.to_be_bytes());
              hasher.update(&after_revision.to_be_bytes());

              let mut deletes = mutation
                  .deletes
                  .iter()
                  .map(|key| key.as_bytes())
                  .collect::<Vec<_>>();
              deletes.sort_unstable();
              hasher.update(
                  &u64::try_from(deletes.len())
                      .map_err(|_| RedbBackendError::CorruptDatabase)?
                      .to_be_bytes(),
              );
              for key in deletes {
                  hash_bytes(&mut hasher, key)?;
              }

              let mut writes = mutation.writes.iter().collect::<Vec<_>>();
              writes.sort_by(|left, right| {
                  left.key.as_bytes().cmp(right.key.as_bytes())
              });
              hasher.update(
                  &u64::try_from(writes.len())
                      .map_err(|_| RedbBackendError::CorruptDatabase)?
                      .to_be_bytes(),
              );
              for write in writes {
                  hash_bytes(&mut hasher, write.key.as_bytes())?;
                  hasher.update(&[class_tag(write.value.class())]);
                  hash_bytes(&mut hasher, write.value.as_bytes())?;
              }
              Ok(Blake3Digest32::from_bytes(
                  *hasher.finalize().as_bytes(),
              ))
          }

          fn hash_bytes(
              hasher: &mut blake3::Hasher,
              bytes: &[u8],
          ) -> Result<(), RedbBackendError> {
              let length = u64::try_from(bytes.len())
                  .map_err(|_| RedbBackendError::CorruptDatabase)?;
              hasher.update(&length.to_be_bytes());
              hasher.update(bytes);
              Ok(())
          }

          fn encode_control_value(value: &ControlValue) -> Vec<u8> {
              let mut encoded = Vec::with_capacity(value.as_bytes().len() + 1);
              encoded.push(class_tag(value.class()));
              encoded.extend_from_slice(value.as_bytes());
              encoded
          }

          fn decode_control_value(
              encoded: &[u8],
          ) -> Result<ControlValue, RedbBackendError> {
              let (&tag, bytes) = encoded
                  .split_first()
                  .ok_or(RedbBackendError::CorruptDatabase)?;
              if bytes.is_empty() {
                  return Err(RedbBackendError::CorruptDatabase);
              }
              Ok(ControlValue {
                  class: decode_class(tag)?,
                  bytes: bytes.to_vec(),
              })
          }

          const fn class_tag(class: ControlRecordClass) -> u8 {
              match class {
                  ControlRecordClass::Identity => 1,
                  ControlRecordClass::Revision => 2,
                  ControlRecordClass::State => 3,
                  ControlRecordClass::Receipt => 4,
                  ControlRecordClass::Operation => 5,
                  ControlRecordClass::Snapshot => 6,
                  ControlRecordClass::Migration => 7,
              }
          }

          fn decode_class(tag: u8) -> Result<ControlRecordClass, RedbBackendError> {
              match tag {
                  1 => Ok(ControlRecordClass::Identity),
                  2 => Ok(ControlRecordClass::Revision),
                  3 => Ok(ControlRecordClass::State),
                  4 => Ok(ControlRecordClass::Receipt),
                  5 => Ok(ControlRecordClass::Operation),
                  6 => Ok(ControlRecordClass::Snapshot),
                  7 => Ok(ControlRecordClass::Migration),
                  _ => Err(RedbBackendError::CorruptDatabase),
              }
          }

          fn encode_operation_record(record: OperationRecord) -> [u8; OPERATION_RECORD_BYTES] {
              let mut encoded = [0_u8; OPERATION_RECORD_BYTES];
              encoded[..32].copy_from_slice(record.payload_digest.as_bytes());
              encoded[32..40].copy_from_slice(&record.before_revision.to_be_bytes());
              encoded[40..48].copy_from_slice(&record.after_revision.to_be_bytes());
              encoded[48..80].copy_from_slice(record.commit_digest.as_bytes());
              encoded
          }

          fn decode_operation_record(
              encoded: &[u8],
          ) -> Result<OperationRecord, RedbBackendError> {
              let encoded: &[u8; OPERATION_RECORD_BYTES] = encoded
                  .try_into()
                  .map_err(|_| RedbBackendError::CorruptDatabase)?;
              Ok(OperationRecord {
                  payload_digest: Blake3Digest32::from_bytes(
                      encoded[..32]
                          .try_into()
                          .map_err(|_| RedbBackendError::CorruptDatabase)?,
                  ),
                  before_revision: u64::from_be_bytes(
                      encoded[32..40]
                          .try_into()
                          .map_err(|_| RedbBackendError::CorruptDatabase)?,
                  ),
                  after_revision: u64::from_be_bytes(
                      encoded[40..48]
                          .try_into()
                          .map_err(|_| RedbBackendError::CorruptDatabase)?,
                  ),
                  commit_digest: Blake3Digest32::from_bytes(
                      encoded[48..80]
                          .try_into()
                          .map_err(|_| RedbBackendError::CorruptDatabase)?,
                  ),
              })
          }

          fn decode_u32(encoded: &[u8]) -> Result<u32, RedbBackendError> {
              Ok(u32::from_be_bytes(
                  encoded
                      .try_into()
                      .map_err(|_| RedbBackendError::CorruptDatabase)?,
              ))
          }

          fn decode_u64(encoded: &[u8]) -> Result<u64, RedbBackendError> {
              Ok(u64::from_be_bytes(
                  encoded
                      .try_into()
                      .map_err(|_| RedbBackendError::CorruptDatabase)?,
              ))
          }

          /// Closed, content-free concrete backend failure.
          #[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]
          pub enum RedbBackendError {
              /// Canonical operation-key encoding is empty or excessive.
              InvalidOperationKey,
              /// On-disk schema identity differs from the expected schema.
              SchemaMismatch,
              /// On-disk bytes are missing, malformed, or contradictory.
              CorruptDatabase,
              /// Guarded transaction expected another journal revision.
              RevisionConflict,
              /// Journal revision cannot advance.
              RevisionOverflow,
              /// Operation key exists with another payload digest.
              IdempotencyConflict,
              /// Database file could not be created or opened.
              DatabaseOpenFailed,
              /// A read or write transaction could not be opened.
              TransactionFailed,
              /// A required table could not be opened.
              TableFailed,
              /// A bounded table read or mutation failed before commit.
              StorageFailed,
              /// Commit may have crossed the durable mutation boundary.
              CommitOutcomeUnknown,
          }

          impl RedbBackendError {
              /// Stable machine-readable reason code.
              #[must_use]
              pub const fn code(self) -> &'static str {
                  match self {
                      Self::InvalidOperationKey => "CONTROL_REDB_INVALID_OPERATION_KEY",
                      Self::SchemaMismatch => "CONTROL_REDB_SCHEMA_MISMATCH",
                      Self::CorruptDatabase => "CONTROL_REDB_CORRUPT_DATABASE",
                      Self::RevisionConflict => "CONTROL_REDB_REVISION_CONFLICT",
                      Self::RevisionOverflow => "CONTROL_REDB_REVISION_OVERFLOW",
                      Self::IdempotencyConflict => "CONTROL_REDB_IDEMPOTENCY_CONFLICT",
                      Self::DatabaseOpenFailed => "CONTROL_REDB_OPEN_FAILED",
                      Self::TransactionFailed => "CONTROL_REDB_TRANSACTION_FAILED",
                      Self::TableFailed => "CONTROL_REDB_TABLE_FAILED",
                      Self::StorageFailed => "CONTROL_REDB_STORAGE_FAILED",
                      Self::CommitOutcomeUnknown => "CONTROL_REDB_COMMIT_OUTCOME_UNKNOWN",
                  }
              }
          }

          impl fmt::Display for RedbBackendError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter.write_str(self.code())
              }
          }

          impl std::error::Error for RedbBackendError {}

          #[cfg(test)]
          mod tests {
              use std::fs;
              use std::time::{SystemTime, UNIX_EPOCH};

              use super::{
                  ControlOperationKeyEncoder, RedbBackendError, RedbControlBackend,
              };
              use crate::{ControlBackend, SchemaVersion};
              use search_contracts::OpaqueId;

              struct TestEncoder;

              impl ControlOperationKeyEncoder for TestEncoder {
                  fn encode_operation_key(
                      &self,
                      _operation_id: &OpaqueId,
                  ) -> Result<Vec<u8>, RedbBackendError> {
                      Ok(vec![1])
                  }
              }

              #[test]
              fn creates_and_reopens_empty_versioned_database() {
                  let unique = SystemTime::now()
                      .duration_since(UNIX_EPOCH)
                      .expect("system time")
                      .as_nanos();
                  let path = std::env::temp_dir().join(format!(
                      "eliot-search-control-redb-{}-{unique}.redb",
                      std::process::id()
                  ));
                  let version = SchemaVersion::new(1).expect("schema version");
                  let backend = RedbControlBackend::create(&path, version, TestEncoder)
                      .expect("create database");
                  let snapshot = backend.load_snapshot().expect("load snapshot");
                  assert_eq!(snapshot.schema_version, version);
                  assert_eq!(snapshot.revision, 0);
                  assert!(snapshot.records.is_empty());
                  drop(backend);

                  let reopened = RedbControlBackend::open(&path, version, TestEncoder)
                      .expect("reopen database");
                  let snapshot = reopened.load_snapshot().expect("reload snapshot");
                  assert_eq!(snapshot.schema_version, version);
                  assert_eq!(snapshot.revision, 0);
                  assert!(snapshot.records.is_empty());
                  drop(reopened);
                  fs::remove_file(path).expect("remove test database");
              }
          }
          RS

          python - <<'PY' 2>&1 | tee -a redb-patch.log
          from pathlib import Path
          path = Path('crates/search-control-redb/src/lib.rs')
          text = path.read_text()
          if 'mod redb_backend;' not in text:
              marker = '#![allow(\n'
              index = text.index(marker)
              # insert after crate attributes, immediately before first use/item
              attribute_end = text.index(')]\n', index) + len(')]\n')
              insertion = '''

          mod redb_backend;

          pub use redb_backend::{
              ControlOperationKeyEncoder, RedbBackendError, RedbControlBackend,
          };
          '''
              text = text[:attribute_end] + insertion + text[attribute_end:]
          path.write_text(text)

          functions = Path('crates/search-control-redb/FUNCTIONS.md')
          body = functions.read_text()
          section = '''

          ## Concrete `redb` backend

          `RedbControlBackend` now persists schema version, authoritative journal
          revision, canonical control records, and operation idempotency receipts
          in one `redb` database. Mutations execute in one guarded write
          transaction. Exact operation replay returns the stored commit revision
          and digest; payload conflicts fail. Commit errors are classified as
          outcome-unknown and must be resolved through operation readback.

          Composition supplies `ControlOperationKeyEncoder` because opaque
          operation IDs intentionally expose no storage representation.
          '''
          if '## Concrete `redb` backend' not in body:
              functions.write_text(body + section)
          PY
          cargo fmt --all

      - name: Verify concrete redb backend and workspace
        id: verify
        if: steps.dependencies.outcome == 'success' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-control-redb --all-targets --locked
            cargo test -p search-control-redb --all-targets --locked
            cargo clippy -p search-control-redb --all-targets --locked -- -D warnings
            cargo doc -p search-control-redb --no-deps --locked
            cargo check --workspace --all-targets --locked
            grep -q 'pub struct RedbControlBackend' crates/search-control-redb/src/redb_backend.rs
            grep -q 'impl<E> ControlBackend for RedbControlBackend' crates/search-control-redb/src/redb_backend.rs
            git diff --check
          } 2>&1 | tee redb-verify.log

      - name: Commit verified backend or bounded failure evidence
        if: always()
        shell: bash
        env:
          DEPENDENCY_OUTCOME: ${{ steps.dependencies.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-redb-backend.yml
          mkdir -p qualification/control-redb
          if [ "$DEPENDENCY_OUTCOME" = success ] && [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/control-redb/LAST_FAILURE.txt
            cat > qualification/control-redb/BACKEND_VERIFIED.md <<EOF
          # Concrete redb control backend

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          A real transactional \`redb\` backend now persists schema/revision,
          control records, exact idempotency receipts, guarded CAS commits, and
          canonical BLAKE3 commit digests. Commit uncertainty remains explicit.
          EOF
            git add -A
            subject="feat(control-redb): implement transactional persistent backend"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-redb-backend.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Dependency outcome: %s\n' "$DEPENDENCY_OUTCOME"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              printf '%s\n' '--- dependency log tail ---'
              tail -n 250 redb-dependencies.log 2>/dev/null || true
              printf '%s\n' '--- patch log tail ---'
              tail -n 350 redb-patch.log 2>/dev/null || true
              printf '%s\n' '--- verification log tail ---'
              tail -n 900 redb-verify.log 2>/dev/null || true
            } > qualification/control-redb/LAST_FAILURE.txt
            git add -A
            subject="verify(control-redb): record failed backend implementation"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$DEPENDENCY_OUTCOME" != success ] || [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

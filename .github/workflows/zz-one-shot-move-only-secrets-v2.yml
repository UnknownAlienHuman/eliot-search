name: one-shot make model input and result token move-only v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zz-one-shot-move-only-secrets-v2.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-move-only-secrets-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.98.0

      - name: Remove clone and debug leakage from secret-bearing values
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee move-only-patch.log
          from pathlib import Path

          model_path = Path('crates/search-model-provider/src/lib.rs')
          model = model_path.read_text()
          old_model_header = '''/// Plaintext input whose debug representation is always redacted.
          #[derive(Clone, Eq, PartialEq)]'''
          new_model_header = '''/// Plaintext input whose debug representation is always redacted.
          ///
          /// The owned plaintext is deliberately non-cloneable:
          ///
          /// ```compile_fail
          /// use search_model_provider::ModelInput;
          ///
          /// fn duplicate(input: ModelInput) {
          ///     let _copy = input.clone();
          /// }
          /// ```
          #[derive(Eq, PartialEq)]'''
          if old_model_header in model:
              model = model.replace(old_model_header, new_model_header, 1)
          elif 'fn duplicate(input: ModelInput)' not in model:
              raise SystemExit('ModelInput ownership anchor missing')

          for struct_name in ('EmbeddingRequest', 'RerankCandidate', 'RerankRequest'):
              old = f'#[derive(Clone, Debug, Eq, PartialEq)]\npub struct {struct_name}'
              new = f'#[derive(Debug, Eq, PartialEq)]\npub struct {struct_name}'
              if old in model:
                  model = model.replace(old, new, 1)
              elif new not in model:
                  raise SystemExit(f'model request derive anchor missing for {struct_name}')

          old_debug = '''        formatter
                      .debug_struct("ModelInput")
                      .field("bytes", &format_args!("<redacted:{} bytes>", self.bytes.len()))
                      .field("digest", &self.digest)
                      .finish()'''
          new_debug = '''        formatter
                      .debug_struct("ModelInput")
                      .field("bytes", &format_args!("<redacted:{} bytes>", self.bytes.len()))
                      .field("digest", &"<redacted>")
                      .finish()'''
          if old_debug in model:
              model = model.replace(old_debug, new_debug, 1)
          elif '.field("digest", &"<redacted>")' not in model:
              raise SystemExit('ModelInput debug anchor missing')

          if 'model_input_debug_redacts_plaintext_and_digest' not in model:
              model += r'''

          #[cfg(test)]
          mod tests {
              use super::ModelInput;
              use search_contracts::Blake3Digest32;

              #[test]
              fn model_input_debug_redacts_plaintext_and_digest() {
                  let input = ModelInput::new(
                      b"secret model input".to_vec(),
                      Blake3Digest32::from_bytes([0xab; 32]),
                      1024,
                  )
                  .expect("bounded model input");
                  let rendered = format!("{input:?}");
                  assert!(rendered.contains("<redacted:18 bytes>"));
                  assert!(rendered.contains("digest: \"<redacted>\""));
                  assert!(!rendered.contains("secret model input"));
                  assert!(!rendered.to_ascii_lowercase().contains("abababab"));
              }
          }
          '''
          model_path.write_text(model)

          result_path = Path('crates/search-query/search-result-projector/src/lib.rs')
          result = result_path.read_text()
          old_result_handle = '''/// Opaque handle returned by the handle owner.
          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct IssuedResultHandle {
              /// Stable handle identity.
              pub handle_id: HandleId,
              /// Opaque bearer token returned once to the caller.
              pub token: OpaqueHandleToken,
              /// Handle retention class.
              pub kind: HandleKind,
              /// Content-free handle creation receipt.
              pub receipt: ReceiptRef,
          }'''
          new_result_handle = '''/// Opaque handle returned by the handle owner.
          ///
          /// The bearer token is private and the value is non-cloneable. Token
          /// release consumes the issued handle exactly once:
          ///
          /// ```compile_fail
          /// use search_result_projector::IssuedResultHandle;
          ///
          /// fn duplicate(handle: IssuedResultHandle) {
          ///     let _copy = handle.clone();
          /// }
          /// ```
          #[derive(Debug, Eq, PartialEq)]
          pub struct IssuedResultHandle {
              handle_id: HandleId,
              token: OpaqueHandleToken,
              kind: HandleKind,
              receipt: ReceiptRef,
          }

          impl IssuedResultHandle {
              /// Creates one move-only issued result handle.
              #[must_use]
              pub const fn new(
                  handle_id: HandleId,
                  token: OpaqueHandleToken,
                  kind: HandleKind,
                  receipt: ReceiptRef,
              ) -> Self {
                  Self {
                      handle_id,
                      token,
                      kind,
                      receipt,
                  }
              }

              /// Stable handle identity.
              #[must_use]
              pub const fn handle_id(&self) -> HandleId {
                  self.handle_id
              }

              /// Handle retention class.
              #[must_use]
              pub const fn kind(&self) -> HandleKind {
                  self.kind
              }

              /// Content-free handle creation receipt.
              #[must_use]
              pub const fn receipt(&self) -> &ReceiptRef {
                  &self.receipt
              }

              /// Consumes the handle and releases its bearer token once.
              #[must_use]
              pub fn into_parts(
                  self,
              ) -> (HandleId, OpaqueHandleToken, HandleKind, ReceiptRef) {
                  (self.handle_id, self.token, self.kind, self.receipt)
              }
          }'''
          if old_result_handle in result:
              result = result.replace(old_result_handle, new_result_handle, 1)
          elif 'fn duplicate(handle: IssuedResultHandle)' not in result:
              raise SystemExit('IssuedResultHandle ownership anchor missing')

          for struct_name in ('ProjectedResult', 'ResultEnvelope'):
              old = f'#[derive(Clone, Debug, Eq, PartialEq)]\npub struct {struct_name}'
              new = f'#[derive(Debug, Eq, PartialEq)]\npub struct {struct_name}'
              if old in result:
                  result = result.replace(old, new, 1)
              elif new not in result:
                  raise SystemExit(f'result derive anchor missing for {struct_name}')
          result_path.write_text(result)
          PY
          cargo fmt --all

      - name: Verify both move-only boundaries
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all -- --check
            cargo check -p search-model-provider -p search-result-projector --all-targets --locked
            cargo test -p search-model-provider --locked
            cargo test -p search-model-provider --doc --locked
            cargo test -p search-result-projector --locked
            cargo test -p search-result-projector --doc --locked
            cargo clippy -p search-model-provider -p search-result-projector --all-targets --locked -- -D warnings
            cargo check --workspace --all-targets --locked
            git diff --check
          } 2>&1 | tee move-only-verify.log

      - name: Commit verified secrecy repair or bounded failure
        if: always()
        shell: bash
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/zz-one-shot-move-only-secrets-v2.yml
          mkdir -p qualification/model-provider qualification/result-projector
          if [ "$PATCH_OUTCOME" = success ] && [ "$VERIFY_OUTCOME" = success ]; then
            rm -f qualification/model-provider/LAST_FAILURE.txt
            rm -f qualification/result-projector/LAST_FAILURE.txt
            cat > qualification/model-provider/INPUT_SECRECY_VERIFIED.md <<EOF
          # Model input secrecy boundary

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Owned model plaintext and request types containing it are non-cloneable.
          Debug output exposes neither plaintext nor its digest.
          EOF
            cat > qualification/result-projector/TOKEN_OWNERSHIP_VERIFIED.md <<EOF
          # Result bearer-token ownership

          Status: **PASS**

          Base commit: \`${GITHUB_SHA}\`

          Issued result bearer tokens are private and move-only. Result handles
          and envelopes cannot be cloned; token release consumes the handle.
          EOF
            git add -A
            subject="fix(security): make model inputs and result tokens move-only"
          else
            git reset --hard HEAD
            rm -f .github/workflows/zz-one-shot-move-only-secrets-v2.yml
            {
              printf 'Status: FAIL\n'
              printf 'Base commit: %s\n' "$GITHUB_SHA"
              printf 'Patch outcome: %s\n' "$PATCH_OUTCOME"
              printf 'Verification outcome: %s\n' "$VERIFY_OUTCOME"
              tail -n 300 move-only-patch.log 2>/dev/null || true
              tail -n 650 move-only-verify.log 2>/dev/null || true
            } > qualification/model-provider/LAST_FAILURE.txt
            cp qualification/model-provider/LAST_FAILURE.txt qualification/result-projector/LAST_FAILURE.txt
            git add -A
            subject="verify(security): record failed move-only repair v2"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$subject [skip ci]"
          git push origin HEAD:main
          if [ "$PATCH_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            exit 1
          fi

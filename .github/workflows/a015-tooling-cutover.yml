name: A015 tooling cutover check

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: read

concurrency:
  group: a015-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Verify removed tooling is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e xtask
          ! grep -F '"xtask"' Cargo.toml
          ! grep -F 'cargo_metadata' Cargo.toml
          ! grep -F 'name = "xtask"' Cargo.lock
          ! grep -F 'name = "cargo_metadata"' Cargo.lock

      - name: Confirm locked metadata
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Check minimal real owner
        shell: bash
        run: cargo +1.98.0 check -p search-contracts --locked

      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.0 clippy -p search-contracts --locked -- -D warnings

name: A015 tooling cutover check

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: read

concurrency:
  group: a015-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Refresh lock with a minimal real owner
        shell: bash
        run: cargo +1.98.0 check -p search-contracts

      - name: Emit refreshed lockfile
        shell: bash
        run: |
          printf 'LOCKFILE_BASE64_BEGIN\n'
          base64 -w0 Cargo.lock
          printf '\nLOCKFILE_BASE64_END\n'

      - name: Confirm locked metadata
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.0 clippy -p search-contracts --locked -- -D warnings

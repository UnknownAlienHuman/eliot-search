name: A015 tooling cutover check

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: write

concurrency:
  group: a015-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Refresh lock with a minimal real owner
        shell: bash
        run: cargo +1.98.0 check -p search-contracts

      - name: Confirm locked metadata
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Minimal Clippy
        shell: bash
        run: cargo +1.98.0 clippy -p search-contracts --locked -- -D warnings

      - name: Commit deterministic lockfile cutover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: refresh lock after xtask removal'
          git push origin HEAD:codex/refactor-preparation-20261017

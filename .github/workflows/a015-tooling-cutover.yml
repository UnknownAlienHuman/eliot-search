name: A015 tooling cutover check

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: read

concurrency:
  group: a015-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Confirm manifest resolution
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Refresh lock and check daemon slice
        shell: bash
        run: cargo +1.98.0 check -p eliot-searchd

      - name: Show exact lockfile cutover
        if: ${{ always() }}
        shell: bash
        run: git diff -- Cargo.lock

      - name: Minimal Clippy on refreshed lock
        shell: bash
        run: cargo +1.98.0 clippy -p eliot-searchd --lib --bin eliot-searchd --locked -- -D warnings

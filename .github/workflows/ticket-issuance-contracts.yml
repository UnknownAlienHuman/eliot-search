name: Ticket issuance contracts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate P00 zero-state drafts
        shell: pwsh
        run: ./tools/validate-p00-ticket-drafts.ps1

      - name: Validate ticket issuance contracts
        shell: pwsh
        run: ./tools/validate-ticket-issuance-contracts.ps1

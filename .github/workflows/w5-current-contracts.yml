name: W5 current-workspace contract structure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w5-current-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate W5 current-workspace contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate W5 owner, function, settings and parser qualification contracts
        shell: pwsh
        run: ./tools/validate-w5-current.ps1 -Json

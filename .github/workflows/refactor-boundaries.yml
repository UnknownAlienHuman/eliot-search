name: Refactor boundaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-boundaries:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Rust-only validator entrypoints
        shell: pwsh
        run: cargo test --locked -p xtask --test tooling_runtime_boundary

      - name: Architecture coverage Rust closure
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test architecture_coverage_runtime
          cargo test --locked -p xtask --test architecture_coverage_contracts_runtime
          cargo test --locked -p xtask --test architecture_coverage_python_boundary
          cargo run --locked --quiet -p xtask -- validate architecture-coverage --json
          cargo run --locked --quiet -p xtask -- validate architecture-coverage-contracts --json

      - name: Package-map Rust generation and validation boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test package_maps_parity
          cargo test --locked -p xtask --test package_maps_module_ownership
          cargo test --locked -p xtask --test package_maps_generator
          cargo run --locked --quiet -p xtask -- generate package-maps --check --json
          cargo run --locked --quiet -p xtask -- validate package-maps --json

      - name: Coverage graph Rust generation and validation boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test coverage_graph_parity
          cargo test --locked -p xtask --test coverage_graph_generation_boundary
          cargo test --locked -p xtask --test coverage_graph_generator
          cargo test --locked -p xtask --test coverage_graph_validation_boundary
          cargo run --locked --quiet -p xtask -- generate coverage-graph --check --json
          cargo run --locked --quiet -p xtask -- validate coverage-graph --json

      - name: Ticket issuance Rust planner and validator
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test ticket_planner_module_ownership
          cargo test --locked -p xtask --test ticket_issuance_builder
          cargo test --locked -p xtask --test ticket_issuance_conformance
          cargo test --locked -p xtask --test ticket_issuance_builder_runtime_boundary
          cargo test --locked -p xtask --test ticket_issuance_validation
          cargo run --locked --quiet -p xtask -- validate ticket-issuance-plan --json
          cargo run --locked --quiet -p xtask -- build ticket-issuance-plan --package search-contracts --output -

      - name: Context artifact Rust builder and boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test context_artifact_module_ownership
          cargo test --locked -p xtask --test context_artifact_builder_runtime_boundary
          cargo test --locked -p xtask --test context_artifact_rust_io
          cargo test --locked -p xtask --test context_artifact_builder
          cargo test --locked -p xtask --test context_artifact_validation
          cargo run --locked --quiet -p xtask -- validate context-artifact-candidate --json

      - name: Context materialization Rust planner and boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test context_materialization_module_ownership
          cargo test --locked -p xtask --test context_materialization_validation_ownership
          cargo test --locked -p xtask --test context_materialization_runtime_boundary
          cargo test --locked -p xtask --test context_materialization_parity
          cargo test --locked -p xtask --test context_materialization_builder
          cargo run --locked --quiet -p xtask -- validate context-materialization-plan --json

      - name: Implementation-program module ownership
        shell: pwsh
        run: cargo test --locked -p xtask --test impl_program_module_ownership

      - name: Materializer and unitizer module ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-materializer --test legacy_direct_module_ownership
          cargo test --locked -p search-unitizer --test manifest_module_ownership
          cargo test --locked -p search-unitizer --test unitization_module_ownership
          cargo test --locked -p search-unitizer --test regression_corpus_ownership
          cargo test --locked -p search-unitizer --test layout_codec_module_ownership
          cargo test --locked -p search-unitizer

      - name: Revision store module ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-revision-store --test revision_store_module_ownership
          cargo test --locked -p search-revision-store

      - name: Evaluation module ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-eval --test core_module_ownership
          cargo test --locked -p search-eval --test report_module_ownership
          cargo test --locked -p search-eval --test evidence_module_ownership
          cargo test --locked -p search-eval --test metrics_module_ownership
          cargo test --locked -p search-eval --test audits_module_ownership
          cargo test --locked -p search-eval

      - name: Daemon composition ownership
        shell: pwsh
        run: |
          cargo test --locked -p eliot-searchd --test access_composition_module_ownership
          cargo test --locked -p eliot-searchd --test config_composition_module_ownership
          cargo test --locked -p eliot-searchd --test continuation_module_ownership
          cargo test --locked -p eliot-searchd --test app_module_ownership
          cargo test --locked -p eliot-searchd --test authenticated_proxy_module_ownership
          cargo test --locked -p eliot-searchd --test public_runtime_service_module_ownership
          cargo test --locked -p eliot-searchd --test provider_composition_module_ownership
          cargo test --locked -p eliot-searchd --test endpoint_module_ownership
          cargo test --locked -p eliot-searchd --test safe_reader_adapter_module_ownership
          cargo test --locked -p eliot-searchd --test owner_composition_module_ownership
          cargo test --locked -p eliot-searchd --test secret_composition_module_ownership
          cargo test --locked -p eliot-searchd --test projection_composition_module_ownership
          cargo test --locked -p eliot-searchd --test source_roots_module_ownership
          cargo test --locked -p eliot-searchd --test result_handles_module_ownership
          cargo test --locked -p eliot-searchd --test development_module_ownership
          cargo test --locked -p eliot-searchd --test restore_composition_module_ownership
          cargo test --locked -p eliot-searchd --test preparation_store_module_ownership
          cargo test --locked -p eliot-searchd --test sealed_store_module_ownership
          cargo test --locked -p eliot-searchd --test sealed_transaction_module_ownership
          cargo test --locked -p eliot-searchd --test publication_composition_module_ownership
          cargo test --locked -p eliot-searchd --test rebuild_composition_module_ownership
          cargo test --locked -p eliot-searchd --test secure_direct_store_module_ownership
          cargo test --locked -p eliot-searchd --test direct_store_ingest_module_ownership
          cargo test --locked -p eliot-searchd --test directory_manifest_module_ownership
          cargo test --locked -p eliot-searchd --test sealed_access_module_ownership
          cargo test --locked -p eliot-searchd --test sealed_owner_epoch_module_ownership
          cargo test --locked -p eliot-searchd --test revision_protection_windows_module_ownership

      - name: Control migration marker ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-control-redb cutover
          cargo test --locked -p eliot-searchd --test control_migration_owner_boundary

      - name: Legacy DIRECT journal ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-source-registry legacy_direct
          cargo test --locked -p eliot-searchd --test direct_store_registry_owner_boundary
          cargo check --locked -p eliot-searchd --bin eliot-searchd
          cargo test --locked -p eliot-searchd --bin eliot-searchd plaintext_direct_store

      - name: Canonical DIRECT and Git source ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-source-admission default_deny
          cargo test --locked -p search-source-identity legacy_digest
          cargo test --locked -p eliot-searchd --test source_composition_owner_boundary
          cargo test --locked -p eliot-searchd --test git_source_owner_boundary
          cargo test --locked -p eliot-searchd --test git_source_process
          cargo check --locked -p eliot-searchd --bin eliot-searchd
          cargo test --locked -p eliot-searchd --bin eliot-searchd denied_sources_never_reach_cas
          cargo test --locked -p eliot-searchd --bin eliot-searchd rename_preserves_stable_identity

      - name: Qdrant dependency, qualification and public API boundary
        shell: pwsh
        run: |
          cargo run --locked -p xtask -- validate qdrant-boundary --json
          cargo test --locked -p xtask --test qdrant_qualification_module_ownership

      - name: Qdrant shared validation and bounded oracle
        shell: pwsh
        run: |
          cargo test --locked -p search-qdrant-bridge --lib --test oracle_contracts
          cargo test --locked -p search-qdrant-bridge --test oracle_contracts_module_ownership
          cargo test --locked -p search-qdrant-bridge --test live_server_module_ownership
          cargo test --locked -p search-qdrant-bridge --test live_probe_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_query_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_codec_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_schema_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_error_schema_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_identity_module_ownership
          cargo test --locked -p search-qdrant-bridge --test real_dataplane_module_ownership
          cargo test --locked -p search-qdrant-bridge --test t20_parity_module_ownership

      - name: Qdrant vendor locality
        shell: pwsh
        run: cargo test --locked -p xtask --test qdrant_vendor_locality

      - name: Qdrant upgrade blast radius
        shell: pwsh
        run: cargo test --locked -p xtask --test qdrant_upgrade_blast_radius

name: Refactor boundaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-boundaries:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0

      - name: Rust-only validator entrypoints
        shell: pwsh
        run: cargo test --locked -p xtask --test tooling_runtime_boundary

      - name: Ticket issuance structural validator
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test ticket_issuance_validation
          cargo run --locked --quiet -p xtask -- validate ticket-issuance-plan --json

      - name: Context artifact Rust builder and boundary
        shell: pwsh
        run: |
          cargo test --locked -p xtask --test context_artifact_module_ownership
          cargo test --locked -p xtask --test context_artifact_builder_runtime_boundary
          cargo test --locked -p xtask --test context_artifact_rust_io
          cargo test --locked -p xtask --test context_artifact_builder
          cargo test --locked -p xtask --test context_artifact_validation
          cargo run --locked --quiet -p xtask -- validate context-artifact-candidate --json

      - name: Context materialization module ownership
        shell: pwsh
        run: cargo test --locked -p xtask --test context_materialization_module_ownership

      - name: Implementation-program module ownership
        shell: pwsh
        run: cargo test --locked -p xtask --test impl_program_module_ownership

      - name: Control migration marker ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-control-redb cutover
          cargo test --locked -p eliot-searchd --test control_migration_owner_boundary

      - name: Legacy DIRECT journal ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-source-registry legacy_direct
          cargo test --locked -p eliot-searchd --test direct_store_registry_owner_boundary
          cargo check --locked -p eliot-searchd --bin eliot-searchd
          cargo test --locked -p eliot-searchd --bin eliot-searchd plaintext_direct_store

      - name: Canonical DIRECT and Git source ownership
        shell: pwsh
        run: |
          cargo test --locked -p search-source-admission default_deny
          cargo test --locked -p search-source-identity legacy_digest
          cargo test --locked -p search-source-identity git_digest
          cargo test --locked -p eliot-searchd --test source_composition_owner_boundary
          cargo test --locked -p eliot-searchd --test git_source_owner_boundary
          cargo test --locked -p eliot-searchd --test git_source_process
          cargo check --locked -p eliot-searchd --bin eliot-searchd
          cargo test --locked -p eliot-searchd --bin eliot-searchd denied_sources_never_reach_cas
          cargo test --locked -p eliot-searchd --bin eliot-searchd rename_preserves_stable_identity

      - name: Qdrant dependency and public API boundary
        shell: pwsh
        run: cargo run --locked -p xtask -- validate qdrant-boundary --json

      - name: Qdrant vendor locality
        shell: pwsh
        run: cargo test --locked -p xtask --test qdrant_vendor_locality

      - name: Qdrant upgrade blast radius
        shell: pwsh
        run: cargo test --locked -p xtask --test qdrant_upgrade_blast_radius

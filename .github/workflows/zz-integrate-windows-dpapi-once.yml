name: integrate-windows-dpapi-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-integrate-windows-dpapi-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: integrate-windows-dpapi-once
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure workspace membership
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          package = "search-os-secrets-windows"
          member = "crates/search-runtime/search-os-secrets-windows"

          def metadata():
              result = subprocess.run(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
                  capture_output=True,
              )
              if result.returncode != 0:
                  raise SystemExit(result.stderr)
              return json.loads(result.stdout)

          if not any(item["name"] == package for item in metadata()["packages"]):
              path = Path("Cargo.toml")
              text = path.read_text(encoding="utf-8")
              match = re.search(r"(?ms)^members\s*=\s*\[(.*?)^\]", text)
              if match is None:
                  raise SystemExit("workspace.members array not found")
              body = match.group(1)
              insertion = f'  "{member}",\n'
              if member not in body:
                  body = body + ("" if body.endswith("\n") else "\n") + insertion
                  path.write_text(
                      text[:match.start(1)] + body + text[match.end(1):],
                      encoding="utf-8",
                  )
              if not any(item["name"] == package for item in metadata()["packages"]):
                  raise SystemExit("new adapter is still outside the Cargo workspace")
          PY

      - name: Update lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Compile adapter and enforce Rust boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p search-os-secrets-windows --all-targets --locked
          if [[ -f scripts/check-rust-boundaries.mjs ]]; then
            node scripts/check-rust-boundaries.mjs
          fi

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/zz-integrate-windows-dpapi-once.yml
          git add Cargo.toml Cargo.lock \
            crates/search-runtime/search-os-secrets-windows \
            docs/implementation/windows-secret-adapter.md
          if git diff --cached --quiet; then
            echo "No integration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(secrets): integrate scoped Windows DPAPI adapter"
          git push origin HEAD:main

name: repair-workspace-check-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-repair-workspace-check-once.yml

permissions:
  contents: write

concurrency:
  group: repair-workspace-check-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --no-self-update
          rustup override set 1.98.0

      - name: Repair declared dependency and lease replay borrow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path('crates/search-query/search-result-projector/Cargo.toml')
          text = manifest.read_text(encoding='utf-8')
          anchor = 'search-candidate-validator.workspace = true\n'
          dependency = 'search-access.workspace = true\n'
          if dependency not in text:
              if anchor not in text:
                  raise SystemExit('result-projector dependency anchor missing')
              text = text.replace(anchor, dependency + anchor, 1)
          manifest.write_text(text, encoding='utf-8')

          retention = Path('crates/search-runtime/search-retention/src/lib.rs')
          text = retention.read_text(encoding='utf-8')
          replacement = '''        if self.leases.contains_key(&lease_id) {
              let existing = self
                  .leases
                  .get(&lease_id)
                  .ok_or(RetentionError::LeaseNotFound)?;
              if existing.last_operation == operation
                  && existing.owner_id == owner_id
                  && existing.target == target
                  && existing.issued_at_ms == issued_at_ms
                  && existing.expires_at_ms == expires_at_ms
              {
                  return Ok(existing);
              }
              return Err(RetentionError::LeaseConflict);
          }'''
          text, replacements = re.subn(
              r'        if let Some\(existing\) = self\.leases\.get\(&lease_id\) \{.*?'
              r'            return Err\(RetentionError::LeaseConflict\);\n        \}',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if replacements != 1:
              raise SystemExit(f'retention replay replacement count={replacements}')
          retention.write_text(text, encoding='utf-8')
          PY

      - name: Format, resolve lockfile, and qualify both packages
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 crates/search-runtime/search-retention/src/lib.rs
          cargo generate-lockfile
          cargo check -p search-result-projector --all-targets --locked
          cargo test -p search-result-projector --all-targets --locked
          cargo check -p search-retention --all-targets --locked
          cargo test -p search-retention --all-targets --locked
          git diff --check

      - name: Commit qualified repairs and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-repair-workspace-check-once.yml
          git add Cargo.lock \
            crates/search-query/search-result-projector/Cargo.toml \
            crates/search-runtime/search-retention/src/lib.rs
          if ! git diff --quiet; then
            echo 'Unexpected unstaged changes:' >&2
            git diff --name-only >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): repair result projection and retention replay'
          git pull --rebase origin main
          git push origin HEAD:main
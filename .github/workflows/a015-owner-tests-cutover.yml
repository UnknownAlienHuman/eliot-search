          new_a018 = "| A018 | Package-local auxiliary docs | Complete current-tree package/binary root sweep; supplement-name set; nonstandard journal/profile/DIRECT/helper files | CHECKED | Removed W7/W8/W10/P18 supplements, copied window/control/profile files and four residual daemon DIRECT/source-mapping documents. Unique current `DIAGNOSTICS.md` remains. | Recheck only when a package adds or renames an auxiliary owner document. Rust references are A015/A022. | High static. |"
          if old_a018 not in text:

              "`xtask` remains legacy governance source scheduled for deletion under #214/#525. Until its Rust callers and workspace entry are removed in a checked code slice, its commands are not current implementation gates and its generated data must not be regenerated.\n",
              "The legacy `xtask` package, generated maps and digest ledger were removed. Do not recreate a custom command merely to mirror Cargo metadata, source layout, review status or acceptance state. Add a repository-specific tool only when a surviving product workflow cannot be expressed clearly with direct Cargo/Git commands.\n",
          )

          Path("crates/search-research-export-adapter/README.md").write_text("""# search-research-export-adapter

**Status:** optional design only. No Cargo package, runtime handler or capability exists.

Implement this adapter only when one concrete Research consumer requires the `eliotr.normalized.v1` bundle. It receives already selected, source-backed materialization data from the daemon and returns one bounded wire object. The adapter does not create another storage, authority or qualification layer.

## Owns when implemented

- mapping the selected materialization into the exact wire schema;
- deterministic manifest assembly and explicit unknown-field rejection;
- wire-level digest calculation and readback;
- reporting unsupported or lossy fields without fabricating completeness.

## Does not own

- source admission, materialization or publication;
- ownership transfer, cutover receipts or canonical Research writes;
- Qdrant, redb, object-store or key access;
- unsaved overlays unless a concrete consumer and provenance contract are selected;
- provider registries, activation gates or release authority.

The concrete operation belongs in [FUNCTIONS.md](FUNCTIONS.md) after a real caller is selected. Until then this directory is documentation, not delivered functionality.
""", encoding="utf-8")

          Path("docs/adr/0005-standalone-search-product-and-controller-boundary.md").write_text("""# ADR 0005 — Standalone Search product and controller boundary

- **Status:** accepted
- **Date:** 2026-10-03; revised 2026-10-22
- **Scope:** product ownership and optional ELIOT integration

## Context

ELIOT Search must work as a local search product. Earlier repository coordination material expanded into tickets, leases, approval receipts and agent-control state inside Search. That duplicated external orchestration products and distracted from the working path:

```text
selected source → retained bytes → preparation → Qdrant → retained evidence → CLI
```

## Decision

1. `eliot-searchd` and `eliot-search` must be useful without Memory OS, a Governor or an agent controller.
2. Qdrant is the only indexed backend. redb stores small current/unfinished technical state; retained source and derived evidence remain outside Qdrant.
3. ELIOT integration is an optional leaf adapter over the same Search handlers. It cannot create a second source, access, publication or query authority.
4. Search does not own generic tasks, attempts, agents, schedulers, mailboxes, writer leases, review acceptance or finish authority.
5. Repository work is coordinated by a maintainer request or issue, one non-overlapping branch/worktree, commits and review. Git history is the archive; no ticket/receipt control plane is required.
6. Compiler output, behavior checks and executed runtime experiments are evidence. Planning documents, source presence, past probe reports and generated status files are not constructor tokens or readiness credentials.
7. Boundary violations are removed rather than completed merely because their internal code is consistent.

## Consequences

- Search can be released and operated independently.
- External orchestration can call Search without importing Search internals.
- Current documentation describes product behavior and selected mechanisms, not agent administration.
- Optional adapters fail independently and never block the baseline local path.
- Product claims still require direct executed evidence, but that evidence is not a runtime approval database.
""", encoding="utf-8")

          Path("docs/runtime/QDRANT_ADAPTER_BOUNDARY.md").write_text("""# Qdrant adapter boundary

Qdrant is the only indexed backend. `search-qdrant-bridge` is the sole package allowed to depend directly on `qdrant-client`; vendor request, response, filter and schema types remain private.

## Runtime boundary

- daemon composition supplies one configured endpoint and optional actual credential;
- publication and query use the same concrete adapter and collection generation;
- startup observes the current endpoint, server capabilities and selected schema;
- past probe output, a matching version string or an executable checksum is not runtime authority;
- mutation uncertainty is returned to publication for reconciliation; reads do not create commit ambiguity;
- managed-child ownership is optional and does not change the bridge API.

Use Cargo metadata, Rust privacy, public-API review and focused behavior checks. The former custom Rust source analyser and its generated boundary database were deleted; do not replace them with another parser or import graph.

## Current code debt

The public source still contains `qualified::*`, a live probe suite and `RealDataPlane::connect` requiring a `QualifiedGate`. This is a remnant of the former qualification operating system. It must be reduced in the #263 bridge cutover to direct construction from:

```text
selected endpoint + actual credential + current capability/schema observation
```

Preserve useful current probes and exact mutation/readback behavior. Remove static receipt chains, fixture admission and runtime dependency on historical qualification records. This document records the cut; it does not claim the code is already simplified.

## Optional process owner

`search-qdrant-supervisor` currently has no connected product caller. A future managed-child mode may own an actual process handle, private config, finite startup probe and bounded shutdown. It must not block external-endpoint Search or manufacture readiness from caller-supplied receipts.

## Verification

For a bridge change, compile the bridge and real consumers, then execute the specific schema/query/mutation/recovery case affected. Record raw results with the owning issue or PR. Do not store them as credentials required by ordinary startup.
""", encoding="utf-8")


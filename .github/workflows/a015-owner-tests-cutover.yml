name: A015 owner-test cutover

on:
  push:
    branches:
      - codex/refactor-preparation-20261017

permissions:
  contents: read

concurrency:
  group: a015-owner-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy --no-self-update
          rustc +1.98.0 -Vv
          cargo +1.98.0 -V

      - name: Locked metadata
        shell: bash
        run: cargo +1.98.0 metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Check affected owners
        shell: bash
        run: >-
          cargo +1.98.0 check --locked
          -p search-materializer
          -p search-unitizer
          -p search-revision-store
          -p search-qdrant-bridge
          -p search-eval

      - name: Minimal Clippy
        shell: bash
        run: >-
          cargo +1.98.0 clippy --locked
          -p search-materializer
          -p search-unitizer
          -p search-revision-store
          -p search-qdrant-bridge
          -p search-eval
          -- -D warnings

      - name: Inventory active stale references
        shell: bash
        run: |
          set -euo pipefail
          pattern='W7_HARDENING\.md|W8_CLIENT\.md|W8_INTEGRATION\.md|W10_INTEGRATION\.md|W10_OPTIONAL_EVALUATION\.md|P18_SCALE\.md|PACKAGE_STATUS\.toml|qualification/(qdrant|product-pulse|client-edge|lifecycle|proof|query|current|optional-depth)|swarm/|xtask'
          git grep -nE "$pattern" -- '*.md' '*.rs' 'Cargo.toml' \
            | grep -vE '^(docs/audit/|qualification/)' \
            || true

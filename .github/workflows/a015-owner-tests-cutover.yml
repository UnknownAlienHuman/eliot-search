              "No high-level `toml` crate is currently a product dependency; the deleted repository-governance tool was its\nonly consumer. `search-config` still depends on `toml_parser`. Add direct `toml` and `serde` dependencies only\nwhen the actual typed configuration reader replaces that parser, and remove the old parser in the same cut.",
          )

